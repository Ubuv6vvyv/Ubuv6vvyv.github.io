<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Street View Panorama Stitcher</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700,300" rel="stylesheet">
    <style>
      /* Modern CSS reset and theme styling */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        overflow: hidden; /* Prevent body scroll on mobile */
      }
      body {
        font: 13px/1.5 'Roboto', tahoma, sans-serif; /* Reduced base font size */
        background-color: #f7f7f7;
        color: #333;
        display: flex;
        flex-direction: column;
      }
      section {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        background-color: #fff;
        padding: 10px; /* Reduced padding */
        box-shadow: 0 1px 5px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        height: 100%; /* Make section take full height */
      }
      h1, h2 {
        margin-bottom: 0.5em; /* Reduced margin */
        font-size: 1.2em;
        text-align: center;
        color: #444;
      }
      h1 { font-size: 1.4em; }
      form {
        margin-bottom: 0.5em; /* Reduced margin */
        text-align: center;
        display: flex;
        justify-content: center;
      }
      input[type="text"] {
        width: 75%;
        padding: 6px; /* Reduced padding */
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      input[type="submit"] {
        padding: 6px 8px; /* Reduced padding */
        width: auto;
        border: none;
        background-color: #4285F4;
        color: #fff;
        border-radius: 4px;
        cursor: pointer;
        margin-left: 5px;
      }
      input[type="submit"]:hover {
        background-color: #357ae8;
      }
      #progressDiv, #messageDiv, #errorDiv, #addressOutput {
        margin: 5px 0; /* Reduced margin */
        text-align: center;
        font-weight: bold;
        font-size: 0.9em;
      }
      #errorDiv { color: #d32f2f; }
      #canvasContainer {
        flex-grow: 1; /* Allows container to fill available space */
        position: relative;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
        background-color: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 10px;
        min-height: 150px; /* Ensure a minimum height */
      }
      #canvasContainer canvas {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain; /* Ensures panorama fits without being squashed */
      }
      /* Consolidated & Condensed Button Controls */
      #controlButtons {
        margin-top: 10px;
        text-align: center;
        display: flex;
        flex-wrap: wrap; /* Allow buttons to wrap on small screens */
        gap: 5px; /* Space between buttons */
        justify-content: center;
      }
      #controlButtons button {
        padding: 8px 10px; /* Reduced padding */
        font-size: 12px; /* Reduced font size */
        background-color: #4285F4;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.2s;
        flex-grow: 1; /* Allow buttons to grow and fill space */
        flex-basis: 100px; /* Minimum width before wrapping */
      }
      #controlButtons button:hover {
        background-color: #357ae8;
      }
      /* Hide unnecessary navButtons container */
      #navButtons { display: none; }
    </style>
  </head>
  <body>
    <section>
      <h1>Street View Stitcher</h1> <div id="formSection">
        <div class="inputGroup">
          <h2>Load by URL/PanoID or Search Address</h2>
          <form id="URLForm">
            <input type="text" id="URLInput" placeholder="Enter Street View URL or panoId">
            <input type="submit" value="Load">
          </form>
        </div>
        <div class="inputGroup">
          <form id="addressForm">
            <input type="text" id="addressInput" placeholder="Enter an address">
            <input type="submit" value="Search">
          </form>
        </div>
      </div>
      
      <div id="progressDiv">Status messages will appear here.</div>
      <div id="messageDiv"></div>
      <div id="errorDiv"></div>
      <div id="addressOutput"></div>
      
      <div id="controlButtons"></div>
      
      <div id="canvasContainer"></div>
      
    </section>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAqVp90WuvdNXrtmT0gKY4TYS3D1A0iUPA&libraries=places"></script>
    <script>
    // --- Start of IIFE to encapsulate code ---
    (function() {
      /****************************************************************
       * Global Variables and Initialization
       ****************************************************************/
      let currentPanoData = null;
      let currentMovementDirection = null; // Persist movement direction (in degrees)
      const streetViewService = new google.maps.StreetViewService();
      const geocoder = new google.maps.Geocoder();

      /****************************************************************
       * Helper: Extract a panoId from a full Street View URL.
       ****************************************************************/
      function getIdFromURL(url) {
        // Updated regex to be more robust and find panoId in common URL formats
        const match = url.match(/!1s([^!]+)|pano=([^&]+)/);
        return match ? (match[1] || match[2]) : url;
      }

      /****************************************************************
       * Class: GoogleStreetViewLoader
       ****************************************************************/
      class GoogleStreetViewLoader {
        constructor() {
          this.canvas = document.createElement("canvas");
          this.ctx = this.canvas.getContext("2d");
          this.metadata = {};
          this.progressCallback = null;
        }
        onProgress(callback) {
          this.progressCallback = callback;
        }
        loadTile(panoId, zoom, x, y) {
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => resolve({ img, x, y });
            img.onerror = () => reject(new Error(`Failed to load tile at x:${x} y:${y}`));
            // Use a consistent subdomain to improve browser caching
            img.src = `https://cbk0.google.com/cbk?output=tile&panoid=${panoId}&zoom=${zoom}&x=${x}&y=${y}`;
          });
        }
        async load(panoId, zoom) {
          const TILE_SIZE = 512;
          const tilesX = Math.pow(2, zoom);
          const tilesY = Math.pow(2, zoom - 1);
          const totalTiles = tilesX * tilesY;
          let loadedTiles = 0;

          this.canvas.width = tilesX * TILE_SIZE;
          this.canvas.height = tilesY * TILE_SIZE;
          
          const tilePromises = [];
          for (let y = 0; y < tilesY; y++) {
            for (let x = 0; x < tilesX; x++) {
              let promise = this.loadTile(panoId, zoom, x, y)
                .then(tile => {
                  this.ctx.drawImage(tile.img, tile.x * TILE_SIZE, tile.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                  loadedTiles++;
                  if (this.progressCallback) {
                    this.progressCallback((loadedTiles / totalTiles) * 100);
                  }
                  return tile;
                });
              tilePromises.push(promise);
            }
          }
          await Promise.all(tilePromises);
          this.metadata = { copyright: "© Google" };
        }
      }

      /****************************************************************
       * UI Helper Functions
       ****************************************************************/
      function showProgress(message) { document.getElementById("progressDiv").innerText = message; }
      function showMessage(message) { document.getElementById("messageDiv").innerText = message; }
      function showError(message) { document.getElementById("errorDiv").innerText = message; }
      function clearCanvas() { document.getElementById("canvasContainer").innerHTML = ""; }
      function updateAddressOutput(address) { document.getElementById("addressOutput").innerText = `Location: ${address}`; }
      
      function displayAddress(latlng) {
        geocoder.geocode({ location: latlng }, (results, status) => {
          if (status === "OK" && results[0]) {
            updateAddressOutput(results[0].formatted_address);
          } else {
            updateAddressOutput("Address not available");
          }
        });
      }

      /****************************************************************
       * Movement Functions
       ****************************************************************/
      function initMovementDirection() {
        if (!currentPanoData) return;
        // Prioritize the Point of View (POV) heading if available
        if (currentPanoData.pov && typeof currentPanoData.pov.heading === 'number') {
            currentMovementDirection = currentPanoData.pov.heading;
        } else if (currentPanoData.links && currentPanoData.links.length > 0) {
            currentMovementDirection = currentPanoData.links[0].heading;
        } else {
            currentMovementDirection = 0; // Default if no other info
        }
      }

      function findBestLink(targetHeading) {
        if (!currentPanoData || !currentPanoData.links) return null;
        let bestLink = null;
        let bestDiff = 180; // Max possible difference is 180
        currentPanoData.links.forEach(link => {
          let diff = Math.abs(targetHeading - link.heading) % 360;
          diff = diff > 180 ? 360 - diff : diff;
          if (diff < bestDiff) {
            bestDiff = diff;
            bestLink = link;
          }
        });
        return bestLink;
      }

      function moveForward() {
        if (!currentPanoData) return;
        if (currentMovementDirection === null) initMovementDirection();
        
        const bestLink = findBestLink(currentMovementDirection);
        if (bestLink) {
          currentMovementDirection = bestLink.heading; // Maintain new direction
          updatePanoramaById(bestLink.pano, 3, loadNearby);
        } else {
          showError("No forward movement available.");
        }
      }

      function moveBackward() {
        if (!currentPanoData) return;
        if (currentMovementDirection === null) initMovementDirection();

        const target = (currentMovementDirection + 180) % 360; // Opposite direction
        const bestLink = findBestLink(target);
        if (bestLink) {
          // When moving backward, we adopt the heading of the link we are moving to,
          // but our conceptual "forward" is the reverse of that link's direction.
          currentMovementDirection = bestLink.heading; 
          updatePanoramaById(bestLink.pano, 3, loadNearby);
        } else {
          showError("No backward movement available.");
        }
      }
      
      function nextStreet() {
        if (!currentPanoData) return;
        if (currentMovementDirection === null) initMovementDirection();

        // Find a link that deviates significantly (e.g., > 45°)
        const candidate = currentPanoData.links.find(link => {
            let diff = Math.abs(currentMovementDirection - link.heading) % 360;
            diff = diff > 180 ? 360 - diff : diff;
            return diff > 45 && diff < 135; // Aim for perpendicular streets
        });

        if (candidate) {
          currentMovementDirection = candidate.heading;
          updatePanoramaById(candidate.pano, 3, loadNearby);
        } else {
          showError("No next street available.");
        }
      }

      /****************************************************************
       * Create Control Buttons (Consolidated)
       ****************************************************************/
      function createControlButtons() {
        const controlDiv = document.getElementById("controlButtons");
        controlDiv.innerHTML = ""; // Clear existing buttons

        const addButton = (text, onClick) => {
            const button = document.createElement("button");
            button.innerText = text;
            button.addEventListener("click", onClick);
            controlDiv.appendChild(button);
        };
        
        // Add all buttons
        addButton("Download", () => {
            const canvas = document.querySelector("#canvasContainer canvas");
            if (canvas) {
                const a = document.createElement("a");
                a.href = canvas.toDataURL("image/jpeg", 0.9); // Slightly higher quality
                a.download = `panorama_${currentPanoData?.location?.pano || 'image'}.jpg`;
                a.click();
            }
        });
        addButton("Step Forward", moveForward);
        addButton("Step Backward", moveBackward);
        addButton("Next Street", nextStreet);
        addButton("Random Melbourne", loadRandomMelbourne);
        addButton("Random Global", loadRandomGlobal);
      }
      
      /****************************************************************
       * Panorama Loading Logic
       ****************************************************************/
      function getNearbyLatLng(latlng) {
        const offset = 0.005; // Slightly larger offset for better results
        const offsetLat = (Math.random() - 0.5) * offset;
        const offsetLng = (Math.random() - 0.5) * offset;
        return { lat: latlng.lat + offsetLat, lng: latlng.lng + offsetLng };
      }

      function loadNearby() {
        if (currentPanoData && currentPanoData.location && currentPanoData.location.latLng) {
          const nearby = getNearbyLatLng(currentPanoData.location.latLng.toJSON());
          loadPanoramaAtLatLng(nearby, 3, loadNearby);
        }
      }
      
      async function loadPanoramaById(panoId, zoom = 3, retryCallback) {
        showProgress(`Loading panorama: ${panoId}`);
        const loader = new GoogleStreetViewLoader();
        loader.onProgress(p => showProgress(`Loading... ${p.toFixed(0)}%`));
        try {
          await loader.load(panoId, zoom);
          showProgress("Finished loading.");
          clearCanvas();
          document.getElementById("canvasContainer").appendChild(loader.canvas);
          showMessage(`Panorama loaded. ${loader.metadata.copyright}`);
        } catch (e) {
          showError(e.message);
          if (typeof retryCallback === "function") {
            showMessage("Retrying with a nearby location...");
            retryCallback();
          }
        }
      }

      function updatePanoramaById(panoId, zoom = 3, retryCallback) {
        showProgress(`Fetching data for panoId: ${panoId}`);
        streetViewService.getPanorama({ pano: panoId }, (data, status) => {
          if (status === "OK" && data && data.location && data.location.pano) {
            currentPanoData = data;
            if (currentMovementDirection === null) {
              initMovementDirection();
            }
            loadPanoramaById(data.location.pano, zoom, retryCallback);
            displayAddress(data.location.latLng);
          } else {
            showError(`Could not fetch data for panoId: ${panoId}`);
            if (typeof retryCallback === "function") retryCallback();
          }
        });
      }

      function loadPanoramaAtLatLng(latlng, zoom = 3, retryCallback) {
        showProgress("Searching for Street View...");
        streetViewService.getPanorama({ location: latlng, radius: 50, source: 'outdoor' }, (data, status) => {
          if (status === "OK" && data && data.location && data.location.pano) {
            currentPanoData = data;
            updatePanoramaById(data.location.pano, zoom, retryCallback);
            displayAddress(data.location.latLng);
          } else {
            if (typeof retryCallback === "function") {
              showMessage("No Street View found. Trying another nearby location...");
              retryCallback();
            } else {
              showError("No Street View panorama found at this location.");
            }
          }
        });
      }

      /****************************************************************
       * Random Location Functions
       ****************************************************************/
      function getRandomMelbourneLatLng() {
        const bounds = { minLat: -37.835, maxLat: -37.795, minLng: 144.942, maxLng: 144.988 };
        const lat = bounds.minLat + Math.random() * (bounds.maxLat - bounds.minLat);
        const lng = bounds.minLng + Math.random() * (bounds.maxLng - bounds.minLng);
        return { lat, lng };
      }
      function getRandomGlobalLatLng() {
        const globalCities = [
            { name: "New York", lat: 40.7128, lng: -74.0060 }, { name: "London", lat: 51.5074, lng: -0.1278 },
            { name: "Tokyo", lat: 35.6895, lng: 139.6917 }, { name: "Paris", lat: 48.8566, lng: 2.3522 },
            { name: "Sydney", lat: -33.8688, lng: 151.2093 }, { name: "Rome", lat: 41.9028, lng: 12.4964 },
            { name: "Rio de Janeiro", lat: -22.9068, lng: -43.1729 }, { name: "Hong Kong", lat: 22.3193, lng: 114.1694 }
        ];
        // Pick a random city center and find a pano nearby
        return globalCities[Math.floor(Math.random() * globalCities.length)];
      }
      function loadRandomMelbourne() {
        loadPanoramaAtLatLng(getRandomMelbourneLatLng(), 3, loadRandomMelbourne);
      }
      function loadRandomGlobal() {
        loadPanoramaAtLatLng(getRandomGlobalLatLng(), 3, loadRandomGlobal);
      }

      /****************************************************************
       * Event Listeners and Initializer
       ****************************************************************/
      function initialize() {
        document.getElementById("URLForm").addEventListener("submit", e => {
          e.preventDefault();
          const url = document.getElementById("URLInput").value.trim();
          if (url) updatePanoramaById(getIdFromURL(url), 3, loadNearby);
          else showError("Please enter a Street View URL or panoId.");
        });

        document.getElementById("addressForm").addEventListener("submit", e => {
          e.preventDefault();
          const address = document.getElementById("addressInput").value.trim();
          if (address) {
              geocoder.geocode({ address }, (results, status) => {
                  if (status === "OK" && results[0]) {
                      loadPanoramaAtLatLng(results[0].geometry.location, 3);
                  } else {
                      showError(`Geocoding failed: ${status}`);
                  }
              });
          } else {
              showError("Please enter an address.");
          }
        });

        const autocomplete = new google.maps.places.Autocomplete(document.getElementById("addressInput"));

        // Initial Load
        createControlButtons(); // Always display control buttons
        showProgress("Getting your location...");
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            position => {
              const latlng = { lat: position.coords.latitude, lng: position.coords.longitude };
              loadPanoramaAtLatLng(latlng, 3, loadRandomMelbourne); // Fallback to Melbourne if local fails
            },
            () => {
              showError("Could not get your location. Defaulting to Melbourne.");
              loadRandomMelbourne();
            }
          );
        } else {
          showError("Geolocation not supported. Defaulting to Melbourne.");
          loadRandomMelbourne();
        }
      }
      
      // Run the initializer when the window loads
      window.addEventListener("load", initialize);

    // --- End of IIFE ---
    })();
    </script>
  </body>
</html>
