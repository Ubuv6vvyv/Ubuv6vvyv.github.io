<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Compact Fine-Line Optical Illusion Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: manipulation;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }
    .canvas-container {
      flex: 1 1 auto;
      position: relative;
      background: #000;
      overflow: hidden;
      min-height: 0; /* Allows flex item to shrink below content size */
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      flex: 0 0 auto;
      background: #0f172a;
      border-top: 1px solid #1e293b;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }
    .control-group-inline {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    select, button, input[type="color"] {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      outline: none;
      height: 26px;
    }
    select {
      max-width: 160px;
    }
    .toggle-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }
    .sliders-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    @media (max-width: 500px) {
      .sliders-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .slider-group {
      background: #182238;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid #24324d;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      font-size: 9px;
      font-weight: 600;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
    }
    .slider-label span.value {
      color: #38bdf8;
      font-family: monospace;
    }
    input[type="range"] {
      width: 100%;
      height: 3px;
      background: #334155;
      border-radius: 2px;
      appearance: none;
      outline: none;
      margin-top: 2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
    }
    .action-buttons {
      display: flex;
      gap: 4px;
    }
    .action-buttons button {
      flex: 1;
      font-weight: 600;
      font-size: 10px;
      padding: 2px 4px;
    }
    .btn-primary {
      background: #2563eb;
      border-color: #3b82f6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="canvas-container">
      <canvas id="illusionCanvas"></canvas>
    </div>
    <div class="controls">
      <div class="control-top">
        <div class="control-group-inline">
          <select id="patternSelect">
            <option value="vortex">Counter Vortex</option>
            <option value="moire">Moiré Interference</option>
            <option value="peripheral">Fraser Drift Wheels</option>
            <option value="tunnel">Op-Art Hyper-Tunnel</option>
            <option value="ouchi">Ouchi Floating Grid</option>
            <option value="hering">Hering-Wundt Warp</option>
            <option value="ripple">Oscillating Ripple</option>
            <option value="pinwheel">Pinwheel Exhaustion</option>
          </select>
          <input type="color" id="colorPicker" value="#ffffff" title="Line Color">
        </div>
        <div class="control-group-inline">
          <button class="toggle-btn active" data-effect="invert">Invert</button>
          <button class="toggle-btn" data-effect="rainbow">Spectrum</button>
          <button id="pauseToggle">Pause</button>
        </div>
      </div>

      <div class="sliders-grid">
        <div class="slider-group">
          <div class="slider-label"><span>Density</span><span id="elementsValue" class="value">60</span></div>
          <input type="range" id="elements" min="5" max="300" step="1" value="60">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>Thickness</span><span id="lineWidthValue" class="value">0.8</span></div>
          <input type="range" id="lineWidth" min="0.01" max="8" step="0.01" value="0.8">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>Rotation</span><span id="rotationSpeedValue" class="value">6</span></div>
          <input type="range" id="rotationSpeed" min="0" max="100" step="0.5" value="6">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>Wave Speed</span><span id="waveSpeedValue" class="value">2</span></div>
          <input type="range" id="waveSpeed" min="0" max="30" step="0.1" value="2">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>Amplitude</span><span id="waveAmplitudeValue" class="value">25</span></div>
          <input type="range" id="waveAmplitude" min="0" max="250" step="1" value="25">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>Spatial Freq</span><span id="waveFrequencyValue" class="value">6</span></div>
          <input type="range" id="waveFrequency" min="0.5" max="100" step="0.5" value="6">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>Curvature</span><span id="spiralMultiplierValue" class="value">12</span></div>
          <input type="range" id="spiralMultiplier" min="0.5" max="60" step="0.5" value="12">
        </div>
        <div class="slider-group">
          <div class="slider-label"><span>Distortion</span><span id="distortionValue" class="value">20</span></div>
          <input type="range" id="distortion" min="0" max="200" step="1" value="20">
        </div>
      </div>

      <div class="action-buttons">
        <button id="randomize">Randomize</button>
        <button id="reset">Reset</button>
        <button id="download" class="btn-primary">Export PNG</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('illusionCanvas');
    const ctx = canvas.getContext('2d');
    let animationId;
    let time = 0;
    let isPaused = false;
    let viewWidth = 0;
    let viewHeight = 0;

    const config = {
      pattern: 'vortex',
      elements: 60,
      lineWidth: 0.8,
      rotationSpeed: 6,
      waveSpeed: 2,
      waveAmplitude: 25,
      waveFrequency: 6,
      spiralMultiplier: 12,
      distortion: 20,
      color: '#ffffff',
      effects: { invert: true, rainbow: false }
    };

    function resizeCanvas() {
      const container = canvas.parentElement;
      const dpr = window.devicePixelRatio || 1;
      viewWidth = container.clientWidth;
      viewHeight = container.clientHeight;
      canvas.width = viewWidth * dpr;
      canvas.height = viewHeight * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function getColor(offset = 0) {
      if (config.effects.rainbow) {
        const hue = (offset + time * 80) % 360;
        return `hsl(${hue}, 90%, 60%)`;
      }
      return config.color;
    }

    function setupContext() {
      ctx.clearRect(0, 0, viewWidth, viewHeight);
      if (config.effects.invert) {
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, viewWidth, viewHeight);
        ctx.strokeStyle = config.effects.rainbow ? getColor() : (config.color === '#000000' ? '#ffffff' : config.color);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, viewWidth, viewHeight);
        ctx.strokeStyle = config.effects.rainbow ? getColor() : (config.color === '#ffffff' ? '#000000' : config.color);
      }
      ctx.lineWidth = config.lineWidth;
      ctx.lineCap = 'round';
    }

    function drawLogarithmicVortex() {
      const cx = viewWidth / 2;
      const cy = viewHeight / 2;
      const maxRadius = Math.hypot(cx, cy);
      const arms = Math.floor(config.elements);

      for (let dir = -1; dir <= 1; dir += 2) {
        for (let i = 0; i < arms; i++) {
          const baseAngle = (i / arms) * Math.PI * 2;
          ctx.beginPath();
          let first = true;

          for (let r = 3; r < maxRadius; r += 2) {
            const theta = baseAngle + dir * (Math.log(r * 0.05 + 1) * config.spiralMultiplier * 0.2 + time * config.rotationSpeed * 0.01);
            const wave = Math.sin(r * config.waveFrequency * 0.01 + time * config.waveSpeed) * config.waveAmplitude;
            const finalR = Math.max(0, r + wave);
            const x = cx + Math.cos(theta) * finalR;
            const y = cy + Math.sin(theta) * finalR;

            if (config.effects.rainbow) ctx.strokeStyle = getColor(r + i * 5);

            if (first) { ctx.moveTo(x, y); first = false; } 
            else { ctx.lineTo(x, y); }
          }
          ctx.stroke();
        }
      }
    }

    function drawMoireLattice() {
      const cx = viewWidth / 2;
      const cy = viewHeight / 2;
      const maxRadius = Math.hypot(cx, cy);
      const rings = Math.floor(config.elements * 1.5);

      for (let i = 1; i <= rings; i++) {
        const r = (i / rings) * maxRadius;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      const offsetX = Math.cos(time * config.waveSpeed) * config.waveAmplitude;
      const offsetY = Math.sin(time * config.waveSpeed) * config.waveAmplitude;
      const rotAngle = (config.distortion * 0.01) + time * config.rotationSpeed * 0.005;

      ctx.save();
      ctx.translate(cx + offsetX, cy + offsetY);
      ctx.rotate(rotAngle);
      for (let i = 1; i <= rings; i++) {
        const r = (i / rings) * maxRadius;
        if (config.effects.rainbow) ctx.strokeStyle = getColor(i * 4);
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawFraserSpiral() {
      const cx = viewWidth / 2;
      const cy = viewHeight / 2;
      const maxRadius = Math.min(cx, cy) * 0.95;
      const rings = Math.floor(config.elements * 0.5);
      const tilt = (config.distortion * 0.008) + 0.35;

      for (let rIdx = 1; rIdx <= rings; rIdx++) {
        const r = (rIdx / rings) * maxRadius;
        const numSegments = Math.floor(r * 0.3 * (config.spiralMultiplier * 0.1 + 0.5));
        const rotDir = (rIdx % 2 === 0 ? 1 : -1);
        const rot = rotDir * time * config.rotationSpeed * 0.008;

        for (let s = 0; s < numSegments; s++) {
          const angle = (s / numSegments) * Math.PI * 2 + rot;
          const x1 = cx + Math.cos(angle) * r;
          const y1 = cy + Math.sin(angle) * r;

          const hatchLen = (maxRadius / rings) * 1.2;
          const hatchAngle = angle + (rIdx % 2 === 0 ? tilt : -tilt);
          const x2 = x1 + Math.cos(hatchAngle) * hatchLen;
          const y2 = y1 + Math.sin(hatchAngle) * hatchLen;

          if (config.effects.rainbow) ctx.strokeStyle = getColor(angle * 40 + rIdx * 5);
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }
    }

    function drawOpArtTunnel() {
      const cx = viewWidth / 2;
      const cy = viewHeight / 2;
      const maxRadius = Math.hypot(cx, cy);
      const rings = Math.floor(config.elements * 1.5);

      for (let i = 1; i <= rings; i++) {
        const norm = i / rings;
        const baseR = Math.pow(norm, 1.8) * maxRadius;
        const phase = time * config.waveSpeed * 2 - norm * config.waveFrequency * 3;
        const waveR = baseR + Math.sin(phase) * config.waveAmplitude;

        if (waveR <= 0) continue;

        const points = Math.floor(3 + config.spiralMultiplier * 0.5);
        ctx.beginPath();
        for (let p = 0; p <= points; p++) {
          const a = (p / points) * Math.PI * 2 + time * config.rotationSpeed * 0.003 * (i % 2 === 0 ? 1 : -1);
          const distMod = Math.cos(a * config.waveFrequency + phase) * (config.distortion * 0.1);
          const x = cx + Math.cos(a) * (waveR + distMod);
          const y = cy + Math.sin(a) * (waveR + distMod);

          if (config.effects.rainbow) ctx.strokeStyle = getColor(i * 6);

          if (p === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
      }
    }

    function drawOuchiIllusion() {
      const cx = viewWidth / 2;
      const cy = viewHeight / 2;
      const discRadius = Math.min(cx, cy) * 0.45;
      const step = Math.max(3, Math.floor(60 - config.elements * 0.15));

      const primaryColor = config.effects.invert ? '#ffffff' : '#000000';
      ctx.fillStyle = primaryColor;

      ctx.save();
      for (let x = 0; x < viewWidth; x += step) {
        for (let y = 0; y < viewHeight; y += step * 2) {
          const shift = ((Math.floor(x / step) % 2) * step);
          ctx.fillRect(x, y + shift, step * 0.5, step);
        }
      }

      const floatX = cx + Math.cos(time * config.rotationSpeed * 0.1) * (config.waveAmplitude * 0.15);
      const floatY = cy + Math.sin(time * config.rotationSpeed * 0.1) * (config.waveAmplitude * 0.15);

      ctx.beginPath();
      ctx.arc(floatX, floatY, discRadius, 0, Math.PI * 2);
      ctx.clip();

      ctx.fillStyle = config.effects.invert ? '#000000' : '#ffffff';
      ctx.fillRect(floatX - discRadius, floatY - discRadius, discRadius * 2, discRadius * 2);

      ctx.fillStyle = primaryColor;
      for (let x = floatX - discRadius - step; x < floatX + discRadius + step; x += step * 2) {
        for (let y = floatY - discRadius - step; y < floatY + discRadius + step; y += step) {
          const shift = ((Math.floor(y / step) % 2) * step);
          ctx.fillRect(x + shift, y, step, step * 0.5);
        }
      }

      ctx.beginPath();
      ctx.arc(floatX, floatY, discRadius, 0, Math.PI * 2);
      ctx.lineWidth = config.lineWidth * 2;
      ctx.stroke();
      ctx.restore();
    }

    function drawHeringWundt() {
      const cx = viewWidth / 2;
      const cy = viewHeight / 2;
      const spokes = Math.floor(config.elements);
      const maxRadius = Math.hypot(cx, cy);

      for (let i = 0; i < spokes; i++) {
        const a = (i / spokes) * Math.PI * 2 + time * config.rotationSpeed * 0.003;
        if (config.effects.rainbow) ctx.strokeStyle = getColor(i * 8);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * maxRadius, cy + Math.sin(a) * maxRadius);
        ctx.stroke();
      }

      const lineSpacing = Math.max(8, 200 - config.waveFrequency * 2);
      const numLines = Math.floor(viewHeight / lineSpacing);

      ctx.lineWidth = config.lineWidth * 2;
      const strokeStyle = config.effects.rainbow ? '#ff0055' : (config.effects.invert ? '#00e5ff' : '#ff0044');
      ctx.strokeStyle = strokeStyle;

      for (let i = -numLines; i <= numLines; i++) {
        if (i === 0) continue;
        const y = cy + i * lineSpacing;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(viewWidth, y);
        ctx.stroke();
      }
    }

    function drawRippleField() {
      const cx = viewWidth / 2;
      const cy = viewHeight / 2;
      const rings = Math.floor(config.elements);
      const maxRadius = Math.hypot(cx, cy);

      for (let i = 1; i <= rings; i++) {
        const r = (i / rings) * maxRadius;
        ctx.beginPath();
        const points = 140;
        for (let p = 0; p <= points; p++) {
          const a = (p / points) * Math.PI * 2;
          const ripple = Math.sin(a * config.waveFrequency + r * 0.03 + time * config.waveSpeed * 2) * config.waveAmplitude;
          const radialDist = Math.max(0, r + ripple);
          const x = cx + Math.cos(a + time * config.rotationSpeed * 0.003) * radialDist;
          const y = cy + Math.sin(a + time * config.rotationSpeed * 0.003) * radialDist;

          if (config.effects.rainbow) ctx.strokeStyle = getColor(r + p);

          if (p === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }

    function drawPinwheelExhaustion() {
      const cx = viewWidth / 2;
      const cy = viewHeight / 2;
      const blades = Math.floor(config.elements);
      const maxRadius = Math.min(cx, cy) * 0.95;

      for (let i = 0; i < blades; i++) {
        const baseAngle = (i / blades) * Math.PI * 2 + time * config.rotationSpeed * 0.008;
        ctx.beginPath();
        for (let r = 0; r < maxRadius; r += 2) {
          const phase = (r / maxRadius) * config.spiralMultiplier * 0.4;
          const angle = baseAngle + Math.sin(phase + time * config.waveSpeed) * (config.waveAmplitude * 0.01);
          const x = cx + Math.cos(angle) * r;
          const y = cy + Math.sin(angle) * r;

          if (config.effects.rainbow) ctx.strokeStyle = getColor(i * 8 + r);

          if (r === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }

    function draw() {
      setupContext();
      switch (config.pattern) {
        case 'vortex': drawLogarithmicVortex(); break;
        case 'moire': drawMoireLattice(); break;
        case 'peripheral': drawFraserSpiral(); break;
        case 'tunnel': drawOpArtTunnel(); break;
        case 'ouchi': drawOuchiIllusion(); break;
        case 'hering': drawHeringWundt(); break;
        case 'ripple': drawRippleField(); break;
        case 'pinwheel': drawPinwheelExhaustion(); break;
      }

      if (!isPaused) { time += 0.016; }
      animationId = requestAnimationFrame(draw);
    }

    function updateSlider(id, val) {
      document.getElementById(`${id}Value`).textContent = val;
      config[id] = parseFloat(val);
    }

    ['elements', 'lineWidth', 'rotationSpeed', 'waveSpeed', 'waveAmplitude',
     'waveFrequency', 'spiralMultiplier', 'distortion'
    ].forEach(id => {
      const slider = document.getElementById(id);
      slider.addEventListener('input', (e) => updateSlider(id, e.target.value));
    });

    document.getElementById('patternSelect').addEventListener('change', (e) => {
      config.pattern = e.target.value;
    });

    document.getElementById('colorPicker').addEventListener('input', (e) => {
      config.color = e.target.value;
    });

    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const effect = btn.dataset.effect;
        config.effects[effect] = !config.effects[effect];
        btn.classList.toggle('active', config.effects[effect]);
      });
    });

    document.getElementById('pauseToggle').addEventListener('click', (e) => {
      isPaused = !isPaused;
      e.target.textContent = isPaused ? 'Resume' : 'Pause';
    });

    document.getElementById('download').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `illusion_${config.pattern}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    document.getElementById('randomize').addEventListener('click', () => {
      ['elements', 'lineWidth', 'rotationSpeed', 'waveSpeed', 'waveAmplitude',
       'waveFrequency', 'spiralMultiplier', 'distortion'
      ].forEach(id => {
        const slider = document.getElementById(id);
        const min = parseFloat(slider.min);
        const max = parseFloat(slider.max);
        const randomVal = (Math.random() * (max - min) + min).toFixed(1);
        slider.value = randomVal;
        updateSlider(id, randomVal);
      });
    });

    document.getElementById('reset').addEventListener('click', () => {
      const defaults = {
        elements: 60,
        lineWidth: 0.8,
        rotationSpeed: 6,
        waveSpeed: 2,
        waveAmplitude: 25,
        waveFrequency: 6,
        spiralMultiplier: 12,
        distortion: 20
      };
      Object.entries(defaults).forEach(([id, val]) => {
        const slider = document.getElementById(id);
        slider.value = val;
        updateSlider(id, val);
      });
      config.effects.invert = true;
      config.effects.rainbow = false;
      document.querySelector('[data-effect="invert"]').classList.add('active');
      document.querySelector('[data-effect="rainbow"]').classList.remove('active');
      config.color = '#ffffff';
      document.getElementById('colorPicker').value = '#ffffff';
    });

    draw();
  </script>
</body>
</html>
