<!doctype html>
<html lang=en>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Dominate</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel=stylesheet>
<style>*{margin:0;padding:0;box-sizing:border-box}body,html{height:100%;width:100%;font-family:'Bebas Neue',sans-serif;display:flex;justify-content:center;align-items:center;background-color:#000;overflow:hidden}#container{text-align:center;position:relative;z-index:1}h1{font-size:30vw;font-weight:700;color:#fff;mix-blend-mode:difference;text-shadow:0 0 8px rgba(255,255,255,.8)}#controls{position:absolute;bottom:20px;width:90%;text-align:center;z-index:2;color:#fff}#color-slider,#intensity-slider,#pulse-slider,#slider,.preset-btn{width:80%;margin:10px 0}.preset-btn{padding:1px;font-size:.5em;cursor:pointer}</style>
</head>
<body>
<audio id=background-audio loop>
<source src=https://files.catbox.moe/escyr2.mp3 type=audio/mpeg>
Your browser does not support the audio element.
</audio>
<div id=container>
<h1 id=dominate>DOMINATE</h1>
</div>
<div id=controls>
<label for=slider>Strobe Frequency (ms):</label>
<input type=range id=slider min=10 max=200 value=50 step=1>
<div>
<button class=preset-btn data-frequency=25>25ms (Very Fast)</button>
<button class=preset-btn data-frequency=50>50ms (Fast)</button>
<button class=preset-btn data-frequency=20>20ms (Wow)</button>
<button class=preset-btn data-frequency=200>200ms (Slow)</button>
</div>
<div>
<label for=intensity-slider>Intensity:</label>
<input type=range id=intensity-slider min=0.1 max=2 value=1 step=0.1>
</div>
<div>
<label for=color-slider>Color Shift:</label>
<input type=range id=color-slider min=0 max=360 value=0 step=1>
</div>
<div>
<label for=pulse-slider>Pulse Speed:</label>
<input type=range id=pulse-slider min=1 max=10 value=5 step=0.1>
</div>
</div>
<script>document.addEventListener("DOMContentLoaded",(()=>{const e=document.getElementById("dominate"),t=document.getElementById("slider"),n=document.getElementById("intensity-slider"),d=document.getElementById("color-slider"),l=document.getElementById("pulse-slider"),a=document.querySelectorAll(".preset-btn"),o=document.getElementById("background-audio");let u,r=t.value,c=n.value,i=d.value,s=l.value;function m(){clearInterval(u),u=setInterval((()=>{const n=10*Math.random();document.body.style.backgroundColor="black"===document.body.style.backgroundColor?`hsl(${i}, 100%, ${50*c}%)`:"black",e.style.color="black"===document.body.style.backgroundColor?`hsl(${i}, 100%, ${50*c}%)`:"black",r=parseFloat(t.value)+n}),r)}function y(){c=n.value,i=d.value,s=l.value,document.body.style.animation=`pulseBackground ${s}s infinite alternate`}t.addEventListener("input",(e=>{r=e.target.value,m()})),a.forEach((e=>{e.addEventListener("click",(()=>{r=e.getAttribute("data-frequency"),t.value=r,m(),"20"===e.getAttribute("data-frequency")&&o.play()}))})),n.addEventListener("input",y),d.addEventListener("input",y),l.addEventListener("input",y),m(),y()}))</script>
<script>document.addEventListener("DOMContentLoaded",(()=>{const e=document.getElementById("background-audio");document.addEventListener("click",(()=>{e.play()}),{once:!0})}))</script>
</body>
</html>
