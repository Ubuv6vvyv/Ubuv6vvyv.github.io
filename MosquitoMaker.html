<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title> Mosquito Maker</title>
	<style>
		body {
			font-family: 'Roboto',Monospace;
			max-width: 100%;
			margin: 0 auto;
			padding: 10px;
			background-color: #f0f8ff;
			text-align: center;
			line-height: 1.6
		}

		h1 {
			color: #2c3e50;
			font-size: 1.6em;
			text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
			margin-bottom: 15px
		}

		.control-group {
			background-color: rgba(255,255,255,0.9);
			border-radius: 12px;
			padding: 15px;
			margin-bottom: 15px;
			box-shadow: 0 4px 6px rgba(0,0,0,0.1)
		}

		.slider-container {
			display: flex;
			align-items: center;
			margin-bottom: 15px;
			width: 100%
		}

		.slider-container label {
			flex: 1.5;
			text-align: left;
			font-size: 0.9em;
			color: #34495e;
			padding-right: 10px
		}

		.slider-container input,.slider-container select {
			flex: 2;
			width: 100%;
			accent-color: #3498db
		}

		.slider-container select {
			font-size: 0.9em;
			height: 40px;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap
		}

		.slider-container span {
			flex: 0.5;
			text-align: right;
			font-size: 0.8em;
			color: #7f8c8d;
			min-width: 40px
		}

		select {
			padding: 8px;
			border-radius: 5px;
			border: 1px solid #bdc3c7
		}

		button {
			width: 100%;
			padding: 12px;
			margin: 10px 0;
			background-color: #2ecc71;
			color: white;
			border: none;
			border-radius: 8px;
			font-weight: bold;
			transition: all 0.3s ease;
			font-size: 1em
		}

		button:hover {
			background-color: #27ae60;
			transform: scale(1.05)
		}

		#clapButton {
			background-color: #e74c3c
		}

		#clapButton:hover {
			background-color: #c0392b
		}

		#visualizer {
			width: 100%;
			height: 100px;
			background-color: #ecf0f1;
			border-radius: 8px;
			margin-top: 15px
		}

		.emoji-section {
			font-size: 2em;
			margin: 10px 0
		}

		.multiplier-container {
			display: flex;
			justify-content: center;
			margin-bottom: 15px
		}

		.multiplier-button {
			margin: 0 5px;
			padding: 8px 15px;
			background-color: #3498db;
			color: white;
			border: none;
			border-radius: 5px;
			cursor: pointer;
			transition: background-color 0.3s ease
		}

		.multiplier-button.active {
			background-color: #2980b9
		}

		@media (max-width:480px) {
			.slider-container {
				flex-direction: column;
				align-items: flex-start
			}

			.slider-container label {
				margin-bottom: 5px;
				width: 100%
			}

			.slider-container input,.slider-container select {
				width: 100%
			}

			.slider-container span {
				align-self: flex-end;
				margin-top: 5px
			}}
	</style>
</head>
<body>
	<div class="emoji-section">
		
	</div>
	<h1>Mosquito Maker </h1>

	<div class="multiplier-container">
		<button class="multiplier-button active" data-multiplier="1">1x Mosquito</button>
		<button class="multiplier-button" data-multiplier="2">2x Mosquitos</button>
		<button class="multiplier-button" data-multiplier="5">5x Mosquitos</button>
	</div>

	<div class="control-group">
		<h2>Oscillator Controls</h2>
		<div class="slider-container">
			<label for="frequencySlider">Base Frequency</label>
			<input type="range" id="frequencySlider" min="400" max="1000" value="750">
			<span id="frequencyValue">750</span>
		</div>
		<div class="slider-container">
			<label for="detuneSlider">Detune Chaos</label>
			<input type="range" id="detuneSlider" min="-50" max="50" value="0">
			<span id="detuneValue">0</span>
		</div>
		<div class="slider-container">
			<label for="typeSelect">Oscillator Type</label>
			<select id="typeSelect">
				<option value="sawtooth">Buzz Saw </option>
				<option value="triangle">Terror Triangle </option>
				<option value="sine">Sine Sadness </option>
				<option value="square">Square Wave Swatter </option>
			</select>
		</div>
	</div>
	<div class="control-group">
		<h2>Mosquito Modulation</h2>
		<div class="slider-container">
			<label for="modulationFreqSlider">Wing Flap Speed</label>
			<input type="range" id="modulationFreqSlider" min="0.1" max="10" step="0.1" value="0.5">
			<span id="modulationFreqValue">0.5</span>
		</div>
		<div class="slider-container">
			<label for="modulationDepthSlider">Buzz Intensity</label>
			<input type="range" id="modulationDepthSlider" min="0" max="100" value="10">
			<span id="modulationDepthValue">10</span>
		</div>
		<div class="slider-container">
			<label for="randomNoiseSlider">Mosquito Randomness</label>
			<input type="range" id="randomNoiseSlider" min="0" max="50" value="10">
			<span id="randomNoiseValue">10</span>
		</div>
	</div>
	<div class="control-group">
		<h2>Annoyance Level</h2>
		<div class="slider-container">
			<label for="volumeSlider">Ear Torture</label>
			<input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.2">
			<span id="volumeValue">0.2</span>
		</div>
		<div class="slider-container">
			<label for="pitchShiftSlider">Pitch Panic</label>
			<input type="range" id="pitchShiftSlider" min="-12" max="12" value="0">
			<span id="pitchShiftValue">0</span>
		</div>
	</div>
	<div class="control-group">
		<button id="playButton">Start Mosquito Sound</button>
		<button id="clapButton">Make It Stop! </button>
	</div>
	<canvas id="visualizer"></canvas>
	<div class="emoji-section">
 Dom Creations	
	</div>
	<script>
  class EnhancedMosquitoSoundGenerator {
    constructor() {
      this.context = new (window.AudioContext || window.webkitAudioContext)();
      this.isPlaying = false;
      this.oscillators = [];
      this.gainNodes = [];
      this.analyser = null;
      this.multiplier = 1;
      this.setupEventListeners();
      this.setupVisualizer();
      this.setupMultiplierButtons();
    }

    setupMultiplierButtons() {
      const buttons = document.querySelectorAll(".multiplier-button");
      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          buttons.forEach((btn) => btn.classList.remove("active"));
          button.classList.add("active");
          this.multiplier = parseInt(button.dataset.multiplier);
          if (this.isPlaying) {
            this.stopSound();
            this.startSound();
          }
        });
      });
    }

    setupEventListeners() {
      document.getElementById("playButton").addEventListener("click", () => this.toggleSound());
      document.getElementById("clapButton").addEventListener("click", () => {
        this.playClapSound();
        this.stopSound();
      });

      [
        "frequencySlider",
        "detuneSlider",
        "typeSelect",
        "modulationFreqSlider",
        "modulationDepthSlider",
        "randomNoiseSlider",
        "pitchShiftSlider",
      ].forEach((id) => {
        document.getElementById(id).addEventListener("input", (event) => {
          const valueDisplay = id.replace("Slider", "") + "Value";
          document.getElementById(valueDisplay).textContent = event.target.value;
          if (this.isPlaying) this.updateSound();
        });
      });

      document.getElementById("volumeSlider").addEventListener("input", (event) => {
        document.getElementById("volumeValue").textContent = event.target.value;
        if (this.isPlaying) this.updateGain();
      });
    }

    toggleSound() {
      this.isPlaying ? this.stopSound() : this.startSound();
    }

    startSound() {
      this.stopSound(); // Ensure all previous oscillators are stopped

      const baseFrequency = parseFloat(document.getElementById("frequencySlider").value);
      const baseDetune = parseFloat(document.getElementById("detuneSlider").value);
      const oscillatorType = document.getElementById("typeSelect").value;
      const modulationFrequency = parseFloat(document.getElementById("modulationFreqSlider").value);
      const randomNoise = parseFloat(document.getElementById("randomNoiseSlider").value);
      const pitchShift = parseFloat(document.getElementById("pitchShiftSlider").value);
      const modulationDepth = parseFloat(document.getElementById("modulationDepthSlider").value);
      const volume = parseFloat(document.getElementById("volumeSlider").value);

      for (let i = 0; i < this.multiplier; i++) {
        const detuneOffset = (i - this.multiplier / 2) * 10; // Offset detune for distinct sounds
        const randomOffset = Math.random() * randomNoise - randomNoise / 2;

        const osc = this.context.createOscillator();
        const gainNode = this.context.createGain();

        osc.type = oscillatorType;
        osc.frequency.setValueAtTime(
          baseFrequency * Math.pow(2, (pitchShift + randomOffset) / 12),
          this.context.currentTime
        );
        osc.detune.setValueAtTime(baseDetune + detuneOffset + randomOffset, this.context.currentTime);

        const modOsc = this.context.createOscillator();
        const modGain = this.context.createGain();
        modOsc.type = "sine";
        modOsc.frequency.setValueAtTime(modulationFrequency, this.context.currentTime);
        modGain.gain.setValueAtTime(modulationDepth, this.context.currentTime);

        modOsc.connect(modGain);
        modGain.connect(osc.frequency);

        gainNode.gain.setValueAtTime(volume / this.multiplier, this.context.currentTime);
        osc.connect(gainNode);
        gainNode.connect(this.context.destination);

        osc.start();
        modOsc.start();

        this.oscillators.push(osc, modOsc);
        this.gainNodes.push(gainNode);
      }

      document.getElementById("playButton").textContent = "Stop Mosquito Sound";
      this.isPlaying = true;
      this.startVisualization();
    }

    stopSound() {
      this.oscillators.forEach((osc) => {
        try {
          osc.stop();
          osc.disconnect();
        } catch (e) {}
      });
      this.gainNodes.forEach((gainNode) => {
        try {
          gainNode.disconnect();
        } catch (e) {}
      });

      this.oscillators = [];
      this.gainNodes = [];
      document.getElementById("playButton").textContent = "Start Mosquito Sound";
      this.isPlaying = false;
      this.stopVisualization();
    }

    updateSound() {
      this.stopSound();
      this.startSound();
    }

    updateGain() {
      if (this.isPlaying) {
        const volume = parseFloat(document.getElementById("volumeSlider").value);
        this.gainNodes.forEach((gainNode) => {
          gainNode.gain.setValueAtTime(volume / this.multiplier, this.context.currentTime);
        });
      }
    }

    setupVisualizer() {
      this.canvas = document.getElementById("visualizer");
      this.canvasCtx = this.canvas.getContext("2d");
      this.analyser = null;
    }

    startVisualization() {
      this.analyser = this.context.createAnalyser();
      const gainNodes = this.gainNodes;
      gainNodes.forEach((gainNode) => gainNode.connect(this.analyser));

      this.analyser.fftSize = 256;
      const bufferLength = this.analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);

      const draw = () => {
        if (!this.isPlaying) return;
        requestAnimationFrame(draw);

        this.analyser.getByteFrequencyData(dataArray);
        this.canvasCtx.fillStyle = "rgb(240, 240, 240)";
        this.canvasCtx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        const barWidth = (this.canvas.width / bufferLength) * 2.5;
        let x = 0;

        dataArray.forEach((value) => {
          const barHeight = value / 2;
          this.canvasCtx.fillStyle = `rgb(${value + 100}, 50, 50)`;
          this.canvasCtx.fillRect(x, this.canvas.height - barHeight, barWidth, barHeight);
          x += barWidth + 1;
        });
      };

      draw();
    }

    stopVisualization() {
      this.canvasCtx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    }

    playClapSound() {
      const buffer = this.context.createBuffer(1, 0.2 * this.context.sampleRate, this.context.sampleRate);
      const channelData = buffer.getChannelData(0);
      for (let i = 0; i < channelData.length; i++) {
        const decay = 1 - i / channelData.length;
        channelData[i] = (2 * Math.random() - 1) * decay;
      }
      const source = this.context.createBufferSource();
      const gainNode = this.context.createGain();

      source.buffer = buffer;
      gainNode.gain.setValueAtTime(1, this.context.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, this.context.currentTime + 0.2);
      source.connect(gainNode);
      gainNode.connect(this.context.destination);
      source.start();
    }
  }

  const mosquitoGenerator = new EnhancedMosquitoSoundGenerator();
</script>

		</body>
	</html>
