<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Color & Style Analyzer</title>
    <style>
        :root {
            --primary: #7b48ff;
            --bg: #f9f9f9;
            --text: #333;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px; 
            background: var(--bg); 
            color: var(--text);
        }
        .skin-analyzer-container { 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        }
        
        /* Progress Bar */
        .progress-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
        .sca-progress-step { padding: 10px 20px; border-radius: 20px; background: #eee; color: #888; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .sca-progress-step.active { background: var(--primary); color: white; }
        .sca-progress-connector { flex-grow: 1; height: 3px; background: #eee; margin: 0 10px; }
        
        /* Upload Area */
        .upload-area { border: 2px dashed #ccc; border-radius: 12px; padding: 60px 20px; text-align: center; cursor: pointer; transition: 0.3s; background: #fafafa; }
        .upload-area:hover { border-color: var(--primary); background: #f4f0ff; }
        .selfie-icon { font-size: 50px; margin-bottom: 15px; }
        .upload-option { font-weight: bold; color: var(--primary); font-size: 1.2em; }
        
        /* Loading & Previews */
        #analysis-loading { text-align: center; padding: 40px; font-size: 1.2em; color: var(--primary); font-weight: bold; }
        .image-preview-container { display: none; margin-bottom: 20px; text-align: center; position: relative; }
        #uploaded-image { max-width: 100%; max-height: 500px; border-radius: 12px; }
        .close-preview { position: absolute; top: 10px; right: 10px; background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; }
        
        /* Color Picker UI */
        .color-selection-screen { text-align: center; }
        .image-container { position: relative; display: inline-block; cursor: crosshair; margin-top: 20px; max-width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #color-picker-canvas { max-width: 100%; display: block; }
        .crosshair { position: absolute; pointer-events: none; color: white; text-shadow: 0 0 4px black; font-size: 24px; margin-top: -12px; margin-left: -12px;}
        
        /* Controls & Buttons */
        .controls-area { margin-top: 25px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 1em; }
        .select-button { background: #eee; color: #333; }
        .select-button.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(123, 72, 255, 0.3); }
        .analyze-button { background: var(--primary); color: white; padding: 15px 30px; font-size: 1.1em; width: 100%; margin-top: 20px; opacity: 0.5; }
        .analyze-button.ready { opacity: 1; box-shadow: 0 4px 15px rgba(123, 72, 255, 0.4); }
        
        /* Dynamic Results Area */
        #skin-analysis-results { margin-top: 30px; }
        .color-swatch-stack-item { border: 2px solid white; }
    </style>
</head>
<body>

<div class="skin-analyzer-container step-1">
    
    <div class="progress-container">
        <div class="sca-progress-step active clickable" data-step="1">1. Upload</div>
        <div class="sca-progress-connector"></div>
        <div class="sca-progress-step clickable" data-step="2">2. Sample</div>
        <div class="sca-progress-connector"></div>
        <div class="sca-progress-step" data-step="3">3. Results</div>
    </div>

    <form id="image-upload-form">
        <div id="upload-area" class="upload-area">
            <div class="selfie-icon">📸</div>
            <div class="upload-option">Click to Upload or Drag & Drop</div>
            <p style="color: #888; margin-top: 10px;">For best results, use a photo with natural daylight.</p>
            <input type="file" id="image-file" accept="image/jpeg, image/png, image/heic, image/webp" style="display:none;">
        </div>
    </form>

    <div class="image-preview-container">
        <button class="close-preview">X</button>
        <img id="uploaded-image" src="" alt="preview">
    </div>

    <div id="analysis-loading" style="display:none;">
        <span class="button-emoji" style="font-size: 2em; display: block; margin-bottom: 10px;">✨</span> 
        Analyzing your unique features...
    </div>

    <div id="skin-analysis-results"></div>

</div>

<template id="color-selection-template">
    <div class="color-selection-screen">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button id="back-to-upload" style="background: #eee; color: #333;">← Back</button>
            <h3 style="margin: 0;">Sample Your Colors</h3>
            <div style="width: 80px;"></div> </div>
        
        <p style="color: #666; margin-top: 10px;">Tap the image to select your skin, hair, and eye color.</p>

        <div class="image-container">
            <canvas id="color-picker-canvas"></canvas>
            <div class="crosshair">+</div>
        </div>

        <div class="controls-area">
            <div id="skin-selector" class="color-selector active">
                <button class="select-button active" data-type="skin">1. Skin</button>
            </div>
            <div id="hair-selector" class="color-selector">
                <button class="select-button" data-type="hair">2. Hair</button>
            </div>
            <div id="eye-selector" class="color-selector">
                <button class="select-button" data-type="eye">3. Eyes</button>
            </div>
        </div>
        
        <button id="analyze-button" class="analyze-button" disabled>Select 3 more colors</button>
    </div>
</template>

<script>
    window.sca_ajax_object = {
        has_active_subscription: true, // Bypasses the "Unlock Pro" blurs
        is_user_logged_in: true,
        login_url: "#",
        paddle_plan_id: "fake_id"
    };
</script>

<script type="module" src="./skin-analyzer.js"></script>

</body>
</html>
