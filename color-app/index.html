<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Color & Style Analyzer</title>
    <style>
       :root {
    --primary: #7b48ff;
    --primary-light: #f4f0ff;
    --bg: #f4f5f7;
    --surface: #ffffff;
    --text-main: #2d3748;
    --text-muted: #718096;
    --radius-lg: 20px;
    --radius-md: 12px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
}

body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    max-width: 900px; 
    margin: 0 auto; 
    padding: 15px; 
    background: var(--bg); 
    color: var(--text-main);
    line-height: 1.6;
}

/* --- MAIN CONTAINERS & PROGRESS --- */
.skin-analyzer-container { 
    background: var(--surface); 
    padding: 25px; 
    border-radius: var(--radius-lg); 
    box-shadow: var(--shadow-md); 
}
.progress-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; font-size: 0.9em; }
.sca-progress-step { padding: 8px 15px; border-radius: 20px; background: #edf2f7; color: var(--text-muted); font-weight: 600; text-align: center;}
.sca-progress-step.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(123, 72, 255, 0.3); }
.sca-progress-connector { flex-grow: 1; height: 3px; background: #edf2f7; margin: 0 5px; }

/* --- UPLOAD & SAMPLING UI --- */
.upload-area { border: 2px dashed #cbd5e0; border-radius: var(--radius-md); padding: 50px 20px; text-align: center; cursor: pointer; background: #f8fafc; transition: 0.3s; }
.upload-area:hover { border-color: var(--primary); background: var(--primary-light); }
.selfie-icon { font-size: 45px; margin-bottom: 10px; }
.image-preview-container { display: none; position: relative; margin-bottom: 20px; text-align: center; }
#uploaded-image { max-width: 100%; max-height: 60vh; border-radius: var(--radius-md); object-fit: contain; }
.image-container { position: relative; display: inline-block; cursor: crosshair; margin-top: 15px; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); width: 100%; }
#color-picker-canvas { width: 100%; display: block; }
.crosshair { position: absolute; pointer-events: none; color: white; text-shadow: 0 0 4px black; font-size: 24px; margin-top: -12px; margin-left: -12px;}

/* --- BUTTONS & CONTROLS --- */
.controls-area { margin-top: 20px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
button { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1em; transition: 0.2s; }
.select-button { background: #edf2f7; color: var(--text-main); width: 30%; min-width: 100px; }
.select-button.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(123, 72, 255, 0.3); }
.analyze-button { background: var(--primary); color: white; width: 100%; margin-top: 20px; opacity: 0.5; padding: 15px; font-size: 1.1em;}
.analyze-button.ready { opacity: 1; box-shadow: 0 4px 15px rgba(123, 72, 255, 0.4); }

/* --- RESULTS: PROFILE HEADER --- */
.user-season-profile { background: linear-gradient(135deg, #ffffff 0%, #f4f0ff 100%); padding: 30px 20px; border-radius: var(--radius-lg); margin-bottom: 40px; box-shadow: var(--shadow-sm); border: 1px solid #e2e8f0; }
.profile-content-column { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 15px; }
.profile-image-circle img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid white; box-shadow: var(--shadow-md); }
.season-name { font-size: 2em; margin: 10px 0 5px 0; color: var(--primary); }
.seasonal-subtype { font-size: 1.2em; font-weight: 600; color: var(--text-main); margin-bottom: 15px; }
.profile-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 10px; }
.profile-tag { background: white; padding: 6px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; box-shadow: var(--shadow-sm); border: 1px solid #edf2f7; }

/* --- RESULTS: COLOR SWATCHES --- */
.color-systems-header { text-align: center; margin: 40px 0 20px 0; }
.color-systems-header h3 { font-size: 1.5em; margin-bottom: 5px; }
.swatch-section-title { font-size: 1.2em; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; margin-top: 30px; }
.swatch-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; margin-top: 15px; }
.swatch-item { background: white; border-radius: var(--radius-md); padding: 15px 10px; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: var(--shadow-sm); cursor: pointer; transition: 0.2s; border: 1px solid #edf2f7; }
.swatch-item:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.swatch-circle { width: 50px; height: 50px; border-radius: 50%; margin-bottom: 10px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); }
.swatch-name { font-size: 0.85em; font-weight: 600; line-height: 1.2; }
.swatch-code { font-size: 0.7em; color: var(--text-muted); margin-top: 5px; text-transform: uppercase; }

/* --- RESULTS: COLORS TO AVOID --- */
.avoid-section { background: #fff5f5; padding: 25px; border-radius: var(--radius-lg); margin-top: 40px; border: 1px solid #fed7d7; }
.avoid-header h2 { color: #e53e3e; margin-top: 0; }
.avoid-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 15px; margin-top: 20px; }
.avoid-swatch { display: flex; flex-direction: column; align-items: center; text-align: center; }
.avoid-circle { width: 45px; height: 45px; border-radius: 50%; margin-bottom: 8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); position: relative; }
.avoid-circle::after { content: '×'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; font-weight: bold; text-shadow: 0 0 4px rgba(0,0,0,0.5); }
.avoid-name { font-size: 0.8em; font-weight: 600; color: #742a2a; }

/* --- RESULTS: STYLE DNA & CONTRAST --- */
.style-dna-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 600px) { .style-dna-grid { grid-template-columns: 1fr 1fr; } }
.dna-card, .contrast-rule-card { background: white; padding: 20px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid #edf2f7; display: flex; gap: 15px; align-items: flex-start; margin-bottom: 15px; }
.dna-card h6, .contrast-rule-card h5 { margin: 0 0 5px 0; font-size: 1.1em; color: var(--primary); }
.dna-card p, .contrast-rule-card p { margin: 0; font-size: 0.9em; color: var(--text-muted); }

/* --- TOAST NOTIFICATION --- */
.sca-toast-custom { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #333; color: white; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 0.9em; box-shadow: 0 4px 15px rgba(0,0,0,0.2); opacity: 0; visibility: hidden; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999; }
.sca-toast-custom.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

/* --- HIDE WORDPRESS UPSELLS JUST IN CASE --- */
.res-upsell-card, .paywall-container { display: none !important; }

    </style>
</head>
<body>

<div class="skin-analyzer-container step-1">
    
    <div class="progress-container">
        <div class="sca-progress-step active clickable" data-step="1">1. Upload</div>
        <div class="sca-progress-connector"></div>
        <div class="sca-progress-step clickable" data-step="2">2. Sample</div>
        <div class="sca-progress-connector"></div>
        <div class="sca-progress-step" data-step="3">3. Results</div>
    </div>

    <form id="image-upload-form">
        <div id="upload-area" class="upload-area">
            <div class="selfie-icon">📸</div>
            <div class="upload-option">Click to Upload or Drag & Drop</div>
            <p style="color: #888; margin-top: 10px;">For best results, use a photo with natural daylight.</p>
            <input type="file" id="image-file" accept="image/jpeg, image/png, image/heic, image/webp" style="display:none;">
        </div>
    </form>

    <div class="image-preview-container">
        <button class="close-preview">X</button>
        <img id="uploaded-image" src="" alt="preview">
    </div>

    <div id="analysis-loading" style="display:none;">
        <span class="button-emoji" style="font-size: 2em; display: block; margin-bottom: 10px;">✨</span> 
        Analyzing your unique features...
    </div>

    <div id="skin-analysis-results"></div>

</div>

<template id="color-selection-template">
    <div class="color-selection-screen">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button id="back-to-upload" style="background: #eee; color: #333;">← Back</button>
            <h3 style="margin: 0;">Sample Your Colors</h3>
            <div style="width: 80px;"></div> </div>
        
        <p style="color: #666; margin-top: 10px;">Tap the image to select your skin, hair, and eye color.</p>

        <div class="image-container">
            <canvas id="color-picker-canvas"></canvas>
            <div class="crosshair">+</div>
        </div>

        <div class="controls-area">
            <div id="skin-selector" class="color-selector active">
                <button class="select-button active" data-type="skin">1. Skin</button>
            </div>
            <div id="hair-selector" class="color-selector">
                <button class="select-button" data-type="hair">2. Hair</button>
            </div>
            <div id="eye-selector" class="color-selector">
                <button class="select-button" data-type="eye">3. Eyes</button>
            </div>
        </div>
        
        <button id="analyze-button" class="analyze-button" disabled>Select 3 more colors</button>
    </div>
</template>

<script>
    window.sca_ajax_object = {
        has_active_subscription: true, // Bypasses the "Unlock Pro" blurs
        is_user_logged_in: true,
        login_url: "#",
        paddle_plan_id: "fake_id"
    };
</script>

<script type="module" src="./skin-analyzer.js"></script>

</body>
</html>
