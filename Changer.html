<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Monitor</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(180deg, #fff 0%, #f8f8f8 100%); color: #333; margin: 0; padding: 0.5rem; min-height: 100vh; font-size: 13px; }
        .container { background: #fff; padding: 1rem; border-radius: 6px; border: 1px solid #ddd; max-width: 400px; margin: 0 auto; }
        h1 { text-align: center; margin: 0 0 0.5rem; font-size: 1.2rem; color: #000; font-weight: 600; }
        p { text-align: center; font-size: 12px; color: #666; margin-bottom: 1rem; }
        .input-group { margin-bottom: 0.75rem; }
        input[type="url"] { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; background: #fff; outline: none; }
        input[type="url"]:focus { border-color: #000; }
        button { width: 100%; background: #000; color: white; border: none; padding: 8px; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        button:hover:not(:disabled) { background: #333; }
        button:disabled { background: #999; cursor: not-allowed; }
        .spinner { display: none; width: 12px; height: 12px; border: 1px solid #ffffff60; border-top: 1px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 6px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { margin-top: 0.75rem; padding: 6px 8px; border-radius: 4px; text-align: center; font-size: 12px; min-height: 16px; }
        .status-loading { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
        .status-success { background: #f0f0f0; color: #000; border: 1px solid #bbb; }
        .status-error { background: #f8f8f8; color: #666; border: 1px solid #ccc; }
        .results { margin-top: 1rem; display: none; }
        .tab-container { display: flex; background: #f5f5f5; border-radius: 4px; padding: 2px; margin-bottom: 0.75rem; border: 1px solid #ddd; }
        .tab { flex: 1; padding: 6px; text-align: center; border-radius: 2px; cursor: pointer; font-size: 11px; font-weight: 500; }
        .tab.active { background: #fff; color: #000; border: 1px solid #ccc; }
        .tab:not(.active) { color: #666; }
        .content-box { background: #fafafa; border: 1px solid #ddd; border-radius: 4px; padding: 0.75rem; max-height: 250px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.3; white-space: pre-wrap; word-wrap: break-word; }
        .iframe-box { background: #fff; border: 1px solid #ddd; border-radius: 4px; height: 250px; overflow: hidden; }
        .iframe-box iframe { width: 100%; height: 100%; border: none; }
        .diff-added { background: #d4edda; color: #155724; }
        .diff-removed { background: #f8d7da; color: #721c24; text-decoration: line-through; }
        .debug-info { background: #fff3cd; border: 1px solid #ffeaa7; padding: 8px; margin: 8px 0; border-radius: 4px; font-size: 11px; }
    </style>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/diff@5.1.0/dist/diff.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🔍 Site Monitor</h1>
        <p>Track changes on any website</p>
        
        <div class="input-group">
            <input type="url" id="url-input" placeholder="https://example.com" value="https://www.domain.com.au/building-profile/105-clarendon-street-southbank-vic-3006?filtertype=forRent&pagesize=10&pageno=1">
        </div>
        
        <button id="monitor-button" onclick="monitorUrl()">
            <span class="spinner" id="spinner"></span>
            <span id="button-text">Check for Changes</span>
        </button>
        
        <div id="status"></div>

        <div class="results" id="results">
            <div class="tab-container">
                <div class="tab active" onclick="switchTab('diff')">Changes</div>
                <div class="tab" onclick="switchTab('html')">Source</div>
                <div class="tab" onclick="switchTab('render')">Preview</div>
            </div>
            <div id="diff-content" class="content-box"></div>
            <div id="html-content" class="content-box" style="display:none;"></div>
            <div id="render-content" class="iframe-box" style="display:none;"><iframe id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe></div>
        </div>
    </div>

    <script>
        const CLOUDFLARE_WORKER_URL = ""; // Leave empty to skip - replace with your worker if you have one
        
        const FALLBACK_PROXIES = [
            {
                name: 'AllOrigins',
                build: url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                parse: async (response) => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    if (!data.contents) throw new Error('No content returned');
                    // Check if we got an error page instead of real content
                    if (data.contents.includes('AllOrigins') && data.contents.includes('error')) {
                        throw new Error('Proxy returned error page');
                    }
                    return data.contents;
                }
            },
            {
                name: 'cors-anywhere',
                build: url => `https://cors-anywhere.herokuapp.com/${url}`,
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            },
            {
                name: 'corsproxy.io',
                build: url => `https://corsproxy.io/?${encodeURIComponent(url)}`
            }
        ];
        
        const SUPABASE_URL = 'https://zsjsqrvrmlupfthkppva.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzanNxcnZybWx1cGZ0aGtwcHZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTczMDU4MDgsImV4cCI6MjA3Mjg4MTgwOH0.nFOJn2NcMjyQ_oC7JmA4rPqQyEt8bgWsUUzBfaTnvRM';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchWithTimeout(url, options = {}, timeout = 20000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        async function fetchPageContent(url) {
            let lastError;

            // Skip Cloudflare Worker if not configured
            if (CLOUDFLARE_WORKER_URL && !CLOUDFLARE_WORKER_URL.includes('your-username')) {
                try {
                    setStatus('Fetching via personal proxy...', 'loading');
                    const proxyUrl = `${CLOUDFLARE_WORKER_URL}?url=${encodeURIComponent(url)}`;
                    const response = await fetchWithTimeout(proxyUrl);
                    if (!response.ok) throw new Error(`Status ${response.status}`);
                    const content = await response.text();
                    if (validateContent(content, url)) return content;
                    throw new Error('Invalid content received');
                } catch (error) {
                    lastError = error;
                    console.warn(`Cloudflare Worker failed: ${error.message}`);
                }
            }

            // Try fallback proxies in order
            for (const proxy of FALLBACK_PROXIES) {
                try {
                    setStatus(`Trying ${proxy.name}...`, 'loading');
                    const proxyUrl = proxy.build(url);
                    const options = proxy.headers ? { headers: proxy.headers } : {};
                    const response = await fetchWithTimeout(proxyUrl, options, 15000);
                    
                    let content = proxy.parse ? await proxy.parse(response) : await response.text();
                    
                    if (validateContent(content, url)) {
                        setStatus(`✅ Fetched via ${proxy.name}`, 'loading');
                        return content;
                    }
                    throw new Error('Content validation failed');
                } catch (error) {
                    lastError = error;
                    console.warn(`${proxy.name} failed:`, error.message);
                }
            }
            
            throw new Error(`All proxies failed. Last error: ${lastError?.message || 'Unknown error'}`);
        }

        function validateContent(content, originalUrl) {
            if (!content || content.length < 100) return false;
            
            // Check for common error indicators
            const errorIndicators = [
                'blocked by CORS policy',
                'access denied',
                'proxy error',
                'service unavailable',
                'too many requests',
                'rate limit exceeded',
                'AllOrigins',
                'cors-anywhere'
            ];
            
            const lowerContent = content.toLowerCase();
            const hasErrorIndicators = errorIndicators.some(indicator => 
                lowerContent.includes(indicator.toLowerCase())
            );
            
            if (hasErrorIndicators && content.length < 1000) {
                return false;
            }
            
            // Basic HTML validation
            const hasHtmlStructure = content.includes('<html') || content.includes('<body') || content.includes('<!DOCTYPE');
            const hasContent = content.length > 200;
            
            return hasHtmlStructure && hasContent;
        }

        function extractTextContent(html) {
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Remove unwanted elements
                ['script', 'style', 'noscript', 'iframe', 'svg', 'nav', 'header', 'footer'].forEach(tag => {
                    doc.querySelectorAll(tag).forEach(el => el.remove());
                });
                
                // Get text content
                let text = doc.body?.innerText || doc.documentElement?.innerText || '';
                
                // Preserve word boundaries better
                text = text
                    .replace(/\s*\n\s*/g, ' ')  // Replace newlines with spaces
                    .replace(/\s{2,}/g, ' ')    // Multiple spaces to single space
                    .replace(/\s+([.,!?;:])/g, '$1') // Remove space before punctuation
                    .trim();
                
                return text;
            } catch (e) {
                console.error("DOM parsing failed, using regex fallback", e);
                // Fallback with better word boundary preservation
                return html
                    .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
                    .replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '')
                    .replace(/<[^>]+>/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim();
            }
        }
        
        async function monitorUrl() {
            const urlInput = document.getElementById('url-input');
            const results = document.getElementById('results');
            const diffContent = document.getElementById('diff-content');
            const htmlContent = document.getElementById('html-content');
            const previewFrame = document.getElementById('preview-frame');

            const url = urlInput.value.trim();
            if (!url) {
                setStatus('Please enter a URL', 'error');
                return;
            }

            if (!url.match(/^https?:\/\/.+/)) {
                setStatus('Please enter a valid URL starting with http:// or https://', 'error');
                return;
            }

            setLoading(true);
            results.style.display = 'none';
            
            try {
                const currentHtml = await fetchPageContent(url);
                const currentText = extractTextContent(currentHtml);
                
                console.log(`Extracted ${currentText.length} characters from page`);
                
                if (!currentText || currentText.length < 50) {
                    throw new Error('Extracted content too short - may have fetched error page');
                }

                // Show debug info for first few requests
                if (currentText.length < 500) {
                    console.warn('Short content detected:', currentText.substring(0, 200));
                }

                htmlContent.textContent = currentHtml;
                previewFrame.srcdoc = currentHtml;
                
                setStatus('Checking database...', 'loading');
                
                const { data: previousData, error: selectError } = await supabaseClient
                    .from('monitored_pages')
                    .select('page_text, last_checked')
                    .eq('url', url)
                    .single();

                if (selectError && selectError.code !== 'PGRST116') {
                    throw new Error(`Database error: ${selectError.message}`);
                }

                const now = new Date().toISOString();

                if (previousData) {
                    const differences = Diff.diffChars(previousData.page_text, currentText);
                    const fragment = document.createDocumentFragment();
                    let hasChanges = differences.some(part => part.added || part.removed);

                    differences.forEach(part => {
                        const span = document.createElement('span');
                        span.className = part.added ? 'diff-added' : (part.removed ? 'diff-removed' : '');
                        span.appendChild(document.createTextNode(part.value));
                        fragment.appendChild(span);
                    });

                    diffContent.innerHTML = '';
                    diffContent.appendChild(fragment);
                    
                    const changePercent = hasChanges ? 
                        Math.round((differences.filter(p => p.added || p.removed).reduce((a, p) => a + p.value.length, 0) / currentText.length) * 100) : 0;
                    
                    setStatus(hasChanges ? `✨ Changes detected (${changePercent}% different)` : '✅ No changes detected', 'success');
                    
                    const { error: updateError } = await supabaseClient
                        .from('monitored_pages')
                        .update({ page_text: currentText, last_checked: now })
                        .eq('url', url);
                    if (updateError) console.error('DB Update Error:', updateError.message);
                
                } else {
                    diffContent.innerHTML = `<div class="debug-info">First check - baseline saved (${currentText.length} chars)</div>${currentText}`;
                    setStatus('📝 First snapshot saved!', 'success');
                    
                    const { error: insertError } = await supabaseClient
                        .from('monitored_pages')
                        .insert({ url: url, page_text: currentText, last_checked: now });
                    if (insertError) console.error('DB Insert Error:', insertError.message);
                }

                results.style.display = 'block';

            } catch (error) {
                console.error('Monitor error:', error);
                setStatus(`❌ ${error.message}`, 'error');
            } finally {
                setLoading(false);
            }
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById('diff-content').style.display = tab === 'diff' ? 'block' : 'none';
            document.getElementById('html-content').style.display = tab === 'html' ? 'block' : 'none';
            document.getElementById('render-content').style.display = tab === 'render' ? 'block' : 'none';
        }

        function setLoading(loading) {
            const button = document.getElementById('monitor-button');
            button.disabled = loading;
            document.getElementById('spinner').style.display = loading ? 'inline-block' : 'none';
            document.getElementById('button-text').textContent = loading ? 'Checking...' : 'Check for Changes';
        }

        function setStatus(msg, type = '') {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = type ? `status-${type}` : '';
        }
        
        document.getElementById('url-input').addEventListener('keypress', e => {
            if (e.key === 'Enter' && !document.getElementById('monitor-button').disabled) {
                monitorUrl();
            }
        });
        
        document.addEventListener('DOMContentLoaded', () => document.getElementById('url-input').focus());
    </script>
</body>
</html>
