<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>default</title>
    <style>
        *,
        *:before,
        *:after {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #000;
            color: #0a0;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            min-height: 100vh
        }

        header {
            padding: 2px;
            text-align: center;
            background: #000;
            border-bottom: 0.1px solid #0a0
        }

        header h1 {
            font-size: 5px;
            letter-spacing: 2px;
            text-shadow: 0 0 1px #0a0
        }
.video_wrapper {
    /* make sure any overflow is hidden */
    overflow: hidden;
  }
  .video_wrapper iframe {
    display: block;
    width: 100%;
    height: 50vh;
    
    clip-path: inset(0 0 35px 0);
    /* preserve sharp edges */
    -webkit-clip-path: inset(0 0 35px 0);
  }
        .stream-container {
            position: relative;              /* <-- make it a positioning context */
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0px;
            margin: 8px;
            border: 0.1px dashed #111;
            box-shadow: 0 0 10px rgba(10, 255, 10, 0.2)
        }

        .stream-container iframe {
            width: 100%;
            max-width: 800px;
            height: 30vh;
            border: 0.1px dashed #111;
            background: #000
        }

        

        footer {
            background: #111;
            border-top: 1px solid #0a0;
            padding: 8px;
            font-size: 12px;
            position: relative;
            overflow: hidden;
            height: 120px
        }

        #c {
            white-space: pre-wrap;
            line-height: 1.2;
            height: 100%;
            overflow-y: auto
        }
    </style>
</head>

<body>
    <header>
        <h1>$default(camera);</h1>
    </header>
    <div class="video_wrapper">
        <iframe id="playerFrame"
            src="https://rtsp.me/embed/BsQZa96R/"
            allowfullscreen
            title="Live"
            sandbox="allow-scripts allow-same-origin"></iframe>
        
    </div>
    <footer>
        <div id="c"></div>
    </footer>
    <script>
        
        !function() {
            var l = ["#EXTM3U", "#EXT-X-VERSION:7", "#EXT-X-TARGETDURATION:6", "#EXT-X-MEDIA-SEQUENCE:6", "#EXT-X-MAP:URI=\"BsQZa96R.mp4\"", "#EXTINF:4.000044,", "BsQZa96R-20250513-1747113083.m4s", "#EXTINF:5.999811,", "BsQZa96R-20250513-1747113087.m4s", "#EXTINF:5.999778,", "BsQZa96R-20250513-1747113093.m4s", "#EXTINF:6.003789,", "BsQZa96R-20250513-1747113099.m4s", "#EXTINF:5.995778,", "BsQZa96R-20250513-1747113105.m4s", "CPU:error", "MEM:65%", "Threads:8", "Latency:0.204s", "PktLoss:0.01%"],
                i = 0,
                c = document.getElementById("c");
            function t() {
                if (i < l.length) {
                    c.textContent += l[i++] + "\n";
                    c.scrollTop = c.scrollHeight;
                    setTimeout(t, 400 + 300 * Math.random());
                }
            }
            setTimeout(t, 800);
        }();

        
    </script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const logo = document.querySelector('.video_wrapper .logo');
    if (logo) logo.remove();
  });
</script>

</body>

</html>
