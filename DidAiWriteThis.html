<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">

<style>
  @import url(https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap);

  :root {
    --bg-color: #f9f9f9;
    --text-color: #2d2d2d;
    --border-color: #2d6765;
    --primary-color: #000;
    --secondary-color: #fff;
    --subtle-text-color: #555;
    --highlight-bg: #f0f0f0;
    --error-color: #c0392b;
    --warning-color: #f59e0b
  }

  body {
    font-family: "Sansation", sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-size: 13.5px;
    line-height: 1.7;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale
  }

  h1,
  h2,
  h3 {
    font-weight: 600;
    letter-spacing: -.5px
  }

  .main-container {
    max-width: 750px;
    margin: 0 auto;
    padding: 3rem 1.5rem
  }

  header {
    text-align: center;
    margin-bottom: 3rem
  }

  header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: .5rem
  }

  header p {
    font-size: .9rem;
    color: var(--subtle-text-color)
  }

  .card {
    background-color: var(--secondary-color);
    border: 1px solid var(--border-color);
    padding: 2rem;
    margin-bottom: 2rem;
    transition: box-shadow .3s ease-in-out
  }

  .editor {
    min-height: 250px;
    width: 100%;
    font-size: .6rem;
    border: 2px solid var(--border-color);
    padding: 1.5rem;
    transition: all .3s ease
  }

  .editor:focus {
    outline: 0;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(0, 0, 0, .05)
  }

  .editor:empty:before {
    content: attr(placeholder);
    color: #999
  }

  .editor-controls {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: .75rem;
    margin-top: 1rem
  }

  .btn {
    font-family: "Sansation", sans-serif;
    font-size: .9rem;
    font-weight: 500;
    padding: .75rem 1.5rem;
    border: none;
    cursor: pointer;
    transition: all .3s ease
  }

  #analyze-btn {
    background-color: var(--primary-color);
    color: var(--secondary-color)
  }

  #analyze-btn:hover:not(:disabled) {
    background-color: #333;
    transform: translateY(-2px)
  }

  #analyze-btn:disabled {
    background-color: #ccc;
    cursor: not-allowed
  }

  #clear-btn {
    background-color: transparent;
    color: var(--text-color);
    border: 1px solid var(--border-color)
  }

  #clear-btn:hover {
    background-color: var(--highlight-bg);
    border-color: #ccc
  }

  #results-container {
    display: flex;
    flex-direction: column;
    gap: 2rem
  }

  .results-summary {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center
  }

  h2.section-title {
    font-size: 1.2rem;
    margin-bottom: 1.5rem;
    text-align: center
  }

  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .5s ease-in-out;
    --score-percent: 0%;
    background: conic-gradient(var(--border-color) 0 var(--score-percent), var(--border-color) var(--score-percent) 100%)
  }

  #score-text {
    font-size: 2.5rem;
    font-weight: 700
  }

  #confidence-level {
    font-size: .8rem;
    color: var(--subtle-text-color);
    margin-top: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px
  }

  #key-indicators {
    list-style-type: none;
    padding: 0;
    margin: 0;
    width: 100%;
    text-align: center
  }

  #key-indicators li {
    padding: .75rem;
    border: 1px solid var(--border-color);
    margin-top: .75rem;
    font-size: .8rem
  }

  .warning-notice {
    background: #fff3cd;
    border: 1px solid #ffc107;
    padding: 1rem;
    margin-bottom: 1rem;
    font-size: .85rem;
    color: #856404;
    border-radius: 4px
  }

  #analysis-categories {
    border: 1px solid var(--border-color)
  }

  .category-wrapper {
    border-bottom: 1px solid var(--border-color)
  }

  .category-wrapper:last-child {
    border-bottom: none
  }

  .category-header {
    cursor: pointer;
    padding: 1.25rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background-color .3s ease
  }

  .category-header:hover {
    background-color: #fbfbfb
  }

  .category-header h3 {
    font-size: 1rem;
    font-weight: 500;
    text-transform: capitalize
  }

  .category-header svg {
    width: 16px;
    height: 16px;
    transition: transform .4s cubic-bezier(.25, .46, .45, .94)
  }

  .category-header.expanded svg {
    transform: rotate(180deg)
  }

  .category-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height .4s cubic-bezier(.25, .46, .45, .94)
  }

  .category-content.expanded {
    max-height: 2000px;
    transition: max-height .6s cubic-bezier(.25, .46, .45, .94)
  }

  .category-content-inner {
    padding: 0 1.5rem 1.5rem;
    border-top: 1px solid var(--border-color)
  }

  .category-item {
    padding: 1rem;
    background-color: var(--bg-color);
    border: 1px solid #e9e9e9;
    margin-top: 1rem
  }

  .item-title {
    font-weight: 500;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: .5rem
  }

  .item-description {
    font-size: .85rem;
    color: var(--subtle-text-color)
  }

  .item-description.small {
    margin-top: .25rem;
    font-size: .8rem
  }

  .item-subcategory {
    font-weight: 500;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border-color)
  }

  .badge {
    font-size: .7rem;
    font-weight: 700;
    padding: .2rem .6rem;
    background-color: var(--highlight-bg);
    border: 1px solid var(--border-color);
    color: var(--text-color)
  }

  .item-examples {
    margin-top: .75rem
  }

  .item-examples summary {
    cursor: pointer;
    font-weight: 500;
    font-size: .85rem;
    padding: .5rem;
    background: #fafafa;
    border: 1px solid var(--border-color);
    user-select: none
  }

  .item-examples summary:hover {
    background: #f0f0f0
  }

  .item-examples ul {
    list-style-type: disc;
    padding-left: 1.25rem;
    margin-top: .5rem
  }

  .item-examples li {
    margin-bottom: .75rem;
    font-size: .8rem;
    line-height: 1.6;
    color: #555
  }

  .hidden {
    display: none !important
  }

  .fade-in {
    animation: fadeIn .8s ease-in-out forwards
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(15px)
    }

    to {
      opacity: 1;
      transform: translateY(0)
    }
  }

  .trigger-highlight {
    color: var(--error-color);
    background-color: #fef2f2;
    font-weight: 600;
    padding: 0 2px;
    border-radius: 3px
  }

  </style>
