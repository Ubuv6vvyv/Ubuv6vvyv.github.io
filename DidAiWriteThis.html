<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
  /* --- Font Import --- */
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap');

  /* --- Root Variables (Monochrome Palette) --- */
  :root {
    --bg-color: #f9f9f9;
    --text-color: #333333;
    --border-color: #e0e0e0;
    --primary-color: #000000;
    --secondary-color: #ffffff;
    --subtle-text-color: #888888;
    --highlight-bg: #eeeeee;
    --score-low: #333333;
    --score-medium: #555555;
    --score-high: #000000;
  }

  /* --- Base & Typography --- */
  body {
    font-family: 'JetBrains Mono', monospace;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-size: 14px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1, h2, h3 {
    font-weight: 500;
    letter-spacing: -0.5px;
  }

  /* --- Main Layout --- */
  .main-container {
    max-width: 700px;
    margin: 0 auto;
    padding: 3rem 1.5rem;
  }

  header {
    text-align: center;
    margin-bottom: 3rem;
  }

  header h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
  }

  header p {
    font-size: 0.95rem;
    color: var(--subtle-text-color);
  }

  .card {
    background-color: var(--secondary-color);
    border: 1px solid var(--border-color);
    padding: 2rem;
    margin-bottom: 2rem;
    transition: box-shadow 0.3s ease-in-out;
  }

  /* --- Editor --- */
  .editor {
    min-height: 250px;
    width: 100%;
    font-size: 0.9rem;
    border: 1px solid var(--border-color);
    padding: 1.5rem;
    transition: all 0.3s ease;
  }

  .editor:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
  }

  .editor-controls {
    display: flex;
    justify-content: flex-end;
    margin-top: 1rem;
  }

  /* --- Button --- */
  #analyze-btn {
    background-color: var(--primary-color);
    color: var(--secondary-color);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 0.75rem 1.5rem;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  #analyze-btn:hover:not(:disabled) {
    background-color: #333;
    transform: translateY(-2px);
  }

  #analyze-btn:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
  }

  /* --- Results Section --- */
  #results-container {
    display: flex;
    flex-direction: column;
    gap: 2rem;
  }

  .results-summary {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  h2.section-title {
    font-size: 1.25rem;
    margin-bottom: 1.5rem;
    text-align: center;
  }

  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.5s ease-in-out;
    --score-percent: 0%;
    background: conic-gradient(var(--border-color) 0% var(--score-percent), var(--border-color) var(--score-percent) 100%);
  }
  
  #score-text {
    font-size: 2.5rem;
    font-weight: 700;
  }

  #confidence-level {
    font-size: 0.85rem;
    color: var(--subtle-text-color);
    margin-top: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  #key-indicators {
    list-style-type: none;
    padding: 0;
    margin: 0;
    width: 100%;
    text-align: center;
  }

  #key-indicators li {
    padding: 0.75rem;
    border: 1px solid var(--border-color);
    margin-top: 0.75rem;
    font-size: 0.85rem;
  }
  
  /* --- Detailed Analysis Accordion --- */
  #analysis-categories {
    border: 1px solid var(--border-color);
  }
  
  .category-wrapper {
    border-bottom: 1px solid var(--border-color);
  }

  .category-wrapper:last-child {
    border-bottom: none;
  }

  .category-header {
    cursor: pointer;
    padding: 1.25rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background-color 0.3s ease;
  }
  
  .category-header:hover {
    background-color: #fbfbfb;
  }

  .category-header h3 {
    font-size: 1rem;
    font-weight: 500;
    text-transform: capitalize;
  }
  
  .category-header svg {
    width: 16px;
    height: 16px;
    transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  .category-header svg.rotate-180 {
    transform: rotate(180deg);
  }

  .category-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  .category-content.expanded {
    max-height: 2000px;
    transition: max-height 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  
  .category-content-inner {
    padding: 0 1.5rem 1.5rem 1.5rem;
    border-top: 1px solid var(--border-color);
  }

  /* --- Detailed Analysis Items --- */
  .category-item {
    padding: 1rem;
    background-color: var(--bg-color);
    border: 1px solid #e9e9e9;
    margin-top: 1rem;
  }

  .item-title {
    font-weight: 500;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.5rem;
  }

  .item-description {
    font-size: 0.85rem;
    color: var(--subtle-text-color);
  }
  
  .item-description.small {
    margin-top: 0.25rem;
  }
  
  .item-subcategory {
     font-weight: 500;
     margin-top: 1rem;
     padding-top: 1rem;
     border-top: 1px solid var(--border-color);
  }
  
  .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      background-color: var(--highlight-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
  }
  
  /* --- Utility Classes --- */
  .hidden {
    display: none !important;
    opacity: 0;
    visibility: hidden;
  }
  
  .fade-in {
    animation: fadeIn 0.8s ease-in-out forwards;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(15px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

</style>
  </head>
 <body>
    <div class="main-container">
      <header>
        <h1>AI Content Detector</h1>
        <p>A tool to analyze text for AI-generated patterns.</p>
      </header>
      
      <main>
        <div class="card">
          <div id="editor" contenteditable="true" class="editor" placeholder="Paste or type your text here..."></div>
          <div class="editor-controls">
            <button id="analyze-btn" disabled>Analyze</button>
          </div>
        </div>
        
        <div id="results-container" class="hidden fade-in">
          <div class="card results-summary">
            <h2 class="section-title">Analysis Summary</h2>
            <div id="score-circle" class="score-circle">
              <span id="score-text">-%</span>
            </div>
            <p id="confidence-level"></p>
          </div>
          
          <div class="card">
            <h2 class="section-title">Key Indicators</h2>
            <ul id="key-indicators">
              <li class="text-gray-500">Analysis results will appear here.</li>
            </ul>
          </div>
        </div>

        <div id="detailed-analysis" class="hidden fade-in">
            <h2 class="section-title" style="margin-top: 2rem;">Detailed Analysis</h2>
            <div id="analysis-categories"></div>
        </div>

      </main>
    </div>    <script>
      // --- UTILITY CLASS ---
      class Utils {
        static htmlToText(html) {
          if (!html || typeof html !== 'string') return '';
          const tempDiv = document.createElement('div');
          tempDiv.innerHTML = html;
          return tempDiv.textContent || tempDiv.innerText || '';
        }
        static countWords(text) {
          if (!text || typeof text !== 'string') return 0;
          return this.htmlToText(text).trim().split(/\s+/).filter(word => word.length > 0).length;
        }
        static debounce(func, wait = 300) {
          let timeout;
          return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
          };
        }
      }
      // --- ANALYZER CLASSES ---
      class UnicodeAnalyzer {
        constructor() {
          this.invisibleChars = {
            '\u200B': 'Zero Width Space',
            '\u200C': 'Zero Width Non-Joiner',
            '\u200D': 'Zero Width Joiner',
            '\uFEFF': 'Byte Order Mark'
          };
        }
        analyze(html) {
          const plainText = Utils.htmlToText(html);
          const found = [];
          let hasBomNotAtStart = false;
          for (let i = 0; i < plainText.length; i++) {
            const char = plainText[i];
            if (this.invisibleChars[char]) {
              found.push({
                char,
                name: this.invisibleChars[char],
                position: i
              });
              if (char === '\uFEFF' && i > 0) hasBomNotAtStart = true;
            }
          }
          return {
            found,
            hasBomNotAtStart,
            count: found.length,
            hasData: found.length > 0
          };
        }
        getScore(results) {
          let score = 0,
            confidence = 0.5,
            explanation = null;
          if (results.hasBomNotAtStart) {
            score = 0.9;
            confidence = 0.9;
            explanation = "Byte Order Mark found mid-text, which is highly unusual.";
          } else if (results.count > 5) {
            score = 0.7;
            confidence = 0.8;
            explanation = `High number of invisible characters (${results.count}) detected.`;
          } else if (results.count > 0) {
            score = 0.3;
            confidence = 0.6;
            explanation = `A few invisible characters (${results.count}) were found.`;
          }
          return {
            score,
            confidence,
            explanation
          };
        }
        getHtml(results) {
          if (!results.hasData) return '<p class="text-gray-500">No unusual Unicode characters found.</p>';
          let html = `<p class="mb-2">Found ${results.count} invisible character(s):</p><ul class="list-disc pl-5 space-y-1">`;
          const uniqueChars = [...new Set(results.found.map(f => f.char))];
          uniqueChars.forEach(char => {
            const count = results.found.filter(f => f.char === char).length;
            html += `<li><strong>${this.invisibleChars[char]}</strong> (U+${char.charCodeAt(0).toString(16).toUpperCase()}): Found ${count} time(s).</li>`;
          });
          if (results.hasBomNotAtStart) html += `<li class="text-red-600 font-semibold">Byte Order Mark (BOM) was found mid-text.</li>`;
          html += '</ul>';
          return html;
        }
      }
      class EmojiAnalyzer {
        analyze(html) {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const paragraphs = Array.from(doc.querySelectorAll('p, div, li'));
          const results = {
            consecutiveStartsWithAny: 0,
            percentStartsWithEmoji: 0,
            hasData: false
          };
          if (paragraphs.length < 3) return results;
          let maxConsecutiveAny = 0,
            currentConsecutiveAny = 0,
            startWithEmojiCount = 0;
          const emojiRegex = /^(\p{Emoji_Presentation}|\p{Extended_Pictographic})/u;
          paragraphs.forEach(p => {
            const text = p.textContent.trim();
            if (!text) return;
            if (text.match(emojiRegex)) {
              startWithEmojiCount++;
              currentConsecutiveAny++;
            } else {
              currentConsecutiveAny = 0;
            }
            maxConsecutiveAny = Math.max(maxConsecutiveAny, currentConsecutiveAny);
          });
          results.consecutiveStartsWithAny = maxConsecutiveAny;
          results.percentStartsWithEmoji = (startWithEmojiCount / paragraphs.length) * 100;
          results.hasData = results.consecutiveStartsWithAny > 2 || results.percentStartsWithEmoji > 30;
          return results;
        }
        getScore(results) {
          let score = 0,
            confidence = 0.5,
            explanation = null;
          if (results.percentStartsWithEmoji > 80) {
            score = 0.95;
            confidence = 0.95;
            explanation = "Extremely high percentage of paragraphs start with emojis, a strong ChatGPT indicator.";
          } else if (results.consecutiveStartsWithAny > 3) {
            score = 0.85;
            confidence = 0.9;
            explanation = "Multiple consecutive paragraphs start with different emojis, a common AI pattern.";
          } else if (results.percentStartsWithEmoji > 50) {
            score = 0.75;
            confidence = 0.8;
            explanation = "A significant portion of paragraphs start with an emoji.";
          }
          return {
            score,
            confidence,
            explanation
          };
        }
        getHtml(results) {
          if (!results.hasData) return '<p class="text-gray-500">No significant emoji patterns detected.</p>';
          let html = `<ul class="list-disc pl-5 space-y-1">`;
          if (results.percentStartsWithEmoji > 10) html += `<li><strong>${results.percentStartsWithEmoji.toFixed(0)}%</strong> of paragraphs start with an emoji.</li>`;
          if (results.consecutiveStartsWithAny > 2) html += `<li>Found up to <strong>${results.consecutiveStartsWithAny}</strong> consecutive paragraphs starting with an emoji.</li>`;
          html += '</ul>';
          return html;
        }
      }
      class FormattingAnalyzer {
        analyze(html) {
          const paragraphs = html.split(/<\/p>|<p[^>]*>|\n\s*\n/).filter(p => p.trim().length > 0).map(p => Utils.htmlToText(p));
          if (paragraphs.length <= 1) return {
            hasData: false
          };
          const pLengths = paragraphs.map(p => p.split(/\s+/).filter(w => w.length > 0).length);
          const mean = pLengths.reduce((a, b) => a + b, 0) / pLengths.length;
          const sumSqDiff = pLengths.map(len => Math.pow(len - mean, 2)).reduce((a, b) => a + b, 0);
          const stdDev = Math.sqrt(sumSqDiff / pLengths.length);
          const isUniform = pLengths.length > 3 && stdDev < 5 && mean > 20;
          return {
            stdDev,
            isUniform,
            hasData: pLengths.length > 3
          };
        }
        getScore(results) {
          if (results.isUniform) {
            return {
              score: 0.75,
              confidence: 0.8,
              explanation: "Paragraphs are suspiciously uniform in length, a common trait of AI writing."
            };
          }
          return {
            score: 0,
            confidence: 0.5,
            explanation: null
          };
        }
        getHtml(results) {
          if (!results.hasData) return '<p class="text-gray-500">Not enough content to analyze paragraph structure.</p>';
          if (results.isUniform) return `<p>Paragraph lengths are very consistent (Standard Deviation: ${results.stdDev.toFixed(2)}), which can be a sign of AI generation.</p>`;
          return `<p class="text-gray-500">Paragraph lengths appear natural (Standard Deviation: ${results.stdDev.toFixed(2)}).</p>`;
        }
      }
      class LexicalAnalyzer {
        constructor() {
          this.thresholds = {
            ttr: {
              veryLow: 0.35,
              low: 0.45,
            },
            sentenceLengthVariation: {
              low: 5,
            }
          };
        }
        analyze(text) {
          if (!text || typeof text !== 'string') {
            return {
              hasData: false
            };
          }
          const plainText = Utils.htmlToText(text);
          if (Utils.countWords(plainText) < 50) return {
            hasData: false,
            wordCount: Utils.countWords(plainText)
          };
          const ttr = this.calculateTTR(plainText);
          const sentenceLength = this.analyzeSentenceLengths(plainText);
          return {
            hasData: true,
            ttr,
            sentenceLength
          };
        }
        calculateTTR(text) {
          const words = text.toLowerCase().replace(/[^\w\s]/g, ' ').split(/\s+/).filter(word => word.length > 0);
          if (words.length < 50) {
            return {
              ttr: 1,
              interpretation: 'Text too short',
              isSuspicious: false
            };
          }
          const uniqueWords = new Set(words);
          const ttr = uniqueWords.size / words.length;
          let interpretation;
          let isSuspicious = false;
          if (ttr < this.thresholds.ttr.veryLow) {
            interpretation = 'Very low lexical diversity (repetitive)';
            isSuspicious = true;
          } else if (ttr < this.thresholds.ttr.low) {
            interpretation = 'Low lexical diversity';
            isSuspicious = true;
          } else {
            interpretation = 'Good lexical diversity';
          }
          return {
            ttr,
            uniqueCount: uniqueWords.size,
            totalCount: words.length,
            interpretation,
            isSuspicious
          };
        }
        analyzeSentenceLengths(text) {
          const sentences = text.split(/[.!?]+(?:\s|$)/).filter(s => s.trim().length > 0);
          if (sentences.length < 3) {
            return {
              interpretation: 'Too few sentences',
              isSuspicious: false
            };
          }
          const sentenceLengths = sentences.map(s => s.split(/\s+/).filter(w => w.length > 0).length);
          const avgLength = sentenceLengths.reduce((sum, len) => sum + len, 0) / sentenceLengths.length;
          const squaredDiffs = sentenceLengths.map(len => Math.pow(len - avgLength, 2));
          const avgSquaredDiff = squaredDiffs.reduce((sum, diff) => sum + diff, 0) / squaredDiffs.length;
          const stdDev = Math.sqrt(avgSquaredDiff);
          const variationCoefficient = stdDev / avgLength;
          let interpretation;
          let isSuspicious = false;
          if (stdDev < this.thresholds.sentenceLengthVariation.low || variationCoefficient < 0.2) {
            interpretation = `Uniform sentences with low variation`;
            isSuspicious = sentences.length >= 10;
          } else {
            interpretation = `Sentences with natural variation`;
          }
          return {
            avgLength,
            stdDev,
            interpretation,
            isSuspicious
          };
        }
        getScore(results) {
          if (!results.hasData) return {
            score: 0,
            confidence: 0,
            explanation: null
          };
          let score = 0;
          let confidence = 0.5;
          let explanations = [];
          if (results.ttr?.isSuspicious) {
            score += 0.25;
            confidence = Math.max(confidence, 0.7);
            explanations.push("low lexical diversity");
          }
          if (results.sentenceLength?.isSuspicious) {
            score += 0.3;
            confidence = Math.max(confidence, 0.75);
            explanations.push("unusually uniform sentence lengths");
          }
          let explanation = null;
          if (explanations.length > 0) {
            explanation = `Lexical patterns found: ${explanations.join(' and ')}.`;
          }
          return {
            score: Math.min(score, 1),
            confidence,
            explanation
          };
        }
        getHtml(results) {
          if (!results.hasData) {
            return `
						<p class="text-gray-500">Not enough text (${results.wordCount || 0} words) for a reliable lexical analysis.</p>`;
          }
          let html = '';
          const {
            ttr,
            sentenceLength
          } = results;
          if (ttr) {
            html += `
						<div class="category-item">
							<div class="item-title">Word Variety</div>
							<div class="item-description">${ttr.interpretation}.</div>
							<div class="item-details">${ttr.uniqueCount} unique words out of ${ttr.totalCount} total.</div>
						</div>`;
          }
          if (sentenceLength) {
            html += `
						<div class="category-item">
							<div class="item-title">Sentence Style</div>
							<div class="item-description">${sentenceLength.interpretation}.</div>
							<div class="item-details">Avg. sentence length: ${sentenceLength.avgLength?.toFixed(1)} words. Std Dev: ${sentenceLength.stdDev?.toFixed(2)}.</div>
						</div>`;
          }
          return html;
        }
      }

             this.formalityWords = [

      class AnalysisManager {
        constructor() {

            stylistic: new StylisticAnalyzer(),
            lexical: new LexicalAnalyzer(),
            emoji: new EmojiAnalyzer()

        }
        analyze(html) {
          this.runAnalyses(html).then(results => this.displayResults(results));
        }
        runAnalyses(html) {
          return new Promise(resolve => {
            setTimeout(() => {
              const
              results = {};
              for (const key in this.analyzers) {
                results[key] = this.analyzers[key].analyze(html);
              }
              results.score = this.calculateScore(results);
              resolve(results);
            }, 100);
          });
        }
        calculateScore(results) {
          const contributions = {};
          for (const key in this.analyzers) {
            contributions[key] = this.analyzers[key].getScore(results[key]);
          }
          let totalScore = 0,
            totalWeight = 0,
            maxConfidence = 0,
            strongIndicatorCount = 0;
          const keyIndicators = [];
          const weights = {
            unicode: 1.5,
            stylistic: 1.5,
            lexical: 1.4,
            formatting: 1.0,
            emoji: 1.2
          };
          for (const category in contributions) {
            const c = contributions[category];
            if (!c || c.score === 0) continue;
            if (c.score > 0.6) strongIndicatorCount++;
            let weight = weights[category] * (0.3 + 0.7 * c.confidence);
            totalScore += c.score * weight;
            totalWeight += weight;
            maxConfidence = Math.max(maxConfidence, c.confidence);
            if (c.explanation) {
              keyIndicators.push({
                explanation: c.explanation,
                score: c.score,
                confidence: c.confidence
              });
            }
          }
          let finalScore = totalWeight > 0 ?
            (totalScore / totalWeight) * 100 : 0;
          if (strongIndicatorCount >= 3) finalScore += 25;
          else if (strongIndicatorCount === 2) finalScore += 15;
          if (results.stylistic?.genericContent?.score >= 0.8) finalScore = Math.max(finalScore, 90);
          if (results.lexical?.sentenceLength?.isSuspicious) finalScore = Math.max(finalScore, 85);
          if (results.emoji?.percentStartsWithEmoji >= 80) finalScore = Math.max(finalScore, 90);
          if (results.stylistic?.punctuation?.results.emDashes.count >= 5) finalScore = Math.max(finalScore, 85);
          if (results.formatting?.isUniform) finalScore = Math.max(finalScore, 75);
          finalScore = Math.min(99, Math.round(finalScore));
          keyIndicators.sort((a, b) => (b.score * b.confidence) - (a.score * a.confidence));
          let confidenceLevel = 'Low';
          if (maxConfidence >= 0.85) confidenceLevel = 'High';
          else if (maxConfidence >= 0.6) confidenceLevel = 'Medium';
          return {
            value: finalScore,
            confidenceLevel,
            keyIndicators: keyIndicators.slice(0, 3)

        const performAnalysis = () => {
          const html = editor.innerHTML;
          if (Utils.countWords(html) < 20) {
            alert('Please enter at least 20 words for a meaningful analysis.');
            return;
          }
          analyzeBtn.disabled = true;
          analyzeBtn.textContent = 'Analyzing...';
          analysisManager.analyze(html);
          setTimeout(() => {
            analyzeBtn.disabled = false;
            analyzeBtn.textContent = 'Analyze';
          }, 1000);
        };
        analyzeBtn.addEventListener('click', performAnalysis);
        editor.addEventListener('input', Utils.debounce(() => {
          if (Utils.countWords(editor.innerHTML) >= 20) analyzeBtn.disabled = false;
        }, 300));
        editor.addEventListener('paste', e => {
          e.preventDefault();
          const text = (e.clipboardData || window.clipboardData).getData('text/plain');
          document.execCommand('insertText', false, text);
        });
      });
    </script>
  </body>
</html>
