<html lang=en>

    <meta charset=UTF-8>
    <meta content="width=device-width,initial-scale=1" name=viewport>
    <title> Detector v5.2</title>
    <script src=https://cdn.tailwindcss.com></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --bg: #f8fafc;
            --text: #1e293b;
            --border: #e2e8f0;
            --primary: #0f172a;
            --highlight: #f1f5f9;
        }

        body {
            font-family: "Quattrocento", serif;
  font-weight: 400;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .editor {
            min-height: 300px;
max-height: 300px;
            border: 2px solid #cbd5e1;
            padding: 1.2rem;
            background: #fff;
            border-radius: 12px;
            font-family: "Quattrocento", serif;
  font-weight: 400;
            font-size: 0.6rem;
            white-space: pre-wrap;
overflow: auto;
        }

        .editor:focus {
            outline: 0;
            border-color: #64748b;
            box-shadow: 0 0 0 4px rgba(100, 116, 139, 0.1);
        }

        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: conic-gradient(var(--score-color, #cbd5e1) 0 var(--score-percent, 0), #f1f5f9 0 100%);
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .score-circle::before {
            content: '';
            position: absolute;
            width: 130px;
            height: 130px;
            background: #fff;
            border-radius: 50%;
        }

        .score-circle span {
            position: relative;
            z-index: 1;
        }

        .category-header {
            cursor: pointer;
            user-select: none;
        }

        .category-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .category-content.open {
            max-height: 800px;
            overflow-y: auto;
        }

        .match-highlight {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 0 2px;
            border-radius: 2px;
            font-weight: 600;
            border-bottom: 1px solid #f87171;
        }

        .match-highlight-blue {
            background-color: #dbeafe;
            color: #1e40af;
            border-bottom: 1px solid #60a5fa;
        }

        .hidden { display: none; }
        
        .snippet-box {
            background-color: #f8fafc;
            border-left: 3px solid #cbd5e1;
            font-family: "SUSE Mono", sans-serif;
  font-optical-sizing: auto;
  font-weight: 400;
            font-size: 0.6rem;
            line-height: 1.5;
        }
    </style>
</head>

        </div>

        const Utils = {
            htmlToText: e => {
                const t = document.createElement("div");
                t.innerHTML = e;
                return t.textContent || t.innerText || "";
            },
            countWords: e => e.trim().split(/\s+/).filter(Boolean).length,
            escapeHtml: e => {
                const t = document.createElement("div");
                t.textContent = e;
                return t.innerHTML;
            },
            splitSentences: e => e.match(/[^.!?]+[.!?]+(?=\s|$)/g) || [],
            extractEmojis: e => [...e.matchAll(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu)].map(e => e[0]),
            calculateStdDev: e => {
                if (!e.length) return 0;
                const t = e.reduce((e, t) => e + t, 0) / e.length;
                return Math.sqrt(e.map(e => Math.pow(e - t, 2)).reduce((e, t) => e + t, 0) / e.length);
            },
            extractSnippet: (fullText, matchText, index, contextLength = 50, className = "match-highlight") => {
                const start = Math.max(0, index - contextLength);
                const end = Math.min(fullText.length, index + matchText.length + contextLength);
                let prefix = fullText.substring(start, index);
                let suffix = fullText.substring(index + matchText.length, end);
                if (start > 0) prefix = "..." + prefix;
                if (end < fullText.length) suffix = suffix + "...";
                return `${Utils.escapeHtml(prefix)}<span class="${className}">${Utils.escapeHtml(matchText)}</span>${Utils.escapeHtml(suffix)}`;
            }
        };

        class WeightedScorer {
            constructor() {
                this.totalWeight = 0;
                this.weightedScore = 0;
                this.findings = [];
            }
            add(score, weightLabel, type = "medium") {
                const weight = PatternConfig.weights[weightLabel] || 1;
                this.weightedScore += score * weight;
                this.totalWeight += weight;
                this.findings.push({ score, weight, type });
            }
            getScore() {
                return this.totalWeight > 0 ? Math.min(100, this.weightedScore / this.totalWeight) : 0;
            }
            getDetails() {
                return {
                    raw: this.weightedScore,
                    totalWeight: this.totalWeight,
                    normalized: this.getScore(),
                    findingsCount: this.findings.length
                };
            }
        }

        // --- 1. LEXICON ANALYZER ---
        class GPTLexiconAnalyzer {
            constructor(text) { this.text = text; this.wordCount = Utils.countWords(text); }
            analyze() {
                const scorer = new WeightedScorer();
                const matches = [];
                const MATCH_DISPLAY_CAP = 40;
                let totalHits = 0;
                PatternConfig.gptLexicon.forEach(phrase => {
                    const regex = new RegExp(`\\b${phrase}\\b`, "gi");
                    let match;
                    while ((match = regex.exec(this.text)) !== null) {
                        totalHits++;
                        if (matches.length < MATCH_DISPLAY_CAP) {
                            matches.push({
                                type: "Lexicon",
                                snippet: Utils.extractSnippet(this.text, match[0], match.index),
                                context: "Common AI Vocabulary",
                                weight: "high"
                            });
                        }
                    }
                });

                // Compound adjectives ("cutting-edge", "data-driven", "best-in-class"...)
                // were sitting in PatternConfig fully populated but never referenced by
                // any analyzer. They're a distinct stylistic signal from the standalone
                // lexicon phrases above (LLMs lean heavily on these hyphenated modifiers),
                // so they're tracked and scored separately, then folded into the same
                // overall "Vocabulary Patterns" category.
                let compoundHits = 0;
                PatternConfig.compoundAdjectives.forEach(phrase => {
                    const regex = new RegExp(`\\b${phrase}\\b`, "gi");
                    let match;
                    while ((match = regex.exec(this.text)) !== null) {
                        compoundHits++;
                        if (matches.length < MATCH_DISPLAY_CAP) {
                            matches.push({
                                type: "Compound Adjective",
                                snippet: Utils.extractSnippet(this.text, match[0], match.index),
                                context: "AI-favored hyphenated modifier",
                                weight: "medium"
                            });
                        }
                    }
                });

                const totalAllHits = totalHits + compoundHits;
                if (totalAllHits > matches.length) {
                    matches.push({ type: "Lexicon", snippet: `...and ${totalAllHits - matches.length} more instance(s) not shown`, context: "Truncated for length", weight: "low" });
                }

                const density = totalHits / (this.wordCount || 1);
                const compoundDensity = compoundHits / (this.wordCount || 1);
                if (density > 0.03) scorer.add(100, "critical");
                else if (density > 0.015) scorer.add(60, "high");
                else if (density > 0.005) scorer.add(30, "medium");

                if (compoundDensity > 0.025) scorer.add(70, "high");
                else if (compoundDensity > 0.012) scorer.add(40, "medium");
                else if (compoundHits >= 3) scorer.add(15, "low");

                return {
                    name: "Vocabulary Patterns",
                    score: scorer.getScore(),
                    matches,
                    summary: `${totalHits} AI vocabulary phrase(s), ${compoundHits} AI-favored compound adjective(s) detected`,
                    details: scorer.getDetails()
                };
            }
        }

        // --- 2. EMOJI FORENSICS ---
        class EmojiAnalyzer {
            constructor(text) { this.text = text; this.emojis = Utils.extractEmojis(text); }
            analyze() {
                const scorer = new WeightedScorer();
                const matches = [];
                if (this.emojis.length === 0) return { name: "Emoji Analysis", score: 0, matches: [], summary: "No emojis detected" };
                
                // 1. Check for placement (End of sentence only)
                let endOnlyCount = 0;
                let midSentenceCount = 0;
                const sentences = Utils.splitSentences(this.text);
                sentences.forEach(s => {
                    if (PatternConfig.emojiPatterns.endOnly.test(s)) endOnlyCount++;
                    if (PatternConfig.emojiPatterns.midSentence.test(s)) midSentenceCount++;
                });

                if (endOnlyCount > 2 && midSentenceCount === 0) {
                    scorer.add(50, "high");
                    matches.push({
                        type: "Placement",
                        snippet: "Detected emojis exclusively at end of sentences",
                        context: "Robotic placement pattern",
                        weight: "high"
                    });
                }

                // 2. Corporate Emoji Check
                let corpCount = 0;
                this.emojis.forEach(e => {
                    if (PatternConfig.corporateEmojis.includes(e)) corpCount++;
                });
                if (corpCount > 2) {
                    scorer.add(40, "medium");
                    matches.push({
                        type: "Corporate Style",
                        snippet: `Detected ${corpCount} corporate emojis (🚀, ✨, etc)`,
                        context: "Linked to AI 'helpful' tone",
                        weight: "medium"
                    });
                }

                return { name: "Emoji Forensics", score: scorer.getScore(), matches, summary: `${this.emojis.length} emojis analyzed`, details: scorer.getDetails() };
            }
        }

        // --- 3. STRUCTURAL RIGIDITY ---
        class StructuralRigidityAnalyzer {
            constructor(text) { this.text = text; this.wordCount = Utils.countWords(text); }
            analyze() {
                const scorer = new WeightedScorer();
                const matches = [];

                // 1. Bullet Density
                const bullets = (this.text.match(PatternConfig.structural.bulletDensity) || []).length;
                if (bullets > 0 && (bullets / this.wordCount > 0.3)) {
                    scorer.add(60, "high");
                    matches.push({
                        type: "List Density",
                        snippet: `${bullets} bulleted lines across ${this.wordCount} words (${((bullets / this.wordCount) * 100).toFixed(0)}% density)`,
                        context: "AI preference for structuring",
                        weight: "high"
                    });
                }

                // 2. Markdown Headers (#, ##, etc.) — AI chat output defaults to headered
                // sections even for short answers; human prose almost never does in
                // plain-text contexts.
                const headers = (this.text.match(PatternConfig.structural.headerPattern) || []).length;
                if (headers > 0) {
                    const density = headers / (this.wordCount / 100);
                    if (density > 1.5) {
                        scorer.add(65, "high");
                        matches.push({ type: "Header Density", snippet: `${headers} markdown headers (#/##/###) detected`, context: "AI defaults to headered sections", weight: "high" });
                    } else {
                        scorer.add(25, "low");
                        matches.push({ type: "Markdown Headers", snippet: `${headers} markdown header(s) detected`, context: "Possible AI formatting carryover", weight: "low" });
                    }
                }

                // 3. Numbered List Density
                const numbered = (this.text.match(PatternConfig.structural.numberedLists) || []).length;
                if (numbered >= 3 && (numbered / this.wordCount > 0.02)) {
                    scorer.add(35, "medium");
                    matches.push({ type: "Numbered List Density", snippet: `${numbered} numbered list items detected`, context: "AI prefers enumerated breakdowns", weight: "medium" });
                }

                // 4. Bold-text overuse (AI tends to bold key terms throughout for
                // skimmability, well beyond normal human emphasis usage)
                const boldMatches = this.text.match(PatternConfig.structural.markdownBold) || [];
                const boldDensity = boldMatches.length / (this.wordCount / 100);
                if (boldMatches.length >= 4 && boldDensity > 1.2) {
                    scorer.add(45, "medium");
                    matches.push({ type: "Bold Emphasis Overuse", snippet: `${boldMatches.length} bolded terms (${boldDensity.toFixed(1)} per 100 words)`, context: "AI over-bolds key terms for skimmability", weight: "medium" });
                }

                // 5. Bold-Colon Artifacts (**Term**: explanation) — classic GPT
                // teaching/definition-list pattern.
                let boldColonMatch;
                const boldColonRegex = new RegExp(PatternConfig.structural.boldColon.source, "g");
                let bcCount = 0;
                while ((boldColonMatch = boldColonRegex.exec(this.text)) !== null) {
                    bcCount++;
                    if (bcCount <= 10) {
                        matches.push({
                            type: "Markdown Artifact",
                            snippet: Utils.extractSnippet(this.text, boldColonMatch[0], boldColonMatch.index),
                            context: "Standard GPT teaching pattern",
                            weight: "high"
                        });
                    }
                }
                if (bcCount > 10) matches.push({ type: "Markdown Artifact", snippet: `...and ${bcCount - 10} more "**Term**:" instances not shown`, context: "Truncated for length", weight: "high" });
                if (bcCount > 0) scorer.add(70, "high");

                return { name: "Structural Rigidity", score: scorer.getScore(), matches, summary: "Structural patterns analyzed", details: scorer.getDetails() };
            }
        }

        // --- 4. PUNCTUATION VECTORS ---
        class PunctuationAnalyzer {
    constructor(text) { this.text = text; this.wordCount = Utils.countWords(text); }
    analyze() {
        const scorer = new WeightedScorer();
        const matches = [];

        // --- A. Em-Dash (—) vs double-hyphen / spaced hyphen ---
        const emDashes = (this.text.match(/—/g) || []).length;
        const doubleHyphens = (this.text.match(/--/g) || []).length;
        const spacedHyphens = (this.text.match(/ - /g) || []).length;
        if (emDashes > 1 && doubleHyphens === 0 && spacedHyphens === 0) {
            scorer.add(40, "low");
            matches.push({ type: "Em-Dash Precision", snippet: `${emDashes}× proper em-dashes (—), zero informal dashes`, context: "Humans type -- or ' - ', AI outputs —", weight: "low" });
        }

        // --- B. Curly/Smart quotes vs straight quotes ---
        // AI outputs from text editors often keep straight, but raw LLM output uses typographic
        const smartQuotes = (this.text.match(/[\u2018\u2019\u201C\u201D]/g) || []).length;
        const straightQuotes = (this.text.match(/["']/g) || []).length;
        if (smartQuotes > 2 && straightQuotes < smartQuotes) {
            scorer.add(30, "low");
            matches.push({ type: "Typographic Quotes", snippet: `${smartQuotes} smart/curly quotes detected`, context: "AI text-generation often outputs typographic quotes", weight: "low" });
        }

        // --- C. Oxford Comma consistency ---
        const oxford = (this.text.match(/,\s+(?:and|or)\s+\w/gi) || []).length;
        const noOxford = (this.text.match(/\b\w+,\s+\w+\s+(?:and|or)\s+\w/gi) || []).length;
        if (oxford > 3 && noOxford === 0) {
            scorer.add(20, "low");
            matches.push({ type: "Oxford Comma Lock", snippet: `${oxford} serial commas, zero omissions`, context: "100% grammatical consistency — algorithmic", weight: "low" });
        }

        // --- D. Colon overuse (AI loves colons to introduce lists/elaborations) ---
        const colons = (this.text.match(/:\s/g) || []).length;
        const colonDensity = colons / (this.wordCount / 100);
        if (colonDensity > 2.5) {
            scorer.add(55, "medium");
            matches.push({ type: "Colon Overuse", snippet: `${colons} colons per ${this.wordCount} words (${colonDensity.toFixed(1)}/100)`, context: "AI introduces every elaboration with a colon", weight: "medium" });
        }

        // --- E. Semicolon absence (AI rarely uses semicolons; humans use them inconsistently) ---
        const semicolons = (this.text.match(/;/g) || []).length;
        if (this.wordCount > 200 && semicolons === 0 && colons > 3) {
            scorer.add(25, "low");
            matches.push({ type: "Semicolon Absence", snippet: `0 semicolons in ${this.wordCount}-word text`, context: "AI prefers periods and colons over semicolons", weight: "low" });
        }

        // --- F. Ellipsis style (...) vs (…) ---
        const unicodeEllipsis = (this.text.match(/…/g) || []).length;
        const triDot = (this.text.match(/\.\.\./g) || []).length;
        if (unicodeEllipsis > 0 && triDot === 0) {
            scorer.add(20, "low");
            matches.push({ type: "Unicode Ellipsis", snippet: `${unicodeEllipsis}× unicode ellipsis (…) with no typed (...)`, context: "Typographic precision signals LLM origin", weight: "low" });
        }

        // --- G. Sentence-ending punctuation variety ---
        const exclamations = (this.text.match(/!/g) || []).length;
        const questions = (this.text.match(/\?/g) || []).length;
        const periods = (this.text.match(/\./g) || []).length;
        const totalEndPunct = exclamations + questions + periods;
        if (totalEndPunct > 5) {
            const exclamRatio = exclamations / totalEndPunct;
            const questionRatio = questions / totalEndPunct;
            // AI avoids exclamations in formal mode; uses them formulaically in casual
            if (exclamRatio === 0 && this.wordCount > 150) {
                scorer.add(20, "low");
                matches.push({ type: "Zero Exclamations", snippet: `No exclamation marks in ${this.wordCount} words`, context: "Formal AI prose avoids emotional punctuation", weight: "low" });
            }
            // AI almost never uses rhetorical questions in expository text
            if (questionRatio === 0 && this.wordCount > 200) {
                scorer.add(15, "low");
                matches.push({ type: "Zero Questions", snippet: `No question marks — entirely declarative`, context: "Humans use rhetorical questions; AI states", weight: "low" });
            }
        }

        // --- H. Parenthetical density (AI overuses parentheticals for "helpful context") ---
        const parens = (this.text.match(/\([^)]{5,60}\)/g) || []).length;
        const parenDensity = parens / (this.wordCount / 100);
        if (parenDensity > 1.5) {
            scorer.add(35, "medium");
            matches.push({ type: "Parenthetical Overuse", snippet: `${parens} parenthetical asides detected`, context: "AI adds clarifying asides mechanically", weight: "medium" });
        }

        return {
            name: "Punctuation Vectors",
            score: Math.min(100, scorer.getScore()),
            matches,
            summary: `Em-dashes: ${emDashes}, Colons: ${colons}, Parentheticals: ${parens}`,
            details: { emDashes, colons, semicolons, parens, totalWeight: scorer.totalWeight }
        };
    }
}
        // --- 5. BINARY PATTERN ANALYZER ---
        class BinaryPatternAnalyzer {

                return { name: "Binary Rhetoric Patterns", score: scorer.getScore(), matches, summary: matches.length ? "Detected binary sentence structures" : "None detected", details: scorer.getDetails() };
            }
        }

        class RepetitionAnalyzer {
            constructor(text) { this.text = text; }
            analyze() {
                const scorer = new WeightedScorer();
                const matches = [];
                const sentences = Utils.splitSentences(this.text);
                // Trimmed stopword list: bare articles only. The original list also
                // excluded "it" and "in"/"on" — but "It's important...", "It also...",
                // "It allows..." repeated every few sentences is one of the more common
                // AI anaphora tells, so it shouldn't have been filtered out.
                const stopwords = ['the', 'a', 'an'];

                // 1. Consecutive repetition (strongest signal — back-to-back sentences
                // sharing an opener reads as obviously mechanical).
                let consecutiveCount = 0;
                for (let i = 1; i < sentences.length; i++) {
                    const prev = sentences[i - 1].trim().split(/\s+/)[0]?.toLowerCase().replace(/[^a-z']/g, '') || '';
                    const curr = sentences[i].trim().split(/\s+/)[0]?.toLowerCase().replace(/[^a-z']/g, '') || '';
                    if (prev === curr && prev.length > 1 && !stopwords.includes(prev)) {
                        consecutiveCount++;
                        if (matches.length < 20) {
                            matches.push({
                                type: "Anaphora (Consecutive)",
                                snippet: `...${sentences[i - 1].trim().substring(0, 40)}... <br> ...<span class="match-highlight">${sentences[i].trim().substring(0, 40)}</span>...`,
                                context: "Back-to-back sentences share an opener",
                                weight: "high"
                            });
                        }
                    }
                }

                // 2. Document-wide starter repetition — same opener recurring across the
                // text even when not adjacent (e.g. "This..." used to open 5 of 20
                // sentences). This is the more common real-world AI signature.
                const starterCounts = {};
                const starterExamples = {};
                sentences.forEach(s => {
                    const word = s.trim().split(/\s+/)[0]?.toLowerCase().replace(/[^a-z']/g, '') || '';
                    if (word.length > 1 && !stopwords.includes(word)) {
                        starterCounts[word] = (starterCounts[word] || 0) + 1;
                        if (!starterExamples[word]) starterExamples[word] = [];
                        if (starterExamples[word].length < 3) starterExamples[word].push(s.trim().substring(0, 50));
                    }
                });
                let repeatedStarterWords = 0;
                let repeatedStarterTotal = 0;
                Object.keys(starterCounts).forEach(word => {
                    const count = starterCounts[word];
                    if (count >= 3) {
                        repeatedStarterWords++;
                        repeatedStarterTotal += count;
                        matches.push({
                            type: "Anaphora (Document-wide)",
                            snippet: starterExamples[word].map(s => Utils.escapeHtml(s)).join(" / "),
                            context: `"${word}" opens ${count} sentences across the text (not necessarily consecutive)`,
                            weight: "medium"
                        });
                    }
                });

                const sentenceCount = sentences.length || 1;
                if (consecutiveCount >= 2) scorer.add(70, "high");
                else if (consecutiveCount === 1) scorer.add(30, "medium");

                const repeatRatio = repeatedStarterTotal / sentenceCount;
                if (repeatedStarterWords > 0 && repeatRatio > 0.3) scorer.add(75, "high");
                else if (repeatedStarterWords > 0 && repeatRatio > 0.15) scorer.add(45, "medium");
                else if (repeatedStarterWords > 0) scorer.add(20, "low");

                return {
                    name: "Repetitive Structures",
                    score: scorer.getScore(),
                    matches,
                    summary: matches.length ? `${consecutiveCount} consecutive repeat(s), ${repeatedStarterWords} starter word(s) reused 3+ times` : "Sentence-opener variance looks natural",
                    details: scorer.getDetails()
                };
            }
        }

        // --- 7. VAGUE AUTHORITY ---
        class VagueAuthorityAnalyzer {
            constructor(text) { this.text = text; }
            analyze() {
                const scorer = new WeightedScorer();
                const matches = [];
                PatternConfig.vagueAuthority.forEach(phrase => {
                    const regex = new RegExp(`\\b${phrase}\\b`, "gi");
                    let match;
                    while ((match = regex.exec(this.text)) !== null) {
                        matches.push({
                            type: "Vague Authority",
                            snippet: Utils.extractSnippet(this.text, match[0], match.index),
                            context: "Uncited claim attribution",
                            weight: "high"
                        });
                    }
                });
                if (matches.length > 0) scorer.add(60, "high");
                return { name: "Vague Authority Claims", score: scorer.getScore(), matches, summary: matches.length ? "Uncited authority detected" : "No vague sourcing", details: scorer.getDetails() };
            }
        }

        // --- 8. PASSIVE VOICE ---
        class PassiveVoiceAnalyzer {
            constructor(text) { this.text = text; }
            analyze() {
                const scorer = new WeightedScorer();
                const matches = [];
                const regex = /\b(am|is|are|was|were|be|been|being)\s+(\w+ed|shown|seen|made|found|done|said|held|kept)\b/gi;
                let match;
                let count = 0;
                while ((match = regex.exec(this.text)) !== null) {
                    count++;
                    if(matches.length < 25) {
                        matches.push({
                            type: "Passive Construction",
                            snippet: Utils.extractSnippet(this.text, match[0], match.index),
                            context: "Passive voice",
                            weight: "low"
                        });
                    }
                }
                if (count > 25) matches.push({ type: "Passive Construction", snippet: `...and ${count - 25} more instance(s) not shown`, context: "Truncated for length", weight: "low" });
                const ratio = count / (Utils.countWords(this.text) || 1);
                if (ratio > 0.04) scorer.add(60, "medium");
                return { name: "Passive Voice", score: scorer.getScore(), matches, summary: `${(ratio*100).toFixed(1)}% passive sentences (${count} found)`, details: scorer.getDetails() };
            }
        }

        // --- 9. BURSTINESS ---
        class BurstinessAnalyzer {
            constructor(text) { this.text = text; }
            analyze() {
                const sentences = Utils.splitSentences(this.text);
                if (sentences.length < 3) return { name: "Burstiness (Variance)", score: 0, matches: [], summary: "Insufficient data (need 3+ sentences)", details: {} };
                const lengths = sentences.map(s => s.trim().split(/\s+/).length);
                const stdDev = Utils.calculateStdDev(lengths);
                const mean = lengths.reduce((a, b) => a + b, 0) / lengths.length;
                const cv = mean > 0 ? stdDev / mean : 0;
                const scorer = new WeightedScorer();
                const matches = [];
                // NOTE: this analyzer used to compute a score/details object that never
                // carried a `totalWeight`, so App.runAnalysis()'s `details.totalWeight > 0`
                // gate silently excluded Burstiness from the final weighted score no matter
                // what it found. Routing it through WeightedScorer (like every other
                // analyzer) fixes that — low variance now actually pushes the total score
                // up, and high variance now actually pulls it down.
                if (cv < 0.25) {
                    scorer.add(80, "high");
                    matches.push({ type: "Low Variance", snippet: `Sentence lengths are unnaturally uniform (avg ${mean.toFixed(1)} words/sentence, σ=${stdDev.toFixed(1)})`, context: `CV Score: ${cv.toFixed(2)} (Robotic — AI tends to write evenly-paced sentences)`, weight: "high" });
                } else if (cv > 0.5) {
                    // "Bonus" signal: strong sentence-length variance is a human trait, so it
                    // nudges the category score negative, which in turn pulls the overall
                    // total down once it's correctly aggregated.
                    scorer.add(-30, "medium");
                    matches.push({ type: "High Variance", snippet: `Sentence lengths vary significantly (avg ${mean.toFixed(1)} words/sentence, σ=${stdDev.toFixed(1)})`, context: `CV Score: ${cv.toFixed(2)} (Human — natural writing mixes short and long sentences)`, weight: "bonus" });
                } else {
                    scorer.add(15, "low");
                }
                return {
                    name: "Burstiness (Variance)",
                    score: scorer.getScore(),
                    matches,
                    summary: cv < 0.25 ? "Mechanical sentence-length uniformity" : (cv > 0.5 ? "Natural sentence-length variance" : "Moderate sentence-length variance"),
                    details: { ...scorer.getDetails(), cv: cv.toFixed(2), meanLength: mean.toFixed(1), stdDev: stdDev.toFixed(1) }
                };
            }
        }

        // --- 10. REFUSAL ---
        class RefusalAnalyzer {
            constructor(text) { this.text = text; }
            analyze() {
                const scorer = new WeightedScorer();
                const matches = [];
                PatternConfig.refusalHeaders.forEach(phrase => {
                    if(new RegExp(phrase, "i").test(this.text)) {
                        matches.push({ type: "AI Refusal", snippet: phrase, context: "Standard LLM refusal", weight: "critical" });
                        scorer.add(100, "critical");
                    }
                });
                return { name: "AI Guardrails", score: scorer.getScore(), matches, summary: matches.length ? "AI Safety signature found" : "No refusals found", details: scorer.getDetails() };
            }
        }

        // --- 11. TRANSITION OVERLOAD ---
        class TransitionAnalyzer {
            constructor(text) { this.text = text; }
            analyze() {
                const scorer = new WeightedScorer();
                const matches = [];
                let count = 0;
                PatternConfig.transitionOverload.forEach(phrase => {
                    const regex = new RegExp(phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), "gi");
                    let match;
                    while ((match = regex.exec(this.text)) !== null) {
                        count++;
                        if (matches.length < 30) {
                            matches.push({ type: "Coherence Marker", snippet: Utils.extractSnippet(this.text, match[0], match.index), context: "Forced logical bridging", weight: "medium" });
                        }
                    }
                });
                if (count > 30) matches.push({ type: "Coherence Marker", snippet: `...and ${count - 30} more instance(s) not shown`, context: "Truncated for length", weight: "medium" });
                if (count > 5) scorer.add(80, "high");
                else if (count > 2) scorer.add(40, "medium");
                return { name: "Transition Overload", score: scorer.getScore(), matches, summary: count > 3 ? `Abnormal transition density (${count} found)` : `Natural flow (${count} found)`, details: scorer.getDetails() };
            }
        }

        // --- 12. NEW: COGNITIVE LOAD ANALYZER (Academic/Hedging/FalseBalance) ---
        class CognitiveLoadAnalyzer {
            constructor(text) { 
                this.text = text; 
                this.wordCount = Utils.countWords(text);
            }
            analyze() {
                const scorer = new WeightedScorer();
                const matches = [];

                const categories = [
                    { id: 'academicCosplay', label: 'Pseudo-Academic', weight: 'high', list: PatternConfig.academicCosplay },
                    { id: 'hedgingLanguage', label: 'Excessive Hedging', weight: 'medium', list: PatternConfig.hedgingLanguage },
                    { id: 'falseBalance', label: 'False Balance', weight: 'high', list: PatternConfig.falseBalance }
                ];

                let totalHits = 0;

                categories.forEach(cat => {
                    cat.list.forEach(phrase => {
                        const regex = new RegExp(`\\b${phrase}\\b`, "gi");
                        let match;
                        while ((match = regex.exec(this.text)) !== null) {
                            totalHits++;
                            if (matches.length < 30) {
                                matches.push({
                                    type: cat.label,
                                    snippet: Utils.extractSnippet(this.text, match[0], match.index),
                                    context: "Artificial Nuance/Complexity",
                                    weight: cat.weight
                                });
                            }
                        }
                    });
                });
                if (totalHits > 30) matches.push({ type: "Cognitive Load", snippet: `...and ${totalHits - 30} more instance(s) not shown`, context: "Truncated for length", weight: "low" });

                // Scoring Logic: Academic language in non-academic contexts is a strong signal
                const density = totalHits / (this.wordCount || 1);
                
                if (density > 0.02) scorer.add(85, "high");
                else if (density > 0.01) scorer.add(50, "medium");
                else if (totalHits > 2) scorer.add(20, "low");

                return { 
                    name: "Cognitive Load", 
                    score: scorer.getScore(), 
                    matches, 
                    summary: totalHits > 0 ? `${totalHits} instances of artificial complexity` : "Natural tone complexity", 
                    details: scorer.getDetails() 
                };
            }
        }

        // --- 13. NEW: CORPORATE SPEAK ANALYZER (Buzzwords/Process Verbs) ---
        class CorporateSpeakAnalyzer {
            constructor(text) { 
                this.text = text; 
                this.wordCount = Utils.countWords(text);
            }
            analyze() {
                const scorer = new WeightedScorer();
                const matches = [];

                // Buzzwords are strong indicators of LLM training data bias, but a single
                // hit shouldn't instantly max the category — that made the score
                // effectively binary (0 or 100) regardless of how saturated the text
                // actually was. Now scored by distinct-cluster count, and snippets pull
                // real surrounding context instead of just echoing the dictionary phrase.
                let clusterHits = 0;
                const lowerText = this.text.toLowerCase();
                PatternConfig.buzzwordClusters.forEach(phrase => {
                    const idx = lowerText.indexOf(phrase.toLowerCase());
                    if (idx !== -1) {
                        clusterHits++;
                        if (matches.length < 25) {
                            matches.push({
                                type: "Buzzword Cluster",
                                snippet: Utils.extractSnippet(this.text, this.text.substr(idx, phrase.length), idx),
                                context: "High-probability LLM cluster phrase",
                                weight: clusterHits >= 2 ? "critical" : "high"
                            });
                        }
                    }
                });
                if (clusterHits >= 2) scorer.add(100, "critical");
                else if (clusterHits === 1) scorer.add(55, "high");

                // Process verbs (utilize, leverage) are common, but high density indicates AI
                let verbCount = 0;
                const VERB_DISPLAY_CAP = 25;
                PatternConfig.processVerbs.forEach(word => {
                    const regex = new RegExp(`\\b${word}\\b`, "gi");
                    let match;
                    while ((match = regex.exec(this.text)) !== null) {
                        verbCount++;
                        if (matches.length < VERB_DISPLAY_CAP) {
                            matches.push({
                                type: "Process Verb",
                                snippet: Utils.extractSnippet(this.text, match[0], match.index),
                                context: "Corporate/Consultant Tone",
                                weight: "low"
                            });
                        }
                    }
                });
                if (verbCount > matches.filter(m => m.type === "Process Verb").length + clusterHits) {
                    matches.push({ type: "Process Verb", snippet: `...and more instances not shown (${verbCount} total process verbs)`, context: "Truncated for length", weight: "low" });
                }

                if (verbCount > 8) scorer.add(70, "high");
                else if (verbCount > 5) scorer.add(40, "medium");

                return { 
                    name: "Corporate Speak", 
                    score: scorer.getScore(), 
                    matches, 
                    summary: clusterHits > 0 ? `${clusterHits} buzzword cluster(s), ${verbCount} process verb(s) detected` : (verbCount > 0 ? `${verbCount} process verb(s) detected` : "No corporate jargon"), 
                    details: scorer.getDetails() 
                };
            }
        }

        // --- 14. NEW: META FILLER ANALYZER (Meta Commentary/List Introducers) ---
        class MetaFillerAnalyzer {
            constructor(text) { this.text = text; }
            analyze() {
                const scorer = new WeightedScorer();
                const matches = [];

                const fillers = [
                    ...PatternConfig.metaCommentary.map(p => ({ p, type: "Meta-Commentary" })),
                    ...PatternConfig.listIntroducers.map(p => ({ p, type: "List Introducer" }))
                ];

                let count = 0;
                fillers.forEach(item => {
                    const regex = new RegExp(`\\b${item.p}\\b`, "gi");
                    let match;
                    while ((match = regex.exec(this.text)) !== null) {
                        count++;
                        matches.push({
                            type: item.type,
                            snippet: Utils.extractSnippet(this.text, match[0], match.index),
                            context: "Structural padding",
                            weight: "medium"
                        });
                    }
                });

                if (count > 2) scorer.add(40 + (count * 10), "high");

                return { 
                    name: "Structural Filler", 
                    score: scorer.getScore(), 
                    matches, 
                    summary: count > 0 ? "Detected structural padding phrases" : "Concise structure", 
                    details: scorer.getDetails() 
                };
            }
        }

        // --- RENDERER ---
        class ResultRenderer {
            constructor() {
                this.container = document.getElementById("modules-container");
                this.scoreCircle = document.getElementById("score-circle");
                this.scoreText = document.getElementById("score-text");
                this.keyIndicators = document.getElementById("key-indicators");
            }
            updateTotalScore(score) {
                this.scoreText.innerText = `${score}%`;
                let color, label;
                if (score > 80) { color = "#ef4444"; label = "Likely AI-Generated"; }
                else if (score > 50) { color = "#f97316"; label = "Mixed Signals / Edited"; }
                else { color = "#22c55e"; label = "Likely Human-Written"; }
                this.scoreCircle.style.setProperty("--score-percent", `${score}%`);
                this.scoreCircle.style.setProperty("--score-color", color);
                this.scoreText.style.color = color;
                document.getElementById("confidence-text").innerText = label;
                document.getElementById("confidence-text").style.color = color;
            }
            renderModule(data) {
                if (data.matches.length === 0 && data.score < 20) return;
                const wrapper = document.createElement("div");
                wrapper.className = "border border-slate-200 rounded-lg overflow-hidden bg-white shadow-sm";
                const headerColor = data.score > 50 ? "bg-red-50" : (data.score > 0 ? "bg-orange-50" : "bg-green-50");
                const textColor = data.score > 50 ? "text-red-700" : (data.score > 0 ? "text-orange-700" : "text-green-700");
                const itemsHtml = data.matches.map(m => `
                    <div class="p-3 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-500">${m.type}</span>
                            <span class="text-xs px-2 py-0.5 rounded bg-slate-200 text-slate-600">${m.context}</span>
                        </div>
                        <div class="snippet-box p-2 rounded text-slate-700 bg-slate-50">${m.snippet}</div>
                    </div>
                `).join("");
                wrapper.innerHTML = `
                    <div class="category-header p-4 flex justify-between items-center ${headerColor}" onclick="this.nextElementSibling.classList.toggle('open')">
                        <div class="flex items-center gap-3">
                            <div class="w-1.5 h-8 rounded-full ${data.score > 50 ? 'bg-red-500' : 'bg-green-500'}"></div>
                            <div>
                                <h3 class="font-bold text-slate-800">${data.name}</h3>
                                <p class="text-xs text-slate-500">${data.matches.length} findings</p>
                            </div>
                        </div>
                        <span class="font-bold text-lg ${textColor}">${Math.round(data.score)}%</span>
                    </div>
                    <div class="category-content bg-white">
                        <p class="p-4 text-sm text-slate-500 italic border-b border-slate-100">${data.summary}</p>
                        <div class="max-h-96 overflow-y-auto">${itemsHtml}</div>
                    </div>
                `;
                this.container.appendChild(wrapper);
                if (data.score > 60 || data.matches.some(m => m.weight === 'critical')) {
                    const li = document.createElement("li");
                    li.className = "text-sm text-slate-600 border-l-2 border-red-400 pl-2";
                    li.innerHTML = `<strong>${data.name}:</strong> ${data.summary}`;
                    this.keyIndicators.appendChild(li);
                }
            }
            clear() {
                this.container.innerHTML = "";
                this.keyIndicators.innerHTML = "";
                document.getElementById("results-area").classList.add("hidden");
                this.scoreCircle.style.setProperty("--score-percent", "0%");
                this.scoreText.innerText = "0%";
            }
            show() { document.getElementById("results-area").classList.remove("hidden"); }
        }

        // --- APP ---
        class App {
            constructor() {
                this.editor = document.getElementById("editor");
                this.analyzeBtn = document.getElementById("analyze-btn");
                this.clearBtn = document.getElementById("clear-btn");
                this.wordCountEl = document.getElementById("word-count");
                this.renderer = new ResultRenderer();
                this.bindEvents();
            }
            bindEvents() {
                this.editor.addEventListener("input", () => {
                    const text = Utils.htmlToText(this.editor.innerHTML);
                    const words = Utils.countWords(text);
                    this.wordCountEl.innerText = `${words} words`;
                    this.analyzeBtn.disabled = words < PatternConfig.thresholds.minWords;
                    if(words >= PatternConfig.thresholds.minWords) this.analyzeBtn.classList.remove("opacity-50", "cursor-not-allowed");
                    else this.analyzeBtn.classList.add("opacity-50", "cursor-not-allowed");
                });
                this.clearBtn.addEventListener("click", () => {
                    this.editor.innerHTML = "";
                    this.renderer.clear();
                    this.wordCountEl.innerText = "0 words";
                    this.analyzeBtn.disabled = true;
                });
                this.analyzeBtn.addEventListener("click", () => this.runAnalysis());
            }
            runAnalysis() {
                this.renderer.clear();
                const rawHtml = this.editor.innerHTML;
                const text = Utils.htmlToText(rawHtml);
                const analyzers = [
                    new RefusalAnalyzer(text),
                    new GPTLexiconAnalyzer(text),
                    new TransitionAnalyzer(text),
                    new VagueAuthorityAnalyzer(text),
                    new RepetitionAnalyzer(text),
                    new PassiveVoiceAnalyzer(text),
                    new BurstinessAnalyzer(text),
                    new EmojiAnalyzer(text),
                    new StructuralRigidityAnalyzer(text),
                    new PunctuationAnalyzer(text),
                    new BinaryPatternAnalyzer(text),
                    // NEW INTEGRATIONS
                    new CognitiveLoadAnalyzer(text),
                    new CorporateSpeakAnalyzer(text),
                    new MetaFillerAnalyzer(text)
                ];
                const results = analyzers.map(a => a.analyze());
                const totalScorer = new WeightedScorer();
                const severityOrder = ["critical", "high", "medium", "low"];
                results.forEach(res => {
                    this.renderer.renderModule(res);
                    if (res.details && res.details.totalWeight > 0) {
                        // Use the highest severity tier actually present among this
                        // category's findings, rather than collapsing everything that
                        // isn't "critical" down to a flat "medium".
                        let weight = "medium";
                        for (const tier of severityOrder) {
                            if (res.matches.some(m => m.weight === tier)) { weight = tier; break; }
                        }
                        totalScorer.add(res.score, weight);
                    }
                });
                let finalScore = totalScorer.getScore();
                if (Utils.countWords(text) < 50) finalScore = Math.min(finalScore, 85);
                this.renderer.updateTotalScore(Math.round(finalScore));
                this.renderer.show();
            }
        }
        document.addEventListener("DOMContentLoaded", () => new App());

    </script>
