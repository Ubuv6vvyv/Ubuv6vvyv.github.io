const Utils={
  htmlToText:e=>{const t=document.createElement("div");t.innerHTML=e;return t.textContent||t.innerText||""},
  countWords:e=>e.trim().split(/\s+/).filter(Boolean).length,
  escapeHtml:e=>{const t=document.createElement("div");t.textContent=e;return t.innerHTML},
  splitSentences:e=>e.match(/[^.!?]+[.!?]+(?=\s|$)/g)||[],
  extractEmojis:e=>[...e.matchAll(/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu)].map(e=>e[0]),
  calculateStdDev:e=>{if(!e.length)return 0;const t=e.reduce((a,b)=>a+b,0)/e.length;return Math.sqrt(e.map(e=>Math.pow(e-t,2)).reduce((a,b)=>a+b,0)/e.length)},
  extractSnippet:(f,m,i,c=50,cls="match-highlight")=>{const s=Math.max(0,i-c),e=Math.min(f.length,i+m.length+c);let p=f.substring(s,i),sf=f.substring(i+m.length,e);if(s>0)p="..."+p;if(e<f.length)sf+=+"...";return`${Utils.escapeHtml(p)}<span class="${cls}">${Utils.escapeHtml(m)}</span>${Utils.escapeHtml(sf)}`},
  getNgrams:(words,n)=>{const g=[];for(let i=0;i<=words.length-n;i++)g.push(words.slice(i,i+n).join(" "));return g},
  getTokens:t=>t.toLowerCase().match(/\b[a-z]{3,}\b/g)||[]
};

class WeightedScorer{
  constructor(){this.totalWeight=0;this.weightedScore=0;this.findings=[]}
  add(s,w,t="medium"){const wt=PatternConfig.weights[w]||1;this.weightedScore+=s*wt;this.totalWeight+=wt;this.findings.push({s,wt,t})}
  getScore(){return this.totalWeight>0?Math.min(100,this.weightedScore/this.totalWeight):0}
  getDetails(){return{raw:this.weightedScore,totalWeight:this.totalWeight,normalized:this.getScore(),findingsCount:this.findings.length}}
}

// --- 1. LEXICON ---
class GPTLexiconAnalyzer{
  constructor(t){this.text=t;this.wc=Utils.countWords(t)}
  analyze(){
    const sc=new WeightedScorer(),m=[];let h=0;
    PatternConfig.gptLexicon.forEach(p=>{
      const rx=new RegExp(`\\b${p}\\b`,"gi");let x;
      while((x=rx.exec(this.text))!==null){h++;if(m.length<15)m.push({type:"Lexicon",snippet:Utils.extractSnippet(this.text,x[0],x.index),context:"Common AI Vocabulary",weight:"high"})}
    });
    const d=h/(this.wc||1);
    if(d>0.03)sc.add(100,"critical");else if(d>0.015)sc.add(60,"high");else if(d>0.005)sc.add(30,"medium");
    return{name:"Vocabulary Patterns",score:sc.getScore(),matches:m,summary:`${h} specific AI words detected`,details:sc.getDetails()};
  }
}

// --- 2. EMOJI FORENSICS ---
class EmojiAnalyzer{
  constructor(t){this.text=t;this.emojis=Utils.extractEmojis(t)}
  analyze(){
    const sc=new WeightedScorer(),m=[];
    if(!this.emojis.length)return{name:"Emoji Analysis",score:0,matches:[],summary:"No emojis detected"};
    let eoc=0,msc=0;
    Utils.splitSentences(this.text).forEach(s=>{
      if(PatternConfig.emojiPatterns.endOnly.test(s))eoc++;
      if(PatternConfig.emojiPatterns.midSentence.test(s))msc++;
    });
    if(eoc>2&&msc===0){sc.add(50,"high");m.push({type:"Placement",snippet:"Detected emojis exclusively at end of sentences",context:"Robotic placement pattern",weight:"high"})}
    let cc=this.emojis.filter(e=>PatternConfig.corporateEmojis.includes(e)).length;
    if(cc>2){sc.add(40,"medium");m.push({type:"Corporate Style",snippet:`Detected ${cc} corporate emojis (🚀, ✨, etc)`,context:"Linked to AI 'helpful' tone",weight:"medium"})}
    return{name:"Emoji Forensics",score:sc.getScore(),matches:m,summary:`${this.emojis.length} emojis analyzed`,details:sc.getDetails()};
  }
}

// --- 3. STRUCTURAL RIGIDITY (improved: para uniformity + heading density, removed dupe Oxford) ---
class StructuralRigidityAnalyzer{
  constructor(t){this.text=t;this.wc=Utils.countWords(t)}
  analyze(){
    const sc=new WeightedScorer(),m=[];

    // Bullet density
    const bullets=(this.text.match(PatternConfig.structural.bulletDensity)||[]).length;
    if(bullets>0&&(bullets/this.wc>0.3)){sc.add(60,"high");m.push({type:"List Density",snippet:"Text contains excessive bulleted lists (>30%)",context:"AI preference for structuring",weight:"high"})}

    // Markdown artifacts (**Bold**:)
    let bcr=new RegExp(/\*\*([A-Z][^*:]{1,40})\*\*:/g),bcm,bcc=0;
    while((bcm=bcr.exec(this.text))!==null){bcc++;if(bcc<=3)m.push({type:"Markdown Artifact",snippet:Utils.extractSnippet(this.text,bcm[0],bcm.index),context:"Standard GPT teaching pattern",weight:"high"})}
    if(bcc>0)sc.add(70,"high");

    // Heading density (###) — AI loves headers in prose
    const headers=(this.text.match(/^#{1,6}\s+/gm)||[]).length;
    if(headers>2){sc.add(50,"medium");m.push({type:"Header Overuse",snippet:`${headers} markdown headers detected in prose`,context:"AI structures all responses with headers",weight:"medium"})}

    // Numbered list density
    const numbered=(this.text.match(/^\d+\.\s+/gm)||[]).length;
    if(numbered>3){sc.add(45,"medium");m.push({type:"Numbered Lists",snippet:`${numbered} numbered list items — AI organizes everything as lists`,context:"AI list-structuring behavior",weight:"medium"})}

    // Paragraph length uniformity — AI writes eerily even paragraphs
    const paras=this.text.split(/\n\s*\n/).filter(p=>p.trim().length>20);
    if(paras.length>=3){
      const pLens=paras.map(p=>Utils.countWords(p));
      const pMean=pLens.reduce((a,b)=>a+b,0)/pLens.length;
      const pSD=Utils.calculateStdDev(pLens);
      const pCV=pSD/(pMean||1);
      if(pCV<0.2&&paras.length>=4){
        sc.add(65,"high");
        m.push({type:"Paragraph Uniformity",snippet:`${paras.length} paragraphs with suspiciously uniform length (CV=${pCV.toFixed(2)})`,context:"AI generates mechanically equal paragraph blocks",weight:"high"});
      } else if(pCV<0.35&&paras.length>=5){
        sc.add(35,"medium");
        m.push({type:"Paragraph Uniformity",snippet:`${paras.length} paragraphs with low length variance (CV=${pCV.toFixed(2)})`,context:"Humans write unevenly-sized paragraphs",weight:"medium"});
      }
    }

    // Section symmetry: detect "intro + 3-5 equal body paras + conclusion" pattern
    if(paras.length>=5&&paras.length<=8){
      const bodyParas=paras.slice(1,-1);
      const bLens=bodyParas.map(p=>Utils.countWords(p));
      const bMean=bLens.reduce((a,b)=>a+b,0)/(bLens.length||1);
      const allClose=bLens.every(l=>Math.abs(l-bMean)/bMean<0.25);
      if(allClose&&bodyParas.length>=3){
        sc.add(55,"high");
        m.push({type:"Essay Template Structure",snippet:`Classic AI structure: intro + ${bodyParas.length} uniform body paragraphs + conclusion`,context:"AI defaults to 5-paragraph essay format",weight:"high"});
      }
    }

    return{name:"Structural Rigidity",score:sc.getScore(),matches:m,summary:"Structural patterns analyzed",details:sc.getDetails()};
  }
}

// --- 4. PUNCTUATION VECTORS (fixed em-dash polarity + expanded) ---
class PunctuationAnalyzer{
  constructor(t){this.text=t;this.wc=Utils.countWords(t)}
  analyze(){
    const sc=new WeightedScorer(),m=[];

    // Em-dash analysis: modern LLMs (GPT-4, Claude) consistently output proper Unicode em-dashes (—)
    // paired with heavy colon use and ZERO informal double-hyphens — a machine-precise typography signature.
    // Humans are inconsistent: they mix --, spaced - , and occasional — unpredictably.
    const emDashes=(this.text.match(/—/g)||[]).length;
    const doubleHyphens=(this.text.match(/--/g)||[]).length;
    const spacedHyphens=(this.text.match(/ - /g)||[]).length;
    const colons=(this.text.match(/:\s/g)||[]).length;
    // AI signal: proper em-dashes + heavy colons + zero informal shortcuts = typographic perfection
    if(emDashes>0&&colons>4&&this.wc>150&&doubleHyphens===0&&spacedHyphens===0){
      sc.add(40,"medium");
      m.push({type:"Perfect Typography",snippet:`${emDashes}× proper em-dashes (—) + ${colons} colons, zero informal -- or ' - '`,context:"AI outputs typographically perfect dashes; humans are inconsistent",weight:"medium"});
    }
    // Also flag em-dash + colon combo even without the absence condition — density matters
    if(emDashes>2&&colons>3&&(emDashes+colons)/(this.wc/100)>3){
      sc.add(30,"low");
      m.push({type:"Dash+Colon Density",snippet:`${emDashes} em-dashes + ${colons} colons = ${((emDashes+colons)/(this.wc/100)).toFixed(1)}/100 words`,context:"AI elaborates with both colons and em-dashes at abnormal density",weight:"low"});
    }
    // Informal signal: double-hyphen or spaced-hyphen usage = human fingerprint
    if(doubleHyphens>0){
      sc.add(-20,"medium");
      m.push({type:"Informal Dash",snippet:`${doubleHyphens}× informal double-hyphen (--) detected`,context:"Humans type --, AI outputs proper — every time",weight:"medium"});
    }
    if(spacedHyphens>1&&emDashes===0){
      sc.add(-15,"low");
      m.push({type:"Spaced Hyphen",snippet:`${spacedHyphens}× spaced hyphen ( - ) with no proper em-dashes`,context:"Informal human dash style — AI never does this",weight:"low"});
    }

    // Smart/curly quotes
    const smartQ=(this.text.match(/[\u2018\u2019\u201C\u201D]/g)||[]).length;
    const straightQ=(this.text.match(/["']/g)||[]).length;
    if(smartQ>2&&straightQ<smartQ){sc.add(30,"low");m.push({type:"Typographic Quotes",snippet:`${smartQ} smart/curly quotes detected`,context:"AI text-generation often outputs typographic quotes",weight:"low"})}

    // Colon overuse
    const colonDensity=colons/(this.wc/100);
    if(colonDensity>2.5){sc.add(55,"medium");m.push({type:"Colon Overuse",snippet:`${colons} colons per ${this.wc} words (${colonDensity.toFixed(1)}/100)`,context:"AI introduces every elaboration with a colon",weight:"medium"})}

    // Semicolon analysis — expanded
    const semicolons=(this.text.match(/;/g)||[]).length;
    if(this.wc>200&&semicolons===0&&colons>3){
      sc.add(30,"medium");
      m.push({type:"Semicolon Absence",snippet:`0 semicolons in ${this.wc}-word text with ${colons} colons`,context:"AI avoids semicolons; uses periods and colons instead",weight:"medium"});
    } else if(semicolons>0){
      // Semicolons used correctly (joining independent clauses) = human signal
      const correctSemi=(this.text.match(/\b\w[^;]{5,}\s*;\s*[A-Za-z]/g)||[]).length;
      if(correctSemi>1){sc.add(-10,"low");m.push({type:"Semicolon Usage",snippet:`${correctSemi} correct semicolons — human writing pattern`,context:"AI rarely uses semicolons",weight:"low"})}
    }

    // Ellipsis style
    const unicodeEllipsis=(this.text.match(/…/g)||[]).length;
    const triDot=(this.text.match(/\.\.\./g)||[]).length;
    if(unicodeEllipsis>0&&triDot===0){sc.add(20,"low");m.push({type:"Unicode Ellipsis",snippet:`${unicodeEllipsis}× unicode ellipsis (…) with no typed (...)`,context:"Typographic precision signals LLM origin",weight:"low"})}
    // Casual ellipsis = human
    if(triDot>2&&unicodeEllipsis===0){sc.add(-10,"low");m.push({type:"Casual Ellipsis",snippet:`${triDot}× typed (...) — informal human punctuation`,context:"Humans type ..., not Unicode …",weight:"low"})}

    // Exclamation & question absence
    const excl=(this.text.match(/!/g)||[]).length;
    const qs=(this.text.match(/\?/g)||[]).length;
    const periods=(this.text.match(/\./g)||[]).length;
    const total=excl+qs+periods;
    if(total>5){
      if(excl===0&&this.wc>150){sc.add(20,"low");m.push({type:"Zero Exclamations",snippet:`No exclamation marks in ${this.wc} words`,context:"Formal AI prose avoids emotional punctuation",weight:"low"})}
      if(qs===0&&this.wc>200){sc.add(15,"low");m.push({type:"Zero Questions",snippet:`No question marks — entirely declarative`,context:"Humans use rhetorical questions; AI states",weight:"low"})}
    }
    // Excessive exclamations = corporate AI cheerfulness
    if(excl>0&&excl/(total||1)>0.15&&this.wc>100){
      sc.add(25,"medium");m.push({type:"Exclamation Overuse",snippet:`${excl} exclamation marks (${(excl/(total||1)*100).toFixed(0)}% of end punct)`,context:"AI 'enthusiastic helper' persona uses excessive exclamations",weight:"medium"});
    }

    // Parenthetical density
    const parens=(this.text.match(/\([^)]{5,60}\)/g)||[]).length;
    const parenDensity=parens/(this.wc/100);
    if(parenDensity>1.5){sc.add(35,"medium");m.push({type:"Parenthetical Overuse",snippet:`${parens} parenthetical asides detected`,context:"AI adds clarifying asides mechanically",weight:"medium"})}

    // Comma density — AI uses commas excessively for compound sentences
    const commas=(this.text.match(/,/g)||[]).length;
    const commaDensity=commas/(this.wc/100);
    if(commaDensity>7){sc.add(25,"low");m.push({type:"Comma Overload",snippet:`${commas} commas in ${this.wc} words (${commaDensity.toFixed(1)}/100)`,context:"AI constructs long compound sentences with many commas",weight:"low"})}

    return{name:"Punctuation Vectors",score:Math.min(100,sc.getScore()),matches:m,summary:`Em-dashes:${emDashes}, Colons:${colons}, Semis:${semicolons}, Parens:${parens}`,details:{emDashes,colons,semicolons,parens,totalWeight:sc.totalWeight}};
  }
}

// --- 6. REPETITION ANALYZER (massively expanded: TTR + n-gram repetition + phrase clustering) ---
class RepetitionAnalyzer{
  constructor(t){this.text=t;this.wc=Utils.countWords(t)}
  analyze(){
    const sc=new WeightedScorer(),m=[];
    const sentences=Utils.splitSentences(this.text);
    const tokens=Utils.getTokens(this.text);
    const stopwords=new Set(['the','a','an','in','on','it','is','are','was','were','be','been','being','to','of','and','or','for','with','at','by','from','as','this','that','these','those','its','our','their','which','who','how','what','when','where','why','not','but','so','if','can','will','has','have','had','do','did','does','just','also','more','than','into','up','out','one','all','any','each','they','we','you','he','she','them','him','her','his','my','your','very','well']);

    // 1. Type-Token Ratio (TTR) — low TTR = repetitive vocabulary = AI signal
    if(tokens.length>50){
      const unique=new Set(tokens).size;
      const ttr=unique/tokens.length;
      // AI often has TTR below 0.45 due to repeated structural vocabulary
      if(ttr<0.4){sc.add(80,"high");m.push({type:"Low Lexical Diversity",snippet:`TTR=${ttr.toFixed(3)} — only ${unique} unique words from ${tokens.length} total`,context:"Humans naturally vary vocabulary; AI reuses structural words",weight:"high"})}
      else if(ttr<0.5){sc.add(40,"medium");m.push({type:"Moderate Lexical Diversity",snippet:`TTR=${ttr.toFixed(3)} — vocabulary repetition above baseline`,context:"Low type-token ratio suggests templated output",weight:"medium"})}
    }

    // 2. Consecutive sentence starts (anaphora)
    const stopwordArr=['the','a','an','in','on','it'];
    for(let i=1;i<sentences.length;i++){
      const prev=sentences[i-1].trim().split(" ")[0].toLowerCase();
      const curr=sentences[i].trim().split(" ")[0].toLowerCase();
      if(prev===curr&&prev.length>2&&!stopwordArr.includes(prev)){
        m.push({type:"Anaphora",snippet:`...<span class="match-highlight">${Utils.escapeHtml(sentences[i-1].substring(0,40))}</span>...<br>...<span class="match-highlight">${Utils.escapeHtml(sentences[i].substring(0,40))}</span>...`,context:"Consecutive sentence starts",weight:"medium"});
      }
    }
    if(m.filter(x=>x.type==="Anaphora").length>1)sc.add(60,"medium");

    // 3. Bigram repetition — find bigrams used 3+ times
    const bigrams=Utils.getNgrams(tokens.filter(w=>!stopwords.has(w)),2);
    const bigramFreq={};
    bigrams.forEach(bg=>{bigramFreq[bg]=(bigramFreq[bg]||0)+1});
    const repeatedBigrams=Object.entries(bigramFreq).filter(([_,c])=>c>=3).sort((a,b)=>b[1]-a[1]);
    if(repeatedBigrams.length>0){
      sc.add(Math.min(70,repeatedBigrams.length*20),"high");
      repeatedBigrams.slice(0,4).forEach(([bg,c])=>{
        m.push({type:"Repeated Phrase",snippet:`"${bg}" appears <span class="match-highlight">${c}×</span> in the text`,context:"Phrase repetition indicates template generation",weight:"high"});
      });
    }

    // 4. Trigram repetition — 2+ repeats of a 3-word non-stopword sequence
    const trigrams=Utils.getNgrams(tokens.filter(w=>!stopwords.has(w)),3);
    const trigramFreq={};
    trigrams.forEach(tg=>{trigramFreq[tg]=(trigramFreq[tg]||0)+1});
    const repeatedTrigrams=Object.entries(trigramFreq).filter(([_,c])=>c>=2).sort((a,b)=>b[1]-a[1]);
    if(repeatedTrigrams.length>0){
      sc.add(75,"high");
      repeatedTrigrams.slice(0,3).forEach(([tg,c])=>{
        m.push({type:"Repeated Trigram",snippet:`"${tg}" appears <span class="match-highlight">${c}×</span>`,context:"Trigram repetition is a strong AI generation signal",weight:"high"});
      });
    }

    // 5. Word overuse — single content words appearing disproportionately
    const wordFreq={};
    tokens.filter(w=>!stopwords.has(w)&&w.length>4).forEach(w=>{wordFreq[w]=(wordFreq[w]||0)+1});
    const overused=Object.entries(wordFreq).filter(([_,c])=>c>=4&&c/(this.wc||1)>0.015).sort((a,b)=>b[1]-a[1]);
    if(overused.length>0){
      sc.add(Math.min(60,overused.length*15),"medium");
      overused.slice(0,5).forEach(([w,c])=>{
        m.push({type:"Word Overuse",snippet:`"${w}" used <span class="match-highlight">${c}×</span> (${(c/this.wc*100).toFixed(1)}% of text)`,context:"Vocabulary fixation — AI returns to same terms",weight:"medium"});
      });
    }

    return{name:"Repetitive Structures",score:Math.min(100,sc.getScore()),matches:m,summary:m.length?`${m.length} repetition patterns found`:"Vocabulary variance looks natural",details:sc.getDetails()};
  }
}

// --- 8. PASSIVE VOICE (massively expanded + false positive reduction) ---
class PassiveVoiceAnalyzer{
  constructor(t){this.text=t;this.wc=Utils.countWords(t)}
  analyze(){
    const sc=new WeightedScorer(),m=[];

    // Irregular past participles that won't catch with -ed
    const irregulars=['shown','seen','made','found','done','said','held','kept','given','taken','known','brought','thought','told','left','felt','meant','sent','built','bought','caught','taught','written','driven','eaten','fallen','forgotten','grown','hidden','known','lain','led','lit','lost','met','paid','read','run','set','sat','slept','spent','spoken','stood','stolen','struck','swept','swum','swung','taken','torn','thrown','understood','won','worn','woken'];

    // Pattern 1: Standard "to be + past participle"
    const beVerbs='am|is|are|was|were|be|been|being';
    const rx1=new RegExp(`\\b(${beVerbs})\\s+(\\w+ed|${irregulars.join('|')})\\b`,'gi');
    let x,count=0;

    // Exclusion: "is interested", "was excited" etc — stative, not passive
    const stativeExclusions=/\b(is|are|was|were)\s+(interested|excited|bored|tired|confused|worried|pleased|satisfied|surprised|disappointed|concerned|stressed|embarrassed|delighted|shocked|amazed|overwhelmed)\b/gi;
    const stativeSet=new Set();
    let sx;
    while((sx=stativeExclusions.exec(this.text))!==null)stativeSet.add(sx.index);

    while((x=rx1.exec(this.text))!==null){
      if(stativeSet.has(x.index))continue;
      count++;
      if(m.length<6)m.push({type:"Passive Voice",snippet:Utils.extractSnippet(this.text,x[0],x.index),context:"Be + participle construction",weight:"low"});
    }

    // Pattern 2: get-passive ("got rejected", "gets overlooked") — often human but worth noting
    const rx2=/\b(get|gets|got|gotten)\s+(\w+ed)\b/gi;
    let gcount=0;
    while((x=rx2.exec(this.text))!==null){gcount++;if(m.length<8)m.push({type:"Get-Passive",snippet:Utils.extractSnippet(this.text,x[0],x.index),context:"Get-passive (informal)",weight:"low"})}

    // Pattern 3: "have been + participle" (perfect passive) — very common in AI
    const rx3=/\b(has|have|had)\s+been\s+(\w+ed|shown|seen|made|found|done|given|taken|written|built)\b/gi;
    let pcount=0;
    while((x=rx3.exec(this.text))!==null){
      pcount++;
      if(m.length<10)m.push({type:"Perfect Passive",snippet:Utils.extractSnippet(this.text,x[0],x.index),context:"Have been + participle — formal AI register",weight:"medium"});
    }

    // Pattern 4: Modal passive ("can be done", "should be noted", "must be considered")
    const rx4=/\b(can|could|should|would|will|may|might|must|shall)\s+be\s+(\w+ed|shown|seen|made|found|done|given|taken|written|noted|considered|observed|understood)\b/gi;
    let mcount=0;
    while((x=rx4.exec(this.text))!==null){
      mcount++;
      if(m.length<12)m.push({type:"Modal Passive",snippet:Utils.extractSnippet(this.text,x[0],x.index),context:"Modal passive — hallmark of formal AI hedging",weight:"medium"});
    }

    const totalPassive=count+pcount+mcount;
    const ratio=totalPassive/(this.wc||1);
    const modalRatio=mcount/(this.wc||1);

    if(modalRatio>0.02){sc.add(70,"high");} // Modal passives are very AI
    else if(ratio>0.05){sc.add(65,"medium");}
    else if(ratio>0.03){sc.add(40,"medium");}
    else if(ratio>0.01){sc.add(20,"low");}

    // Passive density without agent ("by X") = strong AI signal (AI never names agents)
    const withAgent=(this.text.match(/\b(?:am|is|are|was|were|been|being)\s+\w+(?:ed|en)\s+by\s+\w/gi)||[]).length;
    const agentRatio=withAgent/(totalPassive||1);
    if(totalPassive>4&&agentRatio<0.1){
      sc.add(35,"medium");
      m.push({type:"Agentless Passive",snippet:`${totalPassive} passives, only ${withAgent} name an agent ("by X")`,context:"AI uses passive to avoid naming who does what",weight:"medium"});
    }

    return{name:"Passive Voice",score:Math.min(100,sc.getScore()),matches:m,summary:`${totalPassive} passive constructions (${(ratio*100).toFixed(1)}% rate), ${mcount} modal passives`,details:sc.getDetails()};
  }
}

// --- 9. BURSTINESS (expanded: n-gram rhythm + paragraph pacing + sentence length runs) ---
class BurstinessAnalyzer{
  constructor(t){this.text=t}
  analyze(){
    const sentences=Utils.splitSentences(this.text);
    if(sentences.length<3)return{name:"Burstiness",score:0,matches:[],summary:"Insufficient data"};

    const sc=new WeightedScorer(),m=[];
    const lengths=sentences.map(s=>s.trim().split(/\s+/).length);
    const mean=lengths.reduce((a,b)=>a+b,0)/lengths.length;
    const sd=Utils.calculateStdDev(lengths);
    const cv=sd/mean;

    // 1. Overall CV — original check, kept
    if(cv<0.25){sc.add(80,"high");m.push({type:"Low Variance",snippet:"Sentence lengths are unnaturally uniform",context:`CV=${cv.toFixed(2)} — robotic uniformity`,weight:"high"})}
    else if(cv>0.5){sc.add(-20,"high");m.push({type:"High Variance",snippet:"Sentence lengths vary significantly",context:`CV=${cv.toFixed(2)} — human-like burst pattern`,weight:"bonus"})}

    // 2. Long-run detection — detect 3+ consecutive sentences within 20% of each other
    let runs=0,runStart=-1;
    for(let i=1;i<lengths.length-1;i++){
      const windowMean=(lengths[i-1]+lengths[i]+lengths[i+1])/3;
      const allClose=[lengths[i-1],lengths[i],lengths[i+1]].every(l=>Math.abs(l-windowMean)/windowMean<0.2);
      if(allClose){if(runStart<0)runStart=i-1;runs++;}
      else runStart=-1;
    }
    if(runs>3){sc.add(50,"medium");m.push({type:"Length Run",snippet:`${runs} consecutive sentences with near-identical length`,context:"AI generates sentences in metronomic patterns",weight:"medium"})}

    // 3. Sentence length distribution — AI clusters around 18-25 words
    const aiZone=lengths.filter(l=>l>=15&&l<=28).length;
    const aiRatio=aiZone/lengths.length;
    if(aiRatio>0.7&&sentences.length>6){
      sc.add(45,"medium");
      m.push({type:"AI Length Clustering",snippet:`${(aiRatio*100).toFixed(0)}% of sentences are 15-28 words (AI sweet spot)`,context:"GPT defaults to ~20-word 'explanatory' sentences",weight:"medium"});
    }

    // 4. Very short sentence absence — humans use 1-5 word punchy sentences; AI rarely does
    const shortSentences=lengths.filter(l=>l<=5).length;
    if(sentences.length>8&&shortSentences===0){
      sc.add(30,"medium");
      m.push({type:"No Short Sentences",snippet:`Zero sentences ≤5 words in ${sentences.length}-sentence text`,context:"Humans punch with short sentences. AI doesn't.",weight:"medium"});
    }

    // 5. Sentence entropy — measure variety of unique length values
    const uniqueLengths=new Set(lengths).size;
    const lengthEntropy=uniqueLengths/lengths.length;
    if(lengthEntropy<0.4&&sentences.length>8){
      sc.add(40,"medium");
      m.push({type:"Low Length Entropy",snippet:`Only ${uniqueLengths} unique sentence lengths across ${lengths.length} sentences`,context:"Low entropy = templated generation",weight:"medium"});
    }

    // 6. Opening sentence length uniformity across paragraphs
    const paras=this.text.split(/\n\s*\n/).filter(p=>p.trim().length>20);
    if(paras.length>=4){
      const paraOpenLens=paras.map(p=>{const s=Utils.splitSentences(p);return s.length?s[0].trim().split(/\s+/).length:0}).filter(Boolean);
      if(paraOpenLens.length>=4){
        const poSD=Utils.calculateStdDev(paraOpenLens);
        const poMean=paraOpenLens.reduce((a,b)=>a+b,0)/paraOpenLens.length;
        const poCV=poSD/(poMean||1);
        if(poCV<0.2){
          sc.add(45,"medium");
          m.push({type:"Uniform Para Openers",snippet:`Paragraph opening sentences all similar length (CV=${poCV.toFixed(2)})`,context:"AI begins each paragraph with similarly-sized topic sentences",weight:"medium"});
        }
      }
    }

    return{name:"Burstiness & Rhythm",score:Math.min(100,sc.getScore()),matches:m,summary:cv<0.3?"Mechanical uniformity detected":"Rhythm analysis complete",details:{cv,mean:mean.toFixed(1),sd:sd.toFixed(1),aiZoneRatio:aiRatio.toFixed(2)}};
  }
}

// --- 12. COGNITIVE LOAD ---
class CognitiveLoadAnalyzer{
  constructor(t){this.text=t;this.wc=Utils.countWords(t)}
  analyze(){
    const sc=new WeightedScorer(),m=[];
    const cats=[
      {id:'academicCosplay',label:'Pseudo-Academic',weight:'high',list:PatternConfig.academicCosplay},
      {id:'hedgingLanguage',label:'Excessive Hedging',weight:'medium',list:PatternConfig.hedgingLanguage},
      {id:'falseBalance',label:'False Balance',weight:'high',list:PatternConfig.falseBalance}
    ];
    let h=0;
    cats.forEach(cat=>cat.list.forEach(p=>{
      const rx=new RegExp(`\\b${p}\\b`,"gi");let x;
      while((x=rx.exec(this.text))!==null){h++;if(m.length<15)m.push({type:cat.label,snippet:Utils.extractSnippet(this.text,x[0],x.index),context:"Artificial Nuance/Complexity",weight:cat.weight})}
    }));
    const d=h/(this.wc||1);
    if(d>0.02)sc.add(85,"high");else if(d>0.01)sc.add(50,"medium");else if(h>2)sc.add(20,"low");
    return{name:"Cognitive Load",score:sc.getScore(),matches:m,summary:h>0?`${h} instances of artificial complexity`:"Natural tone complexity",details:sc.getDetails()};
  }
}

// --- 13. CORPORATE SPEAK ---
class CorporateSpeakAnalyzer{
  constructor(t){this.text=t;this.wc=Utils.countWords(t)}
  analyze(){
    const sc=new WeightedScorer(),m=[];
    PatternConfig.buzzwordClusters.forEach(p=>{
      if(this.text.toLowerCase().includes(p.toLowerCase())){m.push({type:"Buzzword Cluster",snippet:`...${p}...`,context:"High-probability LLM Cluster",weight:"critical"});sc.add(100,"critical")}
    });
    let vc=0;
    PatternConfig.processVerbs.forEach(w=>{
      const rx=new RegExp(`\\b${w}\\b`,"gi");let x;
      while((x=rx.exec(this.text))!==null){vc++;if(m.length<10)m.push({type:"Process Verb",snippet:Utils.extractSnippet(this.text,x[0],x.index),context:"Corporate/Consultant Tone",weight:"low"})}
    });
    if(vc>5)sc.add(60,"medium");
    return{name:"Corporate Speak",score:sc.getScore(),matches:m,summary:m.length?"Detected 'Consultant' persona":"No corporate jargon",details:sc.getDetails()};
  }
}

// --- 14. META FILLER ---
class MetaFillerAnalyzer{
  constructor(t){this.text=t}
  analyze(){
    const sc=new WeightedScorer(),m=[];
    const fillers=[...PatternConfig.metaCommentary.map(p=>({p,type:"Meta-Commentary"})),...PatternConfig.listIntroducers.map(p=>({p,type:"List Introducer"}))];
    let count=0;
    fillers.forEach(item=>{
      const rx=new RegExp(`\\b${item.p}\\b`,"gi");let x;
      while((x=rx.exec(this.text))!==null){count++;m.push({type:item.type,snippet:Utils.extractSnippet(this.text,x[0],x.index),context:"Structural padding",weight:"medium"})}
    });
    if(count>2)sc.add(40+(count*10),"high");
    return{name:"Structural Filler",score:sc.getScore(),matches:m,summary:count>0?"Detected structural padding phrases":"Concise structure",details:sc.getDetails()};
  }
}

// --- 15. PROFANITY & SWEAR WORD ANALYZER ---
// Rationale: AI outputs are almost entirely free of genuine swearing. When profanity appears it's
// either quoted, discussed academically, or heavily asterisked. Real humans swear naturally in context.
// This analyzer distinguishes: genuine contextual swearing (human), absent swearing in casual text
// (AI), censored/asterisked swearing (AI caution), and academically-framed profanity (AI discussing it).
class ProfanityAnalyzer{
  constructor(t){this.text=t;this.wc=Utils.countWords(t)}
  analyze(){
    const sc=new WeightedScorer(),m=[];

    // Tier 1: Strong swears — very rare in AI output, common in genuine human writing
    const strong=/\b(fuck(?:ing|ed|er|s)?|shit(?:ty|ting|s)?|cunt(?:s)?|bastard(?:s)?|cock(?:s|sucker)?|ass(?:hole|wipe|hat)?|bitch(?:es|ing)?|dick(?:head|s)?|piss(?:ed|ing)?|damn(?:ed|it)?|crap(?:py|s)?|bullshit|motherfucker|wanker|prick|twat|bollocks|arse(?:hole)?)\b/gi;
    // Tier 2: Mild swears / casual language — rare in formal AI, common in informal human text
    const mild=/\b(hell|bloody|bugger|sod(?:ding)?|crap|blimey|feck|shite|bloody hell|christ|jesus christ|oh god|for god's sake|goddamn|friggin|freaking|flippin)\b/gi;
    // Censored patterns — AI doing its "I'll acknowledge but not say it" dance
    const censored=/\b\w\*+\w?\b|\b[A-Za-z]\*{2,}[A-Za-z]?\b/g;
    // Academic framing — AI discussing swearing without swearing
    const academic=/\b(expletive|profanity|obscenity|vulgar(?:ity)?|offensive language|inappropriate language|strong language|crude language|coarse language|foul language|swear word|curse word|four-letter word)\b/gi;

    let strongHits=[],mildHits=[],censorHits=[],acaHits=[];
    let x;

    while((x=strong.exec(this.text))!==null)strongHits.push({word:x[0],idx:x.index});
    while((x=mild.exec(this.text))!==null)mildHits.push({word:x[0],idx:x.index});
    while((x=censored.exec(this.text))!==null)censorHits.push({word:x[0],idx:x.index});
    while((x=academic.exec(this.text))!==null)acaHits.push({word:x[0],idx:x.index});

    // HUMAN SIGNALS: genuine contextual swearing
    if(strongHits.length>0){
      sc.add(-40,"high"); // Strong negative AI score — this is very human
      strongHits.slice(0,5).forEach(h=>{
        m.push({type:"Strong Profanity",snippet:Utils.extractSnippet(this.text,h.word,h.idx,40),context:"Genuine swearing — AI almost never does this naturally",weight:"human"});
      });
    }
    if(mildHits.length>2){
      sc.add(-20,"medium");
      mildHits.slice(0,4).forEach(h=>{
        m.push({type:"Casual Profanity",snippet:Utils.extractSnippet(this.text,h.word,h.idx,40),context:"Mild swearing — informal human register",weight:"human"});
      });
    }

    // AI SIGNALS: censored swearing — AI tiptoeing around words
    if(censorHits.length>0){
      sc.add(50,"high");
      censorHits.slice(0,3).forEach(h=>{
        m.push({type:"Censored Word",snippet:Utils.extractSnippet(this.text,h.word,h.idx,40),context:"Asterisked word — AI self-censorship signature",weight:"high"});
      });
    }

    // AI SIGNALS: talking ABOUT profanity without using it
    if(acaHits.length>0){
      sc.add(40,"medium");
      acaHits.slice(0,3).forEach(h=>{
        m.push({type:"Academic Framing",snippet:Utils.extractSnippet(this.text,h.word,h.idx,40),context:"Discussing swearing without swearing = AI distancing",weight:"medium"});
      });
    }

    // AI SIGNAL: zero swearing in clearly casual/conversational text (informal register without profanity)
    // Detect informal register markers without any swearing
    const informalMarkers=(this.text.match(/\b(gonna|wanna|gotta|kinda|sorta|dunno|ya know|tbh|ngl|lowkey|highkey|legit|literally|honestly|like,|you know,)\b/gi)||[]).length;
    if(informalMarkers>3&&strongHits.length===0&&mildHits.length===0&&this.wc>100){
      sc.add(30,"medium");
      m.push({type:"Sanitised Casual Register",snippet:`${informalMarkers} informal markers (gonna, tbh, literally…) but zero swearing`,context:"AI mimics casual speech but scrubs all profanity",weight:"medium"});
    }

    // Determine summary
    const totalSwears=strongHits.length+mildHits.length;
    let summary;
    if(totalSwears>0)summary=`${totalSwears} swear words detected (human signal)`;
    else if(censorHits.length>0)summary=`${censorHits.length} censored words detected (AI caution)`;
    else if(acaHits.length>0)summary=`Profanity discussed academically — not used`;
    else summary=`No profanity detected — neutral`;

    return{name:"Profanity & Register",score:Math.min(100,Math.max(0,sc.getScore())),matches:m,summary,details:{strongSwears:strongHits.length,mildSwears:mildHits.length,censored:censorHits.length,academic:acaHits.length,totalWeight:sc.totalWeight}};
  }
}

// --- RENDERER ---
class ResultRenderer{
  constructor(){
    this.container=document.getElementById("modules-container");
    this.scoreCircle=document.getElementById("score-circle");
    this.scoreText=document.getElementById("score-text");
    this.keyIndicators=document.getElementById("key-indicators");
  }
  updateTotalScore(s){
    this.scoreText.innerText=`${s}%`;
    let color,label;
    if(s>80){color="#ef4444";label="Likely AI-Generated";}
    else if(s>50){color="#f97316";label="Mixed Signals / Edited";}
    else{color="#22c55e";label="Likely Human-Written";}
    this.scoreCircle.style.setProperty("--score-percent",`${s}%`);
    this.scoreCircle.style.setProperty("--score-color",color);
    this.scoreText.style.color=color;
    const ct=document.getElementById("confidence-text");
    ct.innerText=label;ct.style.color=color;
  }
  renderModule(d){
    if(d.matches.length===0&&d.score<10)return;
    const wrap=document.createElement("div");
    wrap.className="border border-slate-200 rounded-lg overflow-hidden bg-white shadow-sm";
    const hc=d.score>50?"bg-red-50":(d.score>10?"bg-orange-50":"bg-green-50");
    const tc=d.score>50?"text-red-700":(d.score>10?"text-orange-700":"text-green-700");
    const barColor=d.score>50?'bg-red-500':(d.score>10?'bg-orange-400':'bg-green-500');
    const items=d.matches.map(m=>`<div class="p-3 border-b border-slate-100 last:border-0 hover:bg-slate-50 transition"><div class="flex justify-between items-start mb-2"><span class="text-xs font-bold uppercase tracking-wider text-slate-500">${m.type}</span><span class="text-xs px-2 py-0.5 rounded bg-slate-200 text-slate-600">${m.context}</span></div><div class="snippet-box p-2 rounded text-slate-700 bg-slate-50">${m.snippet}</div></div>`).join("");
    wrap.innerHTML=`<div class="category-header p-4 flex justify-between items-center ${hc}" onclick="this.nextElementSibling.classList.toggle('open')"><div class="flex items-center gap-3"><div class="w-1.5 h-8 rounded-full ${barColor}"></div><div><h3 class="font-bold text-slate-800">${d.name}</h3><p class="text-xs text-slate-500">${d.matches.length} findings</p></div></div><span class="font-bold text-lg ${tc}">${Math.round(d.score)}%</span></div><div class="category-content bg-white"><p class="p-4 text-sm text-slate-500 italic border-b border-slate-100">${d.summary}</p><div class="max-h-96 overflow-y-auto">${items}</div></div>`;
    this.container.appendChild(wrap);
    if(d.score>60||d.matches.some(m=>m.weight==='critical')){
      const li=document.createElement("li");
      li.className="text-sm text-slate-600 border-l-2 border-red-400 pl-2";
      li.innerHTML=`<strong>${d.name}:</strong> ${d.summary}`;
      this.keyIndicators.appendChild(li);
    }
  }
  clear(){
    this.container.innerHTML="";this.keyIndicators.innerHTML="";
    document.getElementById("results-area").classList.add("hidden");
    this.scoreCircle.style.setProperty("--score-percent","0%");
    this.scoreText.innerText="0%";
  }
  show(){document.getElementById("results-area").classList.remove("hidden")}
}

// --- APP ---
class App{
  constructor(){
    this.editor=document.getElementById("editor");
    this.analyzeBtn=document.getElementById("analyze-btn");
    this.clearBtn=document.getElementById("clear-btn");
    this.wordCountEl=document.getElementById("word-count");
    this.renderer=new ResultRenderer();
    this.bindEvents();
  }
  bindEvents(){
    this.editor.addEventListener("input",()=>{
      const t=Utils.htmlToText(this.editor.innerHTML);
      const w=Utils.countWords(t);
      this.wordCountEl.innerText=`${w} words`;
      this.analyzeBtn.disabled=w<PatternConfig.thresholds.minWords;
      this.analyzeBtn.classList.toggle("opacity-50",w<PatternConfig.thresholds.minWords);
      this.analyzeBtn.classList.toggle("cursor-not-allowed",w<PatternConfig.thresholds.minWords);
    });
    this.clearBtn.addEventListener("click",()=>{
      this.editor.innerHTML="";this.renderer.clear();
      this.wordCountEl.innerText="0 words";this.analyzeBtn.disabled=true;
    });
    this.analyzeBtn.addEventListener("click",()=>this.runAnalysis());
  }
  runAnalysis(){
    this.renderer.clear();
    const text=Utils.htmlToText(this.editor.innerHTML);
    const analyzers=[
      new RefusalAnalyzer(text),new GPTLexiconAnalyzer(text),new TransitionAnalyzer(text),
      new VagueAuthorityAnalyzer(text),new RepetitionAnalyzer(text),new PassiveVoiceAnalyzer(text),
      new BurstinessAnalyzer(text),new EmojiAnalyzer(text),new StructuralRigidityAnalyzer(text),
      new PunctuationAnalyzer(text),new BinaryPatternAnalyzer(text),new CognitiveLoadAnalyzer(text),
      new CorporateSpeakAnalyzer(text),new MetaFillerAnalyzer(text),new ProfanityAnalyzer(text)
    ];
    const results=analyzers.map(a=>a.analyze());
    const totalScorer=new WeightedScorer();
    results.forEach(res=>{
      this.renderer.renderModule(res);
      if(res.details&&res.details.totalWeight>0){
        const w=res.matches.some(m=>m.weight==='critical')?'critical':'medium';
        totalScorer.add(res.score,w);
      }
    });
    let final=totalScorer.getScore();
    if(Utils.countWords(text)<50)final=Math.min(final,85);
    this.renderer.updateTotalScore(Math.round(final));
    this.renderer.show();
  }
}
document.addEventListener("DOMContentLoaded",()=>new App());
</script>
