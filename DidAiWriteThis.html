<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Content Detector v2.6 (Merged)</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
:root{--bg-color:#f9f9f9;--text-color:#2d2d2d;--border-color:#e0e0e0;--primary-color:#000;--secondary-color:#fff;--subtle-text-color:#888;--highlight-bg:#f0f0f0;--error-color:#c0392b}
body{font-family:'JetBrains Mono',monospace;background-color:var(--bg-color);color:var(--text-color);font-size:13.5px;line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,h2,h3{font-weight:600;letter-spacing:-.5px}
.main-container{max-width:750px;margin:0 auto;padding:3rem 1.5rem}
header{text-align:center;margin-bottom:3rem}
header h1{font-size:1.8rem;font-weight:700;margin-bottom:.5rem}
header p{font-size:.9rem;color:var(--subtle-text-color)}
.card{background-color:var(--secondary-color);border:1px solid var(--border-color);padding:2rem;margin-bottom:2rem;transition:box-shadow .3s ease-in-out}
.editor{min-height:250px;width:100%;font-size:.9rem;border:1px solid var(--border-color);padding:1.5rem;transition:all .3s ease}
.editor:focus{outline:none;border-color:var(--primary-color);box-shadow:0 0 0 3px rgba(0,0,0,.05)}
.editor-controls{display:flex;justify-content:flex-end;align-items:center;gap:.75rem;margin-top:1rem}
.btn{font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:500;padding:.75rem 1.5rem;border:none;cursor:pointer;transition:all .3s ease}
#analyze-btn{background-color:var(--primary-color);color:var(--secondary-color)}
#analyze-btn:hover:not(:disabled){background-color:#333;transform:translateY(-2px)}
#analyze-btn:disabled{background-color:#ccc;cursor:not-allowed}
#clear-btn{background-color:transparent;color:var(--text-color);border:1px solid var(--border-color)}
#clear-btn:hover{background-color:var(--highlight-bg);border-color:#ccc}
#results-container{display:flex;flex-direction:column;gap:2rem}
.results-summary{display:flex;flex-direction:column;align-items:center;text-align:center}
h2.section-title{font-size:1.2rem;margin-bottom:1.5rem;text-align:center}
.score-circle{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .5s ease-in-out;--score-percent:0%;background:conic-gradient(var(--border-color) 0% var(--score-percent),var(--border-color) var(--score-percent) 100%)}
#score-text{font-size:2.5rem;font-weight:700}
#confidence-level{font-size:.8rem;color:var(--subtle-text-color);margin-top:1rem;text-transform:uppercase;letter-spacing:1px}
#key-indicators{list-style-type:none;padding:0;margin:0;width:100%;text-align:center}
#key-indicators li{padding:.75rem;border:1px solid var(--border-color);margin-top:.75rem;font-size:.8rem}
#analysis-categories{border:1px solid var(--border-color)}
.category-wrapper{border-bottom:1px solid var(--border-color)}
.category-wrapper:last-child{border-bottom:none}
.category-header{cursor:pointer;padding:1.25rem 1.5rem;display:flex;justify-content:space-between;align-items:center;transition:background-color .3s ease}
.category-header:hover{background-color:#fbfbfb}
.category-header h3{font-size:1rem;font-weight:500;text-transform:capitalize}
.category-header svg{width:16px;height:16px;transition:transform .4s cubic-bezier(.25,.46,.45,.94)}
.category-header.expanded svg{transform:rotate(180deg)}
.category-content{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.25,.46,.45,.94)}
.category-content.expanded{max-height:2000px;transition:max-height .6s cubic-bezier(.25,.46,.45,.94)}
.category-content-inner{padding:0 1.5rem 1.5rem;border-top:1px solid var(--border-color)}
.category-item{padding:1rem;background-color:var(--bg-color);border:1px solid #e9e9e9;margin-top:1rem}
.item-title{font-weight:500;display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.item-description{font-size:.85rem;color:var(--subtle-text-color)}
.item-description.small{margin-top:.25rem;font-size:.8rem}
.item-subcategory{font-weight:500;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border-color)}
.badge{font-size:.7rem;font-weight:700;padding:.2rem .6rem;background-color:var(--highlight-bg);border:1px solid var(--border-color);color:var(--text-color)}
.item-examples{margin-top:.75rem}
.item-examples summary{cursor:pointer;font-weight:500;font-size:.85rem;padding:.5rem;background:#fafafa;border:1px solid var(--border-color);user-select:none}
.item-examples summary:hover{background:#f0f0f0}
.item-examples ul{list-style-type:disc;padding-left:1.25rem;margin-top:.5rem}
.item-examples li{margin-bottom:.75rem;font-size:.8rem;line-height:1.6;color:#555}
.hidden{display:none!important}
.fade-in{animation:fadeIn .8s ease-in-out forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="main-container">
<header>
<h1>AI Content Detector v2.6</h1>
<p>A comprehensive tool to analyze text for AI-generated patterns with visual examples.</p>
</header>
<main>
<div class="card">
<div id="editor" contenteditable="true" class="editor" placeholder="Paste or type your text here..."></div>
<div class="editor-controls">
<button id="clear-btn" class="btn">Clear</button>
<button id="analyze-btn" class="btn" disabled>Analyze</button>
</div>
</div>
<div id="results-container" class="hidden">
<div class="card results-summary fade-in">
<h2 class="section-title">Analysis Summary</h2>
<div id="score-circle" class="score-circle"><span id="score-text">-%</span></div>
<p id="confidence-level"></p>
</div>
<div class="card fade-in" style="animation-delay: 100ms;">
<h2 class="section-title">Key Indicators</h2>
<ul id="key-indicators"><li class="text-gray-500">Analysis results will appear here.</li></ul>
</div>
</div>
<div id="detailed-analysis" class="hidden">
<h2 class="section-title fade-in" style="animation-delay: 200ms; margin-top: 2rem;">Detailed Analysis</h2>
<div id="analysis-categories" class="fade-in" style="animation-delay: 300ms;"></div>
</div>
</main>
</div>

<script>
// === UTILITY CLASS ===
class Utils{
static htmlToText(t){
if(!t||"string"!=typeof t)return"";
const e=document.createElement("div");
return e.innerHTML=t,e.textContent||e.innerText||""
}
static countWords(t){
if(!t)return 0;
const e="string"==typeof t&&t.includes("<")?this.htmlToText(t):t;
return e.trim().split(/\s+/).filter(Boolean).length
}
static debounce(t,e=300){
let s;
return(...r)=>{clearTimeout(s),s=setTimeout(()=>t.apply(this,r),e)}
}
}

// === STRUCTURAL ANALYZER ===
class StructuralAnalyzer {
analyze(html) {
const plainText = Utils.htmlToText(html);
const paragraphs = plainText.split(/\n\s*\n/).filter(p => Utils.countWords(p) > 5);
if (paragraphs.length <= 2) return { hasData: false };

const pLengths = paragraphs.map(p => p.split(/\s+/).filter(Boolean).length);
const mean = pLengths.reduce((a, b) => a + b, 0) / pLengths.length;
const stdDev = Math.sqrt(pLengths.map(len => Math.pow(len - mean, 2)).reduce((a, b) => a + b, 0) / pLengths.length);
const isUniform = pLengths.length > 3 && stdDev < 6 && mean > 20;

const boldPatternRegex = /(?:\*\*|__|\*|"|'|^|\n)([A-Z][^:]{1,50})(?:\*\*|__|\*|"|')?:\s+([^\n]{20,100})/gm;
const boldMatches = [];
let match;
while ((match = boldPatternRegex.exec(plainText)) !== null && boldMatches.length < 5) {
boldMatches.push({ term: match[1], context: match[0].substring(0, 100) });
}
const hasBoldPattern = boldMatches.length > 2;

const listRegex = /^\s*[-*•]\s+(.+)|^\s*\d+[\.)]\s+(.+)/gm;
const listItems = [];
while ((match = listRegex.exec(plainText)) !== null && listItems.length < 10) {
listItems.push(match[1] || match[2]);
}
let isListUniform = false;
if (listItems.length > 3) {
const itemLengths = listItems.map(item => Utils.countWords(item));
const listMean = itemLengths.reduce((a, b) => a + b, 0) / itemLengths.length;
const listStdDev = Math.sqrt(itemLengths.map(len => Math.pow(len - listMean, 2)).reduce((a, b) => a + b, 0) / itemLengths.length);
isListUniform = listStdDev < 4 && listMean > 10;
}

const headerRegex = /^#+\s+(.+)|^([A-Z][^.!?]{10,60})\s*$/gm;
const headers = [];
while ((match = headerRegex.exec(plainText)) !== null && headers.length < 8) {
headers.push(match[1] || match[2]);
}
const hasStructuredSections = headers.length > 3;

return { stdDev, isUniform, boldMatches, hasBoldPattern, listItems: listItems.slice(0, 4), isListUniform, headers: headers.slice(0, 4), hasStructuredSections, hasData: true };
}

getScore(results) {
let score = 0, explanation = null;
if (results.hasBoldPattern) {
score = 0.9;
explanation = `Frequent use of "Term:" format (${results.boldMatches.length}x), a very strong AI indicator.`;
} else if (results.isListUniform) {
score = 0.8;
explanation = `List items (${results.listItems.length}) are unnaturally uniform in length and structure.`;
} else if (results.isUniform) {
score = 0.7;
explanation = "Paragraphs are suspiciously uniform in length.";
}
if (results.hasStructuredSections) score += 0.1;
return { score, confidence: score > 0 ? 0.9 : 0.5, explanation };
}

getHtml(results) {
if (!results.hasData) return '<p class="text-gray-500">Not enough content to analyze structural patterns.</p>';
let html = '';
if (results.isUniform) html += `<div class="category-item"><div class="item-title">Paragraph Uniformity</div><div class="item-description">Paragraph lengths are very consistent (Std Dev: ${results.stdDev.toFixed(2)}).</div></div>`;
if (results.hasBoldPattern) {
html += `<div class="category-item"><div class="item-title">Explanatory Formatting</div><div class="item-description">Detected ${results.boldMatches.length} instances of a "<strong>Term:</strong>" pattern. This is a classic AI writing style.</div>`;
if (results.boldMatches.length > 0) {
html += '<details class="item-examples"><summary>👁️ View Examples</summary><ul>';
results.boldMatches.forEach(m => html += `<li><strong>${this.escapeHtml(m.term)}:</strong> ${this.escapeHtml(m.context.substring(0, 80))}...</li>`);
html += '</ul></details>';
}
html += '</div>';
}
if (results.isListUniform) {
html += `<div class="category-item"><div class="item-title">List Uniformity</div><div class="item-description">The ${results.listItems.length} list items are highly consistent in length, suggesting AI generation.</div>`;
if (results.listItems.length > 0) {
html += '<details class="item-examples"><summary>👁️ View Examples</summary><ul>';
results.listItems.forEach(item => html += `<li>${this.escapeHtml(item.substring(0, 100))}</li>`);
html += '</ul></details>';
}
html += '</div>';
}
if (results.hasStructuredSections && results.headers.length > 0) {
html += `<div class="category-item"><div class="item-title">Structured Sections</div><div class="item-description">Detected ${results.headers.length}+ section headers in an organizational pattern.</div></div>`;
}
return html || '<p class="text-gray-500">No significant structural patterns detected.</p>';
}

escapeHtml(text) {
const div = document.createElement('div');
div.textContent = text;
return div.innerHTML;
}
}

// === STYLISTIC ANALYZER (MERGED) ===
class StylisticAnalyzer {
constructor() {
this.commonAiPhrases = {
introductory: ["certainly,", "absolutely,", "of course,", "here is", "here's", "here are", "let's dive into", "let's explore", "let's delve into", "let's take a closer look at", "let's unpack", "in this article, we will", "in this guide,", "in this blog post,", "in this response,", "it's important to note", "it is crucial to understand", "it's worth highlighting", "when it comes to", "in the realm of", "in the world of", "the landscape of", "in today's fast-paced world", "in the modern era,", "in today's digital age,", "without further ado", "to begin with,", "first and foremost,", "to kick things off,", "as we embark on", "diving right in", "let us examine", "it is essential to consider"],
concluding: ["in conclusion,", "to sum up,", "in summary,", "to summarize,", "overall,", "in the final analysis,", "all in all,", "taking everything into consideration,", "looking ahead,", "moving forward,", "the path forward involves", "as we look to the future", "hope this helps!", "i hope this explanation was helpful", "i hope this provides clarity", "feel free to ask", "if you have any further questions,", "don't hesitate to reach out", "please let me know if you need anything else", "should you require further assistance,", "to wrap things up", "bringing it all together", "the key takeaway is", "ultimately, what matters most"],
disclaimers: ["as an ai,", "as a language model,", "as a large language model,", "as an ai assistant,", "my knowledge cutoff is", "my training data only goes up to", "i do not have access to real-time information", "i don't have personal opinions", "i cannot provide financial advice", "i am not a medical professional", "it is important to remember", "it should be noted that", "it's worth noting", "a key consideration is", "one must bear in mind", "please keep in mind", "it is essential to", "it's crucial to understand that", "please be aware that", "it's vital to recognize"],
hedging: ["in general,", "generally speaking,", "typically,", "usually,", "often,", "for the most part,", "it seems that", "it appears that", "it could be argued that", "one might say", "tends to be", "can be seen as", "in some respects,", "in many cases,", "arguably,", "potentially,", "likely,", "it is possible that", "in some instances,", "to some extent,", "more or less", "by and large", "on the whole", "as a rule", "in most scenarios"],
rhetorical: ["so, what does this all mean?", "but what about", "the question then becomes", "what's the bottom line?", "how can we", "why is this important?", "so, how does it work?", "what's the key takeaway?", "what does the future hold?", "where do we go from here?", "what can we learn from this?", "how does this apply to", "why should you care?", "what makes this significant?"],
transitions: ["that being said", "with that said", "having said that", "with that in mind", "on the other hand", "it's worth mentioning", "speaking of which", "in light of this", "building on this", "expanding on this idea"]
};
this.formalityWords = ["delve", "explore", "harness", "leverage", "utilize", "facilitate", "elucidate", "underscore", "demonstrate", "articulate", "expound", "ascertain", "postulate", "necessitate", "streamline", "optimize", "ameliorate", "augment", "constitutes", "profoundly", "expedite", "synergize", "navigate", "unleash", "unlock", "furthermore", "moreover", "additionally", "subsequently", "conversely", "correspondingly", "therefore", "hence", "consequently", "nonetheless", "nevertheless", "accordingly", "juxtapose", "paradigm shift", "cultivate", "endeavor", "synthesize", "extrapolate", "epitomize", "exemplify", "encapsulate"];
this.genericWords = ["vast", "intricate", "complex", "dynamic", "remarkable", "unique", "various", "significant", "essential", "key", "crucial", "pivotal", "foundational", "game-changing", "cutting-edge", "state-of-the-art", "world-class", "transformative", "powerful", "seamless", "impactful", "innovative", "streamlined", "versatile", "elegant", "intuitive", "next-generation", "comprehensive", "extensive", "diverse", "abundant", "numerous", "multifaceted", "interconnected", "wide-ranging", "groundbreaking", "amazing", "incredible", "fantastic", "excellent", "outstanding", "impressive", "fascinating", "exceptional", "cornerstone", "revolutionary", "unparalleled", "unprecedented", "holistic", "robust", "scalable"];
            
// --- ADDED FROM TOOL 1 ---
this.punctuationThresholds = {
emDashesPercentage: 0.003,
ellipsesPercentage: 0.006,
exclamationPercentage: 0.007
};
// --- END ADDED ---
}
        
analyze(text) {
const plainText = Utils.htmlToText(text);
if (Utils.countWords(plainText) < 30) return { hasData: false };
            
const aiPhrases = this.findPhrases(plainText, this.commonAiPhrases);
const formalityWords = this.findPhrases(plainText, { formality: this.formalityWords });
const genericWords = this.findPhrases(plainText, { generic: this.genericWords });
            
// --- ADDED FROM TOOL 1 ---
const punctuation = this.analyzePunctuation(plainText);
// --- END ADDED ---

// --- MODIFIED ---
const hasData = aiPhrases.count > 0 || formalityWords.count > 2 || genericWords.count > 3 || punctuation.hasIssues;
return { hasData, aiPhrases, formalityWords, genericWords, punctuation, plainText };
// --- END MODIFIED ---
}
        
findPhrases(text, categories) {
const results = { count: 0, matches: [], categories: {}, examples: [] };
text = text.toLowerCase();
for (const category in categories) {
results.categories[category] = 0;
for (const phrase of categories[category]) {
const regex = new RegExp(phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
const matches = text.match(regex);
if (matches && matches.length > 0) {
const count = matches.length;
results.count += count;
results.categories[category] += count;
results.matches.push({ phrase, category, count });
                        
const idx = text.indexOf(phrase.toLowerCase());
if (idx !== -1 && results.examples.length < 8) {
const start = Math.max(0, idx - 30);
const end = Math.min(text.length, idx + phrase.length + 50);
results.examples.push({
phrase: matches[0],
context: text.substring(start, end).trim()
});
}
}
}
}
return results;
}

// --- ADDED FROM TOOL 1 ---
analyzePunctuation(text) {
const results = {
hasIssues: false,
results: {
emDashes: { count: 0, isExcessive: false },
ellipses: { count: 0, isExcessive: false },
exclamationMarks: { count: 0, isExcessive: false },
oxfordCommaConsistency: { consistent: false }
}
};
if (text.length === 0) return results;
          
const emDashCount = (text.match(/—|–|--/g) || []).length;
results.results.emDashes = {
count: emDashCount,
isExcessive: ((emDashCount / text.length) > this.punctuationThresholds.emDashesPercentage && emDashCount >= 2) || emDashCount >= 3
};
          
const ellipsesCount = (text.match(/\.\.\./g) || []).length;
results.results.ellipses = {
count: ellipsesCount,
isExcessive: (ellipsesCount / text.length) > this.punctuationThresholds.ellipsesPercentage && ellipsesCount >= 3
};

const exclamationCount = (text.match(/!/g) || []).length;
results.results.exclamationMarks = {
count: exclamationCount,
isExcessive: (exclamationCount / text.length) > this.punctuationThresholds.exclamationPercentage && exclamationCount >= 3
};

const withOxfordComma = (text.match(/,\s+and\s+/g) || []).length;
const withoutOxfordComma = (text.match(/\s+and\s+/g) || []).length - withOxfordComma;
const oxfordConsistency = {
consistent: false,
commaCount: withOxfordComma,
noCommaCount: withoutOxfordComma
};
if (withOxfordComma + withoutOxfordComma >= 5) {
if ((withOxfordComma > 0 && withoutOxfordComma === 0) || (withoutOxfordComma > 0 && withOxfordComma === 0)) {
oxfordConsistency.consistent = true;
}
}
results.results.oxfordCommaConsistency = oxfordConsistency;
          
results.hasIssues = results.results.emDashes.isExcessive || results.results.ellipses.isExcessive || results.results.exclamationMarks.isExcessive || (oxfordConsistency.consistent && (withOxfordComma + withoutOxfordComma) >= 8);
return results;
}
// --- END ADDED ---

getScore(results) {
if (!results.hasData) return { score: 0, confidence: 0, explanation: null };
let score = 0, explanations = [];
            
if (results.aiPhrases.categories.rhetorical > 0) {
score += 0.4;
explanations.push("uses rhetorical questions to structure content");
}
if (results.aiPhrases.count > 1) {
score += Math.min(0.5, results.aiPhrases.count * 0.1);
explanations.push(`AI-typical phrases (${results.aiPhrases.count})`);
}
if (results.formalityWords.count > 2) {
score += Math.min(0.25, (results.formalityWords.count - 2) * 0.05);
explanations.push("overly formal/academic language");
}
if (results.genericWords.count > 3) {
score += Math.min(0.2, (results.genericWords.count - 3) * 0.04);
explanations.push("high use of generic 'booster' words");
}

// --- ADDED FROM TOOL 1 (MODIFIED) ---
const punctuation = results.punctuation;
if (punctuation?.hasIssues) {
let punctScore = 0;
if (punctuation.results.emDashes.isExcessive) {
if (punctuation.results.emDashes.count >= 3) {
punctScore += 0.25;
explanations.push(`Multiple em dashes (${punctuation.results.emDashes.count})`);
} else {
punctScore += 0.15;
explanations.push("High em-dash usage");
}
}
if (punctuation.results.ellipses.isExcessive) punctScore += 0.05;
if (punctuation.results.exclamationMarks.isExcessive) punctScore += 0.05;
const oxford = punctuation.results.oxfordCommaConsistency;
if (oxford.consistent && (oxford.commaCount + oxford.noCommaCount) >= 8) {
punctScore += 0.15;
explanations.push("Perfect consistency in optional punctuation");
}
score += punctScore;
}
// --- END ADDED ---
            
return { score: Math.min(0.95, score), confidence: explanations.length > 0 ? 0.85 : 0.5, explanation: explanations.length > 0 ? `Stylistic indicators: ${explanations.join(', ')}.` : null };
}

getHtml(results) {
if (!results.hasData) return '<p class="text-gray-500">No significant stylistic patterns detected.</p>';
let html = '';
            
if (results.aiPhrases.count > 0) {
html += `<div class="category-item"><div class="item-title">AI-Typical Phrasing <span class="badge">${results.aiPhrases.count}</span></div>`;
html += `<div class="item-description">Found common introductory, concluding, or disclaimer phrases. ${results.aiPhrases.categories.rhetorical > 0 ? `Detected ${results.aiPhrases.categories.rhetorical} rhetorical question(s).` : ''}</div>`;
if (results.aiPhrases.examples.length > 0) {
html += '<details class="item-examples"><summary>👁️ View Examples</summary><ul>';
results.aiPhrases.examples.forEach(ex => html += `<li>"...${this.escapeHtml(ex.context)}..."</li>`);
html += '</ul></details>';
}
html += '</div>';
}
if (results.formalityWords.count > 2) {
html += `<div class="category-item"><div class="item-title">Overly Formal Language <span class="badge">${results.formalityWords.count}</span></div>`;
html += `<div class="item-description">Text uses words like "utilize", "elucidate", and "paradigm" which can be a sign of AI writing.</div>`;
if (results.formalityWords.examples.length > 0) {
html += '<details class="item-examples"><summary>👁️ View Examples</summary><ul>';
results.formalityWords.examples.forEach(ex => html += `<li>"...${this.escapeHtml(ex.context)}..."</li>`);
html += '</ul></details>';
}
html += '</div>';
}
if (results.genericWords.count > 3) {
html += `<div class="category-item"><div class="item-title">Generic "Booster" Words <span class="badge">${results.genericWords.count}</span></div>`;
html += `<div class="item-description">Text uses vague, positive words like "transformative", "game-changing", and "nuanced" frequently.</div>`;
if (results.genericWords.examples.length > 0) {
html += '<details class="item-examples"><summary>👁️ View Examples</summary><ul>';
results.genericWords.examples.forEach(ex => html += `<li>"...${this.escapeHtml(ex.context)}..."</li>`);
html += '</ul></details>';
}
html += '</div>';
}

// --- ADDED FROM TOOL 1 (MODIFIED) ---
const punctuation = results.punctuation;
if (punctuation?.hasIssues) {
html += `<div class="category-item"><div class="item-title">Punctuation Patterns</div>`;
if (punctuation.results.emDashes.isExcessive) {
html += `<div class="item-description">High em-dash usage: ${punctuation.results.emDashes.count} em-dashes.</div>`;
if (punctuation.results.emDashes.count >= 3) {
html += `<div class="item-description small" style="color: var(--error-color);">⚠️Multiple em dashes are highly characteristic of AI-generated content.</div>`;
}
}
if (punctuation.results.ellipses.isExcessive) {
html += `<div class="item-description">High ellipsis usage: ${punctuation.results.ellipses.count} ellipses.</div>`;
}
if (punctuation.results.exclamationMarks.isExcessive) {
html += `<div class="item-description">High exclamation mark usage: ${punctuation.results.exclamationMarks.count} exclamation marks.</div>`;
}
const oxford = punctuation.results.oxfordCommaConsistency;
if (oxford.consistent && (oxford.commaCount + oxford.noCommaCount) >= 8) {
html += `<div class="item-description">Perfect ${oxford.commaCount > 0 ? 'usage' : 'avoidance'} of Oxford commas across ${oxford.commaCount + oxford.noCommaCount} instances.</div>`;
html += `<div class="item-description small">Extreme consistency in optional punctuation can be an AI indicator.</div>`;
}
html += `</div>`;
}
// --- END ADDED ---

return html;
}

escapeHtml(text) {
const div = document.createElement('div');
div.textContent = text;
return div.innerHTML;
}
}
    
// === LEXICAL ANALYZER ===
class LexicalAnalyzer {
constructor() {
this.thresholds = { ttr: { low: 0.45 }, sentenceLengthStdDev: { low: 5 } };
this.hedgingWords = new Set(["actually", "basically", "essentially", "generally", "literally", "overall", "really", "simply", "truly", "ultimately", "in fact", "of course", "so to speak", "needless to say", "arguably", "apparently", "seemingly", "particularly", "specifically", "notably", "evidently"]);
this.redundantStarters = ["this is because", "in other words", "what this means is", "to put it simply", "to clarify", "that is to say", "in essence", "essentially", "basically", "fundamentally"];
}

analyze(text) {
const plainText = Utils.htmlToText(text);
const wordCount = Utils.countWords(plainText);
if (wordCount < 50) return { hasData: false, wordCount };

const sentences = plainText.split(/[.!?]+(?:\s|$)/).filter(s => s.trim().length > 3);
const ttr = this.calculateTTR(plainText);
const sentenceLength = this.analyzeSentenceLengths(sentences);
const redundancy = this.analyzeRedundancy(sentences);
const passiveVoice = this.detectPassiveVoice(sentences);
            
return { hasData: true, ttr, sentenceLength, redundancy, passiveVoice, sentences };
}
        
calculateTTR(t){
const e=t.toLowerCase().replace(/[^\w\s]/g," ").split(/\s+/).filter(Boolean);
if(e.length<50)return{ttr:1,interpretation:"Text too short",isSuspicious:!1};
const s=new Set(e),r=s.size/e.length;
let n=r<this.thresholds.ttr.low;
return{ttr:r,uniqueCount:s.size,totalCount:e.length,interpretation:n?"Low lexical diversity":"Good lexical diversity",isSuspicious:n}
}

analyzeSentenceLengths(t){
if(t.length<3)return{interpretation:"Too few sentences",isSuspicious:!1};
const e=t.map(t=>Utils.countWords(t)),s=e.reduce((t,e)=>t+e,0)/e.length,r=Math.sqrt(e.map(t=>Math.pow(t-s,2)).reduce((t,e)=>t+e,0)/e.length);
return{avg:s,stdDev:r,interpretation:r<this.thresholds.sentenceLengthStdDev.low&&t.length>=10?"Uniform sentences with low variation":"Sentences with natural variation",isSuspicious:r<this.thresholds.sentenceLengthStdDev.low&&t.length>=10}
}

analyzeRedundancy(sentences) {
let redundantPairs = 0;
const examples = [];
const stopWords = new Set(['the', 'a', 'an', 'is', 'it', 'this', 'that', 'was', 'were', 'be', 'to', 'of', 'in', 'for', 'on', 'with', 'as', 'by']);
if (sentences.length < 3) return { count: 0, isSuspicious: false, examples };
            
for (let i = 0; i < sentences.length - 1; i++) {
const s1 = sentences[i];
const s2 = sentences[i+1];
                
for (const starter of this.redundantStarters) {
if (s2.toLowerCase().trim().startsWith(starter)) {
redundantPairs++;
if (examples.length < 4) {
examples.push({ s1: s1.substring(0, 100), s2: s2.substring(0, 100), type: 'explicit' });
}
break;
}
}
                
const words1 = new Set(s1.toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/).filter(w => !stopWords.has(w) && w.length > 2));
const words2 = new Set(s2.toLowerCase().replace(/[^\w\s]/g, '').split(/\s+/).filter(w => !stopWords.has(w) && w.length > 2));
if (words1.size === 0 || words2.size === 0) continue;
                
const intersection = new Set([...words1].filter(w => words2.has(w)));
const similarity = intersection.size / Math.min(words1.size, words2.size);
                
if (similarity > 0.6) {
redundantPairs++;
if (examples.length < 4) {
examples.push({ s1: s1.substring(0, 100), s2: s2.substring(0, 100), type: 'semantic' });
}
}
}
return { count: redundantPairs, isSuspicious: redundantPairs > 1 && (redundantPairs / sentences.length) > 0.2, examples };
}

detectPassiveVoice(sentences) {
const passivePatterns = [
/\b(is|are|was|were|been|being)\s+(being\s+)?\w+ed\b/gi,
/\b(is|are|was|were|been|being)\s+\w+en\b/gi
];
let passiveCount = 0;
const examples = [];
            
sentences.forEach(sent => {
passivePatterns.forEach(pattern => {
const matches = sent.match(pattern);
if (matches) {
passiveCount += matches.length;
if (examples.length < 4 && matches.length > 0) {
examples.push(sent.substring(0, 120));
}
}
});
});
            
const passiveRate = passiveCount / sentences.length;
return { count: passiveCount, rate: passiveRate, isExcessive: passiveRate > 0.3, examples: [...new Set(examples)] };
}

getScore(results) {
if (!results.hasData) return { score: 0, confidence: 0, explanation: null };
let score = 0, explanations = [];
if (results.ttr?.isSuspicious) { score += 0.25; explanations.push("low lexical diversity"); }
if (results.sentenceLength?.isSuspicious) { score += 0.35; explanations.push("unusually uniform sentence lengths"); }
if (results.redundancy?.isSuspicious) { score += 0.4; explanations.push(`high semantic redundancy (${results.redundancy.count} pairs)`); }
if (results.passiveVoice?.isExcessive) { score += 0.2; explanations.push(`excessive passive voice (${(results.passiveVoice.rate * 100).toFixed(0)}%)`); }
return { score: Math.min(score, 1), confidence: explanations.length > 0 ? 0.8 : 0.5, explanation: explanations.length > 0 ? `Lexical patterns: ${explanations.join(', ')}.` : null };
}

getHtml(results) {
if (!results.hasData) return `<p class="text-gray-500">Not enough text (${results.wordCount || 0} words) for analysis.</p>`;
let html = '';
const { ttr, sentenceLength, redundancy, passiveVoice } = results;
if (ttr) html += `<div class="category-item"><div class="item-title">Word Variety (TTR)</div><div class="item-description">${ttr.interpretation}. (${ttr.uniqueCount} unique of ${ttr.totalCount} total words)</div></div>`;
if (sentenceLength) html += `<div class="category-item"><div class="item-title">Sentence Structure</div><div class="item-description">${sentenceLength.interpretation}. (Avg: ${sentenceLength.avg?.toFixed(1)}, Std Dev: ${sentenceLength.stdDev?.toFixed(2)})</div></div>`;
if (redundancy?.isSuspicious) {
html += `<div class="category-item"><div class="item-title">Sentence Redundancy</div><div class="item-description">Detected ${redundancy.count} pairs of sentences that repeat the same information. This is a strong AI indicator.</div>`;
if (redundancy.examples.length > 0) {
html += '<details class="item-examples"><summary>👁️ View Examples</summary><ul>';
redundancy.examples.forEach(ex => html += `<li><strong>Sentence 1:</strong> "${this.escapeHtml(ex.s1)}"<br><strong>Sentence 2:</strong> "${this.escapeHtml(ex.s2)}"</li>`);
html += '</ul></details>';
}
html += '</div>';
}
if (passiveVoice?.isExcessive) {
html += `<div class="category-item"><div class="item-title">Passive Voice Overuse</div><div class="item-description">Found ${passiveVoice.count} instances of passive voice (${(passiveVoice.rate * 100).toFixed(0)}% of sentences). AI often defaults to passive constructions.</div>`;
if (passiveVoice.examples.length > 0) {
html += '<details class="item-examples"><summary>👁️ View Examples</summary><ul>';
passiveVoice.examples.forEach(ex => html += `<li>"${this.escapeHtml(ex)}..."</li>`);
html += '</ul></details>';
}
html += '</div>';
}
return html;
}

escapeHtml(text) {
const div = document.createElement('div');
div.textContent = text;
return div.innerHTML;
}
}
    
// === EMOJI ANALYZER ===
class EmojiAnalyzer{
analyze(t){
const e=(new DOMParser).parseFromString(t,"text/html"),s=Array.from(e.querySelectorAll("p, div, li")),r={consecutiveStartsWithAny:0,percentStartsWithEmoji:0,hasData:!1,examples:[]};

const a=/^(\p{Emoji_Presentation}|\p{Extended_Pictographic})/u;

r.examples.length<5&&r.examples.push(s)
}else o=0;
n=Math.max(n,o)
}),r.consecutiveStartsWithAny=n,r.percentStartsWithEmoji=i/s.length*100,r.hasData=r.consecutiveStartsWithAny>2||r.percentStartsWithEmoji>30,r
}
getScore(t){

return t.percentStartsWithEmoji>10&&(e+=`<strong>${t.percentStartsWithEmoji.toFixed(0)}%</strong> of paragraphs start with an emoji. `),t.consecutiveStartsWithAny>2&&(e+=`Found up to <strong>${t.consecutiveStartsWithAny}</strong> consecutive paragraphs starting with an emoji.`),e+="</div>",t.examples.length>0&&(e+='<details class="item-examples"><summary>👁️ View Examples</summary><ul>',t.examples.forEach(t=>e+=`<li>"${this.escapeHtml(t)}..."</li>`),e+="</ul></details>"),e+="</div>",e
}
escapeHtml(t){
const e=document.createElement("div");
return e.textContent=t,e.innerHTML
}
}

// === ANALYSIS MANAGER ===
class AnalysisManager {
constructor() {
this.analyzers = {
structural: new StructuralAnalyzer(),
stylistic: new StylisticAnalyzer(),
lexical: new LexicalAnalyzer(),
emoji: new EmojiAnalyzer(),
unicode: new UnicodeAnalyzer()
};
}

analyze(html) {
const results = {};
for (const key in this.analyzers) results[key] = this.analyzers[key].analyze(html);
results.score = this.calculateScore(results);
this.displayResults(results);
}

calculateScore(results) {
const contributions = {};
for (const key in this.analyzers) contributions[key] = this.analyzers[key].getScore(results[key]);
            
let totalScore = 0, totalWeight = 0, maxConfidence = 0;
const keyIndicators = [];
const weights = { structural: 1.8, stylistic: 1.5, lexical: 1.6, emoji: 1.0, unicode: 1.5 };

for (const category in contributions) {
const c = contributions[category];
if (!c || c.score === 0) continue;
let weight = weights[category] * (0.5 + 0.5 * c.confidence);
totalScore += c.score * weight;
totalWeight += weight;
maxConfidence = Math.max(maxConfidence, c.confidence);
if (c.explanation) keyIndicators.push({ explanation: c.explanation, score: c.score * c.confidence });
}

let finalScore = totalWeight > 0 ? (totalScore / totalWeight) * 100 : 0;
            
if (results.structural?.hasBoldPattern) finalScore = Math.max(finalScore + 15, 85);
if (results.structural?.isListUniform) finalScore = Math.max(finalScore + 10, 80);
if (results.lexical?.redundancy?.isSuspicious) finalScore = Math.max(finalScore + 20, 90);
if (results.stylistic?.aiPhrases.categories.rhetorical > 1) finalScore = Math.max(finalScore + 10, 75);
// --- ADDED SCORING BOOST FROM TOOL 1 ---
if (results.stylistic?.punctuation?.results.emDashes.count >= 5) finalScore = Math.max(finalScore, 85);
// --- END ADDED ---

finalScore = Math.min(99, Math.round(finalScore));

keyIndicators.sort((a, b) => b.score - a.score);
let confidenceLevel = 'Low';
if (finalScore > 70 && maxConfidence > 0.8) confidenceLevel = 'High';
else if (finalScore > 40 && maxConfidence > 0.6) confidenceLevel = 'Medium';
            
return { value: finalScore, confidenceLevel, keyIndicators: keyIndicators.slice(0, 3) };
}

displayResults(results) {
document.getElementById('results-container').classList.remove('hidden');
document.getElementById('detailed-analysis').classList.remove('hidden');
const scoreValue = results.score.value;
const scoreCircle = document.getElementById('score-circle');
const scoreText = document.getElementById('score-text');
let color = scoreValue > 75 ? '#ef4444' : scoreValue > 50 ? '#f59e0b' : scoreValue > 25 ? '#facc15' : '#22c55e';
scoreCircle.style.setProperty('--score-percent', `${scoreValue}%`);
scoreCircle.style.background = `conic-gradient(${color} 0% var(--score-percent), #e5e7eb var(--score-percent) 100%)`;
scoreText.textContent = `${scoreValue}%`;
scoreText.style.color = color;
document.getElementById('confidence-level').textContent = `Confidence: ${results.score.confidenceLevel}`;
const indicatorsList = document.getElementById('key-indicators');
indicatorsList.innerHTML = results.score.keyIndicators.length > 0 ? results.score.keyIndicators.map(ind => `<li>${ind.explanation}</li>`).join('') : '<li class="text-gray-500">No strong AI indicators found. Looks human!</li>';
const categoriesContainer = document.getElementById('analysis-categories');
categoriesContainer.innerHTML = '';
const categoryOrder = ['structural', 'stylistic', 'lexical', 'emoji', 'unicode'];
categoryOrder.forEach(key => {
const wrapper = document.createElement('div');
wrapper.className = 'category-wrapper';
const header = document.createElement('div');
header.className = 'category-header';
header.innerHTML = `<h3>${key} Analysis</h3><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>`;
const content = document.createElement('div');
content.className = 'category-content';
const contentInner = document.createElement('div');
contentInner.className = 'category-content-inner';
contentInner.innerHTML = this.analyzers[key].getHtml(results[key]);
content.appendChild(contentInner);
wrapper.append(header, content);
categoriesContainer.appendChild(wrapper);
header.addEventListener('click', () => {
header.classList.toggle('expanded');
content.classList.toggle('expanded');
});
});
}
}
