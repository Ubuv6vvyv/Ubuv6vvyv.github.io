<!doctype html><html lang=en><meta charset=UTF-8><meta content="width=device-width,initial-scale=1"name=viewport><title>AI Content Detector v4.0</title><script src=https://cdn.tailwindcss.com></script><link href="https://fonts.googleapis.com/css2?family=Sansation:wght@300;400;700&display=swap"rel=stylesheet><style>:root{--bg:#f9f9f9;--text:#2d2d2d;--border:#2d6765;--primary:#000;--secondary:#fff;--highlight:#f0f0f0;--error:#c0392b}body{font-family:Sansation,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}.editor{min-height:250px;border:2px solid var(--border);padding:1.5rem;background:#fff;border-radius:8px}.editor:focus{outline:0;box-shadow:0 0 0 3px rgba(45,103,101,.2)}.score-circle{width:140px;height:140px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--score-color,#ccc)0 var(--score-percent,0),#e5e7eb 0 100%);transition:all 1s ease;position:relative}.score-circle::before{content:'';position:absolute;width:110px;height:110px;background:#fff;border-radius:50%}.score-circle span{position:relative;z-index:1}.category-header{cursor:pointer;user-select:none}.category-content{max-height:0;overflow:hidden;transition:max-height .4s ease}.category-content.open{max-height:5000px}.hidden{display:none}.badge{font-size:.7rem;padding:2px 6px;border-radius:4px;background:#eee;border:1px solid#ccc}.weight-badge{font-size:.65rem;padding:1px 4px;border-radius:3px;background:#fee;border:1px solid#faa;color:#c00;font-weight:700}.pulse{animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}</style><div class="max-w-4xl mx-auto p-4 sm:p-8"><header class="mb-10 text-center"><h1 class="font-bold mb-2 text-2xl sm:text-3xl">🤖 AI Content Detector v4.0</h1><p class="text-gray-600 text-sm sm:text-base">Deep Stylometry • Emoji Forensics • Weighted Probability • Structural Rigidity</header><div class="border bg-white shadow-lg p-4 sm:p-6 border-[var(--border)]mb-8 rounded-lg"><div class=editor id=editor contenteditable=true placeholder="Paste text here..."></div><div class="flex gap-3 justify-end mt-4 flex-wrap"><button class="border border-gray-300 hover:bg-gray-100 px-4 sm:px-6 py-2 text-sm transition rounded"id=clear-btn>Clear</button> <button class="text-sm px-4 sm:px-6 py-2 transition bg-black disabled:opacity-50 hover:bg-gray-800 text-white rounded"id=analyze-btn disabled>Analyze</button></div></div><div class="hidden space-y-6"id=results-area><div class="border bg-white shadow-lg border-gray-200 flex flex-col items-center p-6 text-center rounded-lg"><h2 class="font-bold mb-6 text-xl">Analysis Summary</h2><div class="mb-4 score-circle"id=score-circle><span class="font-bold text-4xl"id=score-text>0%</span></div><p class="text-sm mb-2 text-gray-500 tracking-widest uppercase"id=confidence-text>Confidence: Calculating...</p><p class="text-xs text-gray-400 mb-6"id=threshold-text></p><ul class="text-sm bg-gray-50 p-4 rounded space-y-2 text-left w-full"id=key-indicators></ul></div><div class="border bg-white shadow-lg border-gray-200 rounded-lg"id=modules-container></div></div></div><script>const PatternConfig={thresholds:{minWords:15,human:30,mixed:65,ai:100},weights:{critical:5,high:3,medium:2,low:1},gptLexicon:["delve","tapestry","nuance","testament","underscores","multifaceted","landscape","democratize","leveraging","realm","facet","paramount","pivotal","cornerstone","intricate","robust","framework","paradigm","holistic","comprehensive","facilitate","optimize","streamline","synergy","proactive","scalable","disruptive","cutting-edge","game-changer","revolutionary","transformative","innovative","dynamic","seamless","versatile","ecosystem","utilize","harness","elucidate","ascertain","endeavor","foster","cultivate","exemplify","epitomize","underscore","highlight","showcase","unveil","unpack","dissect","navigate","traverse","embark","venture","explore","delve into","dive into","in-depth","thoroughly","extensively","meticulously","diligently","notably","remarkably","undeniably","inherently","fundamentally","essentially","ultimately","consequently","accordingly","nevertheless","nonetheless","furthermore","moreover","additionally","conversely","alternatively","juxtapose"],transitionOverload:["It is important to note","In conclusion","Conversely","Furthermore","To summarize","That being said","With that in mind","On the other hand","It should be noted that","As previously mentioned","In light of this","Taking this into account","Given the above","In this context","From this perspective","To put it another way","In other words","To clarify","To elaborate","To expand on this","Building on this","Following from this","In addition to this","Along these lines","Similarly","Likewise","By the same token","In the same vein","Correspondingly","By contrast","In contrast","On the contrary","Despite this","In spite of this","Regardless of this","Notwithstanding","At the same time","Simultaneously","Concurrently","Meanwhile","In the meantime","Subsequently","Consequently","As a result","Therefore","Thus","Hence","Accordingly","For this reason","To this end","With this in mind","Bearing this in mind","Given these points","In summary","To sum up","All things considered","On balance","Ultimately","In the final analysis","At the end of the day"],refusalHeaders:["As an AI language model","I cannot fulfill","It is ethically important","I don't have personal opinions","I'm not able to","I cannot provide","I'm unable to","I don't have the ability","As an AI assistant","As a large language model","My purpose is to","I strive to","My knowledge cutoff","I don't have access to real-time","I cannot generate","I'm not capable of","I must decline","I cannot assist with","I'm programmed to","I am designed to","It would be inappropriate for me to","I cannot engage in","I don't have personal experiences","I lack the capacity to","I'm not authorized to","I cannot make","I'm not qualified to","I don't possess"],corporateEmojis:["✨","🚀","💡","🤖","🧠","🎯","⚡", {name:"Emoji Analysis",score:0,matches:[],summary:"No emojis detected."};let n=0;let a=0;let s=0;const i=Utils.splitSentences(this.text);i.forEach(e=>{PatternConfig.emojiPatterns.endOnly.test(e)&&n++;PatternConfig.emojiPatterns.midSentence.test(e)&&a++;PatternConfig.emojiPatterns.standalone.test(e)&&s++});const r=n/(i.length||1);if(r>.3){e.add(25,"high");t.push({type:"Placement",value:`${(100*r).toFixed(0)}% end-only`,context:"AI places emojis at sentence ends",weight:"high"})}if(0===a&&n>2){e.add(20,"medium");t.push({type:"Placement",value:"Zero mid-sentence",context:"Humans use emojis mid-sentence",weight:"medium"})}let o=0;this.emojis.forEach(e=>{PatternConfig.corporateEmojis.includes(e)&&o++});if(o/this.emojis.length>.5){e.add(20,"medium");t.push({type:"Type",value:`${o}/${this.emojis.length} corporate`,context:"✨🚀💡 = AI helpful tone",weight:"medium"})}return{name:"Emoji Analysis",score:e.getScore(),matches:t,summary:t.length?`${this.emojis.length} emojis analyzed`:"Emoji usage appears natural",details:e.getDetails()}}}class StructuralRigidityAnalyzer{constructor(e){this.text=e;this.wordCount=Utils.countWords(e)}analyze(){const e=new WeightedScorer;const t=[];const n=(this.text.match(PatternConfig.structural.bulletDensity)||[]).length;const a=n/this.wordCount;if(a>.3){e.add(30,"high");t.push({type:"Bullets",value:`${(100*a).toFixed(0)}% density`,context:"AI loves lists >30%",weight:"high"})}const s=(this.text.match(PatternConfig.punctuation.oxfordComma)||[]).length;const i=(this.text.match(PatternConfig.punctuation.noOxford)||[]).length;const r=s+i;if(r>=5&&(s>0&&0===i||0===s&&i>0)){e.add(25,"critical");t.push({type:"Oxford Comma",value:s>0?"Always uses":"Never uses",context:"100% consistency = robot",weight:"critical"})}const o=(this.text.match(PatternConfig.structural.markdownBold)||[]).length;const l=(this.text.match(PatternConfig.structural.boldColon)||[]).length;if(l>2){e.add(35,"critical");t.push({type:"Markdown",value:`${l} bold:definitions`,context:"**Term:** = GPT teaching pattern",weight:"critical"})}if(o>5&&l>2){e.add(15,"medium");t.push({type:"Markdown",value:`${o} markdown artifacts`,context:"Unparsed formatting",weight:"medium"})}return{name:"Structural Rigidity",score:e.getScore(),matches:t,summary:t.length?`${t.length} rigidity indicators`:"Structure appears organic",details:e.getDetails()}}}class PunctuationVectorAnalyzer{constructor(e){this.text=e}analyze(){const e=new WeightedScorer;const t=[];const n=(this.text.match(PatternConfig.punctuation.emDash)||[]).length;const a=(this.text.match(PatternConfig.punctuation.doubleDash)||[]).length;if(n>3&&0===a){e.add(20,"medium");t.push({type:"Em-Dash",value:`${n} proper em-dashes`,context:"Humans use -- not —",weight:"medium"})}const s=(this.text.match(PatternConfig.punctuation.parenOpen)||[]).length;const i=(this.text.match(PatternConfig.punctuation.parenClose)||[]).length;if(s===i&&s>3){e.add(15,"low");t.push({type:"Parentheses",value:`${s}/${i} perfect match`,context:"AI never misses closing parens",weight:"low"})}const r=(this.text.match(PatternConfig.punctuation.quoteOpen)||[]).length;const o=(this.text.match(PatternConfig.punctuation.quoteClose)||[]).length;if(r===o&&r>3){e.add(15,"low");t.push({type:"Quotes",value:`${r}/${o} perfect match`,context:"AI balances quotes perfectly",weight:"low"})}return{name:"Punctuation Vectors",score:e.getScore(),matches:t,summary:t.length?`${t.length} precision indicators`:"Natural punctuation variance",details:e.getDetails()}}}class GPTLexiconAnalyzer{constructor(e){this.text=e.toLowerCase();this.wordCount=Utils.countWords(e)}analyze(){const e=new WeightedScorer;const t=[];let n=0;PatternConfig.gptLexicon.forEach(e=>{const a=new RegExp(`\\b${e}\\b`,"gi");const s=(this.text.match(a)||[]).length;if(s>0){n+=s;if(s>1){t.push({type:"GPT Lexicon",value:e,context:"RLHF over-represented",count:s,weight:"high"})}}});const a=n/this.wordCount;if(a>.03){e.add(40,"critical");t.push({type:"Density",value:`${(100*a).toFixed(1)}% GPT words`,context:"Critical threshold exceeded",weight:"critical"})}else if(a>.015&&a<=.03){e.add(25,"high");t.push({type:"Density",value:`${(100*a).toFixed(1)}% GPT words`,context:"High RLHF vocabulary",weight:"high"})}return{name:"GPT Lexicon Analysis",score:e.getScore(),matches:t.slice(0,10),summary:`${n} RLHF-trained words detected`,details:e.getDetails()}}}class TransitionOverloadAnalyzer{constructor(e){this.text=e}analyze(){const e=new WeightedScorer;const t=[];let n=0;PatternConfig.transitionOverload.forEach(e=>{if(new RegExp(e,"gi").test(this.text)){n++;if(n<=8){t.push({type:"Transition",value:e,context:"Forced coherence marker",weight:"medium"})}}});if(n>5){e.add(30,"high");t.push({type:"Overload",value:`${n} transition phrases`,context:"AI overuses meta-commentary",weight:"high"})}return{name:"Transition Overload",score:e.getScore(),matches:t,summary:n>5?`${n} excessive transitions`:"Natural flow",details:e.getDetails()}}}class RefusalHeaderAnalyzer{constructor(e){this.text=e}analyze(){const e=new WeightedScorer;const t=[];let n=0;PatternConfig.refusalHeaders.forEach(e=>{if(new RegExp(e,"i").test(this.text)){n++;t.push({type:"AI Header",value:e,context:"100% AI signature",weight:"critical"})}});if(n>0){e.add(95,"critical")}return{name:"AI Signature Detection",score:e.getScore(),matches:t,summary:n>0?"DEFINITIVE AI MARKER FOUND":"No AI signatures",details:e.getDetails()}}}class BurstinessAnalyzer{constructor(e){this.text=e}analyze(){const e=Utils.splitSentences(this.text);if(e.length<5){return{name:"Human Burstiness",score:0,matches:[],summary:"Insufficient data"}}const t=e.map(e=>e.split(/\s+/).length);const n=Utils.calculateStdDev(t);const a=t.reduce((e,t)=>e+t,0)/t.length;const s=n/a;let i=0;const r=[];if(s>.6){i=-25;r.push({type:"Burstiness",value:`CV: ${s.toFixed(2)}`,context:"High variance = human chaos",weight:"bonus"})}else if(s<.3){i=20;r.push({type:"Monotony",value:`CV: ${s.toFixed(2)}`,context:"Low variance = AI uniformity",weight:"high"})}return{name:"Human Burstiness Factor",score:i,matches:r,summary:i<0?"HUMAN chaos detected":"Mechanical uniformity",isBonus:i<0,details:{coefficientOfVariation:s,sentenceCount:e.length}}}}class ResultRenderer{constructor(){this.container=document.getElementById("modules-container");this.scoreCircle=document.getElementById("score-circle");this.scoreText=document.getElementById("score-text");this.keyIndicators=document.getElementById("key-indicators")}updateTotalScore(e,t){this.scoreText.innerText=`${e}%`;let n="#22c55e";let a="Likely Human";if(e>PatternConfig.thresholds.mixed){n="#f59e0b";a="Mixed/Edited"}else if(e>PatternConfig.thresholds.human){n="#ef4444";a="Likely AI"}this.scoreCircle.style.setProperty("--score-percent",`${e}%`);this.scoreCircle.style.setProperty("--score-color",n);this.scoreText.style.color=n;document.getElementById("confidence-text").innerText=a;document.getElementById("threshold-text").innerText=`Weighted Score: ${e}% | Findings: ${t}`}renderModule(e){if(0===e.score&&0===e.matches.length)return;const t=document.createElement("div");t.className="border-b border-gray-200 last:border-0";const n=e.matches.slice(0,15).map(e=>{const t="critical"===e.weight?"weight-badge":"";if("bonus"===e.weight){e.weight="✓"}const n=e.count>1?`<span class="badge">×${e.count}</span>`:"";return`<li class="text-sm text-gray-600 mb-2 flex justify-between border-b border-gray-100 pb-2 last:border-0 flex-wrap gap-2">\n                <span class="flex-1"><span class="font-semibold ${e.score<0?"text-green-600":"text-red-500"}">"${Utils.escapeHtml(String(e.value))}"</span> ${n}</span>\n                <span class="text-xs bg-gray-100 px-2 py-1 rounded text-gray-500">${e.context} <span class="${t}">${e.weight}</span></span>\n            </li>`}).join("");t.innerHTML=`\n            <div class="category-header p-4 bg-gradient-to-r ${e.score<0?"from-green-50 to-white hover:from-green-100":"from-gray-50 to-white hover:from-gray-100"} flex justify-between items-center transition"onclick="this.nextElementSibling.classList.toggle('open')">\n                <div class="flex items-center gap-3 flex-1">\n                    <div class="w-2 h-8 ${e.score>50?"bg-red-500":e.score<0?"bg-green-500":"bg-yellow-500"} rounded"></div>\n                    <div class="flex-1">\n                        <h3 class="font-bold text-gray-700 text-sm sm:text-base">${e.name}</h3>\n                        <p class="text-xs text-gray-400">${e.matches.length} ${e.isBonus?"bonuses":"issues"}</p>\n                    </div>\n                </div>\n                <span class="text-sm font-bold ${e.score<0?"text-green-600":"text-gray-600"} bg-white px-3 py-1 rounded border border-gray-200">${e.score>0?"+":""}${Math.round(e.score)}</span>\n            </div>\n            <div class="category-content px-4 sm:px-6 bg-white">\n                <div class="py-4">\n                    <p class="text-sm text-gray-500 italic mb-3 border-l-4 ${e.score<0?"border-green-300":"border-gray-300"} pl-2">${e.summary}</p>\n                    <ul class="list-none">${n}</ul>\n                </div>\n            </div>\n        `;this.container.appendChild(t);if(Math.abs(e.score)>15||e.matches.some(e=>"critical"===e.weight)){this.addKeyIndicator(e)}}addKeyIndicator(e){const t=document.createElement("li");t.className=`border-l-4 ${e.score<0?"border-green-400 bg-green-50":"border-red-400 bg-red-50"} pl-3 py-2 text-sm`;t.innerHTML=`<strong>${e.name}:</strong> ${e.summary}`;this.keyIndicators.appendChild(t)}clear(){this.container.innerHTML="";this.keyIndicators.innerHTML="";document.getElementById("results-area").classList.add("hidden")}show(){document.getElementById("results-area").classList.remove("hidden")}}class App{constructor(){this.editor=document.getElementById("editor");this.analyzeBtn=document.getElementById("analyze-btn");this.clearBtn=document.getElementById("clear-btn");this.renderer=new ResultRenderer;this.bindEvents()}bindEvents(){this.editor.addEventListener("input",()=>{const e=Utils.countWords(this.editor.innerText);this.analyzeBtn.disabled=e<PatternConfig.thresholds.minWords});this.clearBtn.addEventListener("click",()=>{this.editor.innerHTML="";this.renderer.clear();this.analyzeBtn.disabled=true});this.analyzeBtn.addEventListener("click",()=>this.runAnalysis())}runAnalysis(){this.renderer.clear();const e=this.editor.innerText;const t=[new GPTLexiconAnalyzer(e),new TransitionOverloadAnalyzer(e),new RefusalHeaderAnalyzer(e),new EmojiAnalyzer(e),new StructuralRigidityAnalyzer(e),new PunctuationVectorAnalyzer(e),new BurstinessAnalyzer(e)];const n=t.map(e=>e.analyze());const a=new WeightedScorer;let s=0;n.forEach(e=>{this.renderer.renderModule(e);if(e.details&&e.details.totalWeight>0){a.add(e.score,e.details.totalWeight>3?"high":"medium")}s++});let i=a.getScore();i=Math.max(0,Math.min(100,Math.round(i)));const r=n.reduce((e,t)=>e+t.matches.length,0);this.renderer.updateTotalScore(i,r);this.renderer.show()}}document.addEventListener("DOMContentLoaded",()=>new App)</script></html>
