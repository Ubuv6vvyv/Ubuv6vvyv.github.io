<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Enhanced Image to 3D Converter</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background: #121212;
                color: #eee;
                overflow: hidden;
                touch-action: none;
            }

            #container {
                position: fixed;
                width: 100%;
                height: 100%;
            }

            #ui {
                position: absolute;
                bottom: 5px;
                left: 5px;
                background: rgba(0, 0, 0, 0.7);
                padding: 8px;
                z-index: 10;
                font-size: 10px;
                border-radius: 3px;
                width: 400px;
                transition: transform 0.3s ease;
            }

            #toggleArrow {
                position: absolute;
                left: 0;
                top: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 0, 0, 0.7);
                color: #eee;
                padding: 4px 6px;
                border-radius: 50%;
                font-size: 12px;
                cursor: pointer;
                z-index: 11;
                display: none;
            }

            #upload {
                position: absolute;
                top: 5px;
                left: 5px;
                z-index: 10;
                font-size: 10px;
            }

            .slider-container {
                margin: 4px 0;
                display: flex;
                align-items: center;
            }

            .slider-container label {
                width: 70px;
            }

            .slider-container input {
                flex: 1;
                margin-right: 4px;
            }

            .slider-container span {
                width: 30px;
                text-align: right;
            }

            .toggle-container {
                display: flex;
                align-items: center;
                margin: 4px 0;
            }

            .toggle-container label {
                margin-right: 4px;
            }

            #loading {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 14px;
                background: rgba(0, 0, 0, 0.7);
                padding: 10px;
                border-radius: 5px;
                display: none;
                z-index: 20;
            }

            button {
                background: #4e4eff;
                color: #fff;
                border: none;
                padding: 4px 8px;
                border-radius: 3px;
                cursor: pointer;
                margin-right: 4px;
                font-size: 10px;
            }

            button:active {
                background: #3030cc;
            }

            input[type="file"] {
                display: none;
            }

            .file-label {
                display: inline-block;
                background: #4e4eff;
                color: #fff;
                padding: 4px 8px;
                border-radius: 3px;
                cursor: pointer;
                margin-right: 4px;
                font-size: 10px;
            }

            .preset-btn {
                background: #333;
                margin-bottom: 4px;
                width: calc(33.33% - 3px);
            }

            .preset-btn.active {
                background: #4e4eff;
            }

            #presets {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                margin-bottom: 4px;
            }

            #histogramCanvas {
                width: 100%;
                height: 40px;
                background: #000;
                margin: 4px 0;
                border-radius: 2px;
            }

            @media (max-width:600px) {
                #ui {
                    max-height: 30vh;
                    overflow-y: auto;
                }
            }
        </style>
    </head>
    <body>
        <div id="container"></div>
        <div id="toggleArrow">&#9664;</div>
        <div id="upload">
            <label class="file-label" for="imageInput">Select Image</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        <div id="ui">
            <div id="presets">
                <button class="preset-btn" data-preset="portrait">Portrait</button>
                <button class="preset-btn" data-preset="landscape">Landscape</button>
                <button class="preset-btn" data-preset="product">Product</button>
            </div>
            <canvas id="histogramCanvas"></canvas>
            <div class="slider-container">
                <label for="depthStrength">Depth:</label>
                <input type="range" id="depthStrength" min="0" max="20" value="5" step="0.1">
                <span id="depthStrengthValue">5.0</span>
            </div>
            <div class="slider-container">
                <label for="smoothing">Smooth:</label>
                <input type="range" id="smoothing" min="0" max="5" value="1" step="0.1">
                <span id="smoothingValue">1.0</span>
            </div>
            <div class="slider-container">
                <label for="vertexDetail">Detail:</label>
                <input type="range" id="vertexDetail" min="10" max="200" value="50" step="1">
                <span id="vertexDetailValue">50</span>
            </div>
            <div class="slider-container">
                <label for="brightnessThreshold">Thresh:</label>
                <input type="range" id="brightnessThreshold" min="0" max="1" value="0.5" step="0.01">
                <span id="brightnessThresholdValue">0.50</span>
            </div>
            <div class="slider-container">
                <label for="normalStrength">Normals:</label>
                <input type="range" id="normalStrength" min="0" max="1" value="0.5" step="0.01">
                <span id="normalStrengthValue">0.50</span>
            </div>
            <div class="slider-container">
                <label for="edgePreserve">Edge Pres:</label>
                <input type="range" id="edgePreserve" min="0" max="1" value="0.5" step="0.01">
                <span id="edgePreserveValue">0.50</span>
            </div>
            <div class="toggle-container">
                <label for="depthAlgo">Depth:</label>
                <select id="depthAlgo">
                    <option value="brightness">Brightness</option>
                    <option value="laplacian">Edge Detection</option>
                    <option value="hybrid" selected>Hybrid</option>
                </select>
            </div>
            <div class="toggle-container">
                <label for="wireframe">Wire:</label>
                <input type="checkbox" id="wireframe">
            </div>
            <div class="toggle-container">
                <label for="sideToggle">Sides:</label>
                <input type="checkbox" id="sideToggle" checked>
            </div>
            <div class="toggle-container">
                <label for="normalMap">Normal Map:</label>
                <input type="checkbox" id="normalMap" checked>
            </div>
            <div class="toggle-container">
                <label for="bgInvert">Invert BG:</label>
                <input type="checkbox" id="bgInvert">
            </div>
            <div class="toggle-container">
                <button id="saveButton">Save PNG</button>
                <button id="resetCamera">Reset</button>
                <button id="toggleUI">Hide UI</button>
            </div>
        </div>
        <div id="loading">Processing image...</div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <script>
            // Global variables and controls
            let scene, camera, renderer, modelGroup, controls = {
                    depthStrength: 5.0,
                    smoothing: 1.0,
                    vertexDetail: 50,
                    brightnessThreshold: 0.5,
                    normalStrength: 0.5,
                    edgePreserve: 0.5,
                    depthAlgo: 'hybrid',
                    wireframe: false,
                    normalMap: true
                },
                origData, processing = false,
                isRotating = true;
            // References for side panel meshes for toggle
            let sideMeshes = {
                top: null,
                bottom: null,
                left: null,
                right: null
            };
            // Invert background flag
            let invertBG = false;
            // For depth processing
            let depthData = null;
            // For normal map generation
            let normalMapTexture = null;

            // Utility: Smoothstep function for smooth transitions
            function smoothStep(edge0, edge1, x) {
                let t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
                return t * t * (3 - 2 * t);
            }

            init();

            function init() {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x121212);
                camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
                camera.position.z = 5;
                renderer = new THREE.WebGLRenderer({
                    antialias: true
                });
                renderer.setSize(innerWidth, innerHeight);
                renderer.setPixelRatio(devicePixelRatio);
                document.getElementById("container").appendChild(renderer.domElement);
                scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                let dl = new THREE.DirectionalLight(0xffffff, 1);
                dl.position.set(1, 1, 1);
                scene.add(dl);
                modelGroup = new THREE.Group();
                scene.add(modelGroup);
                setListeners();
                animate();
            }

            function animate() {
                requestAnimationFrame(animate);
                if (modelGroup && isRotating) modelGroup.rotation.y += 0.005;
                renderer.render(scene, camera);
            }

            function setListeners() {
                window.addEventListener("resize", () => {
                    camera.aspect = innerWidth / innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(innerWidth, innerHeight);
                });
                document.getElementById("imageInput").addEventListener("change", handleUpload);
                // Add preset button handlers
                document.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        applyPreset(this.dataset.preset);
                    });
                });
                ["depthStrength", "smoothing", "vertexDetail", "brightnessThreshold", "normalStrength", "edgePreserve"].forEach(id => {
                    document.getElementById(id).addEventListener("input", e => {
                        controls[id] = id === "vertexDetail" ? parseInt(e.target.value) : parseFloat(e.target.value);
                        document.getElementById(id + "Value").textContent = controls[id].toFixed(id === "vertexDetail" ? 0 : 2);
                        if (origData) buildModel(origData);
                    });
                });
                document.getElementById("depthAlgo").addEventListener("change", e => {
                    controls.depthAlgo = e.target.value;
                    if (origData) buildModel(origData);
                });
                document.getElementById("wireframe").addEventListener("change", e => {
                    controls.wireframe = e.target.checked;
                    updateWireframe();
                });
                document.getElementById("normalMap").addEventListener("change", e => {
                    controls.normalMap = e.target.checked;
                    if (origData) buildModel(origData);
                });
                document.getElementById("sideToggle").addEventListener("change", e => {
                    updateSideVisibility();
                });
                document.getElementById("bgInvert").addEventListener("change", e => {
                    invertBG = e.target.checked;
                    scene.background = new THREE.Color(invertBG ? 0xffffff : 0x121212);
                });
                document.getElementById("saveButton").addEventListener("click", savePNG);
                document.getElementById("resetCamera").addEventListener("click", resetCam);
                document.getElementById("toggleUI").addEventListener("click", toggleUI);
                // Also allow the arrow toggle to bring UI back
                document.getElementById("toggleArrow").addEventListener("click", showUI);
                const cont = document.getElementById("container");
                let drag = false,
                    prevX = 0,
                    prevY = 0,
                    pinch = 0;
                cont.addEventListener("mousedown", e => {
                    drag = true;
                    prevX = e.clientX;
                    prevY = e.clientY;
                    isRotating = false;
                });
                window.addEventListener("mousemove", e => {
                    if (drag) {
                        modelGroup.rotation.y += (e.clientX - prevX) * 0.01;
                        modelGroup.rotation.x += (e.clientY - prevY) * 0.01;
                        prevX = e.clientX;
                        prevY = e.clientY;
                    }
                });
                window.addEventListener("mouseup", () => {
                    drag = false;
                });
                cont.addEventListener("wheel", e => {
                    e.preventDefault();
                    camera.position.z = Math.max(1, Math.min(10, camera.position.z + e.deltaY * 0.01));
                });
                cont.addEventListener("touchstart", onTouchStart);
                cont.addEventListener("touchmove", onTouchMove);
                cont.addEventListener("touchend", onTouchEnd);
            }

            function applyPreset(preset) {
                switch (preset) {
                    case 'portrait':
                        controls.depthStrength = 3.0;
                        controls.smoothing = 2.0;
                        controls.vertexDetail = 100;
                        controls.brightnessThreshold = 0.4;
                        controls.normalStrength = 0.6;
                        controls.edgePreserve = 0.7;
                        controls.depthAlgo = 'hybrid';
                        break;
                    case 'landscape':
                        controls.depthStrength = 7.0;
                        controls.smoothing = 1.5;
                        controls.vertexDetail = 150;
                        controls.brightnessThreshold = 0.3;
                        controls.normalStrength = 0.8;
                        controls.edgePreserve = 0.3;
                        controls.depthAlgo = 'brightness';
                        break;
                    case 'product':
                        controls.depthStrength = 6.0;
                        controls.smoothing = 0.5;
                        controls.vertexDetail = 120;
                        controls.brightnessThreshold = 0.5;
                        controls.normalStrength = 0.7;
                        controls.edgePreserve = 0.9;
                        controls.depthAlgo = 'laplacian';
                        break;
                }
                // Update UI
                ["depthStrength", "smoothing", "vertexDetail", "brightnessThreshold", "normalStrength", "edgePreserve"].forEach(id => {
                    document.getElementById(id).value = controls[id];
                    document.getElementById(id + "Value").textContent = controls[id].toFixed(id === "vertexDetail" ? 0 : 2);
                });
                document.getElementById("depthAlgo").value = controls.depthAlgo;
                if (origData) buildModel(origData);
            }

            function onTouchStart(e) {
                isRotating = false;
                if (e.touches.length === 1) {
                    this.drag = true;
                    prevX = e.touches[0].clientX;
                    prevY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    let dx = e.touches[0].clientX - e.touches[1].clientX,
                        dy = e.touches[0].clientY - e.touches[1].clientY;
                    pinch = Math.hypot(dx, dy);
                    prevX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    prevY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                }
            }

            function onTouchMove(e) {
                e.preventDefault();
                if (!modelGroup) return;
                if (e.touches.length === 1) {
                    modelGroup.rotation.y += (e.touches[0].clientX - prevX) * 0.01;
                    modelGroup.rotation.x += (e.touches[0].clientY - prevY) * 0.01;
                    prevX = e.touches[0].clientX;
                    prevY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    let dx = e.touches[0].clientX - e.touches[1].clientX,
                        dy = e.touches[0].clientY - e.touches[1].clientY,
                        curPinch = Math.hypot(dx, dy),
                        delta = curPinch - pinch;
                    camera.position.z = Math.max(1, Math.min(10, camera.position.z - delta * 0.01));
                    pinch = curPinch;
                    let cx = (e.touches[0].clientX + e.touches[1].clientX) / 2,
                        cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    modelGroup.rotation.y += (cx - prevX) * 0.01;
                    modelGroup.rotation.x += (cy - prevY) * 0.01;
                    prevX = cx;
                    prevY = cy;
                }
            }

            function onTouchEnd(e) {}

            function resetCam() {
                camera.position.set(0, 0, 5);
                camera.lookAt(0, 0, 0);
                modelGroup.rotation.set(0, 0, 0);
            }

            function toggleUI() {
                let ui = document.getElementById("ui"),
                    arrow = document.getElementById("toggleArrow"),
                    btn = document.getElementById("toggleUI");
                if (ui.style.transform === "translateY(100%)") {
                    ui.style.transform = "translateY(0)";
                    btn.textContent = "Hide UI";
                    arrow.style.display = "none";
                } else {
                    ui.style.transform = "translateY(100%)";
                    btn.textContent = "Show UI";
                    arrow.style.display = "block";
                }
            }

            function showUI() {
                let ui = document.getElementById("ui"),
                    btn = document.getElementById("toggleUI"),
                    arrow = document.getElementById("toggleArrow");
                ui.style.transform = "translateY(0)";
                btn.textContent = "Hide UI";
                arrow.style.display = "none";
            }

            function handleUpload(e) {
                let f = e.target.files[0];
                if (!f) return;
                let r = new FileReader();
                r.onload = function(ev) {
                    let img = new Image();
                    img.onload = function() {
                        // Scale down high resolution images for faster processing
                        const maxDim = 1024; // Maximum dimension allowed
                        let scaleFactor = 1;
                        if (img.width > maxDim || img.height > maxDim) {
                            scaleFactor = maxDim / Math.max(img.width, img.height);
                        }
                        let cv = document.createElement("canvas");
                        cv.width = Math.floor(img.width * scaleFactor);
                        cv.height = Math.floor(img.height * scaleFactor);
                        let ctx = cv.getContext("2d");
                        ctx.clearRect(0, 0, cv.width, cv.height);
                        ctx.drawImage(img, 0, 0, cv.width, cv.height);
                        // Use the scaled down image data for processing
                        origData = {
                            data: ctx.getImageData(0, 0, cv.width, cv.height),
                            width: cv.width,
                            height: cv.height,
                            img: cv
                        };
                        analyzeImage(origData);
                        buildModel(origData);
                    };
                    img.src = ev.target.result;
                };
                r.readAsDataURL(f);
            }

            function analyzeImage(idata) {
                // Create histogram for visualization
                let { data, width, height } = idata.data;
                let histogram = new Array(256).fill(0);
                let histCanvas = document.getElementById('histogramCanvas');
                let histCtx = histCanvas.getContext('2d');
                histCanvas.width = 256;
                histCanvas.height = 40;
                histCtx.clearRect(0, 0, histCanvas.width, histCanvas.height);
                // Calculate histogram from image data
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i],
                        g = data[i + 1],
                        b = data[i + 2],
                        a = data[i + 3];
                    if (a < 128) continue; // Skip transparent pixels
                    let brightness = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
                    histogram[brightness]++;
                }
                // Normalize histogram
                let maxCount = Math.max(...histogram);
                let normalizedHist = histogram.map(count => count / maxCount * histCanvas.height);
                // Draw histogram
                histCtx.fillStyle = '#4e4eff';
                for (let i = 0; i < normalizedHist.length; i++) {
                    histCtx.fillRect(i, histCanvas.height - normalizedHist[i], 1, normalizedHist[i]);
                }
                // Auto-adjust brightness threshold based on histogram
                let sum = 0, count = 0;
                for (let i = 0; i < histogram.length; i++) {
                    sum += i * histogram[i];
                    count += histogram[i];
                }
                let avgBrightness = sum / count;
                controls.brightnessThreshold = avgBrightness / 255;
                document.getElementById('brightnessThreshold').value = controls.brightnessThreshold;
                document.getElementById('brightnessThresholdValue').textContent = controls.brightnessThreshold.toFixed(2);
            }

            function updateWireframe() {
                modelGroup.traverse(o => {
                    if (o.isMesh) {
                        if (Array.isArray(o.material)) o.material.forEach(m => m.wireframe = controls.wireframe);
                        else o.material.wireframe = controls.wireframe;
                    }
                });
            }

            function updateSideVisibility() {
                let show = document.getElementById("sideToggle").checked;
                for (let key in sideMeshes) {
                    if (sideMeshes[key]) sideMeshes[key].visible = show;
                }
            }

            // Generate normal map from depth map
            function generateNormalMap(depthData, width, height) {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                const imgData = ctx.createImageData(width, height);
                const data = imgData.data;
                const strength = controls.normalStrength * 10;
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const i = (y * width + x);
                        // Get depth samples (with bounds checking)
                        const left = x > 0 ? depthData[i - 1] : depthData[i];
                        const right = x < width - 1 ? depthData[i + 1] : depthData[i];
                        const up = y > 0 ? depthData[i - width] : depthData[i];
                        const down = y < height - 1 ? depthData[i + width] : depthData[i];
                        // Calculate normal using sobel operator (simplified)
                        let nx = (left - right) * strength;
                        let ny = (up - down) * strength;
                        let nz = 1.0;
                        // Normalize
                        const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
                        nx /= len;
                        ny /= len;
                        nz /= len;
                        // Convert from [-1,1] to [0,1] range
                        nx = nx * 0.5 + 0.5;
                        ny = ny * 0.5 + 0.5;
                        nz = nz * 0.5 + 0.5;
                        // Store as RGB
                        const idx = (y * width + x) * 4;
                        data[idx] = nx * 255;
                        data[idx + 1] = ny * 255;
                        data[idx + 2] = nz * 255;
                        data[idx + 3] = 255;
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                return canvas;
            }

            // Edge detection for depth calculation
            function detectEdges(imgData, width, height) {
                const data = imgData.data;
                const edgeData = new Float32Array(width * height);
                // Laplacian kernel for edge detection
                const kernel = [-1, -1, -1, -1, 8, -1, -1, -1, -1];
                const kernelSize = 3;
                const halfKernelSize = Math.floor(kernelSize / 2);
                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        let sum = 0;
                        // Apply kernel
                        for (let ky = 0; ky < kernelSize; ky++) {
                            for (let kx = 0; kx < kernelSize; kx++) {
                                const pixelX = Math.min(width - 1, Math.max(0, x + kx - halfKernelSize));
                                const pixelY = Math.min(height - 1, Math.max(0, y + ky - halfKernelSize));
                                const idx = (pixelY * width + pixelX) * 4;
                                const kernelIdx = ky * kernelSize + kx;
                                if (data[idx + 3] < 128) continue;
                                const gray = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                                sum += gray * kernel[kernelIdx];
                            }
                        }
                        edgeData[y * width + x] = Math.min(1, Math.abs(sum) / 255);
                    }
                }
                return edgeData;
            }

            // Improved buildModel function with advanced depth mapping and normal mapping
            function buildModel(idata) {
                if (processing) return;
                processing = true;
                document.getElementById("loading").style.display = "block";
                // Define softness constant for smooth threshold calculations
                const softness = 0.05;
                setTimeout(() => {
                    let { data, width, height, img } = idata,
                        px = data.data,
                        gx = Math.min(Math.max(10, Math.floor(width / (200 / controls.vertexDetail))), 200),
                        gy = Math.min(Math.max(10, Math.floor(height / (200 / controls.vertexDetail))), 200),
                        asp = width / height,
                        pw = asp >= 1 ? 4 : 4 * asp,
                        ph = asp >= 1 ? 4 / asp : 4,
                        extr = controls.depthStrength / 10;
                    const totalPixels = width * height;
                    depthData = new Float32Array(totalPixels);
                    // Calculate brightness depth map
                    if (controls.depthAlgo === 'brightness' || controls.depthAlgo === 'hybrid') {
                        for (let y = 0; y < height; y++) {
                            for (let x = 0; x < width; x++) {
                                const idx = (y * width + x) * 4;
                                const a = px[idx + 3] / 255;
                                if (a < 0.5) {
                                    depthData[y * width + x] = 0;
                                    continue;
                                }
                                const r = px[idx] / 255;
                                const g = px[idx + 1] / 255;
                                const b = px[idx + 2] / 255;
                                const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                                depthData[y * width + x] = brightness;
                            }
                        }
                    }
                    // Calculate edge-based depth map
                    let edgeData;
                    if (controls.depthAlgo === 'laplacian' || controls.depthAlgo === 'hybrid') {
                        edgeData = detectEdges(data, width, height);
                        if (controls.depthAlgo === 'laplacian') {
                            for (let i = 0; i < totalPixels; i++) {
                                depthData[i] = edgeData[i];
                            }
                        } else {
                            const edgeWeight = controls.edgePreserve;
                            const brightnessWeight = 1 - edgeWeight;
                            for (let i = 0; i < totalPixels; i++) {
                                depthData[i] = (depthData[i] * brightnessWeight) + (edgeData[i] * edgeWeight);
                            }
                        }
                    }
                    // Apply smoothing to depth map
                    if (controls.smoothing > 0) {
                        const smoothedDepth = new Float32Array(totalPixels);
                        const radius = Math.max(1, Math.floor(controls.smoothing));
                        for (let y = 0; y < height; y++) {
                            for (let x = 0; x < width; x++) {
                                const i = y * width + x;
                                let sum = 0, weight = 0, totalWeight = 0;
                                const centerDepth = depthData[i];
                                const centerEdge = edgeData ? edgeData[i] : 0;
                                for (let oy = -radius; oy <= radius; oy++) {
                                    for (let ox = -radius; ox <= radius; ox++) {
                                        const nx = Math.min(width - 1, Math.max(0, x + ox));
                                        const ny = Math.min(height - 1, Math.max(0, y + oy));
                                        const ni = ny * width + nx;
                                        const idx = ni * 4;
                                        if (px[idx + 3] < 128) continue;
                                        const spatialWeight = 1 / (1 + Math.sqrt(ox * ox + oy * oy));
                                        let edgeWeight = 1;
                                        if (edgeData) {
                                            const neighborEdge = edgeData[ni];
                                            edgeWeight = 1 / (1 + Math.abs(centerEdge - neighborEdge) * 10 * controls.edgePreserve);
                                        }
                                        const depthDiff = Math.abs(centerDepth - depthData[ni]);
                                        const rangeWeight = 1 / (1 + depthDiff * 10);
                                        weight = spatialWeight * edgeWeight * rangeWeight;
                                        sum += depthData[ni] * weight;
                                        totalWeight += weight;
                                    }
                                }
                                smoothedDepth[i] = totalWeight > 0 ? sum / totalWeight : centerDepth;
                            }
                        }
                        depthData = smoothedDepth;
                    }
                    // Generate normal map texture if needed
                    if (controls.normalMap) {
                        const normalMapCanvas = generateNormalMap(depthData, width, height);
                        normalMapTexture = new THREE.CanvasTexture(normalMapCanvas);
                    }
                    // Clean up existing model
                    while (modelGroup.children.length > 0) {
                        let obj = modelGroup.children[0];
                        if (obj.geometry) obj.geometry.dispose();
                        if (obj.material) {
                            if (Array.isArray(obj.material)) {
                                obj.material.forEach(m => m.dispose());
                            } else {
                                obj.material.dispose();
                            }
                        }
                        modelGroup.remove(obj);
                    }
                    // Reset side meshes references
                    for (let key in sideMeshes) {
                        sideMeshes[key] = null;
                    }
                    // Create primary mesh
                    let g = new THREE.PlaneGeometry(pw, ph, gx, gy);
                    let positions = g.attributes.position.array;
                    for (let i = 0, vIdx = 0; i < positions.length; i += 3, vIdx++) {
                        const x = (positions[i] + pw / 2) / pw * width;
                        const y = (positions[i + 1] + ph / 2) / ph * height;
                        const fx = Math.min(width - 1, Math.max(0, x));
                        const fy = Math.min(height - 1, Math.max(0, height - y - 1));
                        const x0 = Math.floor(fx);
                        const y0 = Math.floor(fy);
                        const x1 = Math.min(x0 + 1, width - 1);
                        const y1 = Math.min(y0 + 1, height - 1);
                        const wx = fx - x0;
                        const wy = fy - y0;
                        const d00 = depthData[y0 * width + x0];
                        const d01 = depthData[y0 * width + x1];
                        const d10 = depthData[y1 * width + x0];
                        const d11 = depthData[y1 * width + x1];
                        const depthValue = d00 * (1 - wx) * (1 - wy) + d01 * wx * (1 - wy) + d10 * (1 - wx) * wy + d11 * wx * wy;
                        let depthFactor = smoothStep(controls.brightnessThreshold, controls.brightnessThreshold + softness, depthValue);
                        let depth = depthValue * depthFactor;
                        depth = Math.min(1, Math.max(0, depth));
                        positions[i + 2] = depth * extr;
                    }
                    g.computeVertexNormals();
                    let texture = new THREE.Texture(img);
                    texture.needsUpdate = true;
                    let mat;
                    if (controls.normalMap) {
                        mat = new THREE.MeshPhongMaterial({
                            map: texture,
                            normalMap: normalMapTexture,
                            wireframe: controls.wireframe,
                            side: THREE.DoubleSide
                        });
                    } else {
                        mat = new THREE.MeshPhongMaterial({
                            map: texture,
                            wireframe: controls.wireframe,
                            side: THREE.DoubleSide
                        });
                    }
                    let mesh = new THREE.Mesh(g, mat);
                    modelGroup.add(mesh);
                    // Create side panels if enabled
                    if (document.getElementById("sideToggle").checked) {
                        // Top side
                        let topG = new THREE.PlaneGeometry(pw, extr, gx, 1);
                        let topPositions = topG.attributes.position.array;
                        for (let i = 0, vIdx = 0; i < topPositions.length; i += 3, vIdx++) {
                            const x = (topPositions[i] + pw / 2) / pw * width;
                            const z = topPositions[i + 1];
                            const y = ph / 2;
                            const fx = Math.min(width - 1, Math.max(0, x));
                            const fy = 0;
                            const x0 = Math.floor(fx);
                            const depthTop = depthData[fy * width + x0];
                            let depthFactor = smoothStep(controls.brightnessThreshold, controls.brightnessThreshold + softness, depthTop);
                            const depth = depthTop * depthFactor;
                            topPositions[i + 1] = depth * extr;
                            topPositions[i + 2] = -z;
                        }
                        topG.computeVertexNormals();
                        sideMeshes.top = new THREE.Mesh(topG, mat.clone());
                        sideMeshes.top.position.y = ph / 2;
                        sideMeshes.top.rotation.x = Math.PI / 2;
                        modelGroup.add(sideMeshes.top);
                        // Bottom side
                        let bottomG = new THREE.PlaneGeometry(pw, extr, gx, 1);
                        let bottomPositions = bottomG.attributes.position.array;
                        for (let i = 0, vIdx = 0; i < bottomPositions.length; i += 3, vIdx++) {
                            const x = (bottomPositions[i] + pw / 2) / pw * width;
                            const z = bottomPositions[i + 1];
                            const y = -ph / 2;
                            const fx = Math.min(width - 1, Math.max(0, x));
                            const fy = height - 1;
                            const x0 = Math.floor(fx);
                            const depthBottom = depthData[fy * width + x0];
                            let depthFactor = smoothStep(controls.brightnessThreshold, controls.brightnessThreshold + softness, depthBottom);
                            const depth = depthBottom * depthFactor;
                            bottomPositions[i + 1] = depth * extr;
                            bottomPositions[i + 2] = z;
                        }
                        bottomG.computeVertexNormals();
                        sideMeshes.bottom = new THREE.Mesh(bottomG, mat.clone());
                        sideMeshes.bottom.position.y = -ph / 2;
                        sideMeshes.bottom.rotation.x = -Math.PI / 2;
                        modelGroup.add(sideMeshes.bottom);
                        // Left side
                        let leftG = new THREE.PlaneGeometry(extr, ph, 1, gy);
                        let leftPositions = leftG.attributes.position.array;
                        for (let i = 0, vIdx = 0; i < leftPositions.length; i += 3, vIdx++) {
                            const z = leftPositions[i];
                            const y = leftPositions[i + 1];
                            const x = -pw / 2;
                            const fy = Math.min(height - 1, Math.max(0, (y + ph / 2) / ph * height));
                            const fx = 0;
                            const y0 = Math.floor(fy);
                            const depthLeft = depthData[(height - 1 - y0) * width + fx];
                            let depthFactor = smoothStep(controls.brightnessThreshold, controls.brightnessThreshold + softness, depthLeft);
                            const depth = depthLeft * depthFactor;
                            leftPositions[i] = depth * extr;
                            leftPositions[i + 2] = -z;
                        }
                        leftG.computeVertexNormals();
                        sideMeshes.left = new THREE.Mesh(leftG, mat.clone());
                        sideMeshes.left.position.x = -pw / 2;
                        sideMeshes.left.rotation.y = -Math.PI / 2;
                        modelGroup.add(sideMeshes.left);
                        // Right side
                        let rightG = new THREE.PlaneGeometry(extr, ph, 1, gy);
                        let rightPositions = rightG.attributes.position.array;
                        for (let i = 0, vIdx = 0; i < rightPositions.length; i += 3, vIdx++) {
                            const z = rightPositions[i];
                            const y = rightPositions[i + 1];
                            const x = pw / 2;
                            const fy = Math.min(height - 1, Math.max(0, (y + ph / 2) / ph * height));
                            const fx = width - 1;
                            const y0 = Math.floor(fy);
                            const depthRight = depthData[(height - 1 - y0) * width + fx];
                            let depthFactor = smoothStep(controls.brightnessThreshold, controls.brightnessThreshold + softness, depthRight);
                            const depth = depthRight * depthFactor;
                            rightPositions[i] = depth * extr;
                            rightPositions[i + 2] = z;
                        }
                        rightG.computeVertexNormals();
                        sideMeshes.right = new THREE.Mesh(rightG, mat.clone());
                        sideMeshes.right.position.x = pw / 2;
                        sideMeshes.right.rotation.y = Math.PI / 2;
                        modelGroup.add(sideMeshes.right);
                    }
                    processing = false;
                    document.getElementById("loading").style.display = "none";
                }, 100);
            }

            function savePNG() {
                const ui = document.getElementById("ui");
                const upload = document.getElementById("upload");
                const arrow = document.getElementById("toggleArrow");
                const loading = document.getElementById("loading");
                ui.style.display = "none";
                upload.style.display = "none";
                arrow.style.display = "none";
                loading.style.display = "none";
                const origRotation = modelGroup.rotation.clone();
                const origCameraPos = camera.position.clone();
                modelGroup.rotation.set(0, 0, 0);
                renderer.render(scene, camera);
                const link = document.createElement('a');
                link.download = 'enhanced-3d-model.png';
                link.href = renderer.domElement.toDataURL('image/png');
                link.click();
                ui.style.display = "block";
                upload.style.display = "block";
                if (ui.style.transform === "translateY(100%)") {
                    arrow.style.display = "block";
                }
                modelGroup.rotation.copy(origRotation);
                renderer.render(scene, camera);
            }

            function isMobile() {
                return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            }

            function optimizeForMobile() {
                if (isMobile()) {
                    controls.vertexDetail = Math.min(controls.vertexDetail, 80);
                    document.getElementById("vertexDetail").value = controls.vertexDetail;
                    document.getElementById("vertexDetailValue").textContent = controls.vertexDetail;
                    const ui = document.getElementById("ui");
                    ui.style.width = "200px";
                    ui.style.fontSize = "8px";
                }
            }

            optimizeForMobile();

            let lastTap = 0;
            document.getElementById("container").addEventListener("click", function(e) {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    isRotating = !isRotating;
                }
                lastTap = currentTime;
            });
        </script>
    </body>
</html>
