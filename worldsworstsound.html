<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Annoyance Generator 5.0</title>
    <style>
        body { font-family:sans-serif; background-color:#e0e0e0; color:#222; padding:5px; font-size:0.8rem; margin:0; }
        .container { width:100%; max-width:100%; margin:0 auto; background-color:#f8f8f8; padding:8px; border-radius:4px; box-shadow:0 0 5px rgba(0,0,0,0.1); box-sizing:border-box; }
        h1 { text-align:center; color:#a30000; font-size:1.3rem; margin-top:5px; margin-bottom:10px; }
        h3 { margin-top:0; margin-bottom:8px; color:#444; font-size:1rem; }
        .category { margin-bottom:15px; padding:8px; border:1px solid #ccc; border-radius:3px; background-color:#fff; }
        .controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px; } /* Consistent 2-column layout */
        .control { display:flex; flex-direction:column; }
        label { margin-bottom:2px; font-size:0.75em; color:#333; }
        input[type="range"] { width:100%; margin:0; padding:0; height:15px; }
        select { padding:3px; font-size:0.75em; height:28px; width:100%; }
        button { padding:5px 8px; background-color:#c94c4c; color:white; border:none; border-radius:3px; cursor:pointer; transition:background-color 0.2s; font-weight:bold; font-size:0.65em; margin-top:3px; margin-right:3px; } /* Slightly smaller preset button font */
        button:hover { background-color:#b30000; }
        .preset-btn { background-color:#50a350; }
        .preset-btn:hover { background-color:#408340; }
        .preset-buttons { margin-top:5px; display:flex; flex-wrap:wrap; gap:4px; }
        .stop-btn { background-color:#d98c3a; width:100%; padding:10px; font-size:1em; margin-top:10px; }
        .stop-btn:hover { background-color:#c9741a; }
        .slider-value { font-size:0.7em; color:#555; text-align:right; height:10px; }
        hr { margin:15px 0; border-top:1px solid #ddd; border-bottom:0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Annoyance Gen 5.0 😈</h1>

        <div class="category">
            <h3>🦟 Mosquito</h3>
            <div class="controls">
                <div class="control"><label for="mq-f">Freq(Hz):<span id="mq-f-v">4k</span></label><input type="range" id="mq-f" min="1000" max="18000" value="4000" step="100"></div>
                <div class="control"><label for="mq-type">Osc:</label><select id="mq-type"><option value="sine">Sin</option><option value="square">Sqr</option><option value="sawtooth" selected>Saw</option><option value="triangle">Tri</option></select></div>
                <div class="control"><label for="mq-detune">Detune(c):<span id="mq-detune-v">0</span></label><input type="range" id="mq-detune" min="-100" max="100" value="0" step="1"></div>
                <div class="control"><label for="mq-lfo1-f">BuzzF(Hz):<span id="mq-lfo1-f-v">20</span></label><input type="range" id="mq-lfo1-f" min="0.1" max="50" value="20" step="0.1"></div>
                <div class="control"><label for="mq-lfo1-d">BuzzD(Hz):<span id="mq-lfo1-d-v">15</span></label><input type="range" id="mq-lfo1-d" min="0" max="100" value="15" step="1"></div>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" id="mq-p1">Classic</button><button class="preset-btn" id="mq-p2">Drill</button><button class="preset-btn" id="mq-p3">Erratic</button>
                <button class="preset-btn" id="mq-p4">Swarm</button><button class="preset-btn" id="mq-p5">AlertFail</button><button class="preset-btn" id="mq-p6">Whisper</button>
            </div>
        </div><hr>

        <div class="category">
            <h3>🌀 Vibrating</h3>
            <div class="controls">
                <div class="control"><label for="vb-f">BaseF(Hz):<span id="vb-f-v">150</span></label><input type="range" id="vb-f" min="30" max="500" value="150" step="5"></div>
                <div class="control"><label for="vb-type">Osc:</label><select id="vb-type"><option value="sine">Sin</option><option value="square" selected>Sqr</option><option value="sawtooth">Saw</option><option value="triangle">Tri</option></select></div>
                <div class="control"><label for="vb-lfo1-f">VibF(Hz):<span id="vb-lfo1-f-v">10</span></label><input type="range" id="vb-lfo1-f" min="0.1" max="50" value="10" step="0.1"></div>
                <div class="control"><label for="vb-lfo1-d">VibD(Hz):<span id="vb-lfo1-d-v">50</span></label><input type="range" id="vb-lfo1-d" min="0" max="200" value="50" step="5"></div>
                <div class="control" style="grid-column: span 2;"><label for="vb-lfo1-type">VibLFO Type:</label><select id="vb-lfo1-type"><option value="sine" selected>Sin</option><option value="square">Sqr</option><option value="sawtooth">Saw</option><option value="triangle">Tri</option></select></div>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" id="vb-p1">HeavyHum</button><button class="preset-btn" id="vb-p2">Unstable</button><button class="preset-btn" id="vb-p3">Disorient</button>
                <button class="preset-btn" id="vb-p4">Subsonic</button><button class="preset-btn" id="vb-p5">AggroThrob</button><button class="preset-btn" id="vb-p6">DeepWarn</button>
            </div>
        </div><hr>

        <div class="category">
            <h3>🛠️ Scraping</h3>
            <div class="controls">
                <div class="control"><label for="sc-f">BaseF(Hz):<span id="sc-f-v">3k</span></label><input type="range" id="sc-f" min="300" max="8000" value="3000" step="50"></div>
                <div class="control"><label for="sc-type">Osc:</label><select id="sc-type"><option value="sawtooth" selected>Saw</option><option value="square">Sqr</option></select></div>
                <div class="control"><label for="sc-filt-f">FilterF(Hz):<span id="sc-filt-f-v">2.5k</span></label><input type="range" id="sc-filt-f" min="200" max="10000" value="2500" step="50"></div>
                <div class="control"><label for="sc-filt-q">FilterQ:<span id="sc-filt-q-v">15</span></label><input type="range" id="sc-filt-q" min="0.1" max="30" value="15" step="0.1"></div>
                <div class="control" style="grid-column: span 2;"><label for="sc-filt-type">Filter Type:</label><select id="sc-filt-type"><option value="highpass" selected>Highpass</option><option value="bandpass">Bandpass</option><option value="lowpass">Lowpass</option></select></div>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" id="sc-p1">Chalk</button><button class="preset-btn" id="sc-p2">Metal</button><button class="preset-btn" id="sc-p3">Feedback</button>
                <button class="preset-btn" id="sc-p4">Grind</button><button class="preset-btn" id="sc-p5">DrillBit</button>
            </div>
        </div><hr>
        
        <div class="category">
            <h3>⚡ Digital</h3>
            <div class="controls">
                <div class="control"><label for="dg-f">BaseF(Hz):<span id="dg-f-v">1k</span></label><input type="range" id="dg-f" min="100" max="10000" value="1000" step="50"></div>
                <div class="control"><label for="dg-type">Osc:</label><select id="dg-type"><option value="square" selected>Sqr</option><option value="sawtooth">Saw</option><option value="sine">Sin</option></select></div>
                <div class="control"><label for="dg-lfo1-f">GlitchF(Hz):<span id="dg-lfo1-f-v">50</span></label><input type="range" id="dg-lfo1-f" min="10" max="200" value="50" step="5"></div>
                <div class="control"><label for="dg-lfo1-d">GlitchD(Hz):<span id="dg-lfo1-d-v">500</span></label><input type="range" id="dg-lfo1-d" min="0" max="5000" value="500" step="50"></div>
                <div class="control"><label for="dg-lfo2-f">StutterF(Hz):<span id="dg-lfo2-f-v">30</span></label><input type="range" id="dg-lfo2-f" min="1" max="100" value="30" step="1"></div>
                <div class="control"><label for="dg-lfo2-d">StutterD:<span id="dg-lfo2-d-v">0.5</span></label><input type="range" id="dg-lfo2-d" min="0" max="1" value="0.5" step="0.05"></div>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" id="dg-p1">Modem</button><button class="preset-btn" id="dg-p2">Corrupt</button><button class="preset-btn" id="dg-p3">RoboStatic</button>
            </div>
        </div><hr>

        <div class="category">
            <h3>⚙️ Mechanical</h3>
            <div class="controls">
                <div class="control"><label for="im-f">BaseF(Hz):<span id="im-f-v">300</span></label><input type="range" id="im-f" min="50" max="2000" value="300" step="10"></div>
                <div class="control"><label for="im-type">Osc:</label><select id="im-type"><option value="sawtooth" selected>Saw</option><option value="square">Sqr</option></select></div>
                <div class="control"><label for="im-lfo1-f">WhirF(Hz):<span id="im-lfo1-f-v">80</span></label><input type="range" id="im-lfo1-f" min="10" max="200" value="80" step="5"></div>
                <div class="control"><label for="im-lfo1-d">WhirD(Hz):<span id="im-lfo1-d-v">300</span></label><input type="range" id="im-lfo1-d" min="0" max="1000" value="300" step="10"></div>
                <div class="control"><label for="im-lfo2-f">RattleF(Hz):<span id="im-lfo2-f-v">40</span></label><input type="range" id="im-lfo2-f" min="5" max="100" value="40" step="1"></div>
                <div class="control"><label for="im-lfo2-d">RattleD:<span id="im-lfo2-d-v">0.8</span></label><input type="range" id="im-lfo2-d" min="0" max="1" value="0.8" step="0.05"></div>
                 <div class="control" style="grid-column: span 2;"><label for="im-lfo2-type">RattleLFO Type:</label><select id="im-lfo2-type"><option value="square" selected>Sqr</option><option value="sawtooth">Saw</option><option value="sine" >Sin</option></select></div>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" id="im-p1">Turbine</button><button class="preset-btn" id="im-p2">ImpactDrill</button><button class="preset-btn" id="im-p3">LoosePiston</button>
            </div>
        </div><hr>

        <div class="category">
            <h3>🔊 Master</h3>
            <div class="controls">
                <div class="control"><label for="master-gain">Gain:<span id="master-gain-v">0.5</span></label><input type="range" id="master-gain" min="0" max="1" value="0.5" step="0.01"></div>
                <div class="control"><label for="reverb-decay">Reverb(s):<span id="reverb-decay-v">0.1</span></label><input type="range" id="reverb-decay" min="0" max="3" value="0.1" step="0.05"></div>
            </div>
        </div>

        <button class="stop-btn" id="stop-all">STOP ALL 🛑</button>
    </div>

    <script>
        let actx, mGain, reverbN; // AudioContext, Master Gain, Reverb Node
        let cs = { osc:null, gain:null, lfo1:null, lfo1Gain:null, lfo2:null, lfo2Gain:null, amGain:null, filter:null, cat:null }; // Current Sound

        const initAudio = () => { // Init Audio
            if (!actx) {
                actx = new (window.AudioContext || window.webkitAudioContext)();
                mGain = actx.createGain(); reverbN = actx.createConvolver();
                reverbN.connect(actx.destination); updMGain(); updReverb();
            }
        };

        const fmtF = v => { const f=parseFloat(v); return f>=1000?(f/1000).toFixed(1)+'k':f.toFixed(0); }; // Format Freq
        const updSlVal = (id,v,isF=false) => { const el=document.getElementById(id); if(el) el.textContent = isF?fmtF(v):parseFloat(v).toFixed(id.includes('gain-v')||id.includes('decay-v')?2:1); };

        const updMGain = () => { // Update Master Gain
            const gVal = parseFloat(document.getElementById('master-gain').value);
            if(mGain)mGain.gain.setValueAtTime(gVal,actx?actx.currentTime:0); updSlVal('master-gain-v',gVal);
        };

        const updReverb = () => { // Update Reverb
            const decay = parseFloat(document.getElementById('reverb-decay').value);
            updSlVal('reverb-decay-v',decay);
            if(actx&&reverbN&&mGain){
                mGain.disconnect();
                if(decay<0.01){ reverbN.buffer=null; mGain.connect(actx.destination); }
                else{
                    const sr=actx.sampleRate,len=sr*Math.max(decay,0.01),imp=actx.createBuffer(2,len,sr);
                    for(let ch=0;ch<2;ch++){ const d=imp.getChannelData(ch); for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.0);}
                    reverbN.buffer=imp; mGain.connect(reverbN);
                }
            }
        };

        const stopSnd = () => { // Stop Sound
            Object.values(cs).forEach(n=>{if(n){if(n.stop)try{n.stop(0);}catch(e){} if(n.disconnect)try{n.disconnect();}catch(e){}}});
            cs = { osc:null,gain:null,lfo1:null,lfo1Gain:null,lfo2:null,lfo2Gain:null,amGain:null,filter:null,cat:null };
        };
        document.getElementById('stop-all').addEventListener('click',()=>actx&&stopSnd());

        const playSnd = (cfg, cat) => { // Play Sound
            initAudio(); stopSnd();
            const osc=actx.createOscillator(),gain=actx.createGain();
            cs.osc=osc;cs.gain=gain;cs.cat=cat;
            osc.type=cfg.type;osc.frequency.setValueAtTime(cfg.f,actx.currentTime);
            if(cfg.detune!==undefined)osc.detune.setValueAtTime(cfg.detune,actx.currentTime);
            
            // LFO1 (Pitch/Filter Mod)
            if(cfg.lfo1F&&cfg.lfo1D!==undefined){
                const lfo=actx.createOscillator(),lfoGain=actx.createGain();
                lfo.type=cfg.lfo1Type||'sine';lfo.frequency.setValueAtTime(cfg.lfo1F,actx.currentTime);
                lfoGain.gain.setValueAtTime(cfg.lfo1D,actx.currentTime);lfo.connect(lfoGain);
                if(cat==='sc'&&cs.filter&&cfg.lfo1Target==='filter')lfoGain.connect(cs.filter.frequency);else lfoGain.connect(osc.frequency);
                lfo.start(0);cs.lfo1=lfo;cs.lfo1Gain=lfoGain;
            }
            // LFO2 (Amplitude Mod for Digital/Mechanical)
            if((cat==='digital'||cat==='im')&&cfg.lfo2F&&cfg.lfo2D!==undefined){
                cs.amGain=actx.createGain(); cs.amGain.gain.setValueAtTime(1.0-(cfg.lfo2D/2.0),actx.currentTime);
                const lfo=actx.createOscillator(),lfoGain=actx.createGain();
                lfo.type=cfg.lfo2Type||'square';lfo.frequency.setValueAtTime(cfg.lfo2F,actx.currentTime);
                lfoGain.gain.setValueAtTime(cfg.lfo2D/2.0,actx.currentTime);
                lfo.connect(lfoGain);lfoGain.connect(cs.amGain.gain);
                lfo.start(0);cs.lfo2=lfo;cs.lfo2Gain=lfoGain;
            }
            gain.gain.setValueAtTime(0.5,actx.currentTime); // Main source gain before master
            let lastN=osc; // Last Node in chain before category gain
            if(cat==='sc'){
                cs.filter=actx.createBiquadFilter();cs.filter.type=cfg.filtType;
                cs.filter.frequency.setValueAtTime(cfg.filtF,actx.currentTime);cs.filter.Q.setValueAtTime(cfg.filtQ,actx.currentTime);
                lastN.connect(cs.filter);lastN=cs.filter;
            }
            if(cs.amGain&&(cat==='digital'||cat==='im')){ osc.disconnect(); osc.connect(cs.amGain); lastN=cs.amGain; }
            lastN.connect(gain);gain.connect(mGain);osc.start(0);
            updCtrl(cfg,cat); // Update UI sliders
        };

        const updCtrl = (cfg,cat) => { // Update Controls from Preset
            const get=(id)=>document.getElementById(id),setV=(id,v,isF=false)=>{get(id).value=v;updSlVal(id+'-v',v,isF);};
            const setS=(id,v)=>{if(get(id))get(id).value=v;}; // Set Select value
            if(cat==='mq'){ setV('mq-f',cfg.f,true);setS('mq-type',cfg.type);setV('mq-detune',cfg.detune||0);setV('mq-lfo1-f',cfg.lfo1F||0);setV('mq-lfo1-d',cfg.lfo1D||0); }
            else if(cat==='vb'){ setV('vb-f',cfg.f,true);setS('vb-type',cfg.type);setV('vb-lfo1-f',cfg.lfo1F||0);setV('vb-lfo1-d',cfg.lfo1D||0);setS('vb-lfo1-type',cfg.lfo1Type||'sine');}
            else if(cat==='sc'){ setV('sc-f',cfg.f,true);setS('sc-type',cfg.type);setS('sc-filt-type',cfg.filtType);setV('sc-filt-f',cfg.filtF,true);setV('sc-filt-q',cfg.filtQ);}
            else if(cat==='digital'){ setV('dg-f',cfg.f,true);setS('dg-type',cfg.type);setV('dg-lfo1-f',cfg.lfo1F||0);setV('dg-lfo1-d',cfg.lfo1D||0);setV('dg-lfo2-f',cfg.lfo2F||0);setV('dg-lfo2-d',cfg.lfo2D||0);}
            else if(cat==='im'){ setV('im-f',cfg.f,true);setS('im-type',cfg.type);setV('im-lfo1-f',cfg.lfo1F||0);setV('im-lfo1-d',cfg.lfo1D||0);setV('im-lfo2-f',cfg.lfo2F||0);setV('im-lfo2-d',cfg.lfo2D||0); setS('im-lfo2-type',cfg.lfo2Type||'square');}
        };
        
        const addL=(id,cb,evt='input')=>document.getElementById(id).addEventListener(evt,cb); // Add Listener
        const getFV=id=>parseFloat(document.getElementById(id).value); // Get Float Value
        const getSVal=id=>document.getElementById(id).value; // Get Select Value
        const rePlay=(cat,pCfg)=>cs.osc&&cs.cat===cat&&playSnd(pCfg(),cat); // Re-Play sound

        // Listeners (shortened prefixes: mq, vb, sc, dg, im)
        ['mq','vb','dg','im'].forEach(pfx=>{ // Common LFO1 listeners
            addL(`${pfx}-f`,e=>{const v=e.target.value;updSlVal(`${pfx}-f-v`,v,true);if(cs.osc&&cs.cat===pfx)cs.osc.frequency.setValueAtTime(getFV(`${pfx}-f`),actx.currentTime);});
            addL(`${pfx}-lfo1-f`,e=>{const v=e.target.value;updSlVal(`${pfx}-lfo1-f-v`,v);if(cs.lfo1&&cs.cat===pfx)cs.lfo1.frequency.setValueAtTime(getFV(`${pfx}-lfo1-f`),actx.currentTime);});
            addL(`${pfx}-lfo1-d`,e=>{const v=e.target.value;updSlVal(`${pfx}-lfo1-d-v`,v);if(cs.lfo1Gain&&cs.cat===pfx)cs.lfo1Gain.gain.setValueAtTime(getFV(`${pfx}-lfo1-d`),actx.currentTime);});
        });
        addL('mq-detune',e=>{const v=e.target.value;updSlVal('mq-detune-v',v);if(cs.osc&&cs.cat==='mq')cs.osc.detune.setValueAtTime(getFV('mq-detune'),actx.currentTime);});
        addL('mq-type',()=>rePlay('mq',()=>({f:getFV('mq-f'),type:getSVal('mq-type'),detune:getFV('mq-detune'),lfo1F:getFV('mq-lfo1-f'),lfo1D:getFV('mq-lfo1-d')})),'change');
        const vbRecreate=()=>rePlay('vb',()=>({f:getFV('vb-f'),type:getSVal('vb-type'),lfo1F:getFV('vb-lfo1-f'),lfo1D:getFV('vb-lfo1-d'),lfo1Type:getSVal('vb-lfo1-type')}));
        addL('vb-type',vbRecreate,'change'); addL('vb-lfo1-type',vbRecreate,'change');
        
        addL('sc-f',e=>{const v=e.target.value;updSlVal('sc-f-v',v,true);if(cs.osc&&cs.cat==='sc')cs.osc.frequency.setValueAtTime(getFV('sc-f'),actx.currentTime);});
        addL('sc-filt-f',e=>{const v=e.target.value;updSlVal('sc-filt-f-v',v,true);if(cs.filter&&cs.cat==='sc')cs.filter.frequency.setValueAtTime(getFV('sc-filt-f'),actx.currentTime);});
        addL('sc-filt-q',e=>{const v=e.target.value;updSlVal('sc-filt-q-v',v);if(cs.filter&&cs.cat==='sc')cs.filter.Q.setValueAtTime(getFV('sc-filt-q'),actx.currentTime);});
        const scRecreate=()=>rePlay('sc',()=>({f:getFV('sc-f'),type:getSVal('sc-type'),filtType:getSVal('sc-filt-type'),filtF:getFV('sc-filt-f'),filtQ:getFV('sc-filt-q')})); // Note: LFO for filter for "Grind" preset is set by preset, not retained on osc type change here.
        addL('sc-type',scRecreate,'change'); addL('sc-filt-type',scRecreate,'change');

        // Digital & Intense Mechanical LFO2 (Amplitude) listeners
        ['dg','im'].forEach(pfx => {
            addL(`${pfx}-lfo2-f`, e => { const v=e.target.value; updSlVal(`${pfx}-lfo2-f-v`,v); if(cs.lfo2&&cs.cat===pfx) cs.lfo2.frequency.setValueAtTime(getFV(`${pfx}-lfo2-f`),actx.currentTime);});
            addL(`${pfx}-lfo2-d`, e => { const v=e.target.value; updSlVal(`${pfx}-lfo2-d-v`,v); if(cs.amGain&&cs.lfo2Gain&&cs.cat===pfx){ const d=getFV(`${pfx}-lfo2-d`); cs.amGain.gain.setValueAtTime(1.0-(d/2.0),actx.currentTime); cs.lfo2Gain.gain.setValueAtTime(d/2.0,actx.currentTime);}});
        });
        const dgRecreate=()=>rePlay('digital',()=>({f:getFV('dg-f'),type:getSVal('dg-type'),lfo1F:getFV('dg-lfo1-f'),lfo1D:getFV('dg-lfo1-d'),lfo2F:getFV('dg-lfo2-f'),lfo2D:getFV('dg-lfo2-d')}));
        addL('dg-type',dgRecreate,'change');
        const imRecreate=()=>rePlay('im',()=>({f:getFV('im-f'),type:getSVal('im-type'),lfo1F:getFV('im-lfo1-f'),lfo1D:getFV('im-lfo1-d'),lfo2F:getFV('im-lfo2-f'),lfo2D:getFV('im-lfo2-d'),lfo2Type:getSVal('im-lfo2-type')}));
        addL('im-type',imRecreate,'change'); addL('im-lfo2-type',imRecreate,'change');

        addL('master-gain',updMGain); addL('reverb-decay',updReverb);

        // Presets
        addL('mq-p1',()=>playSnd({f:15500,type:'sawtooth',detune:30,lfo1F:35,lfo1D:30},'mq'),'click');
        addL('mq-p2',()=>playSnd({f:9000,type:'square',detune:-20,lfo1F:1.5,lfo1D:80},'mq'),'click');
