<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Annoyance Generator 4.0</title>
    <style>
        body { font-family:sans-serif; background-color:#e0e0e0; color:#222; padding:5px; font-size:0.8rem; margin:0; }
        .container { width:100%; max-width:100%; margin:0 auto; background-color:#f8f8f8; padding:8px; border-radius:4px; box-shadow:0 0 5px rgba(0,0,0,0.1); box-sizing:border-box; }
        h1 { text-align:center; color:#a30000; font-size:1.3rem; margin-top:5px; margin-bottom:10px; }
        h3 { margin-top:0; margin-bottom:8px; color:#444; font-size:1rem; }
        .category { margin-bottom:15px; padding:8px; border:1px solid #ccc; border-radius:3px; background-color:#fff; }
        .controls { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; margin-bottom:8px; }
        .control { display:flex; flex-direction:column; }
        label { margin-bottom:2px; font-size:0.75em; color:#333; }
        input[type="range"] { width:100%; margin:0; padding:0; height:15px; }
        select { padding:3px; font-size:0.75em; height:28px; }
        button { padding:5px 8px; background-color:#c94c4c; color:white; border:none; border-radius:3px; cursor:pointer; transition:background-color 0.2s; font-weight:bold; font-size:0.7em; margin-top:3px; margin-right:3px; }
        button:hover { background-color:#b30000; }
        .preset-btn { background-color:#50a350; }
        .preset-btn:hover { background-color:#408340; }
        .preset-buttons { margin-top:5px; display:flex; flex-wrap:wrap; gap:4px; }
        .stop-btn { background-color:#d98c3a; width:100%; padding:10px; font-size:1em; margin-top:10px; }
        .stop-btn:hover { background-color:#c9741a; }
        .slider-value { font-size:0.7em; color:#555; text-align:right; height:10px; }
        hr { margin:15px 0; border-top:1px solid #ddd; border-bottom:0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Annoyance Gen 4.0 😈</h1>

        <div class="category">
            <h3>🦟 Mosquito</h3>
            <div class="controls">
                <div class="control"><label for="mq-f">Freq(Hz):<span id="mq-f-v">4k</span></label><input type="range" id="mq-f" min="1000" max="18000" value="4000" step="100"></div>
                <div class="control"><label for="mq-type">Osc:</label><select id="mq-type"><option value="sine">Sin</option><option value="square">Sqr</option><option value="sawtooth" selected>Saw</option><option value="triangle">Tri</option></select></div>
                <div class="control"><label for="mq-detune">Detune(c):<span id="mq-detune-v">0</span></label><input type="range" id="mq-detune" min="-100" max="100" value="0" step="1"></div>
                <div class="control"><label for="mq-lfo-f">BuzzF(Hz):<span id="mq-lfo-f-v">20</span></label><input type="range" id="mq-lfo-f" min="0.1" max="50" value="20" step="0.1"></div>
                <div class="control"><label for="mq-lfo-d">BuzzD(Hz):<span id="mq-lfo-d-v">15</span></label><input type="range" id="mq-lfo-d" min="0" max="100" value="15" step="1"></div>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" id="mq-p1">Classic</button><button class="preset-btn" id="mq-p2">Drill</button><button class="preset-btn" id="mq-p3">Erratic</button>
                <button class="preset-btn" id="mq-p4">Swarm</button><button class="preset-btn" id="mq-p5">AlertFail</button><button class="preset-btn" id="mq-p6">Whisper</button>
            </div>
        </div><hr>

        <div class="category">
            <h3>🌀 Vibrating</h3>
            <div class="controls">
                <div class="control"><label for="vb-f">BaseF(Hz):<span id="vb-f-v">150</span></label><input type="range" id="vb-f" min="30" max="500" value="150" step="5"></div>
                <div class="control"><label for="vb-type">Osc:</label><select id="vb-type"><option value="sine">Sin</option><option value="square" selected>Sqr</option><option value="sawtooth">Saw</option><option value="triangle">Tri</option></select></div>
                <div class="control"><label for="vb-lfo-f">VibF(Hz):<span id="vb-lfo-f-v">10</span></label><input type="range" id="vb-lfo-f" min="0.1" max="50" value="10" step="0.1"></div>
                <div class="control"><label for="vb-lfo-d">VibD(Hz):<span id="vb-lfo-d-v">50</span></label><input type="range" id="vb-lfo-d" min="0" max="200" value="50" step="5"></div>
                <div class="control"><label for="vb-lfo-type">VibLFO:</label><select id="vb-lfo-type"><option value="sine" selected>Sin</option><option value="square">Sqr</option><option value="sawtooth">Saw</option><option value="triangle">Tri</option></select></div>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" id="vb-p1">HeavyHum</button><button class="preset-btn" id="vb-p2">Unstable</button><button class="preset-btn" id="vb-p3">Disorient</button>
                <button class="preset-btn" id="vb-p4">Subsonic</button><button class="preset-btn" id="vb-p5">AggroThrob</button><button class="preset-btn" id="vb-p6">DeepWarn</button>
            </div>
        </div><hr>

        <div class="category">
            <h3>🛠️ Scraping</h3>
            <div class="controls">
                <div class="control"><label for="sc-f">BaseF(Hz):<span id="sc-f-v">3k</span></label><input type="range" id="sc-f" min="300" max="8000" value="3000" step="50"></div>
                <div class="control"><label for="sc-type">Osc:</label><select id="sc-type"><option value="sawtooth" selected>Saw</option><option value="square">Sqr</option></select></div>
                <div class="control"><label for="sc-filt-type">Filter:</label><select id="sc-filt-type"><option value="highpass" selected>HP</option><option value="bandpass">BP</option><option value="lowpass">LP</option></select></div>
                <div class="control"><label for="sc-filt-f">FilterF(Hz):<span id="sc-filt-f-v">2.5k</span></label><input type="range" id="sc-filt-f" min="200" max="10000" value="2500" step="50"></div>
                <div class="control"><label for="sc-filt-q">FilterQ:<span id="sc-filt-q-v">15</span></label><input type="range" id="sc-filt-q" min="0.1" max="30" value="15" step="0.1"></div>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" id="sc-p1">Chalk</button><button class="preset-btn" id="sc-p2">Metal</button><button class="preset-btn" id="sc-p3">Feedback</button><button class="preset-btn" id="sc-p4">Grind</button>
            </div>
        </div><hr>
        
        <div class="category">
            <h3>⚡ Digital Glitch</h3>
            <div class="controls">
                <div class="control"><label for="dg-f">BaseF(Hz):<span id="dg-f-v">1k</span></label><input type="range" id="dg-f" min="100" max="10000" value="1000" step="50"></div>
                <div class="control"><label for="dg-type">Osc:</label><select id="dg-type"><option value="square" selected>Sqr</option><option value="sawtooth">Saw</option><option value="sine">Sin</option></select></div>
                <div class="control"><label for="dg-gLfo-f">GlitchF(Hz):<span id="dg-gLfo-f-v">50</span></label><input type="range" id="dg-gLfo-f" min="10" max="200" value="50" step="5"></div>
                <div class="control"><label for="dg-gLfo-d">GlitchD(Hz):<span id="dg-gLfo-d-v">500</span></label><input type="range" id="dg-gLfo-d" min="0" max="5000" value="500" step="50"></div>
                <div class="control"><label for="dg-sLfo-f">StutterF(Hz):<span id="dg-sLfo-f-v">30</span></label><input type="range" id="dg-sLfo-f" min="1" max="100" value="30" step="1"></div>
                <div class="control"><label for="dg-sLfo-d">StutterD:<span id="dg-sLfo-d-v">0.5</span></label><input type="range" id="dg-sLfo-d" min="0" max="1" value="0.5" step="0.05"></div>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" id="dg-p1">Modem</button><button class="preset-btn" id="dg-p2">Corrupt</button><button class="preset-btn" id="dg-p3">RoboStatic</button>
            </div>
        </div><hr>

        <div class="category">
            <h3>🔊 Master</h3>
            <div class="controls">
                <div class="control"><label for="master-gain">Gain:<span id="master-gain-v">0.5</span></label><input type="range" id="master-gain" min="0" max="1" value="0.5" step="0.01"></div>
                <div class="control"><label for="reverb-decay">Reverb(s):<span id="reverb-decay-v">0.1</span></label><input type="range" id="reverb-decay" min="0" max="3" value="0.1" step="0.05"></div>
            </div>
        </div>

        <button class="stop-btn" id="stop-all">STOP ALL 🛑</button>
    </div>

    <script>
        let actx, mGain, reverbN; // actx: AudioContext, mGain: Master Gain, reverbN: Reverb Node
        let cs = { osc:null, gain:null, lfo1:null, lfo1Gain:null, lfo2:null, lfo2Gain:null, amGain:null, filter:null, cat:null }; // cs: Current Sound

        const initAudio = () => { // Initialize Audio
            if (!actx) {
                actx = new (window.AudioContext || window.webkitAudioContext)();
                mGain = actx.createGain();
                reverbN = actx.createConvolver();
                reverbN.connect(actx.destination);
                updateMGain(); updateReverb(); // Set initial master gain & reverb connections
            }
        };

        const fmtFreq = v => { const f=parseFloat(v); return f>=1000?(f/1000).toFixed(1)+'k':f.toFixed(0); }; // Format Frequency
        const updSliderVal = (id,v,isF=false) => { const el=document.getElementById(id); if(el) el.textContent = isF?fmtFreq(v):parseFloat(v).toFixed(id.includes('gain-v')||id.includes('decay-v')?2:1); }; // Update Slider Value Display

        document.querySelectorAll('input[type="range"]').forEach(s => updSliderVal(s.id+'-v', s.value, s.id.includes('-f')&&!s.id.includes('lfo-f')&&!s.id.includes('filt-f'))); // Initial slider displays

        const updateMGain = () => { // Update Master Gain
            const gVal = parseFloat(document.getElementById('master-gain').value);
            if (mGain) mGain.gain.setValueAtTime(gVal, actx ? actx.currentTime : 0);
            updSliderVal('master-gain-v', gVal);
        };

        const updateReverb = () => { // Update Reverb
            const decay = parseFloat(document.getElementById('reverb-decay').value);
            updSliderVal('reverb-decay-v', decay);
            if (actx && reverbN && mGain) {
                mGain.disconnect(); // Disconnect master gain
                if (decay < 0.01) { // If decay is near zero, bypass reverb
                    reverbN.buffer = null; mGain.connect(actx.destination);
                } else { // Else, connect through reverb
                    const sr = actx.sampleRate, len = sr * Math.max(decay,0.01);
                    const imp = actx.createBuffer(2,len,sr);
                    for(let ch=0;ch<2;ch++){ const d=imp.getChannelData(ch); for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.0); }
                    reverbN.buffer = imp; mGain.connect(reverbN);
                }
            }
        };

        const stopSnd = () => { // Stop All Sounds
            Object.values(cs).forEach(n => { if(n){if(n.stop)try{n.stop(0);}catch(e){} if(n.disconnect)try{n.disconnect();}catch(e){}} });
            cs = { osc:null, gain:null, lfo1:null, lfo1Gain:null, lfo2:null, lfo2Gain:null, amGain:null, filter:null, cat:null };
        };
        document.getElementById('stop-all').addEventListener('click', () => { if (actx) stopSnd(); });

        const playSnd = (cfg, cat) => { // Play Sound
            initAudio(); stopSnd();
            const osc = actx.createOscillator(), gain = actx.createGain();
            cs.osc = osc; cs.gain = gain; cs.cat = cat;
            osc.type = cfg.type; osc.frequency.setValueAtTime(cfg.f, actx.currentTime);
            if(cfg.detune!==undefined) osc.detune.setValueAtTime(cfg.detune,actx.currentTime);
            
            // LFO1 (typically pitch/filter mod)
            if(cfg.lfo1F && cfg.lfo1D!==undefined){
                const lfo=actx.createOscillator(), lfoGain=actx.createGain();
                lfo.type=cfg.lfo1Type||'sine'; lfo.frequency.setValueAtTime(cfg.lfo1F,actx.currentTime);
                lfoGain.gain.setValueAtTime(cfg.lfo1D,actx.currentTime);
                lfo.connect(lfoGain);
                if(cat==='scraping' && cfg.lfo1Target==='filter') lfoGain.connect(cs.filter.frequency); else lfoGain.connect(osc.frequency);
                lfo.start(0); cs.lfo1=lfo; cs.lfo1Gain=lfoGain;
            }
            // LFO2 (typically AM/Stutter for Digital category)
            if(cat==='digital' && cfg.lfo2F && cfg.lfo2D!==undefined){
                cs.amGain = actx.createGain(); // AM gain node
                cs.amGain.gain.setValueAtTime(1.0 - (cfg.lfo2D / 2.0), actx.currentTime); // Base gain for AM

                const lfo=actx.createOscillator(), lfoGain=actx.createGain();
                lfo.type=cfg.lfo2Type||'square'; lfo.frequency.setValueAtTime(cfg.lfo2F,actx.currentTime);
                lfoGain.gain.setValueAtTime(cfg.lfo2D / 2.0,actx.currentTime); // Modulation depth
                lfo.connect(lfoGain); lfoGain.connect(cs.amGain.gain);
                lfo.start(0); cs.lfo2=lfo; cs.lfo2Gain=lfoGain;
            }

            gain.gain.setValueAtTime(0.55, actx.currentTime); // Slightly reduced source gain

            let lastNode = osc;
            if(cat==='scraping'){
                cs.filter=actx.createBiquadFilter(); cs.filter.type=cfg.filtType;
                cs.filter.frequency.setValueAtTime(cfg.filtF,actx.currentTime); cs.filter.Q.setValueAtTime(cfg.filtQ,actx.currentTime);
                lastNode.connect(cs.filter); lastNode = cs.filter;
            }
            if(cat==='digital' && cs.amGain) { // Connect main osc to AM gain if it exists
                osc.disconnect(); // Main osc was connected to 'lastNode', now reroute
                osc.connect(cs.amGain);
                lastNode = cs.amGain;
            }
            lastNode.connect(gain); gain.connect(mGain); osc.start(0);
            updCtrlPresets(cfg, cat); // Update slider displays to preset values
        };

        const updCtrlPresets = (cfg, cat) => { // Update Controls for Preset
            const get=(id)=>document.getElementById(id), setVal=(id,v,isF=false)=>{get(id).value=v;updSliderVal(id+'-v',v,isF);};
            if(cat==='mq'){
                setVal('mq-f',cfg.f,true); get('mq-type').value=cfg.type; setVal('mq-detune',cfg.detune||0);
                setVal('mq-lfo-f',cfg.lfo1F||0); setVal('mq-lfo-d',cfg.lfo1D||0);
            }else if(cat==='vb'){
                setVal('vb-f',cfg.f,true); get('vb-type').value=cfg.type;
                setVal('vb-lfo-f',cfg.lfo1F||0); setVal('vb-lfo-d',cfg.lfo1D||0); get('vb-lfo-type').value=cfg.lfo1Type||'sine';
            }else if(cat==='sc'){
                setVal('sc-f',cfg.f,true); get('sc-type').value=cfg.type; get('sc-filt-type').value=cfg.filtType;
                setVal('sc-filt-f',cfg.filtF,true); setVal('sc-filt-q',cfg.filtQ);
            }else if(cat==='digital'){
                setVal('dg-f',cfg.f,true); get('dg-type').value=cfg.type;
                setVal('dg-gLfo-f',cfg.lfo1F||0); setVal('dg-gLfo-d',cfg.lfo1D||0);
                setVal('dg-sLfo-f',cfg.lfo2F||0); setVal('dg-sLfo-d',cfg.lfo2D||0);
            }
        };
        
        // Param Update Listeners
        const addL = (id, cb, event='input') => document.getElementById(id).addEventListener(event, cb); // Add Listener helper
        const getFVal = id => parseFloat(document.getElementById(id).value); // Get Float Value helper
        const rePlay = (cat, pCfg) => { if(cs.osc && cs.cat===cat) playSnd(pCfg(), cat); }; // Re-Play sound on type change etc.

        // Mosquito Listeners
        addL('mq-f', e=>{const v=e.target.value;updSliderVal('mq-f-v',v,true);if(cs.osc&&cs.cat==='mq')cs.osc.frequency.setValueAtTime(parseFloat(v),actx.currentTime);});
        addL('mq-detune',e=>{const v=e.target.value;updSliderVal('mq-detune-v',v);if(cs.osc&&cs.cat==='mq')cs.osc.detune.setValueAtTime(parseFloat(v),actx.currentTime);});
        addL('mq-lfo-f',e=>{const v=e.target.value;updSliderVal('mq-lfo-f-v',v);if(cs.lfo1&&cs.cat==='mq')cs.lfo1.frequency.setValueAtTime(parseFloat(v),actx.currentTime);});
        addL('mq-lfo-d',e=>{const v=e.target.value;updSliderVal('mq-lfo-d-v',v);if(cs.lfo1Gain&&cs.cat==='mq')cs.lfo1Gain.gain.setValueAtTime(parseFloat(v),actx.currentTime);});
        addL('mq-type',()=>rePlay('mq',()=>({f:getFVal('mq-f'),type:document.getElementById('mq-type').value,detune:getFVal('mq-detune'),lfo1F:getFVal('mq-lfo-f'),lfo1D:getFVal('mq-lfo-d')})),'change');

        // Vibrating Listeners
        addL('vb-f',e=>{const v=e.target.value;updSliderVal('vb-f-v',v,true);if(cs.osc&&cs.cat==='vb')cs.osc.frequency.setValueAtTime(parseFloat(v),actx.currentTime);});
        addL('vb-lfo-f',e=>{const v=e.target.value;updSliderVal('vb-lfo-f-v',v);if(cs.lfo1&&cs.cat==='vb')cs.lfo1.frequency.setValueAtTime(parseFloat(v),actx.currentTime);});
        addL('vb-lfo-d',e=>{const v=e.target.value;updSliderVal('vb-lfo-d-v',v);if(cs.lfo1Gain&&cs.cat==='vb')cs.lfo1Gain.gain.setValueAtTime(parseFloat(v),actx.currentTime);});
        const vbRecreate=()=>rePlay('vb',()=>({f:getFVal('vb-f'),type:document.getElementById('vb-type').value,lfo1F:getFVal('vb-lfo-f'),lfo1D:getFVal('vb-lfo-d'),lfo1Type:document.getElementById('vb-lfo-type').value}));
        addL('vb-type',vbRecreate,'change'); addL('vb-lfo-type',vbRecreate,'change');

        // Scraping Listeners
        addL('sc-f',e=>{const v=e.target.value;updSliderVal('sc-f-v',v,true);if(cs.osc&&cs.cat==='sc')cs.osc.frequency.setValueAtTime(parseFloat(v),actx.currentTime);});
        addL('sc-filt-f',e=>{const v=e.target.value;updSliderVal('sc-filt-f-v',v,true);if(cs.filter&&cs.cat==='sc')cs.filter.frequency.setValueAtTime(parseFloat(v),actx.currentTime);});
        addL('sc-filt-q',e=>{const v=e.target.value;updSliderVal('sc-filt-q-v',v);if(cs.filter&&cs.cat==='sc')cs.filter.Q.setValueAtTime(parseFloat(v),actx.currentTime);});
        const scRecreate=()=>rePlay('sc',()=>({f:getFVal('sc-f'),type:document.getElementById('sc-type').value,filtType:document.getElementById('sc-filt-type').value,filtF:getFVal('sc-filt-f'),filtQ:getFVal('sc-filt-q'), lfo1F: (document.getElementById('sc-type').value==='grind'?20:undefined), lfo1D:(document.getElementById('sc-type').value==='grind'?500:undefined), lfo1Target:(document.getElementById('sc-type').value==='grind'?'filter':undefined)})); // Special for grind preset to engage LFO
        addL('sc-type',scRecreate,'change'); addL('sc-filt-type',scRecreate,'change');

        // Digital Glitch Listeners
        addL('dg-f',e=>{const v=e.target.value;updSliderVal('dg-f-v',v,true);if(cs.osc&&cs.cat==='digital')cs.osc.frequency.setValueAtTime(parseFloat(v),actx.currentTime);});
        addL('dg-gLfo-f',e=>{const v=e.target.value;updSliderVal('dg-gLfo-f-v',v);if(cs.lfo1&&cs.cat==='digital')cs.lfo1.frequency.setValueAtTime(parseFloat(v),actx.currentTime);});
        addL('dg-gLfo-d',e=>{const v=e.target.value;updSliderVal('dg-gLfo-d-v',v);if(cs.lfo1Gain&&cs.cat==='digital')cs.lfo1Gain.gain.setValueAtTime(parseFloat(v),actx.currentTime);});
        addL('dg-sLfo-f',e=>{const v=e.target.value;updSliderVal('dg-sLfo-f-v',v);if(cs.lfo2&&cs.cat==='digital')cs.lfo2.frequency.setValueAtTime(parseFloat(v),actx.currentTime);});
        addL('dg-sLfo-d',e=>{const v=e.target.value;updSliderVal('dg-sLfo-d-v',v); if(cs.amGain&&cs.lfo2Gain&&cs.cat==='digital'){ const depth=parseFloat(v); cs.amGain.gain.setValueAtTime(1.0-(depth/2.0),actx.currentTime); cs.lfo2Gain.gain.setValueAtTime(depth/2.0,actx.currentTime);}});
        const dgRecreate=()=>rePlay('digital',()=>({f:getFVal('dg-f'),type:document.getElementById('dg-type').value,lfo1F:getFVal('dg-gLfo-f'),lfo1D:getFVal('dg-gLfo-d'),lfo2F:getFVal('dg-sLfo-f'),lfo2D:getFVal('dg-sLfo-d')}));
        addL('dg-type',dgRecreate,'change');

        // Master Listeners
        addL('master-gain', updateMGain); addL('reverb-decay', updateReverb);

        // Preset Buttons
        // Mosquito
        addL('mq-p1',()=>playSnd({f:15500,type:'sawtooth',detune:30,lfo1F:35,lfo1D:30},'mq'),'click');
        addL('mq-p2',()=>playSnd({f:9000,type:'square',detune:-20,lfo1F:1.5,lfo1D:80},'mq'),'click');
        addL('mq-p3',()=>playSnd({f:12000,type:'sine',detune:0,lfo1F:7,lfo1D:60,lfo1Type:'sawtooth'},'mq'),'click');
        addL('mq-p4',()=>playSnd({f:16000,type:'sawtooth',detune:25,lfo1F:40,lfo1D:40,lfo1Type:'sawtooth'},'mq'),'click');
        addL('mq-p5',()=>playSnd({f:10000,type:'sine',detune:10,lfo1F:0.5,lfo1D:50},'mq'),'click');
        addL('mq-p6',()=>playSnd({f:17500,type:'sine',detune:0,lfo1F:45,lfo1D:5},'mq'),'click'); // Whisper
        // Vibrating
        addL('vb-p1',()=>playSnd({f:100,type:'square',lfo1F:6,lfo1D:30,lfo1Type:'sine'},'vb'),'click');
        addL('vb-p2',()=>playSnd({f:220,type:'sawtooth',lfo1F:18,lfo1D:80,lfo1Type:'square'},'vb'),'click');
        addL('vb-p3',()=>playSnd({f:70,type:'sine',lfo1F:0.5,lfo1D:25,lfo1Type:'sine'},'vb'),'click');
