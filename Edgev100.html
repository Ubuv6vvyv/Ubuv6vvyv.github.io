<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>EDGE CAM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--acc:#00ffe7;}
body{background:#000;font-family:'Share Tech Mono',monospace;color:#fff;height:100dvh;overflow:hidden;display:flex;flex-direction:column;user-select:none;}

/* ── START SCREEN ── */
#start{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;}
#start::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,231,.03) 2px,rgba(0,255,231,.03) 4px);pointer-events:none;}
.title{font-family:'Orbitron',sans-serif;font-size:2.8rem;font-weight:700;letter-spacing:8px;color:var(--acc);text-shadow:0 0 30px var(--acc),0 0 60px rgba(0,255,231,.3);animation:pulse 2s infinite;}
.sub{font-size:.7rem;letter-spacing:4px;color:#444;margin-top:-10px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
#start button{background:transparent;border:1px solid var(--acc);color:var(--acc);padding:14px 44px;font-family:'Orbitron',sans-serif;font-size:.9rem;letter-spacing:3px;cursor:pointer;position:relative;overflow:hidden;}
#start button::before{content:'';position:absolute;inset:0;background:var(--acc);transform:translateX(-100%);transition:.3s;}
#start button:active::before{transform:translateX(0);}
#start button:active{color:#000;}

/* ── VIEWFINDER ── */
#mw{position:relative;flex:1;min-height:0;overflow:hidden;background:#000;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
video{display:none;}
#scn{position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.18) 3px,rgba(0,0,0,.18) 4px);transition:opacity .3s;}
#hud{position:absolute;top:0;left:0;right:0;padding:9px 13px;display:flex;justify-content:space-between;align-items:center;z-index:10;background:linear-gradient(rgba(0,0,0,.7),transparent);}
.hi{font-size:.62rem;letter-spacing:1px;color:rgba(0,255,231,.55);}
#fps{background:rgba(0,255,231,.08);border:1px solid rgba(0,255,231,.25);padding:2px 7px;border-radius:2px;font-size:.62rem;color:var(--acc);}

/* ── ZOOM ── */
#zoom-col{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:5px;}
.zbtn{width:36px;height:36px;background:rgba(0,0,0,.55);border:1px solid rgba(0,255,231,.3);color:var(--acc);border-radius:3px;font-size:1.2rem;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.zbtn:active{background:rgba(0,255,231,.2);transform:scale(.88);}
#zlbl{font-size:.58rem;color:rgba(0,255,231,.5);text-align:center;min-width:36px;}

/* ── BOTTOM PANEL ── */
#panel{position:absolute;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(transparent,rgba(0,0,0,.97) 22%);padding:6px 13px 16px;}

/* filter pills */
#filter-pills{display:flex;gap:6px;overflow-x:auto;padding:5px 0 8px;scrollbar-width:none;}
#filter-pills::-webkit-scrollbar{display:none;}

/* neon sub-panel */
#neon-sub{margin-bottom:6px;}
.sub-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.sub-lbl{font-size:.55rem;color:#555;letter-spacing:1px;text-transform:uppercase;flex-shrink:0;width:44px;}
.sub-pills{display:flex;gap:5px;overflow-x:auto;flex:1;scrollbar-width:none;}
.sub-pills::-webkit-scrollbar{display:none;}

/* pills (shared) */
.pill{flex-shrink:0;padding:5px 12px;border-radius:3px;border:1px solid #2a2a2a;background:rgba(255,255,255,.04);font-size:.7rem;cursor:pointer;white-space:nowrap;color:#555;font-family:'Share Tech Mono',monospace;letter-spacing:.5px;transition:.13s;}
.pill.on{border-color:var(--acc);background:rgba(0,255,231,.11);color:var(--acc);box-shadow:0 0 10px rgba(0,255,231,.18);}

/* sliders */
#sliders{display:flex;gap:11px;margin:3px 0 7px;}
.sg{flex:1;}
.sl{font-size:.62rem;color:#444;display:flex;justify-content:space-between;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
.sl span{color:var(--acc);}
input[type=range]{width:100%;height:2px;background:#1e1e1e;border-radius:1px;outline:none;-webkit-appearance:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:2px;background:var(--acc);border:1px solid #000;box-shadow:0 0 8px var(--acc);}

/* width slider inside neon-sub */
.wsub-row{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
.wsub-sl{flex:1;}

/* buttons */
#btns{display:flex;gap:7px;}
.btn{flex:0 0 auto;background:rgba(255,255,255,.06);color:#888;border:1px solid #2a2a2a;padding:8px 14px;border-radius:2px;font-size:.72rem;cursor:pointer;font-family:'Share Tech Mono',monospace;letter-spacing:.5px;}
.btn:active{transform:scale(.92);}
.btn.prim{flex:1;max-width:140px;background:rgba(0,255,231,.13);color:var(--acc);border-color:var(--acc);font-family:'Orbitron',sans-serif;font-size:.68rem;}
.btn.prim:active{background:var(--acc);color:#000;}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:100;transition:opacity .1s;}
</style>
</head>
<body>

<div id="flash"></div>

<div id="start">
  <div class="title">EDGE CAM</div>
  <div class="sub">LIVE FILTER SYSTEM v5</div>
  <button onclick="boot()">⚡ INITIALIZE</button>
</div>

<div id="mw">
  <div id="scn"></div>
  <canvas id="cv"></canvas>
  <video id="vid" playsinline muted autoplay></video>
  <div id="hud">
    <div class="hi" id="res">-- × --</div>
    <div id="fps">-- FPS</div>
    <div class="hi" id="mhud">--</div>
  </div>
  <div id="zoom-col">
    <div class="zbtn" onclick="adjZoom(.25)">＋</div>
    <div id="zlbl">1×</div>
    <div class="zbtn" onclick="adjZoom(-.25)">－</div>
  </div>
</div>

<div id="panel">

  <!-- main filter selector -->
  <div id="filter-pills"></div>

  <!-- neon-only sub-controls -->
  <div id="neon-sub">
    <div class="sub-row">
      <div class="sub-lbl">KERNEL</div>
      <div class="sub-pills" id="kpills"></div>
    </div>
    <div class="sub-row">
      <div class="sub-lbl">COLOR</div>
      <div class="sub-pills" id="cpills"></div>
    </div>
    <div class="sub-row">
      <div class="sub-lbl">WIDTH</div>
      <div class="wsub-sl">
        <div class="sl">LINE WIDTH &nbsp;<span id="wv">2</span></div>
        <input type="range" id="sw" min="1" max="4" step="1" value="2" oninput="wv.textContent=this.value">
      </div>
    </div>
  </div>

  <!-- shared sliders -->
  <div id="sliders">
    <div class="sg">
      <div class="sl"><span id="l1">PARAM1</span>&nbsp;<span id="v1">-</span></div>
      <input type="range" id="s1" oninput="v1.textContent=this.value">
    </div>
    <div class="sg">
      <div class="sl"><span id="l2">PARAM2</span>&nbsp;<span id="v2">-</span></div>
      <input type="range" id="s2" oninput="v2.textContent=this.value">
    </div>
  </div>

  <div id="btns">
    <button class="btn" onclick="flipCam()">🔄 FLIP</button>
    <button class="btn" id="crtBtn" onclick="toggleCRT()" style="color:var(--acc)">📺 CRT</button>
    <button class="btn prim" onclick="snap()">📸 SNAP</button>
  </div>

</div>

<script>
// ── ELEMENTS ────────────────────────────────────────────────────────────────
const vid=document.getElementById('vid');
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d',{willReadFrequently:true,alpha:false});
const mw=document.getElementById('mw');
const s1=document.getElementById('s1'), s2=document.getElementById('s2'), sw=document.getElementById('sw');
const v1=document.getElementById('v1'), v2=document.getElementById('v2');
const l1=document.getElementById('l1'), l2=document.getElementById('l2');

// ── STATE ───────────────────────────────────────────────────────────────────
let stream, frontCam=false, running=false, crtOn=true;
let CW=0, CH=0;
let rawBuf=null, lumaBuf=null, gxBuf=null, gyBuf=null, magBuf=null, nmsBuf=null, nightPrev=null;
let fc=0, lastSec=0;
let mode='neon', kernel='scharr', colorMode='angle';
let zoom=1, pinchD=0, pinchZ=1;

// ── ZOOM ────────────────────────────────────────────────────────────────────
const zlbl=document.getElementById('zlbl');
function adjZoom(d){zoom=Math.max(1,Math.min(5,zoom+d));zlbl.textContent=zoom.toFixed(2).replace(/\.?0+$/,'')+'×';}
cv.addEventListener('touchstart',e=>{if(e.touches.length===2){e.preventDefault();pinchD=pd(e);pinchZ=zoom;}},{passive:false});
cv.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();zoom=Math.max(1,Math.min(5,pinchZ*pd(e)/pinchD));zlbl.textContent=zoom.toFixed(2).replace(/\.?0+$/,'')+'×';}},{passive:false});
function pd(e){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;return Math.sqrt(dx*dx+dy*dy);}

// ── HUE LUT ─────────────────────────────────────────────────────────────────
const HLUT=new Uint8Array(360*3);
(()=>{for(let h=0;h<360;h++){const f=h/60,x=(1-Math.abs(f%2-1))*255|0;let r=0,g=0,b=0;if(f<1){r=255;g=x;}else if(f<2){r=x;g=255;}else if(f<3){g=255;b=x;}else if(f<4){g=x;b=255;}else if(f<5){r=x;b=255;}else{r=255;b=x;}HLUT[h*3]=r;HLUT[h*3+1]=g;HLUT[h*3+2]=b;}})();

// ── THERMAL LUT ─────────────────────────────────────────────────────────────
const TLUT=new Uint8Array(768);
(()=>{const S=[[0,[0,0,0]],[40,[30,0,100]],[90,[120,0,160]],[140,[200,0,60]],[180,[255,60,0]],[210,[255,180,0]],[235,[255,255,100]],[255,[255,255,255]]];for(let i=0;i<256;i++){let lo=S[0],hi=S[S.length-1];for(let s=0;s<S.length-1;s++){if(i>=S[s][0]&&i<=S[s+1][0]){lo=S[s];hi=S[s+1];break;}}const t=(i-lo[0])/(hi[0]-lo[0]||1);TLUT[i*3]=lo[1][0]+(hi[1][0]-lo[1][0])*t|0;TLUT[i*3+1]=lo[1][1]+(hi[1][1]-lo[1][1])*t|0;TLUT[i*3+2]=lo[1][2]+(hi[1][2]-lo[1][2])*t|0;}})();

// ── FILTER / KERNEL / COLOR CONFIG ──────────────────────────────────────────
const FILTERS=[
  {id:'neon',    lbl:'⚡NEON',
   s1:{n:'Threshold',min:2, max:80, val:18, step:1},
   s2:{n:'Dark Lift', min:1, max:6,  val:2.2,step:.1}},
  {id:'night',   lbl:'👁 NIGHT',
   s1:{n:'Amplify',  min:1, max:14, val:4,  step:.1},
   s2:{n:'Persist',  min:0, max:95, val:30, step:1}},
  {id:'thermal', lbl:'🌡THERMAL',
   s1:{n:'Contrast', min:.3,max:4,  val:1.6,step:.05},
   s2:{n:'Edge Mix', min:0, max:1,  val:.25,step:.01}},
  {id:'emboss',  lbl:'⛰ EMBOSS',
   s1:{n:'Depth',    min:.5,max:8,  val:2.5,step:.1},
   s2:{n:'Metallic', min:0, max:1,  val:.4, step:.01}},
  {id:'mirror',  lbl:'🪞MIRROR',
   s1:{n:'Mode 0–3', min:0, max:3,  val:0,  step:1},
   s2:{n:'Blend',    min:0, max:1,  val:1,  step:.02}},
  {id:'duotone', lbl:'◑DUOTONE',
   s1:{n:'Shadow Hue',min:0,max:359,val:240,step:1},
   s2:{n:'High Hue',  min:0,max:359,val:30, step:1}},
];

const KERNELS = [
  {id:'scharr',  lbl:'SCHARR'},
  {id:'sobel',   lbl:'SOBEL'},
  {id:'prewitt', lbl:'PREWITT'},
  {id:'canny',   lbl:'CANNY'},
  {id:'laplace', lbl:'LAPLACE'},
];

const COLORS=[
  {id:'angle', lbl:'DIRECTION'},
  {id:'white', lbl:'WHITE'},
  {id:'cyan',  lbl:'CYAN'},
];

// ── BUILD PILLS ──────────────────────────────────────────────────────────────
function buildPills(containerId, items, getActive, onSelect){
  const el=document.getElementById(containerId);
  el.innerHTML='';
  items.forEach(item=>{
    const p=document.createElement('div');
    p.className='pill'+(item.id===getActive()?' on':'');
    p.textContent=item.lbl;
    p.onclick=()=>{
      onSelect(item.id);
      el.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));
      p.classList.add('on');
    };
    el.appendChild(p);
  });
}

buildPills('filter-pills', FILTERS, ()=>mode, id=>{
  mode=id;
  const f=FILTERS.find(x=>x.id===id);
  setSl(s1,l1,v1,f.s1);
  setSl(s2,l2,v2,f.s2);
  document.getElementById('mhud').textContent=f.lbl.replace(/[^\w ]/g,'').trim();
  document.getElementById('neon-sub').style.display=id==='neon'?'block':'none';
  setTimeout(()=>document.querySelector('#filter-pills .pill.on')?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}),50);
});

buildPills('kpills', KERNELS, ()=>kernel, id=>{ kernel=id; });
buildPills('cpills', COLORS,  ()=>colorMode, id=>{ colorMode=id; });

function setSl(inp,ln,vn,c){
  inp.min=c.min; inp.max=c.max; inp.step=c.step; inp.value=c.val;
  ln.textContent=c.n; vn.textContent=c.val;
}

// Init default filter
(()=>{
  const f=FILTERS.find(x=>x.id==='neon');
  setSl(s1,l1,v1,f.s1); setSl(s2,l2,v2,f.s2);
  document.getElementById('mhud').textContent='NEON';
  document.getElementById('neon-sub').style.display='block';
  // mark neon pill active
  document.querySelector('#filter-pills')?.querySelector('.pill')?.classList.add('on');
})();

function toggleCRT(){
  crtOn=!crtOn;
  document.getElementById('scn').style.opacity=crtOn?1:0;
  document.getElementById('crtBtn').style.color=crtOn?'var(--acc)':'#555';
}

// ── CAMERA ──────────────────────────────────────────────────────────────────
async function boot(){
  document.getElementById('start').style.display='none';
  await getStream();
}
async function getStream(){
  stream?.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:frontCam?'user':'environment',width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    vid.srcObject=stream;
    await vid.play();
    if(!running){running=true;requestAnimationFrame(loop);}
  }catch(e){alert('Camera: '+e.message);}
}
function flipCam(){frontCam=!frontCam;zoom=1;zlbl.textContent='1×';getStream();}

// ── BUFFERS ──────────────────────────────────────────────────────────────────
function allocBufs(w,h){
  CW=w; CH=h;
  const n=w*h;
  rawBuf   =new Uint8ClampedArray(n*4);
  lumaBuf  =new Float32Array(n);
  gxBuf    =new Float32Array(n);
  gyBuf    =new Float32Array(n);
  magBuf   =new Float32Array(n);
  nmsBuf   =new Float32Array(n);
  nightPrev=new Float32Array(n);
  document.getElementById('res').textContent=w+'×'+h;
}

function syncCanvas(){
  const w=mw.clientWidth|0, h=mw.clientHeight|0;
  if(w&&h&&(cv.width!==w||cv.height!==h)) allocBufs(cv.width=w, cv.height=h);
}

function drawCover(){
  const vw=vid.videoWidth, vh=vid.videoHeight;
  if(!vw)return;
  const sc=Math.max(CW/vw,CH/vh)*zoom;
  ctx.drawImage(vid,(CW-vw*sc)/2,(CH-vh*sc)/2,vw*sc,vh*sc);
}

// ── MAIN LOOP ────────────────────────────────────────────────────────────────
function loop(ts){
  requestAnimationFrame(loop);
  if(vid.readyState<2)return;
  syncCanvas(); if(!CW)return;
  fc++;
  if(ts-lastSec>=1000){document.getElementById('fps').textContent=fc+' FPS';fc=0;lastSec=ts;}
  drawCover();
  const id=ctx.getImageData(0,0,CW,CH);
  const d=id.data;
  rawBuf.set(d);
  const p1=parseFloat(s1.value), p2=parseFloat(s2.value);
  if(mode==='neon')    fNeon(d,p1,p2);
  else if(mode==='night')   fNight(d,p1,p2);
  else if(mode==='thermal') fThermal(d,p1,p2);
  else if(mode==='emboss')  fEmboss(d,p1,p2);
  else if(mode==='mirror')  fMirror(d,p1,p2);
  else if(mode==='duotone') fDuotone(d,p1,p2);
  ctx.putImageData(id,0,0);
}

// ── LUMA ─────────────────────────────────────────────────────────────────────
function calcLuma(boost){
  const n=CW*CH, s=rawBuf;
  for(let i=0,j=0;j<n;j++,i+=4)
    lumaBuf[j]=Math.sqrt(s[i]*.299+s[i+1]*.587+s[i+2]*.114)*boost*16;
}

function applyBlur() {
  const W = CW, H = CH, L = lumaBuf;
  const temp = new Float32Array(L.length);
  // True 3x3 Gaussian weighting: Center (4), Orthogonal (2), Diagonal (1)
  for (let y = 1; y < H - 1; y++) {
    const yo = y * W;
    for (let x = 1; x < W - 1; x++) {
      const j = yo + x;
      temp[j] = (
        (L[j - W - 1] + L[j - W + 1] + L[j + W - 1] + L[j + W + 1]) * 1 + // Diagonals
        (L[j - W] + L[j + W] + L[j - 1] + L[j + 1]) * 2 +               // Orthogonals
        (L[j] * 4)                                                      // Center
      ) / 16;
    }
  }
  lumaBuf.set(temp);
}


// ── GRADIENT ─────────────────────────────────────────────────────────────────
function computeGrad(k) {
  const W = CW, H = CH, L = lumaBuf, gx = gxBuf, gy = gyBuf, mg = magBuf;
  
  // 1. Clean the luma with the blur pass first
  applyBlur();

  // 2. Brightness multiplier (Higher = more sensitive/brighter lines)
  const boost = 1.5; 

  for (let y = 1; y < H - 1; y++) {
    const yo = y * W;
    for (let x = 1; x < W - 1; x++) {
      const j = yo + x;
      const tl = L[j - W - 1], tc = L[j - W], tr = L[j - W + 1];
      const ml = L[j - 1],             mr = L[j + 1];
      const bl = L[j + W - 1], bc = L[j + W], br = L[j + W + 1];
      
      let a = 0, b = 0;
      if (k === 'laplace') {
        a = (tl + tc + tr + ml + mr + bl + bc + br - 8 * L[j]);
      } else if (k === 'sobel') {
        a = (-1 * tl + 1 * tr - 2 * ml + 2 * mr - 1 * bl + 1 * br);
        b = (-1 * tl - 2 * tc - 1 * tr + 1 * bl + 2 * bc + 1 * br);
      } else if (k === 'prewitt') {
        a = (-1 * tl + 1 * tr - 1 * ml + 1 * mr - 1 * bl + 1 * br);
        b = (-1 * tl - 1 * tc - 1 * tr + 1 * bl + 1 * bc + 1 * br);
      } else {
        // Scharr
        a = (-3 * tl + 3 * tr - 10 * ml + 10 * mr - 3 * bl + 3 * br) / 16;
        b = (-3 * tl - 10 * tc - 3 * tr + 3 * bl + 10 * bc + 3 * br) / 16;
      }

      gx[j] = a * boost; 
      gy[j] = b * boost; 
      mg[j] = Math.sqrt(gx[j] * gx[j] + gy[j] * gy[j]);
    }
  }
}

// ── NMS ──────────────────────────────────────────────────────────────────────
function nms(thr){
  const W=CW,H=CH,mg=magBuf,nm=nmsBuf;
  for(let y=1;y<H-1;y++){
    const yo=y*W;
    for(let x=1;x<W-1;x++){
      const j=yo+x, m=mg[j];
      if(m<thr){nm[j]=0;continue;}
      const a=((Math.atan2(gyBuf[j],gxBuf[j])*4/Math.PI+8.5)|0)%4;
      const n1=a===0?mg[j-1]:a===1?mg[j-W+1]:a===2?mg[j-W]:mg[j-W-1];
      const n2=a===0?mg[j+1]:a===1?mg[j+W-1]:a===2?mg[j+W]:mg[j+W+1];
      nm[j]=(m>=n1&&m>=n2)?m:0;
    }
  }
}

// ── HYSTERESIS ───────────────────────────────────────────────────────────────
function hysteresis(lo,hi){
  const W=CW,H=CH,n=W*H,nm=nmsBuf;
  const mark=new Uint8Array(n);
  for(let j=0;j<n;j++) mark[j]=nm[j]>=hi?2:nm[j]>=lo?1:0;
  const stack=[];
  for(let j=0;j<n;j++) if(mark[j]===2) stack.push(j);
  while(stack.length){
    const j=stack.pop();
    for(const nb of [j-1,j+1,j-W,j+W,j-W-1,j-W+1,j+W-1,j+W+1])
      if(nb>=0&&nb<n&&mark[nb]===1){mark[nb]=2;stack.push(nb);}
  }
  for(let j=0;j<n;j++) nm[j]=mark[j]===2?magBuf[j]:0;
}

// ── FILTER: NEON (SMOOTH GRADIENT VERSION) ──────────────────────────────────
function fNeon(d,thr,boost){
  const W=CW,H=CH;
  
  // 1. Calculate Luma and Gradient, but skip the harsh NMS!
  calcLuma(boost);
  computeGrad(kernel); 

  // 2. Clear canvas to pitch black
  for(let i=0;i<d.length;i+=4){d[i]=0;d[i+1]=0;d[i+2]=0;d[i+3]=255;}

  const wid=parseInt(sw.value);

  for(let y=1;y<H-1;y++){
    const yo=y*W;
    for(let x=1;x<W-1;x++){
      const j=yo+x;
      
      // Use the raw, thick magnitude instead of the 1-pixel NMS buffer
      const m = magBuf[j];
      
      // Soft thresholding to cut out background noise
      if (m < thr) continue;

      const i = j * 4;

      // Smoothly scale the intensity based on how strong the edge is
      const intensityNorm = Math.min(1, m / 120); 
      // Add a slight floor so the visible edges remain punchy
      const intensity = Math.min(255, (intensityNorm * 255) + 30) | 0; 

      let r, g, b;
      if (colorMode === 'white') {
        r = g = b = intensity;
      } else if (colorMode === 'cyan') {
        r = 0; g = intensity; b = (intensity * 0.95) | 0;
      } else {
        const angle = Math.atan2(gyBuf[j], gxBuf[j]); 
        const hue = ((angle * (180 / Math.PI) + 360) % 360) | 0;
        r = (HLUT[hue * 3] * intensity) / 255;
        g = (HLUT[hue * 3 + 1] * intensity) / 255;
        b = (HLUT[hue * 3 + 2] * intensity) / 255;
      }

      // Max-blend the core pixel so intersecting edges blend beautifully
      if (r > d[i]) d[i] = r;
      if (g > d[i+1]) d[i+1] = g;
      if (b > d[i+2]) d[i+2] = b;

      // Spread rings for that classic Neon "Bloom"
      if(wid>=2){
        const r1=[j-1,j+1,j-W,j+W,j-W-1,j-W+1,j+W-1,j+W+1];
        for(const nj of r1){ 
          if(nj<0||nj>=W*H) continue; 
          const ni=nj*4, v=0.65; 
          if((r*v|0)>d[ni]) d[ni]=r*v|0; 
          if((g*v|0)>d[ni+1]) d[ni+1]=g*v|0; 
          if((b*v|0)>d[ni+2]) d[ni+2]=b*v|0; 
        }
      }
      if(wid>=3){
        const r2=[j-2,j+2,j-W*2,j+W*2];
        for(const nj of r2){ 
          if(nj<0||nj>=W*H) continue; 
          const ni=nj*4, v=0.35; 
          if((r*v|0)>d[ni]) d[ni]=r*v|0; 
          if((g*v|0)>d[ni+1]) d[ni+1]=g*v|0; 
          if((b*v|0)>d[ni+2]) d[ni+2]=b*v|0; 
        }
      }
      if(wid>=4){
        const r3=[j-3,j+3,j-W*3,j+W*3];
        for(const nj of r3){ 
          if(nj<0||nj>=W*H) continue; 
          const ni=nj*4, v=0.18; 
          if((r*v|0)>d[ni]) d[ni]=r*v|0; 
          if((g*v|0)>d[ni+1]) d[ni+1]=g*v|0; 
          if((b*v|0)>d[ni+2]) d[ni+2]=b*v|0; 
        }
      }
    }
  }
}
// ── FILTER: NIGHT ────────────────────────────────────────────────────────────
function fNight(d,gain,persistPct){
  const W=CW,H=CH,s=rawBuf,p=persistPct/100,wh=W/2,hh=H/2;
  for(let j=0,i=0;j<W*H;j++,i+=4){
    const L=(s[i]*.299+s[i+1]*.587+s[i+2]*.114)*gain*(1-p)+nightPrev[j]*p;
    nightPrev[j]=L;
    const gr=(Math.random()-.5)*18;
    const nx=(j%W-wh)/wh, ny=(j/W|0-hh)/hh;
    const out=Math.max(0,Math.min(255,(L+gr)*Math.max(0,1-(nx*nx+ny*ny)*.5)));
    d[i]=out*.06|0; d[i+1]=out|0; d[i+2]=out*.18|0; d[i+3]=255;
  }
}

// ── FILTER: THERMAL ──────────────────────────────────────────────────────────
function fThermal(d,contrast,edgeMix){
  const W=CW,H=CH,s=rawBuf;
  for(let i=0,j=0;i<d.length;i+=4,j++){
    const lu=s[i]*.299+s[i+1]*.587+s[i+2]*.114;
    lumaBuf[j]=lu;
    const lc=Math.max(0,Math.min(255,(lu-128)*contrast+128))|0;
    d[i]=TLUT[lc*3]; d[i+1]=TLUT[lc*3+1]; d[i+2]=TLUT[lc*3+2]; d[i+3]=255;
  }
  if(edgeMix<.01)return;
  for(let y=1;y<H-1;y++){const yo=y*W;for(let x=1;x<W-1;x++){
    const j=yo+x;
    const gx=-lumaBuf[j-W-1]-2*lumaBuf[j-1]-lumaBuf[j+W-1]+lumaBuf[j-W+1]+2*lumaBuf[j+1]+lumaBuf[j+W+1];
    const gy=-lumaBuf[j-W-1]-2*lumaBuf[j-W]-lumaBuf[j-W+1]+lumaBuf[j+W-1]+2*lumaBuf[j+W]+lumaBuf[j+W+1];
    const m=Math.min(1,Math.sqrt(gx*gx+gy*gy)/160)*edgeMix;
    if(m<.02)continue;
    const i=j*4;
    d[i]=d[i]+(255-d[i])*m|0; d[i+1]=d[i+1]+(255-d[i+1])*m|0; d[i+2]=d[i+2]+(255-d[i+2])*m|0;
  }}
}

// ── FILTER: EMBOSS ────────────────────────────────────────────────────────────
function fEmboss(d,depth,metallic){
  const W=CW,H=CH,s=rawBuf;
  const L=k=>{const p=k*4;return s[p]*.299+s[p+1]*.587+s[p+2]*.114;};
  for(let y=1;y<H-1;y++){const yo=y*W;for(let x=1;x<W-1;x++){
    const j=yo+x,i=j*4;
    const v=Math.max(0,Math.min(255,128+depth*(-L(j-W-1)-L(j-W)-L(j-W+1)-L(j-1)+L(j+1)+L(j+W-1)+L(j+W)+L(j+W+1))/4))|0;
    const sr=s[i],sg=s[i+1],sb=s[i+2],sm=Math.max(sr,sg,sb)||1;
    d[i]=v+(sr/sm*v-v)*metallic|0; d[i+1]=v+(sg/sm*v-v)*metallic|0; d[i+2]=v+(sb/sm*v-v)*metallic|0; d[i+3]=255;
  }}
}

// ── FILTER: MIRROR ────────────────────────────────────────────────────────────
function fMirror(d,mode,blend){
  const W=CW,H=CH,s=rawBuf,hw=W>>1,hh=H>>1;
  mode=mode|0;
  for(let y=0;y<H;y++){for(let x=0;x<W;x++){
    const i=(y*W+x)*4;let sx=x,sy=y;
    if(mode===0)sx=x<hw?x:W-1-x;
    else if(mode===1)sy=y<hh?y:H-1-y;
    else if(mode===2){sx=x<hw?x:W-1-x;sy=y<hh?y:H-1-y;}
    else{sx=y<hh?x:W-1-x;sy=y<hh?y:H-1-y;}
    const si=(sy*W+sx)*4;
    d[i]=s[si]*blend+s[i]*(1-blend)|0; d[i+1]=s[si+1]*blend+s[i+1]*(1-blend)|0;
    d[i+2]=s[si+2]*blend+s[i+2]*(1-blend)|0; d[i+3]=255;
  }}
}

// ── FILTER: DUOTONE ───────────────────────────────────────────────────────────
function fDuotone(d,h1,h2){
  const s=rawBuf;
  h1=((h1|0)%360+360)%360; h2=((h2|0)%360+360)%360;
  const r1=HLUT[h1*3],g1=HLUT[h1*3+1],b1=HLUT[h1*3+2];
  const r2=HLUT[h2*3],g2=HLUT[h2*3+1],b2=HLUT[h2*3+2];
  for(let i=0;i<d.length;i+=4){
    let t=(s[i]*.299+s[i+1]*.587+s[i+2]*.114)/255; t=t*t*(3-2*t);
    d[i]=r1+(r2-r1)*t|0; d[i+1]=g1+(g2-g1)*t|0; d[i+2]=b1+(b2-b1)*t|0; d[i+3]=255;
  }
}

function snap(){
  const fl=document.getElementById('flash');
  fl.style.opacity=1; setTimeout(()=>fl.style.opacity=0,100);
  const a=document.createElement('a');
  a.download='EDGECAM_'+mode+'_'+Date.now()+'.png';
  a.href=cv.toDataURL('image/png'); a.click();
}
