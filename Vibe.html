<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vibration Controller: Diagnostic Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #1a1a1a, #2d2d2d);
            --card-bg: #ffffff;
            --text-primary: #111;
            --text-secondary: #444;
            --accent: #ff3b30;
            --accent-hover: #cc2f26;
            --start-bg: #34c759;
            --start-hover: #2db04e;
            --slider-bg: #e5e5ea;
            --slider-thumb: #007aff;
            --btn-bg: #f2f2f7;
            --btn-active: #007aff;
            --btn-text-active: #fff;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0; 
            padding: 10px;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .control-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 12px;
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h2, h3 { margin: 0; color: var(--text-primary); }
        h2 { font-size: 1.2em; border-bottom: 2px solid var(--slider-bg); padding-bottom: 4px; }
        h3 { font-size: 0.8em; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

        .master-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .master-btn {
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 600;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
        }
        
        #startBtn { background-color: var(--start-bg); }
        #startBtn:active { background-color: var(--start-hover); }
        #stopBtn { background-color: var(--accent); }
        #stopBtn:active { background-color: var(--accent-hover); }

        /* Compact Dense Grid Layout */
        .pattern-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 4px;
        }

        .pattern-btn {
            padding: 6px 4px;
            background-color: var(--btn-bg);
            border: 1px solid #d1d1d6;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7em;
            font-weight: 600;
            transition: all 0.1s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }

        .pattern-btn.active {
            background-color: var(--btn-active);
            color: var(--btn-text-active);
            border-color: var(--btn-active);
        }

        .category-group {
            display: flex;
            flex-direction: column;
        }

        .slider-group {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #eee;
        }

        .slider-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            gap: 8px;
        }

        .slider-row:last-child { margin-bottom: 0; }
        .slider-row label { flex: 0 0 75px; font-size: 0.75em; font-weight: 600;}
        .slider-row input[type="range"] { flex: 1; cursor: pointer; }
        .slider-row span { flex: 0 0 45px; text-align: right; font-size: 0.75em; font-family: monospace; }

        .status {
            text-align: center;
            padding: 8px;
            background: var(--btn-bg);
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85em;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="control-section">
        <h2>Vibration API Diagnostics</h2>
        
        <div class="master-controls">
            <button class="master-btn" id="startBtn">Force Start</button>
            <button class="master-btn" id="stopBtn">Halt / Kill</button>
        </div>

        <div class="status" id="statusIndicator">STATE: OFFLINE</div>

        <!-- Dynamic Container for Category Grids -->
        <div id="categoryContainer" style="display: flex; flex-direction: column; gap: 10px;"></div>

        <!-- Manual Controls -->
        <div class="slider-group">
            <h3>Manual Override Parameters</h3>
            
            <div class="slider-row">
                <label title="Repeat count for the array">Cycles</label>
                <input type="range" id="intensity" min="1" max="20" value="5" step="1">
                <span id="intensityVal">5x</span>
            </div>
            
            <div class="slider-row">
                <label title="Vibration duration in milliseconds">Burst (ms)</label>
                <input type="range" id="burst" min="0.1" max="1000" value="200" step="0.1">
                <span id="burstVal">200.0</span>
            </div>
            
            <div class="slider-row">
                <label title="Silence duration in milliseconds">Gap (ms)</label>
                <input type="range" id="gap" min="0.1" max="1000" value="50" step="0.1">
                <span id="gapVal">50.0</span>
            </div>
        </div>
    </div>

    <script>
        // Array of 150 items to test browser array length limits (Chrome caps at 99)
        const longArrayTest = Array.from({length: 150}, (_, i) => i % 2 === 0 ? 50 : 20);

        const patterns = {
            "Stress & API Vectors": {
                'jackhammer': [50, 10, 50, 10, 50, 10, 50, 10, 50, 10], 
                'engine-rev': [100, 20, 200, 20, 300, 20, 400, 20, 500, 20],
                'maximum-lock': [10000, 1, 10000, 1, 10000],
                'micro-floats': [0.5, 0.5, 0.5, 0.5, 1.2, 1.2, 0.1, 0.1], 
                'zero-gaps': [200, 0, 200, 0, 200, 0, 200], 
                'array-limit': longArrayTest, 
                'exp-accel': [200, 200, 150, 150, 100, 100, 50, 50, 25, 25, 10, 10],
                'duty-swap': [10, 200, 200, 10, 10, 200, 200, 10]
            },
            "Alerts & Ringtones": {
                'sos-distress': [100, 50, 100, 50, 100, 200, 300, 50, 300, 50, 300, 200, 100, 50, 100, 50, 100, 500],
                'heartbeat': [150, 100, 150, 600],
                'fast-heart': [100, 60, 100, 300],
                'escalating': [500, 200, 400, 150, 300, 100, 200, 50, 100, 25],
                'fade-in': [10, 50, 20, 50, 40, 50, 80, 50, 150, 50, 300, 50],
                'fade-out': [300, 50, 150, 50, 80, 50, 40, 50, 20, 50, 10],
                'radar-ping': [30, 800, 30, 800],
                'triple-burst': [100, 80, 100, 80, 100, 400]
            },
            "UI Haptic Feedback": {
                'select-tick': [15],
                'success-double': [30, 60, 60],
                'error-triple': [60, 40, 60, 40, 60],
                'heavy-impact': [150],
                'ramp-up': [10, 30, 30, 30, 80],
                'long-press': [80, 40, 200],
                'toggle-on': [20, 40, 50],
                'toggle-off': [50, 40, 20]
            },
            "Sci-Fi & Machine FX": {
                'geiger-counter': [10, 120, 10, 300, 10, 50, 10, 400, 10, 80],
                'warp-drive': [10, 100, 20, 80, 40, 60, 80, 40, 160, 20],
                'laser-burst': [120, 30, 80, 30, 40, 30, 10],
                'cyber-pulse': [150, 50, 30, 50, 150, 50, 30, 50],
                'engine-idle': [40, 120, 40, 120, 40, 120],
                'shield-hit': [200, 40, 100, 40, 40]
            },
            "Rhythmic Melodies": {
                'happy-birthday': [200, 100, 100, 150, 300, 150, 300, 300, 200, 100, 100, 150, 300, 150, 400, 500],
                'smooth-criminal': [150, 100, 150, 50, 150, 250, 150, 50, 150, 250, 150, 50, 150, 200, 400, 500],
                '20th-century': [50, 50, 50, 50, 50, 150, 200, 100, 200, 100, 200, 200, 50, 50, 50, 50, 50, 150, 400, 600],
                'mario-theme': [150, 80, 150, 200, 150, 200, 150, 80, 150, 250, 300, 400],
                'imperial-march': [400, 200, 400, 200, 400, 200, 250, 100, 150, 100, 600, 400],
                'pink-panther': [100, 200, 100, 200, 100, 100, 100, 100, 300, 400],
                'star-wars-main': [500, 100, 500, 100, 500, 100, 350, 50, 150, 50, 500, 400],
                'zelda-secret': [100, 50, 100, 50, 100, 50, 100, 50, 100, 50, 100, 50, 100, 50, 300, 400],
                'tetris-theme': [300, 150, 150, 150, 150, 150, 300, 150, 150, 150, 300, 400],
                'beethoven-5th': [150, 100, 150, 100, 150, 300, 500, 600],
                'mission-imp': [200, 100, 200, 250, 200, 100, 200, 250, 100, 50, 100, 50, 200, 400],
                'pac-man': [80, 40, 80, 40, 80, 40, 80, 40, 160, 80, 160, 400]
            }
        };

        let currentPattern = null;
        let loopInterval = null;
        let isRunning = false;

        const dom = {
            container: document.getElementById('categoryContainer'),
            status: document.getElementById('statusIndicator'),
            start: document.getElementById('startBtn'),
            stop: document.getElementById('stopBtn'),
            sliders: {
                intensity: document.getElementById('intensity'),
                burst: document.getElementById('burst'),
                gap: document.getElementById('gap')
            },
            vals: {
                intensity: document.getElementById('intensityVal'),
                burst: document.getElementById('burstVal'),
                gap: document.getElementById('gapVal')
            }
        };

        function init() {
            renderDynamicCategories();
            
            dom.start.addEventListener('click', executeVibration);
            dom.stop.addEventListener('click', haltVibration);

            Object.keys(dom.sliders).forEach(key => {
                dom.sliders[key].addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    if (key === 'intensity') {
                        dom.vals[key].textContent = val + 'x';
                    } else {
                        dom.vals[key].textContent = val.toFixed(1); 
                    }
                    
                    if (isRunning && !currentPattern) executeVibration(); 
                });
            });
        }

        // Generates UI categories dynamically from the patterns object
        function renderDynamicCategories() {
            dom.container.innerHTML = '';
            
            Object.keys(patterns).forEach(categoryName => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'category-group';

                const title = document.createElement('h3');
                title.textContent = categoryName;

                const grid = document.createElement('div');
                grid.className = 'pattern-grid';

                Object.keys(patterns[categoryName]).forEach(patternKey => {
                    const btn = document.createElement('button');
                    btn.className = 'pattern-btn';
                    btn.title = patternKey.toUpperCase().replace(/-/g, ' ');
                    btn.textContent = patternKey.replace(/-/g, ' ');
                    
                    btn.onclick = () => {
                        document.querySelectorAll('.pattern-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentPattern = patterns[categoryName][patternKey];
                        if (isRunning) executeVibration();
                    };

                    grid.appendChild(btn);
                });

                groupDiv.appendChild(title);
                groupDiv.appendChild(grid);
                dom.container.appendChild(groupDiv);
            });
        }

        function getManualPattern() {
            const burst = parseFloat(dom.sliders.burst.value);
            const gap = parseFloat(dom.sliders.gap.value);
            const intensity = parseInt(dom.sliders.intensity.value, 10);
            let arr = [];
            
            for (let i = 0; i < intensity; i++) {
                arr.push(burst);
                if (i < intensity - 1) {
                    arr.push(gap);
                }
            }
            return arr;
        }

        function executeVibration() {
            if (!('vibrate' in navigator)) {
                dom.status.textContent = 'ERR: API NOT SUPPORTED';
                return;
            }
            
            haltVibration(false); 
            isRunning = true;
            dom.status.textContent = 'STATE: ACTUATOR ACTIVE';
            dom.status.style.backgroundColor = '#34c759';
            dom.status.style.color = '#fff';

            const payload = currentPattern || getManualPattern();
            const cycleDuration = payload.reduce((a, b) => a + b, 0);

            const trigger = () => {
                navigator.vibrate(payload);
                const timeoutDelay = Math.max(cycleDuration, 10); 
                loopInterval = setTimeout(trigger, timeoutDelay);
            };
            
            trigger();
        }

        function haltVibration(updateUI = true) {
            clearTimeout(loopInterval);
            navigator.vibrate(0); 
            isRunning = false;
            
            if (updateUI) {
                document.querySelectorAll('.pattern-btn').forEach(b => b.classList.remove('active'));
                currentPattern = null;
                dom.status.textContent = 'STATE: OFFLINE';
                dom.status.style.backgroundColor = 'var(--btn-bg)';
                dom.status.style.color = 'var(--text-primary)';
            }
        }

        init();
    </script>
</body>
</html>
