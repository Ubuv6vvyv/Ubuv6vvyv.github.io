<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pass the Parcel Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 30px;
            background-color: #f0f0f0;
            transition: background-color 0.3s;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 123, 255, 0.4);
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #maxDuration, #speedControl {
            flex: 1;
        }
        .file-input {
            margin-bottom: 15px;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            background-color: #e8f5e9;
            transition: all 0.3s ease;
    text-align: center;
    font-weight: bold;
    font-size: 1.2em;
        }
        .effects-panel {
            margin-top: 15px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
        .checkbox-group {
            display: flex;
            gap: 20px;
            margin: 10px 0;
        }
        @keyframes backgroundPulse {
            0% {
        background: linear-gradient(45deg, 
            rgba(255, 0, 0, 0.3) 0%,
            rgba(255, 154, 0, 0.3) 20%,
            rgba(208, 222, 33, 0.3) 40%,
            rgba(79, 220, 74, 0.3) 60%,
            rgba(63, 218, 216, 0.3) 80%,
            rgba(47, 201, 226, 0.3) 100%);
    }
    50% {
        background: linear-gradient(45deg,
            rgba(47, 201, 226, 0.6) 0%,
            rgba(255, 0, 0, 0.6) 20%,
            rgba(255, 154, 0, 0.6) 40%,
            rgba(208, 222, 33, 0.6) 60%,
            rgba(79, 220, 74, 0.6) 80%,
            rgba(63, 218, 216, 0.6) 100%);
    }
    100% {
        background: linear-gradient(45deg,
            rgba(255, 0, 0, 0.3) 0%,
            rgba(255, 154, 0, 0.3) 20%,
            rgba(208, 222, 33, 0.3) 40%,
            rgba(79, 220, 74, 0.3) 60%,
            rgba(63, 218, 216, 0.3) 80%,
            rgba(47, 201, 226, 0.3) 100%);
    }
}
        @keyframes stopFlash {
            0% {
        background-color: #f0f0f0;
        box-shadow: 0 0 0 rgba(255, 0, 0, 0);
    }
    25% {
        background-color: #ff0000;
        box-shadow: 0 0 50px rgba(255, 0, 0, 0.8);
    }
    75% {
        background-color: #ff0000;
        box-shadow: 0 0 100px rgba(255, 0, 0, 0.8);
    }
    100% {
        background-color: #f0f0f0;
        box-shadow: 0 0 0 rgba(255, 0, 0, 0);
    }
}
       .playing-animation {
    animation: backgroundPulse 3s infinite;
    background-size: 400% 1l400%;
    transition: all 0.3s ease;
}
   .stop-animation {
    animation: stopFlash 0.8s ease-in-out;
}

        
    </style>
</head>
<body>
    <div class="container">
        <h1>Pass the Parcel Game</h1>
        
        <div class="controls">
            <div class="file-input">
                <label for="audioFile">Select Music File:</label>
                <input type="file" id="audioFile" accept="audio/*">
            </div>
            
            <div class="slider-container">
                <label for="maxDuration">Maximum Duration (seconds):</label>
                <input type="range" id="maxDuration" min="15" max="60" value="20">
                <span id="durationValue">20</span>
            </div>

            <div class="slider-container">
                <label for="speedControl">Playback Speed:</label>
                <input type="range" id="speedControl" min="50" max="200" value="100" step="25">
                <span id="speedValue">1.0x</span>
            </div>
            
            <div class="effects-panel">
                <h3>Visual Effects</h3>
                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="pulseEffect" checked> 
                        Pulse During Play
                    </label>
                    <label>
                        <input type="checkbox" id="stopEffect" checked> 
                        Flash on Stop
                    </label>
                </div>
            </div>
            
            <audio id="audio" style="display: none;"></audio>
            
            <div>
                <button id="startButton" disabled>Start</button>
                <button id="stopButton" disabled>Stop</button>
                <button id="clearButton">Clear All</button>
            </div>
        </div>
        
        <div id="status">Ready to play! Select a music file to begin.</div>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const audioFile = document.getElementById('audioFile');
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const clearButton = document.getElementById('clearButton');
        const maxDuration = document.getElementById('maxDuration');
        const durationValue = document.getElementById('durationValue');
        const speedControl = document.getElementById('speedControl');
        const speedValue = document.getElementById('speedValue');
        const status = document.getElementById('status');
        const pulseEffect = document.getElementById('pulseEffect');
        const stopEffect = document.getElementById('stopEffect');
        
        let stopTimer;

        // Update duration value display
        maxDuration.addEventListener('input', () => {
            durationValue.textContent = maxDuration.value;
        });

        // Update speed value display and audio playback rate
        speedControl.addEventListener('input', () => {
            const speed = speedControl.value / 100;
            speedValue.textContent = `${speed.toFixed(1)}x`;
            audio.playbackRate = speed;
        });

        // Handle file selection
        audioFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                audio.src = url;
                startButton.disabled = false;
                status.textContent = `Music loaded: ${file.name}`;
            }
        });

        function startPulseEffect() {
            if (pulseEffect.checked) {
                document.body.classList.add('playing-animation');
            }
        }

        function stopPulseEffect() {
            document.body.classList.remove('playing-animation');
        }

        function triggerStopEffect() {
            if (stopEffect.checked) {
                document.body.classList.remove('playing-animation');
                document.body.classList.add('stop-animation');
                setTimeout(() => {
                    document.body.classList.remove('stop-animation');
                }, 500);
            }
        }

        // Start button handler
        startButton.addEventListener('click', () => {
            audio.play();
            startButton.disabled = true;
            stopButton.disabled = false;
            
            // Set random stop time between 5 and max duration
            const minTime = 5000; // 5 seconds
            const maxTime = maxDuration.value * 1000;
            const randomTime = Math.floor(Math.random() * (maxTime - minTime)) + minTime;
            
            status.textContent = 'Music playing... Pass the parcel!';
            startPulseEffect();
            
            // Set timer for random stop
            stopTimer = setTimeout(() => {
                audio.pause();
                startButton.disabled = false;
                stopButton.disabled = true;
                status.textContent = 'Music stopped! Check who has the parcel!';
                stopPulseEffect();
                triggerStopEffect();
            }, randomTime);
        });

        // Stop button handler
        stopButton.addEventListener('click', () => {
            audio.pause();
            startButton.disabled = false;
            stopButton.disabled = true;
            clearTimeout(stopTimer);
            status.textContent = 'Game paused. Press Start to continue.';
            stopPulseEffect();
        });

        // Clear button handler
        clearButton.addEventListener('click', () => {
            audio.pause();
            audio.src = '';
            audioFile.value = '';
            startButton.disabled = true;
            stopButton.disabled = true;
            clearTimeout(stopTimer);
            status.textContent = 'Ready to play! Select a music file to begin.';
            stopPulseEffect();
        });

        // When audio ends naturally
        audio.addEventListener('ended', () => {
            startButton.disabled = false;
            stopButton.disabled = true;
            clearTimeout(stopTimer);
            status.textContent = 'Music ended. Load new music or restart.';
            stopPulseEffect();
        });
    </script>
</body>
</html>
