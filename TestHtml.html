<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor</title>
    <style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #ffffff;
        color: #000;
        max-width: 1200px;
        margin: 0 auto;
    }
    .section {
        background-color: #ffffff;
        border: 1px solid #ddd;
        padding: 10px;
        margin: 20px 0;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .section-title {
        margin-top: 0;
        color: #333;
        font-size: 1.2em;
        font-weight: 700;
        margin-bottom: 10px;
    }
    textarea {
        width: 100%;
        height:  400px;
        font-family: 'Courier New', monospace;
        font-size: 11px;
        padding: 5px;
        border: 2px solid #ccc;
        border-radius: 6px;
        background-color: #f9f9f9;
        color: #333;
        transition: all 0.3s ease;
    }
    textarea:focus {
        border-color: #4CAF50;
        outline: none;
        background-color: #fff;
    }
.button-group {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* 4 equal-width columns */
    grid-template-rows: repeat(2, auto); /* 2 rows */
    gap: 4px; /* Space between items */
}

    button {
        padding: 4px 5px;
        font-size: 12px;
        font-weight: 500;
        border: 1px solid #333;
        border-radius: 5px;
        background-color: #4681f4;
        color: #fff;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
    }
    button:hover {
        background-color: #555;
        transform: scale(1.05);
    }
    button:active {
        transform: scale(1);
    }
    .diff-content {
        white-space: pre-wrap;
        font-family: 'Courier New', monospace;
        font-size: 10px;
    }
    .added {
        background-color: #e6ffe6;
        padding: 2px;
    }
    .removed {
        background-color: #ffe6e6;
        padding: 2px;
    }
    .highlight {
        background-color: #ffeb3b;
        padding: 2px;
    }
    .search-box {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
    }
    .search-box input {
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 10px;
    }
    .search-count {
        color: #666;
        font-size: 0.9em;
        margin-left: 10px;
    }
    /* Styling specific to Text Tools section */
.text-tools-section {
    border: 1px solid #ddd;
    padding: 20px;
    margin: 20px 0;
    border-radius: 8px;
    background-color: #f9f9f9;
}.text-tools-title {
    font-size: 1.2em;
    color: #333;
    margin-bottom: 15px;
}

/* Styling for the search boxes within Text Tools */
.text-tools-search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    align-items: center;
}

.text-tools-search-box input {
    padding: 10px;
    width: 200px;
    font-size: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background-color: #fff;
}

.text-tools-search-box button {
    padding: 8px 15px;
    font-size: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background-color: #111;
    cursor: pointer;
    transition: background-color 0.3s;
}

.text-tools-search-box button:hover {
    background-color: #e9ecef;
}

.text-tools-search-count {
    color: #666;
    font-size: 0.85em;
    margin-left: 10px;
}

/* Button group styling */
.text-tools-button-group {
    display: flex;
    gap: 12px;
    margin-bottom: 15px;
}

.text-tools-button-group button {
    padding: 8px 15px;
    font-size: 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background-color: #09f;
    cursor: pointer;
    transition: background-color 0.3s;
}

.text-tools-button-group button:hover {
    background-color: #e9ecef;
}

/* Styling for the regex section */
.text-tools-search-box select {
    padding: 10px;
    font-size: 12px;
    border: 1px solid #ddd;
    border-radius: 4px;
    background-color: #ddd;
    width: 200px;
}

/* Responsive design for smaller screens */
@media (max-width: 768px) {
    .text-tools-search-box {
        flex-direction: column;
        gap: 8px;
    }

    .text-tools-button-group {
        flex-direction: column;
        gap: 10px;
    }

    .text-tools-search-box input,
    .text-tools-search-box select,
    .text-tools-search-box button,
    .text-tools-button-group button {
        width: 100%;
    }
}

</style>


        
</head>
<body>
    <div class="section">
        <h2 class="section-title">Main Editor</h2>
        <textarea id="code-textarea" placeholder="Enter or paste code here..."></textarea>
        <div class="button-group">
<button onclick="undoChange()">Undo</button>
            <button onclick="copyToClipboard()">Copy</button>
            <button onclick="clearEditor()">Clear</button>
            <button onclick="openInNewTab()">Open in New Tab</button>
            <button onclick="handleFileOpen()">Open File</button>
            <button onclick="saveFile()">Save File</button>
            <button onclick="minifyCode()">Minify</button>
            <button onclick="beautifyCode()">Beautify</button>
        </div>
    </div>
    
    <div class="text-tools-section">
    <h2 class="text-tools-title">Text Tools</h2>
    <div class="text-tools-search-box">
        <input type="text" id="find-input" placeholder="Find text">
        <input type="text" id="replace-input" placeholder="Replace with">
        <button onclick="findAndReplace()">Replace All</button>
        <span class="text-tools-search-count" id="match-count"></span>
    </div>
    <div class="text-tools-button-group">
        <button onclick="filterLines()">Filter Lines</button>
        <button onclick="removeEmptyLines()">Remove Empty Lines</button>
        <button onclick="removeDuplicateLines()">Remove Duplicate Lines</button>
    </div>
    <div class="text-tools-search-box">
        <input type="text" id="regex-input" placeholder="Enter regex pattern">
        <button onclick="applyRegex()">Apply Regex</button>
        <select id="regex-action">
            <option value="highlight">Highlight Matches</option>
            <option value="extract">Extract Matches</option>
            <option value="remove">Remove Matches</option>
        </select>
    </div>
</div>



    <div class="section">
        <h2 class="section-title">Diff Checker</h2>
        <textarea id="original-code" placeholder="Original code"></textarea>
        <textarea id="new-code" placeholder="Modified code"></textarea>
        <div class="button-group">
            <button onclick="checkDiff()">Compare</button>
        </div>
        <div id="diff-output" class="diff-content"></div>
    </div>

    <script>
        // Undo functionality
        let undoHistory = [];
        const codeTextarea = document.getElementById("code-textarea");

        codeTextarea.addEventListener("input", () => {
            if (undoHistory.length === 0 || undoHistory[undoHistory.length - 1] !== codeTextarea.value) {
                undoHistory.push(codeTextarea.value);
            }
        });

        function undoChange() {
            if (undoHistory.length > 1) {
                undoHistory.pop();
                codeTextarea.value = undoHistory[undoHistory.length - 1];
            } else {
                alert("Nothing to undo!");
            }
        }

        // File handling
        function handleFileOpen() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.html,.js,.css,.txt';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = e => document.getElementById('code-textarea').value = e.target.result;
                reader.readAsText(file);
            };
            input.click();
        }

        function saveFile() {
            const code = document.getElementById('code-textarea').value;
            const blob = new Blob([code], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'code.txt';
            a.click();
        }

        function openInNewTab() {
            const code = document.getElementById('code-textarea').value;
            const blob = new Blob([code], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        }
        
        function findAndReplace() {
            const textarea = document.getElementById('code-textarea');
            const findText = document.getElementById('find-input').value;
            const replaceText = document.getElementById('replace-input').value;
            
            if (!findText) return;
            
            const regex = new RegExp(findText, 'g');
            const matches = textarea.value.match(regex);
            document.getElementById('match-count').textContent = 
                matches ? `${matches.length} matches found` : 'No matches found';
            
            textarea.value = textarea.value.replace(regex, replaceText);
        }

        function filterLines() {
            const textarea = document.getElementById('code-textarea');
            const filterText = document.getElementById('find-input').value;
            
            if (!filterText) return;
            
            const lines = textarea.value.split('\n');
            const filteredLines = lines.filter(line => line.includes(filterText));
            textarea.value = filteredLines.join('\n');
        }

        function removeEmptyLines() {
            const textarea = document.getElementById('code-textarea');
            const lines = textarea.value.split('\n');
            const nonEmptyLines = lines.filter(line => line.trim());textarea.value = nonEmptyLines.join('\n');
        }

        function removeDuplicateLines() {
            const textarea = document.getElementById('code-textarea');
            const lines = textarea.value.split('\n');
            const uniqueLines = [...new Set(lines)];
            textarea.value = uniqueLines.join('\n');
        }

        function applyRegex() {
            const textarea = document.getElementById('code-textarea');
            const pattern = document.getElementById('regex-input').value;
            const action = document.getElementById('regex-action').value;
            
            if (!pattern) return;
            
            try {
                const regex = new RegExp(pattern, 'g');
                const text = textarea.value;
                
                switch (action) {
                    case 'highlight':
                        const matches = text.match(regex);
                        document.getElementById('match-count').textContent = 
                            matches ? `${matches.length} matches found` : 'No matches found';
                        break;
                    case 'extract':
                        const extracted = text.match(regex);
                        textarea.value = extracted ? extracted.join('\n') : '';
                        break;
                    case 'remove':
                        textarea.value = text.replace(regex, '');
                        break;
                }
            } catch (e) {
                alert('Invalid regex pattern');
            }
        }


        // Diff Checker
        function checkDiff() {
            const original = document.getElementById('original-code').value;
            const modified = document.getElementById('new-code').value;

            const originalLines = original.split('\n');
            const modifiedLines = modified.split('\n');
            const output = document.getElementById('diff-output');
            output.innerHTML = '';

            originalLines.forEach((line, index) => {
                const modifiedLine = modifiedLines[index] || '';
                if (line !== modifiedLine) {
                    const spanAdded = document.createElement('span');
                    const spanRemoved = document.createElement('span');
                    
                    spanRemoved.textContent = `- ${line}\n`;
                    spanRemoved.className = 'removed';

                    spanAdded.textContent = `+ ${modifiedLine}\n`;
                    spanAdded.className = 'added';

                    output.appendChild(spanRemoved);
                    output.appendChild(spanAdded);
                } else {
                    const spanEqual = document.createElement('span');
                    spanEqual.textContent = `  ${line}\n`;
                    output.appendChild(spanEqual);
                }
            });
        }

        // Code manipulation
        function minifyCode() {
            const textarea = document.getElementById('code-textarea');
            let code = textarea.value;

            code = code.replace(/\/\*[\s\S]*?\*\/|\/\/.*/g, '') // Remove comments
                       .replace(/\s+/g, ' ')                  // Remove extra spaces
                       .replace(/>\s+</g, '><');              // Inline HTML tags

            textarea.value = code.trim();
        }

        function beautifyCode() {
            const textarea = document.getElementById('code-textarea');
            let code = textarea.value;
            const INDENT = '    '; // Indentation (4 spaces)
            let level = 0;

            textarea.value = code
                .split(/(?<=[{};>])|(?=<)/) // Split at logical points (e.g., `{`, `;`, `<`)
                .map(part => {
                    part = part.trim();
                    if (!part) return '';

                    if (part.startsWith('}') || part.startsWith(']') || part.startsWith(')')) level--; // Decrease level on closing braces
                    const indented = `${INDENT.repeat(Math.max(level, 0))}${part}`; // Ensure level >= 0
                    if (part.endsWith('{') || part.endsWith('[') || part.endsWith('(')) level++; // Increase level on opening braces
                    return indented;
                })
                .join('\n')
                .trim(); // Trim final output
        }

        function copyToClipboard() {
            const textarea = document.getElementById('code-textarea');
            textarea.select();
            document.execCommand('copy');
        }

        function clearEditor() {
            document.getElementById('code-textarea').value = '';
        }
    </script>



</body></html>
