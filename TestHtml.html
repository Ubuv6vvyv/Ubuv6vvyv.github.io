
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor</title>
    <style>
        #code-textarea {
            width: 100%;
            height: 300px;
            font-size: 12px;
            padding: 10px;
        }
        button {
            margin: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Code Editor</h1>
    <textarea id="code-textarea"></textarea>
    <button id="open-in-new-tab-btn">Open Code in New Tab</button>
    <button id="clear-all-btn">Clear All</button>
    <button id="copy-all-btn">Copy All</button>

    <script>
        const codeTextarea = document.getElementById('code-textarea');
        const openInNewTabBtn = document.getElementById('open-in-new-tab-btn');
        const clearAllBtn = document.getElementById('clear-all-btn');
        const copyAllBtn = document.getElementById('copy-all-btn');

        openInNewTabBtn.addEventListener('click', () => {
            const code = codeTextarea.value;
            const blob = new Blob([code], {type: 'text/html'});
            const url = URL.createObjectURL(blob);
            window.open(url, '_blank');
        });

        clearAllBtn.addEventListener('click', () => {
            codeTextarea.value = '';
        });

        copyAllBtn.addEventListener('click', () => {
            codeTextarea.select();
            document.execCommand('copy');
        });
    </script>
</body>
</html>
