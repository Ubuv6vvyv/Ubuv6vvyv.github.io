<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chaos Engine - Enhanced</title>
<style>
:root{--bg-color:#0a0a0a;--surface-color:#141414;--primary-color:#ff3366;--primary-variant-color:#ff6699;--secondary-color:#00ff88;--on-surface-color:#e8e8e8;--on-surface-variant-color:#999;--border-color:#333;--off-color:#222;--danger-color:#ff0040}
*{box-sizing:border-box}
body{font-family:'Courier New',monospace;background:linear-gradient(135deg,var(--bg-color) 0%,#1a0a0a 100%);color:var(--on-surface-color);display:flex;justify-content:center;align-items:flex-start;margin:0;padding:8px 4px;user-select:none;min-height:100vh}
#app-container{width:100%;max-width:390px;padding:12px;background:linear-gradient(145deg,var(--surface-color) 0%,#1a1a1a 100%);border-radius:16px;box-shadow:0 8px 32px rgba(255,51,102,0.1),inset 0 1px 0 rgba(255,255,255,0.1);border:2px solid var(--border-color);position:relative}
#app-container::before{content:'';position:absolute;top:-2px;right:-2px;bottom:-2px;left:-2px;background:linear-gradient(45deg,var(--primary-color),var(--secondary-color),var(--primary-color));border-radius:16px;z-index:-1;opacity:0.3}
.control-group{padding:12px 10px;border-bottom:1px solid var(--border-color);transition:all 0.2s ease}
.control-group:hover{background:rgba(255,51,102,0.03)}
.control-group:last-child{border-bottom:none}
.label{font-size:0.7em;font-weight:700;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;color:var(--on-surface-variant-color);text-transform:uppercase;letter-spacing:1px}
.section-header{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
input[type="range"]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;height:16px;margin:4px 0}
input[type="range"]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--bg-color) 0%,var(--primary-color) 50%,var(--danger-color) 100%);height:4px;border-radius:2px;box-shadow:inset 0 1px 3px rgba(0,0,0,0.5)}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;margin-top:-7px;background:radial-gradient(circle,var(--primary-color) 0%,var(--danger-color) 100%);height:18px;width:18px;border-radius:50%;box-shadow:0 0 8px var(--primary-color),0 2px 4px rgba(0,0,0,0.3);border:2px solid #fff;transition:all 0.1s ease}
input[type="range"]:active::-webkit-slider-thumb{transform:scale(1.2);box-shadow:0 0 16px var(--primary-color)}
.button-container{display:flex;gap:10px;margin-bottom:10px}
button,.select-css{flex-grow:1;padding:10px 12px;font-size:0.8em;font-weight:700;border:none;border-radius:8px;background:linear-gradient(135deg,var(--primary-color) 0%,var(--danger-color) 100%);color:#fff;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:all 0.2s ease;box-shadow:0 2px 8px rgba(255,51,102,0.3)}
button:hover,.select-css:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(255,51,102,0.4)}
button:active{transform:translateY(0);box-shadow:0 1px 4px rgba(255,51,102,0.2)}
.toggle-btn{background:linear-gradient(135deg,var(--off-color) 0%,#333 100%);color:var(--on-surface-variant-color);padding:6px 12px;font-size:0.7em;height:28px;flex-grow:0;min-width:70px}
.toggle-btn.active{background:linear-gradient(135deg,var(--secondary-color) 0%,#00cc66 100%);color:#000;font-weight:800;box-shadow:0 0 12px var(--secondary-color)}
.preset-buttons{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.preset-buttons button{background:linear-gradient(135deg,#333 0%,#555 100%);color:var(--on-surface-variant-color);font-size:0.7em;padding:8px 10px;flex:1;min-width:60px}
.preset-buttons button.active{background:linear-gradient(135deg,var(--secondary-color) 0%,#00cc66 100%);color:#000;box-shadow:0 0 8px var(--secondary-color)}
.chaos-preset{background:linear-gradient(135deg,var(--danger-color) 0%,#cc0033 100%)!important;color:#fff!important;animation:chaosGlow 2s ease-in-out infinite alternate}
@keyframes chaosGlow{0%{box-shadow:0 0 8px var(--danger-color)}100%{box-shadow:0 0 16px var(--danger-color),0 0 24px rgba(255,0,64,0.3)}}
.value-display{font-weight:600;color:var(--primary-color);text-shadow:0 0 4px var(--primary-color)}
.hidden-section{display:none}
.chaos-mode{animation:chaosFlicker 0.1s ease-in-out infinite}
@keyframes chaosFlicker{0%,100%{opacity:1}50%{opacity:0.95}}
.intensity-high .control-group{border-color:var(--danger-color);box-shadow:inset 0 0 10px rgba(255,0,64,0.1)}
#chaos-indicator{position:absolute;top:10px;right:10px;width:12px;height:12px;border-radius:50%;background:var(--secondary-color);opacity:0;transition:opacity 0.3s ease}
#chaos-indicator.active{opacity:1;animation:chaosGlow 1s ease-in-out infinite alternate}
</style>
</head>
<body>
<div id="app-container">
<div id="chaos-indicator"></div>

<div class="control-group">
<div class="button-container">
<button id="startButton">◄◄ ENGAGE ►►</button>
<button id="stopButton">■ KILL ■</button>
<button id="chaosButton">⚡ CHAOS ⚡</button>
</div>
<label class="label">
<span>⚡ MAIN POWER ⚡</span>
<span class="value-display" id="masterGainValue">50%</span>
</label>
<input type="range" id="masterGain" min="0" max="1" step="0.01" value="0.5">
</div>

<div class="control-group">
<div class="label"><span>🤖 CORE OSCILLATOR 🤖</span></div>
<label class="label">
<span>Primary Frequency</span>
<span class="value-display" id="osc1PitchValue">150 Hz</span>
</label>
<input type="range" id="osc1-pitch" min="0" max="1500" step="1" value="300">
<div class="preset-buttons" id="osc1-wave">
<button data-wave="sine">Sine</button>
<button data-wave="square">Square</button>
<button data-wave="triangle">Triangle</button>
<button class="active" data-wave="sawtooth">Saw</button>
</div>
<label class="label" style="margin-top:10px;">
<span>Sub-Bass Intensity</span>
<span class="value-display" id="subMixValue">50%</span>
</label>
<input type="range" id="sub-mix" min="0" max="1" step="0.01" value="0.5">
</div>

<div class="control-group">
<div class="section-header">
<div class="label" style="margin-bottom:0;">🔥 DISTORTION & CHAOS 🔥</div>
<button class="toggle-btn" id="toggle-grit">OFF</button>
</div>
<div id="grit-controls" class="hidden-section">
<label class="label">
<span>Overdrive Brutality</span>
<span class="value-display" id="driveValue">25%</span>
</label>
<input type="range" id="drive" min="0" max="100" step="1" value="25">
<label class="label" style="margin-top:8px;">
<span>Harmonic Multiplier</span>
<span class="value-display" id="fmRatioValue">1.50x</span>
</label>
<input type="range" id="fm-ratio" min="0.1" max="25" step="0.01" value="1.5">
<label class="label">
<span>Chaos Depth</span>
<span class="value-display" id="fmDepthValue">150</span>
</label>
<input type="range" id="fm-depth" min="0" max="5000" step="1" value="150">
<label class="label">
<span>Noise Injection</span>
<span class="value-display" id="noiseValue">0%</span>
</label>
<input type="range" id="noise-level" min="0" max="100" step="1" value="0">
</div>
</div>

<div class="control-group">
<div class="section-header">
<div class="label" style="margin-bottom:0;">📡 ECHO CHAMBER 📡</div>
<button class="toggle-btn" id="toggle-echo">OFF</button>
</div>
<div id="echo-controls" class="hidden-section">
<label class="label">
<span>Echo Time</span>
<span class="value-display" id="delayTimeValue">0.20 s</span>
</label>
<input type="range" id="delay-time" min="0.01" max="2.0" step="0.01" value="0.2">
<label class="label">
<span>Echo Feedback</span>
<span class="value-display" id="delayFeedbackValue">0%</span>
</label>
<input type="range" id="delay-feedback" min="0" max="0.98" step="0.01" value="0">
</div>
</div>

<div class="control-group">
<div class="section-header">
<div class="label" style="margin-bottom:0;">🎛️ VOCAL FILTER 🎛️</div>
<button class="toggle-btn" id="toggle-filter">OFF</button>
</div>
<div id="filter-controls" class="hidden-section">
<select id="filter-type" class="select-css" style="margin-bottom:8px;">
<option value="lowpass">Darken</option>
<option value="highpass">Thin Out</option>
<option value="bandpass" selected>Vocalize</option>
<option value="notch">Notch Cut</option>
<option value="allpass">Phase Shift</option>
</select>
<div id="vocal-spread-control">
<label class="label">
<span>Vocal Spread</span>
<span class="value-display" id="vocalSpreadValue">400</span>
</label>
<input type="range" id="vocal-spread" min="0" max="2000" step="1" value="400">
</div>
<label class="label">
<span>Cutoff Frequency</span>
<span class="value-display" id="filterCutoffValue">458 Hz</span>
</label>
<input type="range" id="filter-cutoff" min="0" max="1500" step="1" value="600">
<label class="label">
<span>Resonance/Q</span>
<span class="value-display" id="filterQValue">12.0</span>
</label>
<input type="range" id="filter-q" min="0" max="50" step="0.1" value="12.0">
</div>
</div>

<div class="control-group">
<div class="section-header">
<div class="label" style="margin-bottom:0;">🌊 MOTION CONTROL 🌊</div>
</div>
<div class="label" style="margin-top:8px;">
<span>Rhythmic Gate</span>
<button class="toggle-btn" id="toggle-pulse">OFF</button>
</div>
<div id="pulse-controls" class="hidden-section">
<label class="label">
<span>Gate Speed</span>
<span class="value-display" id="pulseSpeedValue">2.0 Hz</span>
</label>
<input type="range" id="pulse-speed" min="0.1" max="100" step="0.1" value="2.0">
<label class="label">
<span>Gate Depth</span>
<span class="value-display" id="pulseDepthValue">100%</span>
</label>
<input type="range" id="pulse-depth" min="0" max="1" step="0.01" value="1">
</div>
<div class="label" style="margin-top:8px;">
<span>Filter Wah</span>
<button class="toggle-btn" id="toggle-wah">OFF</button>
</div>
<div id="wah-controls" class="hidden-section">
<label class="label">
<span>Wah Speed</span>
<span class="value-display" id="wahSpeedValue">1.0 Hz</span>
</label>
<input type="range" id="wah-speed" min="0.1" max="50" step="0.1" value="1.0">
<label class="label">
<span>Wah Depth</span>
<span class="value-display" id="wahDepthValue">1500</span>
</label>
<input type="range" id="wah-depth" min="0" max="12000" step="10" value="1500">
</div>
<div class="label" style="margin-top:8px;">
<span>Pitch Wobble</span>
<button class="toggle-btn" id="toggle-wobble">OFF</button>
</div>
<div id="wobble-controls" class="hidden-section">
<label class="label">
<span>Wobble Speed</span>
<span class="value-display" id="wobbleSpeedValue">8.0 Hz</span>
</label>
<input type="range" id="wobble-speed" min="0.1" max="100" step="0.1" value="8.0">
<label class="label">
<span>Wobble Depth</span>
<span class="value-display" id="wobbleDepthValue">50 cents</span>
</label>
<input type="range" id="wobble-depth" min="0" max="2400" step="1" value="50">
</div>
</div>

<div class="control-group">
<div class="label"><span>📈 ENVELOPE SHAPING 📈</span></div>
<label class="label">
<span>Attack Time</span>
<span class="value-display" id="attackValue">0.10 s</span>
</label>
<input type="range" id="attack" min="0.001" max="3" step="0.001" value="0.1">
<label class="label">
<span>Sustain Level</span>
<span class="value-display" id="sustainValue">100%</span>
</label>
<input type="range" id="sustain" min="0" max="1" step="0.01" value="1.0">
<label class="label">
<span>Release Time</span>
<span class="value-display" id="releaseValue">1.00 s</span>
</label>
<input type="range" id="release" min="0.001" max="8" step="0.001" value="1.0">
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- AUDIO CONTEXT AND NODE DECLARATIONS ---
    let audioContext, masterGain, envelope, preFilterMix, distortion, filter1, filter2, filterMix, pulseGate, delay, feedbackGain, panner;
    let osc1, osc2, fmGain, osc2Gain, subOsc, subGain, noiseSource, noiseGain;
    let wobbleLFO, wobbleGain, wahLFO, wahGain, pulseLFO, pulseGain, chaosLFO, chaosGain;
    let isPlaying = false, isAudioSetup = false, chaosMode = false, chaosInterval = null;

    const smoothTime = 0.008;
    const minF = 20, maxF = 20000;
    const logRange = Math.log(maxF / minF);
    const convertToLog = (val, maxVal) => minF * Math.exp(logRange * val / maxVal);

    // --- INITIALIZATION ---
    function makeDistortionCurve(amount) {
        if (amount <= 0) return null;
        const k = Math.pow(amount * 0.01, 0.7) * 50;
        const samples = 44100;
        const curve = new Float32Array(samples);
        for (let i = 0; i < samples; i++) {
            const x = (i * 2) / samples - 1;
            const abs_x = Math.abs(x);
            curve[i] = x * (1 + k * abs_x) / (1 + k * abs_x * abs_x);
            curve[i] = Math.tanh(curve[i] * (1 + amount * 0.02));
        }
        return curve;
    }

    function createNoiseBuffer() {
        if (!audioContext) return;
        const bufferSize = audioContext.sampleRate * 2;
        const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
        const output = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
        }
        return buffer;
    }

    function initAudioEngine() {
        if (isAudioSetup) return;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        masterGain = audioContext.createGain();
        envelope = audioContext.createGain();
        panner = audioContext.createStereoPanner();
        preFilterMix = audioContext.createGain();
        distortion = audioContext.createWaveShaper();
        filter1 = audioContext.createBiquadFilter();
        filter2 = audioContext.createBiquadFilter();
        filterMix = audioContext.createGain();
        pulseGate = audioContext.createGain();
        delay = audioContext.createDelay(2.0);
        feedbackGain = audioContext.createGain();

        osc1 = audioContext.createOscillator();
        osc2 = audioContext.createOscillator();
        osc2Gain = audioContext.createGain();
        fmGain = audioContext.createGain();
        subOsc = audioContext.createOscillator();
        subGain = audioContext.createGain();
        
        noiseSource = audioContext.createBufferSource();
        noiseSource.buffer = createNoiseBuffer();
        noiseSource.loop = true;
        noiseGain = audioContext.createGain();

        wobbleLFO = audioContext.createOscillator();
        wobbleGain = audioContext.createGain();
        wahLFO = audioContext.createOscillator();
        wahGain = audioContext.createGain();
        pulseLFO = audioContext.createOscillator();
        pulseGain = audioContext.createGain();
        chaosLFO = audioContext.createOscillator();
        chaosGain = audioContext.createGain();

        // --- ROUTING ---
        osc1.connect(preFilterMix);
        osc2.connect(osc2Gain);
        osc2Gain.connect(preFilterMix);
        subOsc.connect(subGain);
        subGain.connect(preFilterMix);
        noiseSource.connect(noiseGain);
        noiseGain.connect(preFilterMix);

        preFilterMix.connect(distortion);
        distortion.connect(filter1);
        distortion.connect(filter2);
        filter1.connect(filterMix);
        filter2.connect(filterMix);
        filterMix.connect(pulseGate);
        pulseGate.connect(panner);
        panner.connect(envelope);
        envelope.connect(masterGain);
        masterGain.connect(audioContext.destination);

        osc2.connect(fmGain);
        fmGain.connect(osc1.frequency);
        
        chaosLFO.connect(chaosGain);
        chaosGain.connect(osc1.frequency);
        chaosGain.connect(osc2.frequency);
        
        pulseGate.connect(delay);
        delay.connect(feedbackGain);
        feedbackGain.connect(delay);
        delay.connect(envelope);

        wobbleLFO.connect(wobbleGain);
        wobbleGain.connect(osc1.detune);
        wobbleGain.connect(osc2.detune);
        wahLFO.connect(wahGain);
        wahGain.connect(filter1.frequency);
        wahGain.connect(filter2.frequency);

        const pulseOffset = audioContext.createConstantSource();
        pulseOffset.offset.value = 1;
        pulseOffset.start();
        pulseLFO.connect(pulseGain);
        pulseGain.connect(pulseGate.gain);
        pulseOffset.connect(pulseGate.gain);

        // Start all persistent sources
        osc1.start(); osc2.start(); subOsc.start();
        wobbleLFO.start(); wahLFO.start(); pulseLFO.start(); chaosLFO.start();
        noiseSource.start();

        isAudioSetup = true;
    }

    // --- AUDIO START/STOP ---
    function startAudio() {
        if (isPlaying) return;
        initAudioEngine();
        if (audioContext.state === 'suspended') audioContext.resume();
        isPlaying = true;
        document.getElementById('startButton').classList.add('active');
        updateAllParams();
        triggerAttack();
    }

    function stopAudio() {
        if (!isPlaying || !isAudioSetup) return;
        triggerRelease();
        isPlaying = false;
        document.getElementById('startButton').classList.remove('active');
        if (chaosMode) toggleChaosMode(); // Turn off chaos mode when stopping
    }

    // --- ENVELOPE ---
    function triggerAttack() {
        if (!isAudioSetup) return;
        const now = audioContext.currentTime;
        const attackTime = parseFloat(document.getElementById('attack').value);
        const sustainLevel = parseFloat(document.getElementById('sustain').value);
        envelope.gain.cancelScheduledValues(now);
        envelope.gain.setValueAtTime(envelope.gain.value, now);
        envelope.gain.exponentialRampToValueAtTime(sustainLevel, now + attackTime);
    }

    function triggerRelease() {
        if (!isAudioSetup) return;
        const now = audioContext.currentTime;
        const releaseTime = parseFloat(document.getElementById('release').value);
        envelope.gain.cancelScheduledValues(now);
        envelope.gain.setValueAtTime(envelope.gain.value, now);
        envelope.gain.exponentialRampToValueAtTime(0.0001, now + releaseTime);
    }
    
    // CHAOS MODE
    function toggleChaosMode() {
        chaosMode = !chaosMode;
        const btn = document.getElementById('chaosButton');
        const indicator = document.getElementById('chaos-indicator');
        const container = document.getElementById('app-container');

        btn.classList.toggle('chaos-preset', chaosMode);
        container.classList.toggle('chaos-mode', chaosMode);
        indicator.classList.toggle('active', chaosMode);

        if (chaosMode) {
            btn.textContent = '🔥 CHAOS ON 🔥';
            // Prevent multiple intervals
            if (chaosInterval) clearInterval(chaosInterval);
            chaosInterval = setInterval(() => {
                if (!chaosMode) {
                    clearInterval(chaosInterval);
                    return;
                }
                const controls = ['osc1-pitch', 'fm-ratio', 'fm-depth', 'filter-cutoff', 'wobble-speed', 'pulse-speed'];
                const randomControlId = controls[Math.floor(Math.random() * controls.length)];
                const element = document.getElementById(randomControlId);
                if (element) {
                    const range = parseFloat(element.max) - parseFloat(element.min);
                    const newValue = parseFloat(element.min) + Math.random() * range;
                    element.value = newValue;
                    updateAllParams(); // Update sound after random change
                }
            }, 500 + Math.random() * 1000);
        } else {
            btn.textContent = '⚡ CHAOS ⚡';
            if (chaosInterval) clearInterval(chaosInterval);
            chaosInterval = null;
            chaosGain.gain.setTargetAtTime(0, audioContext.currentTime, smoothTime); // Reset chaos gain
        }
    }

    // --- MASTER UPDATE FUNCTION ---
    function updateAllParams() {
        if (!isAudioSetup) return;
        const now = audioContext.currentTime;

        // --- Read all UI values first ---
        const masterGainValue = parseFloat(document.getElementById('masterGain').value);
        
        const osc1PitchSlider = document.getElementById('osc1-pitch');
        const osc1Freq = convertToLog(osc1PitchSlider.value, 1500);
        const osc1Wave = document.querySelector('#osc1-wave .active')?.dataset.wave ?? 'sawtooth';
        
        const fmRatio = parseFloat(document.getElementById('fm-ratio').value);
        const osc2Freq = osc1Freq * fmRatio;
        const fmWave = document.querySelector('#fm-wave .active')?.dataset.wave ?? 'sawtooth';
        const isGritOn = document.getElementById('toggle-grit').classList.contains('active');
        const fmDepth = isGritOn ? parseFloat(document.getElementById('fm-depth').value) : 0;
        
        const subMix = parseFloat(document.getElementById('sub-mix').value);
        const drive = isGritOn ? parseFloat(document.getElementById('drive').value) : 0;
        const noiseLevel = isGritOn ? parseFloat(document.getElementById('noise-level').value) * 0.01 : 0;
        
        const isEchoOn = document.getElementById('toggle-echo').classList.contains('active');
        const delayTime = parseFloat(document.getElementById('delay-time').value);
        const delayFeedback = isEchoOn ? parseFloat(document.getElementById('delay-feedback').value) : 0;
        
        const isFilterOn = document.getElementById('toggle-filter').classList.contains('active');
        const filterType = document.getElementById('filter-type').value;
        const filterCutoffSlider = document.getElementById('filter-cutoff');
        const baseFilterFreq = convertToLog(filterCutoffSlider.value, 1500);
        const filterFreq = isFilterOn ? baseFilterFreq : 20000;
        const filterQ = isFilterOn ? parseFloat(document.getElementById('filter-q').value) : 1;
        const vocalSpread = parseFloat(document.getElementById('vocal-spread').value);
        
        const isPulseOn = document.getElementById('toggle-pulse').classList.contains('active');
        const pulseSpeed = parseFloat(document.getElementById('pulse-speed').value);
        const pulseDepth = isPulseOn ? parseFloat(document.getElementById('pulse-depth').value) : 0;
        
        const isWahOn = document.getElementById('toggle-wah').classList.contains('active');
        const wahSpeed = parseFloat(document.getElementById('wah-speed').value);
        const wahDepth = isWahOn ? parseFloat(document.getElementById('wah-depth').value) : 0;
        
        const isWobbleOn = document.getElementById('toggle-wobble').classList.contains('active');
        const wobbleSpeed = parseFloat(document.getElementById('wobble-speed').value);
        const wobbleDepth = isWobbleOn ? parseFloat(document.getElementById('wobble-depth').value) : 0;

        // --- Update Audio Nodes ---
        masterGain.gain.setTargetAtTime(masterGainValue, now, smoothTime);
        
        osc1.type = osc1Wave;
        osc1.frequency.setTargetAtTime(osc1Freq, now, smoothTime);
        
        osc2.type = fmWave;
        osc2.frequency.setTargetAtTime(osc2Freq, now, smoothTime);
        fmGain.gain.setTargetAtTime(fmDepth, now, smoothTime);
        osc2Gain.gain.setTargetAtTime(Math.max(0.1, 1 - fmDepth / 1000), now, smoothTime);

        subOsc.type = 'sine';
        subOsc.frequency.setTargetAtTime(osc1Freq * 0.5, now, smoothTime);
        subGain.gain.setTargetAtTime(subMix, now, smoothTime);
        
        distortion.curve = makeDistortionCurve(drive);
        noiseGain.gain.setTargetAtTime(noiseLevel, now, smoothTime);

        delay.delayTime.setTargetAtTime(delayTime, now, smoothTime);
        feedbackGain.gain.setTargetAtTime(delayFeedback, now, smoothTime);
        
        document.getElementById('vocal-spread-control').style.display = (filterType === 'bandpass' && isFilterOn) ? 'block' : 'none';
        if (filterType === 'bandpass' && isFilterOn) {
            filter1.type = 'bandpass';
            filter2.type = 'bandpass';
            filter1.frequency.setTargetAtTime(filterFreq, now, smoothTime);
            filter2.frequency.setTargetAtTime(filterFreq + vocalSpread, now, smoothTime);
            filter1.Q.setTargetAtTime(filterQ, now, smoothTime);
            filter2.Q.setTargetAtTime(filterQ * 0.7, now, smoothTime);
            filterMix.gain.setTargetAtTime(1, now, smoothTime);
        } else {
            filter1.type = filterType;
            filter1.frequency.setTargetAtTime(filterFreq, now, smoothTime);
            filter1.Q.setTargetAtTime(filterQ, now, smoothTime);
            filter2.frequency.setTargetAtTime(20000, now, smoothTime); // Effectively bypass filter2
            filterMix.gain.setTargetAtTime(1, now, smoothTime);
        }
        
        pulseLFO.frequency.setTargetAtTime(pulseSpeed, now, smoothTime);
        pulseGain.gain.setTargetAtTime(-pulseDepth, now, smoothTime);
        
        wahLFO.frequency.setTargetAtTime(wahSpeed, now, smoothTime);
        wahGain.gain.setTargetAtTime(wahDepth, now, smoothTime);
        
        wobbleLFO.frequency.setTargetAtTime(wobbleSpeed, now, smoothTime);
        wobbleGain.gain.setTargetAtTime(wobbleDepth, now, smoothTime);
        
        if (chaosMode) {
            chaosLFO.frequency.setTargetAtTime(Math.random() * 30 + 5, now, smoothTime);
            chaosGain.gain.setTargetAtTime(Math.random() * 200 + 50, now, smoothTime);
        }

        // --- Update UI Displays ---
        document.getElementById('masterGainValue').textContent = `${Math.round(masterGainValue*100)}%`;
        document.getElementById('osc1PitchValue').textContent = `${Math.round(osc1Freq)} Hz`;
        document.getElementById('subMixValue').textContent = `${Math.round(subMix*100)}%`;
        document.getElementById('driveValue').textContent = `${Math.round(drive)}%`;
        document.getElementById('fmRatioValue').textContent = `${fmRatio.toFixed(2)}x`;
        document.getElementById('fmDepthValue').textContent = `${Math.round(fmDepth)}`;
        document.getElementById('noiseValue').textContent = `${Math.round(noiseLevel*100)}%`;
        document.getElementById('delayTimeValue').textContent = `${delayTime.toFixed(2)} s`;
        document.getElementById('delayFeedbackValue').textContent = `${Math.round(delayFeedback*100)}%`;
        document.getElementById('filterCutoffValue').textContent = `${Math.round(baseFilterFreq)} Hz`;
        document.getElementById('vocalSpreadValue').textContent = `${Math.round(vocalSpread)}`;
        document.getElementById('filterQValue').textContent = filterQ.toFixed(1);
        document.getElementById('pulseSpeedValue').textContent = `${pulseSpeed.toFixed(1)} Hz`;
        document.getElementById('pulseDepthValue').textContent = `${Math.round(pulseDepth*100)}%`;
        document.getElementById('wahSpeedValue').textContent = `${wahSpeed.toFixed(1)} Hz`;
        document.getElementById('wahDepthValue').textContent = `${Math.round(wahDepth)}`;
        document.getElementById('wobbleSpeedValue').textContent = `${wobbleSpeed.toFixed(1)} Hz`;
        document.getElementById('wobbleDepthValue').textContent = `${Math.round(wobbleDepth)} cents`;
        document.getElementById('attackValue').textContent = `${parseFloat(document.getElementById('attack').value).toFixed(2)} s`;
        document.getElementById('sustainValue').textContent = `${Math.round(parseFloat(document.getElementById('sustain').value) * 100)}%`;
        document.getElementById('releaseValue').textContent = `${parseFloat(document.getElementById('release').value).toFixed(2)} s`;
    }

    // --- EVENT LISTENERS ---
    document.getElementById('startButton').addEventListener('click', startAudio);
    document.getElementById('stopButton').addEventListener('click', stopAudio);
    document.getElementById('chaosButton').addEventListener('click', toggleChaosMode);
    
    document.getElementById('app-container').addEventListener('input', updateAllParams);
    
    document.querySelectorAll('.preset-buttons button, .toggle-btn').forEach(button => {
        button.addEventListener('click', (e) => {
            if (e.target.classList.contains('toggle-btn')) {
                e.target.classList.toggle('active');
                e.target.textContent = e.target.classList.contains('active') ? 'ON' : 'OFF';
                const controlsId = e.target.id.replace('toggle-', '') + '-controls';
                const controlsEl = document.getElementById(controlsId);
                if (controlsEl) controlsEl.classList.toggle('hidden-section');
            } else {
                const parent = e.target.parentElement;
                if(parent.querySelector('.active')) parent.querySelector('.active').classList.remove('active');
                e.target.classList.add('active');

            }
            updateAllParams();
        });
    });

    // Special handler for Hold Level which re-triggers the envelope
     document.getElementById('sustain').addEventListener('input', e => {
        if (isPlaying) triggerAttack();
        document.getElementById('sustainValue').textContent = `${Math.round(e.target.value * 100)}%`;
    });
});
</script>
</body>
</html>
