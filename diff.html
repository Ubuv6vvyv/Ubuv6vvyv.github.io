<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Diff Checker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .diff-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.4;
            resize: vertical;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            background-color: #0066cc;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0052a3;
        }

        button.secondary {
            background-color: #666;
        }

        button.apply {
            background-color: #28a745;
        }

        button.revert {
            background-color: #dc3545;
        }

        .diff-viewer {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 20px;
            margin-top: 20px;
        }

        .diff-line {
            font-family: 'Consolas', 'Monaco', monospace;
            padding: 2px 8px;
            margin: 2px 0;
            display: flex;
            align-items: center;
            border-radius: 3px;
        }

        .diff-line:hover {
            background-color: #f8f9fa;
        }

        .line-number {
            color: #666;
            padding-right: 10px;
            user-select: none;
            width: 40px;
            text-align: right;
            font-size: 12px;
        }

        .diff-content {
            flex-grow: 1;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .diff-removed {
            background-color: #ffe6e6;
        }

        .diff-added {
            background-color: #e6ffe6;
        }

        .diff-modified {
            background-color: #e6f3ff;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
            margin-left: 10px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .diff-line:hover .action-buttons {
            opacity: 1;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stats {
            margin-bottom: 10px;
            color: #666;
        }

        .highlight {
            background-color: #fff3cd;
        }

        #search {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Advanced Diff Checker</h1>
        </div>

        <div class="diff-container">
            <textarea id="original" placeholder="Original code..."></textarea>
            <textarea id="modified" placeholder="Modified code..."></textarea>
        </div>

        <div class="controls">
            <button onclick="compareDiff()">Compare Changes</button>
            <button class="secondary" onclick="swapTexts()">Swap Texts</button>
            <button class="secondary" onclick="clearAll()">Clear All</button>
            <input type="text" id="search" placeholder="Search in diff...">
            <button onclick="searchDiff()">Search</button>
        </div>

        <div class="filters">
            <div class="filter-checkbox">
                <input type="checkbox" id="showAdded" checked>
                <label for="showAdded">Show Additions</label>
            </div>
            <div class="filter-checkbox">
                <input type="checkbox" id="showRemoved" checked>
                <label for="showRemoved">Show Removals</label>
            </div>
            <div class="filter-checkbox">
                <input type="checkbox" id="showUnchanged" checked>
                <label for="showUnchanged">Show Unchanged</label>
            </div>
        </div>

        <div class="stats" id="stats"></div>
        <div class="diff-viewer" id="diffOutput"></div>
    </div>

    <script>
        let currentDiff = [];

        function compareDiff() {
            const original = document.getElementById('original').value.split('\n');
            const modified = document.getElementById('modified').value.split('\n');
            const output = document.getElementById('diffOutput');
            
            currentDiff = [];
            output.innerHTML = '';
            
            let additions = 0, removals = 0, unchanged = 0;
            
            let i = 0, j = 0;
            while (i < original.length || j < modified.length) {
                const originalLine = original[i] || '';
                const modifiedLine = modified[j] || '';
                
                if (originalLine === modifiedLine) {
                    // Unchanged line
                    currentDiff.push({
                        type: 'unchanged',
                        content: originalLine,
                        originalIndex: i,
                        modifiedIndex: j
                    });
                    unchanged++;
                    i++;
                    j++;
                } else {
                    // Check for modifications
                    let found = false;
                    const lookAhead = 3; // Number of lines to look ahead
                    
                    // Look for the next matching line
                    for (let k = 1; k <= lookAhead && i + k < original.length; k++) {
                        if (original[i + k] === modifiedLine) {
                            // Found a match, mark previous lines as removed
                            for (let l = 0; l < k; l++) {
                                currentDiff.push({
                                    type: 'removed',
                                    content: original[i + l],
                                    originalIndex: i + l,
                                    modifiedIndex: null
                                });
                                removals++;
                            }
                            i += k;
                            found = true;
                            break;
                        }
                    }
                    
                    if (!found) {
                        // Look for the original line in modified text
                        for (let k = 1; k <= lookAhead && j + k < modified.length; k++) {
                            if (modified[j + k] === originalLine) {
                                // Found a match, mark previous lines as added
                                for (let l = 0; l < k; l++) {
                                    currentDiff.push({
                                        type: 'added',
                                        content: modified[j + l],
                                        originalIndex: null,
                                        modifiedIndex: j + l
                                    });
                                    additions++;
                                }
                                j += k;
                                found = true;
                                break;
                            }
                        }
                        
                        if (!found) {
                            // No match found, mark as removed and added
                            currentDiff.push({
                                type: 'removed',
                                content: originalLine,
                                originalIndex: i,
                                modifiedIndex: null
                            });
                            currentDiff.push({
                                type: 'added',
                                content: modifiedLine,
                                originalIndex: null,
                                modifiedIndex: j
                            });
                            removals++;
                            additions++;
                            i++;
                            j++;
                        }
                    }
                }
            }
            
            updateStats(additions, removals, unchanged);
            renderDiff();
            
            // Update filter event listeners
            document.querySelectorAll('.filter-checkbox input').forEach(checkbox => {
                checkbox.addEventListener('change', renderDiff);
            });
        }

        function renderDiff() {
            const output = document.getElementById('diffOutput');
            output.innerHTML = '';
            
            const showAdded = document.getElementById('showAdded').checked;
            const showRemoved = document.getElementById('showRemoved').checked;
            const showUnchanged = document.getElementById('showUnchanged').checked;
            
            currentDiff.forEach((line, index) => {
                if (
                    (line.type === 'added' && !showAdded) ||
                    (line.type === 'removed' && !showRemoved) ||
                    (line.type === 'unchanged' && !showUnchanged)
                ) {
                    return;
                }
                
                const div = document.createElement('div');
                div.className = `diff-line diff-${line.type}`;
                
                const lineNumber = document.createElement('span');
                lineNumber.className = 'line-number';
                lineNumber.textContent = line.originalIndex !== null ? (line.originalIndex + 1) : (line.modifiedIndex + 1);
                
                const content = document.createElement('span');
                content.className = 'diff-content';
                content.textContent = line.content;
                
                const actions = document.createElement('span');
                actions.className = 'action-buttons';
                
                if (line.type !== 'unchanged') {
                    const applyButton = document.createElement('button');
                    applyButton.className = 'apply';
                    applyButton.textContent = line.type === 'added' ? 'Keep' : 'Delete';
                    applyButton.onclick = () => applyChange(index);
                    actions.appendChild(applyButton);
                    
                    const revertButton = document.createElement('button');
                    revertButton.className = 'revert';
                    revertButton.textContent = 'Revert';
                    revertButton.onclick = () => revertChange(index);
                    actions.appendChild(revertButton);
                }
                
                div.appendChild(lineNumber);
                div.appendChild(content);
                div.appendChild(actions);
                output.appendChild(div);
            });
        }

        function applyChange(index) {
            const line = currentDiff[index];
            const originalText = document.getElementById('original');
            const modifiedText = document.getElementById('modified');
            
            if (line.type === 'added') {
                originalText.value = originalText.value.split('\n')
                    .splice(line.modifiedIndex, 0, line.content)
                    .join('\n');
            } else if (line.type === 'removed') {
                const lines = originalText.value.split('\n');
                lines.splice(line.originalIndex, 1);
                originalText.value = lines.join('\n');
            }
            
            compareDiff();
        }

        function revertChange(index) {
            const line = currentDiff[index];
            const modifiedText = document.getElementById('modified');
            
            if (line.type === 'added') {
                const lines = modifiedText.value.split('\n');
                lines.splice(line.modifiedIndex, 1);
                modifiedText.value = lines.join('\n');
            } else if (line.type === 'removed') {
                const lines = modifiedText.value.split('\n');
                lines.splice(line.originalIndex, 0, line.content);
                modifiedText.value = lines.join('\n');
            }
            
            compareDiff();
        }

        function updateStats(additions, removals, unchanged) {
            const stats = document.getElementById('stats');
            stats.textContent = `Changes: ${additions} additions, ${removals} removals, ${unchanged} unchanged lines`;
        }

        function searchDiff() {
            const searchTerm = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('.diff-line').forEach(line => {
                const content = line.querySelector('.diff-content').textContent.toLowerCase();
                if (content.includes(searchTerm)) {
                    line.classList.add('highlight');
                } else {
                    line.classList.remove('highlight');
                }
            });
        }

        function swapTexts() {
            const original = document.getElementById('original');
            const modified = document.getElementById('modified');
            [original.value, modified.value] = [modified.value, original.value];
            compareDiff();
        }

        function clearAll() {
            document.getElementById('original').value = '';
            document.getElementById('modified').value = '';
            document.getElementById('diffOutput').innerHTML = '';
            document.getElementById('stats').textContent = '';
            currentDiff = [];
        }

        // Add event listener for search input
        document.getElementById('search').addEventListener('keyup', searchDiff);
    </script>
</body>
  </html>
