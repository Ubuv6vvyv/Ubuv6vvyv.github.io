<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.5">
  <title>Loose Sliders, Terrible Code. Don't do this.</title>
  <style>
    :root {
      --background: #111;
      --text: #fff;
      --rope-color: #66ccff;

      --track-height: 350px;

      --margin-vert: 30px;
    }
    body {
      background: var(--background);
      color: var(--text);
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.5rem;
      color: var(--rope-color);
    }
    .slider-container {
      position: relative;
      width: 90%;
      max-width: 500px;
      height: var(--track-height);
      margin: 40px auto;
      border: 1px solid #333;
      background: #222;
      border-radius: 8px;
      overflow: hidden;
    }
    .slider-title {
      position: absolute;
      top: -28px;
      left: 10px;
      font-size: 1rem;
      font-weight: bold;
      color: var(--rope-color);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    input[type="range"] {

      position: absolute;
      top: calc(50% - 11px);
      width: 100%;
      -webkit-appearance: none;
      background: transparent;
      z-index: 2;
    }
    input[type="range"]:focus {
      outline: none;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      background: var(--rope-color);
      border: 2px solid #fff;
      border-radius: 50%;
      margin-top: -11px;
      cursor: pointer;
      position: relative;
      z-index: 3;
      box-shadow: 0 0 10px rgba(102,204,255,0.5);
    }
    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      background: var(--rope-color);
      border: 2px solid #fff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(102,204,255,0.5);
    }
    input[type="range"]::-moz-range-track {
      height: 4px;
      background: transparent;
    }
    .value-display {
      position: absolute;
      right: 10px;
      top: 10px;
      font-size: 1rem;
      color: var(--rope-color);
    }
p {
text-align: center;
}
  </style>
</head>
<body>
  <h1>Pure Garbage Idiot Sliders</h1>
<p>Drag these experimental slider elements side to side to see the horrifying UI designs of the future</p>

  <!-- Variation 1: Elastic Rope -->
  <div class="slider-container" id="rope-slider-1">
<h5> Complete Flop Rope </h5>
    <div class="slider-title">Elastic Rope</div>
    <canvas id="canvas-1"></canvas>
    <input type="range" min="0" max="100" value="100">
    <div class="value-display">100</div>
  </div>

  <!-- Variation 2: Wavy Rope -->
  <div class="slider-container" id="rope-slider-2">
<h5> Stubborn Rope </h5>
    <div class="slider-title">Wavy Rope</div>
    <canvas id="canvas-2"></canvas>
    <input type="range" min="0" max="100" value="10">
    <div class="value-display">10</div>
  </div>

  <!-- Variation 3: Jitter Rope -->
  <div class="slider-container" id="rope-slider-3">
<h5> Anxious Electric Rope </h5>
    <div class="slider-title">Jitter Rope</div>
    <canvas id="canvas-3"></canvas>
    <input type="range" min="0" max="100" value="10">
    <div class="value-display">10</div>
  </div>

  <!-- Variation 4: Pendulum Rope -->

<h5> Garden Hose Gone Wild </h5>
    <div class="slider-title">Pendulum Rope</div>

  <!-- Variation 5: Spiral Rope -->
  <div class="slider-container" id="rope-slider-5">
<h5> Spin Rope </h5>
    <div class="slider-title">Spiral Rope</div>
    <canvas id="canvas-5"></canvas>
    <input type="range" min="0" max="100" value="1">
    <div class="value-display">1</div>
  </div>

  <script>

    class Point {
      constructor(x, y, oldx = x, oldy = y) {
        this.x = x; 
        this.y = y;
        this.oldx = oldx; 
        this.oldy = oldy;
        this.vx = 0; 
        this.vy = 0;
        this.pinned = false;
      }
      update(gravity, friction = 0.97) {
        if (this.pinned) return;
        this.vx = (this.x - this.oldx) * friction;
        this.vy = (this.y - this.oldy) * friction;
        this.oldx = this.x; 
        this.oldy = this.y;
        this.x += this.vx;
        this.y += this.vy + gravity;
      }
      setPosition(x, y) {
        this.x = x; 
        this.y = y;
      }
    }
    class Stick {
      constructor(p0, p1, length = null) {
        this.p0 = p0; 
        this.p1 = p1;
        this.length = length || Math.hypot(p1.x - p0.x, p1.y - p0.y);
        this.tension = 0.1;
      }
      update() {
        const dx = this.p1.x - this.p0.x;
        const dy = this.p1.y - this.p0.y;
        const dist = Math.hypot(dx, dy);
        const diff = (this.length - dist) * this.tension;
        if (dist === 0) return;
        const percent = diff / dist / 2;
        const offsetX = dx * percent;
        const offsetY = dy * percent;
        if (!this.p0.pinned) { this.p0.x -= offsetX; this.p0.y -= offsetY; }
        if (!this.p1.pinned) { this.p1.x += offsetX; this.p1.y += offsetY; }
      }
      draw(ctx, lineWidth = 8, color = "#66ccff") {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = lineWidth;
        ctx.lineCap = "round";
        ctx.moveTo(this.p0.x, this.p0.y);
        ctx.lineTo(this.p1.x, this.p1.y);
        ctx.stroke();
      }
    }

    function getSliderRatio(slider) {
      return (slider.value - slider.min) / (slider.max - slider.min);
    }

    function clampY(y, canvasHeight) {
      const margin = 35; 
      return Math.max(margin, Math.min(y, canvasHeight - margin));
    }

    function initRopeSlider1() {
      const container = document.getElementById('rope-slider-1');
      const slider = container.querySelector('input[type="range"]');
      const canvas = document.getElementById('canvas-1');
      const ctx = canvas.getContext('2d');
      let width = slider.offsetWidth;
      let height = container.offsetHeight;
      canvas.width = width;
      canvas.height = height;

      const gravity = 0.1; 
      const segments = 25;
      const spacing = width / segments;
      const points = [];
      const sticks = [];

      function createRope() {
        points.length = 0;
        sticks.length = 0;
        for (let i = 0; i <= segments; i++) {
          const x = i * spacing;

          const y = height / 1 + Math.sin(i * 1) * 3;
          const p = new Point(x, y);

          p.pinned = (i === segments);
          points.push(p);
        }
        for (let i = 0; i < segments; i++) {
          const stick = new Stick(points[i], points[i+1]);
          stick.tension = 0.2;
          sticks.push(stick);
        }
      }

      function setThumb() {
        const t = getSliderRatio(slider);
        const x = t * width;
        const thumb = points[segments];
        if (thumb) { thumb.setPosition(x, height / 2); }
      }

      function update() {
        setThumb();
        for (let i = 0; i < points.length; i++) {
          if (i !== segments) {
            points[i].update(gravity);

            points[i].y = clampY(points[i].y, canvas.height);
          }
        }
        for (let j = 0; j < 4; j++) {
          sticks.forEach(stick => stick.update());
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.strokeStyle = "#66ccff";
        ctx.lineWidth = 8;
        ctx.lineCap = "round";
        ctx.stroke();
      }

      function animate() {
        update();
        draw();
        requestAnimationFrame(animate);
      }

      let dragging = false;
      canvas.addEventListener("mousedown", e => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        if (Math.hypot(points[0].x - mouseX, points[0].y - mouseY) < 15) {
          dragging = true;
        }
      });
      canvas.addEventListener("mousemove", e => {
        if (dragging) {
          const rect = canvas.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const mouseY = e.clientY - rect.top;
          points[0].setPosition(mouseX, mouseY);
        }
      });
      canvas.addEventListener("mouseup", () => { dragging = false; });
      canvas.addEventListener("mouseleave", () => { dragging = false; });

      slider.addEventListener("input", () => {
        container.querySelector(".value-display").textContent = slider.value;
      });
      window.addEventListener("resize", () => {
        width = slider.offsetWidth;
        canvas.width = width;
        height = container.offsetHeight;
        createRope();
      });

      createRope();
      animate();
    }

      canvas.width = width;

      const segments = 12;

      function createRope() {
        points.length = 0;
        sticks.length = 0;
        for (let i = 0; i <= segments; i++) {
          const x = i * spacing;

          const y = height / 2 + Math.sin(i * 0.8) * 50;
          const p = new Point(x, y);
          p.pinned = (i === segments);
          points.push(p);

        for (let i = 0; i < segments; i++) {
          const stick = new Stick(points[i], points[i + 1]);
          stick.tension = 0.8;
          sticks.push(stick);
        }
      }

      function setThumb() {
        const t = getSliderRatio(slider);
        const x = t * width;
        const thumb = points[segments];
        if (thumb) {
          thumb.setPosition(x, height / 2 + Math.sin(segments * 0.8) * 30);
        }
      }

      function update() {
        setThumb();
        for (let i = 0; i < points.length; i++) {
          if (i !== segments) {
            points[i].update(gravity);

            points[i].y = clampY(points[i].y, canvas.height);
          }
        }
        for (let j = 0; j < 4; j++) {
          sticks.forEach(stick => stick.update());
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.strokeStyle = "#66ccff";
        ctx.lineWidth = 8;
        ctx.stroke();
      }

      function animate() {
        update();
        draw();
        requestAnimationFrame(animate);
      }

      slider.addEventListener("input", () => {
        container.querySelector(".value-display").textContent = slider.value;
      });
      window.addEventListener("resize", () => {
        width = slider.offsetWidth;
        canvas.width = width;
        createRope();
      });

      createRope();
      animate();
    }

    function initRopeSlider3() {
      const container = document.getElementById('rope-slider-3');
      const slider = container.querySelector('input[type="range"]');
      const canvas = document.getElementById('canvas-3');
      const ctx = canvas.getContext('2d');
      let width = slider.offsetWidth;
      let height = container.offsetHeight;
      canvas.width = width;
      canvas.height = height;

      const gravity = 0.007;
      const segments = 40;
      const spacing = width / segments;
      const points = [];

      function createRope() {
        points.length = 0;

        for (let i = 0; i <= segments; i++) {

          const p = new Point(x, y);
          p.pinned = (i === segments);
          points.push(p);
        }
        for (let i = 0; i < segments; i++) {
          const stick = new Stick(points[i], points[i + 1]);
          stick.tension = 0.85;

      }

      function setThumb() {
        const t = getSliderRatio(slider);

      }

      function update() {

        for (let i = 0; i < points.length; i++) {

            points[i].x += (Math.random() - 0.5) * 2;
            points[i].y += (Math.random() - 0.5) * 2;

      slider.addEventListener("input", () => {

    function initRopeSlider4() {
      const container = document.getElementById('rope-slider-4');
      const slider = container.querySelector('input[type="range"]');
      const canvas = document.getElementById('canvas-4');
      const ctx = canvas.getContext('2d');
      let width = slider.offsetWidth;
      let height = container.offsetHeight;
      canvas.width = width;
      canvas.height = height;

      const gravity = 0.3;
      const segments = 20;
      const spacing = width / (segments * 2);
      const points = [];
      const sticks = [];

      function createRope() {
        points.length = 0;
        sticks.length = 0;
        for (let i = 0; i <= segments; i++) {
          const x = i * spacing;

          const y = height / 2 + (i / segments) * 20;
          const p = new Point(x, y);
          p.pinned = (i === segments);
          points.push(p);
        }
        for (let i = 0; i < segments; i++) {
          const stick = new Stick(points[i], points[i + 1]);
          stick.tension = 0.05;
          sticks.push(stick);
        }
      }

      function setThumb() {
        const t = getSliderRatio(slider);
        const x = t * width;
        const thumb = points[segments];
        if (thumb) { thumb.setPosition(x, height / 2 + 0.1); }
      }

      function update() {
        setThumb();
        const time = Date.now() * 0.003;
        for (let i = 0; i < points.length; i++) {
          if (i !== segments) {
            points[i].update(gravity);

            points[i].x += Math.sin(time + i * 0.8) * 2;
            points[i].y = clampY(points[i].y, canvas.height);
          }
        }
        for (let j = 0; j < 4; j++) {

        ctx.clearRect(0, 0, width, height);

        }
        ctx.strokeStyle = "#66ccff";
        ctx.lineWidth = 8;
        ctx.stroke();
      }

      function animate() {
        update();
        draw();
        requestAnimationFrame(animate);
      }

      slider.addEventListener("input", () => {
        container.querySelector(".value-display").textContent = slider.value;
      });
      window.addEventListener("resize", () => {
        width = slider.offsetWidth;
        canvas.width = width;
        createRope();
      });

      createRope();
      animate();
    }

    function initRopeSlider5() {
      const container = document.getElementById('rope-slider-5');
      const slider = container.querySelector('input[type="range"]');
      const canvas = document.getElementById('canvas-5');
      const ctx = canvas.getContext('2d');
      let width = slider.offsetWidth;
      let height = container.offsetHeight;
      canvas.width = width;
      canvas.height = height;

      const gravity = 0.1
2;
      const segments = 20;
      const spacing = width / segments;
      const points = [];
      const sticks = [];

      function createRope() {
        points.length = 0;
        sticks.length = 0;
        for (let i = 0; i <= segments; i++) {
          const x = i * spacing;
          const y = height / 3;
          const p = new Point(x, y);
          p.pinned = (i === segments);
          points.push(p);
        }
        for (let i = 0; i < segments; i++) {
          const stick = new Stick(points[i], points[i+1]);
          stick.tension = 0.3;
          sticks.push(stick);
        }
      }

      function setThumb() {
        const t = getSliderRatio(slider);
        const x = t * width;
        const thumb = points[segments];
        if (thumb) { thumb.setPosition(x, height / 2); }
      }

      function update() {
        setThumb();

        const twistMax = Math.PI * 0.1;
        const twistAmount = twistMax * getSliderRatio(slider);
        const centerX = width / 2, centerY = height / 2;
        for (let i = 0; i < points.length; i++) {
          if (i !== segments) {
            points[i].update(gravity);
            let dx = points[i].x - centerX;
            let dy = points[i].y - centerY;
            let currentAngle = Math.atan2(dy, dx);
            let distance = Math.hypot(dx, dy);
            let angleOffset = twistAmount * (i / segments);
            let newAngle = currentAngle + angleOffset;
            points[i].x = centerX + distance * Math.cos(newAngle);
            points[i].y = centerY + distance * Math.sin(newAngle);
            points[i].y = clampY(points[i].y, canvas.height);
          }
        }
        for (let j = 0; j < 4; j++) {
          sticks.forEach(stick => stick.update());
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.strokeStyle = "#66ccff";
        ctx.lineWidth = 8;
        ctx.stroke();
      }

      function animate() {
        update();
        draw();
        requestAnimationFrame(animate);
      }

      slider.addEventListener("input", () => {
        container.querySelector(".value-display").textContent = slider.value;
      });

      window.addEventListener("resize", () => {
        width = slider.offsetWidth;
        canvas.width = width;
        createRope();
      });

      createRope();
      animate();
    }

    window.addEventListener("load", () => {
      initRopeSlider1();
      initRopeSlider2();
      initRopeSlider3();
      initRopeSlider4();
      initRopeSlider5();
