<!DOCTYPE html>
<meta charset="UTF-8">
<meta content="width=device-width,initial-scale=1" name="viewport">
<title>Zip to Inline HTML Tool</title>
<style>
:root {
    --p: #4361ee;
    --s: #4cc9a4;
    --w: #f9c74f;
    --d: #ef476f;
    --sec: #6c757d;
    --t: #333;
    --bg: #f8f9fa;
    --l: #fff;
    --drk: #212529;
    --border: #e0e0e0;
    --hover: #f0f0f0
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0 auto;
    padding: 12px;
    background: var(--bg);
    color: var(--t);
    font-size: 14px;
    line-height: 1.5;
    max-width: 900px
}

* {
    box-sizing: border-box
}

h1 {
    text-align: center;
    margin-bottom: 16px;
    font-size: 20px;
    color: var(--p)
}

.c {
    background: var(--l);
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, .1);
    padding: 16px;
    margin-bottom: 16px
}

button, input, select, textarea {
    display: block;
    width: 100%;
    margin-bottom: 12px;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px
}

button {
    cursor: pointer;
    font-weight: 500;
    transition: all .2s ease;
    display: flex;
    align-items: center;
    justify-content: center
}

button svg {
    margin-right: 8px
}

button.p {
    background: var(--p);
    color: #fff;
    border: none
}

button.p:hover {
    background: #3255e3;
    transform: translateY(-2px)
}

button.s {
    background: var(--s);
    color: #fff;
    border: none
}

button.s:hover {
    background: #41b493;
    transform: translateY(-2px)
}

button.sec {
    background: var(--sec);
    color: #fff;
    border: none
}

button.sec:hover {
    background: #5a6268
}

button.w {
    background: var(--w);
    color: var(--drk);
    border: none
}

textarea {
    resize: vertical;
    min-height: 150px;
    font-family: monospace
}

.r {
    display: flex;
    gap: 8px;
    margin-bottom: 12px
}

.r button {
    margin-bottom: 0
}

.fu {
    position: relative;
    overflow: hidden;
    margin-bottom: 12px
}

.fu input {
    position: absolute;
    top: 0;
    right: 0;
    margin: 0;
    padding: 0;
    font-size: 20px;
    cursor: pointer;
    opacity: 0;
    height: 100%;
    width: 100%
}

.fl {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--p);
    color: #fff;
    padding: 12px;
    border-radius: 6px;
    transition: all .2s ease;
    cursor: pointer
}

.fl:hover {
    background: #3255e3;
    transform: translateY(-2px)
}

#ft {
    background: var(--l);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 2px 4px rgba(0, 0, 0, .05);
    padding: 12px;
    max-height: 400px;
    overflow-y: auto;
    margin-bottom: 12px;
    font-size: 13px
}

.tree-item {
    display: flex;
    align-items: center;
    padding: 4px 0;
    border-radius: 4px;
    transition: background-color 0.2s ease;
    cursor: pointer;
    position: relative;
    flex-wrap: wrap; /* Allow wrapping for folder path */
}

.tree-item:hover {
    background-color: var(--hover)
}

.tree-item.folder {
    font-weight: 600;
    color: var(--p);
    margin: 2px 0
}

.tree-item.file {
    color: var(--t);
    padding-left: 8px
}

.tree-level-0 { padding-left: 0 }
.tree-level-1 { padding-left: 20px }
.tree-level-2 { padding-left: 40px }
.tree-level-3 { padding-left: 60px }
.tree-level-4 { padding-left: 80px }
.tree-level-5 { padding-left: 100px }

.folder-toggle {
    width: 16px;
    height: 16px;
    margin-right: 4px;
    cursor: pointer;
    transition: transform 0.2s ease;
    flex-shrink: 0;
}

.folder-toggle.expanded {
    transform: rotate(90deg)
}

.folder-content {
    overflow: hidden;
    transition: max-height 0.3s ease
}

.folder-content.collapsed {
    max-height: 0
}

.folder-content.expanded {
    max-height: 1000px
}

.file-checkbox {
    margin-right: 8px;
    margin-left: 4px;
    width: 16px;
    height: 16px;
    cursor: pointer;
    flex-shrink: 0;
}

.file-icon {
    margin-right: 6px;
    flex-shrink: 0
}

.file-name {
    flex-grow: 1;
    margin-right: 8px;
    word-break: break-word
}

.ft {
    padding: 2px 6px;
    font-size: 10px;
    border-radius: 4px;
    color: #fff;
    font-weight: 500;
    white-space: nowrap
}

.ft.h { background: #e34c26 }
.ft.cs { background: #264de4 }
.ft.j { background: #f0db4f; color: #000 }
.ft.im { background: #8a2be2 }
.ft.fn { background: #ff5722 }
.ft.au { background: #4caf50 }
.ft.vi { background: #e91e63 }
.ft.do { background: #2196f3 }
.ft.ot { background: #607d8b }

#sl {
    height: 100px;
    overflow-y: auto;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 8px;
    background: #f5f5f5;
    font-family: monospace;
    font-size: 12px;
    margin-bottom: 12px
}

.le {
    margin-bottom: 4px;
    padding: 2px 4px;
    border-radius: 3px
}

.li {
    background: rgba(67, 97, 238, .1);
    border-left: 3px solid var(--p)
}

.ls {
    background: rgba(76, 201, 164, .1);
    border-left: 3px solid var(--s)
}

.lw {
    background: rgba(249, 199, 79, .1);
    border-left: 3px solid var(--w)
}

.le {
    background: rgba(239, 71, 111, .1);
    border-left: 3px solid var(--d)
}

@media (max-width: 768px) {
    body { padding: 8px }
    .r { flex-direction: column; gap: 4px }
    h1 { font-size: 18px }
    #ft { max-height: 300px }
    .tree-level-1 { padding-left: 15px }
    .tree-level-2 { padding-left: 30px }
    .tree-level-3 { padding-left: 45px }
    .tree-level-4 { padding-left: 60px }
    .tree-level-5 { padding-left: 75px }
}

.spn {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 3px solid rgba(255, 255, 255, .3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 1s ease-in-out infinite;
    margin-right: 8px
}

@keyframes spin {
    to { transform: rotate(360deg) }
}

.hid { display: none }

.tc {
    display: flex;
    align-items: center;
    margin-bottom: 12px
}

.tl {
    margin-left: 8px;
    font-size: 14px
}

.tog {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 24px
}

.tog input {
    opacity: 0;
    width: 0;
    height: 0
}

.sl {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    transition: .4s;
    border-radius: 24px
}

.sl:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: #fff;
    transition: .4s;
    border-radius: 50%
}

input:checked + .sl {
    background-color: var(--p)
}

input:focus + .sl {
    box-shadow: 0 0 1px var(--p)
}

input:checked + .sl:before {
    transform: translateX(26px)
}

.folder-path {
    font-size: 11px;
    color: var(--sec);
    margin-left: 24px;
    font-style: italic;
    width: 100%; /* Take full width to appear on next line */
}
</style>

<h1>Zip to Inline HTML Tool</h1>

<div class="c">
    <div class="fu">
        <div class="fl">
            <svg fill="none" height="20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="20">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" x2="12" y1="3" y2="15"></line>
            </svg>
            <span>Choose ZIP File</span>
        </div>
        <input id="zf" type="file" accept=".zip">
    </div>
    <div class="tc">
        <label class="tog">
            <input id="act" type="checkbox" checked>
            <span class="sl"></span>
        </label>
        <span class="tl">Auto-convert after file selection</span>
    </div>
</div>

<div class="c">
    <h3>File Browser</h3>
    <div id="ft">
        <div style="text-align:center;color:#6c757d;padding:40px 0">Upload a ZIP file to see its contents</div>
    </div>
    <div class="r">
        <button class="sec" id="sa">
            <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            Select All
        </button>
        <button class="sec" id="da">
            <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16">
                <path d="M18 6L6 18"></path>
                <path d="M6 6l12 12"></path>
            </svg>
            Deselect All
        </button>
        <button class="sec" id="ea">
            <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            Expand All
        </button>
        <button class="sec" id="ca">
            <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16">
                <path d="M15 3h6v6"></path>
                <path d="M10 14L21 3"></path>
                <path d="M21 14v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            </svg>
            Collapse All
        </button>
    </div>
    <button class="p" id="cv">
        <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"></path>
            <path d="M21 8V5a2 2 0 0 0-2-2h-3"></path>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"></path>
            <path d="M16 21h3a2 2 0 0 0 2-2v-3"></path>
            <rect height="10" rx="2" width="10" x="7" y="7"></rect>
        </svg>
        Convert to Inline HTML
        <span class="hid spn" id="cvs"></span>
    </button>
</div>

<div class="c">
    <h3>Status Log</h3>
    <div id="sl"></div>
</div>

<div class="c">
    <h3>Output HTML</h3>
    <textarea id="op" placeholder="Converted HTML will appear here"></textarea>
    <div class="r">
        <button class="s" id="pb">
            <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
            Preview
        </button>
        <button class="s" id="sb">
            <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" x2="12" y1="15" y2="3"></line>
            </svg>
            Save HTML
        </button>
        <button class="sec" id="cb">
            <svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16">
                <rect height="13" rx="2" width="13" x="9" y="9" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Copy to Clipboard
        </button>
    </div>
</div>

<script>
const zf = document.getElementById("zf"),
    ft = document.getElementById("ft"),
    cv = document.getElementById("cv"),
    op = document.getElementById("op"),
    pb = document.getElementById("pb"),
    sb = document.getElementById("sb"),
    cb = document.getElementById("cb"),
    sa = document.getElementById("sa"),
    da = document.getElementById("da"),
    ea = document.getElementById("ea"),
    ca = document.getElementById("ca"),
    act = document.getElementById("act"),
    sl = document.getElementById("sl"),
    cvs = document.getElementById("cvs");

let fc = [], zfs = {}, pc = 0;

const isH = p => /\.html?$/i.test(p),
    isC = p => /\.css$/i.test(p),
    isJ = p => /\.js$/i.test(p),
    isI = p => /\.(jpe?g|png|gif|svg|webp|bmp|ico)$/i.test(p),
    isF = p => /\.(woff2?|ttf|otf|eot)$/i.test(p),
    isA = p => /\.(mp3|wav|ogg|m4a)$/i.test(p),
    isV = p => /\.(mp4|webm|ogv)$/i.test(p),
    isD = p => /\.(pdf|doc|docx|xls|xlsx|ppt|pptx|txt|md)$/i.test(p);

zf.addEventListener("change", hZU);
cv.addEventListener("click", cIH);
pb.addEventListener("click", pO);
sb.addEventListener("click", sO);
cb.addEventListener("click", cO);
sa.addEventListener("click", () => sAC(true));
da.addEventListener("click", () => sAC(false));
ea.addEventListener("click", () => tAF(true));
ca.addEventListener("click", () => tAF(false));

function l(m, t = 'info') {
    const e = document.createElement('div');
    e.classList.add('le', `l${t[0]}`);
    e.textContent = `[${new Date().toLocaleTimeString()}] ${m}`;
    sl.appendChild(e);
    sl.scrollTop = sl.scrollHeight;
}

async function hZU() {
    const zipFile = this.files[0];
    if (!zipFile) return;
    try {
        l(`Loading ZIP file: ${zipFile.name}`);
        if (typeof JSZip === 'undefined') {
            l('Loading JSZip library...', 'info');
            await lJZ();
        }
        const z = await JSZip.loadAsync(zipFile);
        zfs = z.files;
        l(`Successfully loaded ZIP with ${Object.keys(zfs).filter(k => !zfs[k].dir).length} files`, 'success');
        const fileTree = bFT(zfs);
        fc = [];
        document.getElementById("ft").innerHTML = "";
        rFT(fileTree);
        l('Enhanced file tree generated', 'success');
        if (act.checked) {
            l('Auto-convert enabled, processing files...', 'info');
            cIH();
        }
    } catch (e) {
        l(`Failed to load ZIP file: ${e.message}`, 'error');
        console.error(e);
    }
}

function lJZ() {
    return new Promise((resolve, reject) => {
        if (typeof JSZip !== 'undefined') {
            resolve();
            return;
        }
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('Failed to load JSZip library'));
        document.body.appendChild(s);
    });
}

function bFT(zipFiles) {
    const fileTree = {};
    Object.keys(zipFiles).forEach(fileName => {
        if (zipFiles[fileName].dir) return;
        const pathParts = fileName.split("/");
        let currentDir = fileTree;
        for (let i = 0; i < pathParts.length - 1; i++) {
            const dirName = pathParts[i];
            if (!dirName) continue;
            currentDir[dirName] = currentDir[dirName] || {};
            currentDir = currentDir[dirName];
        }
        const fName = pathParts[pathParts.length - 1];
        if (fName) currentDir[fName] = fileName;
    });
    return fileTree;
}

function rFT(fileTree, parentElement = document.getElementById("ft"), pathPrefix = "", level = 0) {
    const container = document.createElement("div");
    const folders = [];
    const files = [];
    
    Object.keys(fileTree).sort().forEach(itemName => {
        const item = fileTree[itemName];
        if (typeof item === "object") {
            folders.push({ name: itemName, content: item });
        } else {
            files.push({ name: itemName, path: item });
        }
    });

    folders.forEach(folder => {
        const folderDiv = document.createElement("div");
        folderDiv.className = "folder-container";

        const folderItem = document.createElement("div");
        folderItem.className = `tree-item folder tree-level-${Math.min(level, 5)}`;

        const toggleIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        toggleIcon.className = "folder-toggle expanded";
        toggleIcon.setAttribute("width", "12");
        toggleIcon.setAttribute("height", "12");
        toggleIcon.setAttribute("viewBox", "0 0 24 24");
        toggleIcon.innerHTML = '<path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2" fill="none" />';

        const folderIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        folderIcon.className = "file-icon";
        folderIcon.setAttribute("width", "16");
        folderIcon.setAttribute("height", "16");
        folderIcon.setAttribute("viewBox", "0 0 24 24");
        // FIX: Renamed folderPath to folderSvgPath to avoid collision
        const folderSvgPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
        folderSvgPath.setAttribute("d", "M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z");
        folderSvgPath.setAttribute("fill", "none");
        folderSvgPath.setAttribute("stroke", "currentColor");
        folderSvgPath.setAttribute("stroke-width", "2");
        folderIcon.appendChild(folderSvgPath);

        const folderName = document.createElement("span");
        folderName.className = "file-name";
        folderName.textContent = folder.name;

        // FIX: Renamed folderPath to folderPathElem to avoid collision
        const folderPathElem = document.createElement("div");
        folderPathElem.className = "folder-path";
        folderPathElem.textContent = pathPrefix ? `${pathPrefix}${folder.name}/` : `${folder.name}/`;

        folderItem.appendChild(toggleIcon);
        folderItem.appendChild(folderIcon);
        folderItem.appendChild(folderName);
        // FIX: Appended path element inside the folder item for better structure
        folderItem.appendChild(folderPathElem);

        const folderContent = document.createElement("div");
        folderContent.className = "folder-content expanded";

        folderItem.addEventListener('click', (e) => {
            e.stopPropagation();
            const isExpanded = folderContent.classList.toggle('expanded');
            folderContent.classList.toggle('collapsed', !isExpanded);
            toggleIcon.classList.toggle('expanded', isExpanded);
        });

        folderDiv.appendChild(folderItem);
        folderDiv.appendChild(folderContent);

        rFT(folder.content, folderContent, pathPrefix + folder.name + "/", level + 1);
        container.appendChild(folderDiv);
    });

    files.forEach(file => {
        const fileItem = document.createElement("div");
        fileItem.className = `tree-item file tree-level-${Math.min(level, 5)}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "file-checkbox";
        checkbox.dataset.path = file.path;
        checkbox.checked = true;
        fc.push(checkbox);

        const fileIcon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        fileIcon.className = "file-icon";
        fileIcon.setAttribute("width", "14");
        fileIcon.setAttribute("height", "14");
        fileIcon.setAttribute("viewBox", "0 0 24 24");
        fileIcon.innerHTML = `<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" fill="none"></path><polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="2" fill="none"></polyline>`;

        const fileName = document.createElement("span");
        fileName.className = "file-name";
        fileName.textContent = file.name;

        const fileType = document.createElement("span");
        fileType.classList.add("ft");
        
        if (isH(file.name)) { fileType.textContent = "HTML"; fileType.classList.add("h"); }
        else if (isC(file.name)) { fileType.textContent = "CSS"; fileType.classList.add("cs"); }
        else if (isJ(file.name)) { fileType.textContent = "JS"; fileType.classList.add("j"); }
        else if (isI(file.name)) { fileType.textContent = "IMG"; fileType.classList.add("im"); }
        else if (isF(file.name)) { fileType.textContent = "FONT"; fileType.classList.add("fn"); }
        else if (isA(file.name)) { fileType.textContent = "AUDIO"; fileType.classList.add("au"); }
        else if (isV(file.name)) { fileType.textContent = "VIDEO"; fileType.classList.add("vi"); }
        else if (isD(file.name)) { fileType.textContent = "DOC"; fileType.classList.add("do"); }
        else { fileType.textContent = "OTHER"; fileType.classList.add("ot"); }

        fileItem.appendChild(checkbox);
        fileItem.appendChild(fileIcon);
        fileItem.appendChild(fileName);
        fileItem.appendChild(fileType);

        container.appendChild(fileItem);
    });

    parentElement.appendChild(container);
}

function sAC(checked) {
    fc.forEach(cb => cb.checked = checked);
    l(`${checked ? 'Selected' : 'Deselected'} all files`, 'info');
}

function tAF(expand) {
    document.querySelectorAll('.folder-content').forEach(folder => {
        folder.classList.toggle('expanded', expand);
        folder.classList.toggle('collapsed', !expand);
    });
    document.querySelectorAll('.folder-toggle').forEach(toggle => {
        toggle.classList.toggle('expanded', expand);
    });
    l(`${expand ? 'Expanded' : 'Collapsed'} all folders`, 'info');
}

async function cIH() {
    try {
        cvs.classList.remove('hid');
        cv.disabled = true;
        const sp = fc.filter(cb => cb.checked).map(cb => cb.dataset.path);
        if (sp.length === 0) {
            l('No files selected. Please select at least one file.', 'warning');
            cvs.classList.add('hid');
            cv.disabled = false;
            return;
        }
        l(`Starting conversion of ${sp.length} files`, 'info');
        pc = 0;
        
        const hf = sp.filter(isH), cf = sp.filter(isC), jf = sp.filter(isJ),
              imf = sp.filter(isI), ff = sp.filter(isF), af = sp.filter(isA),
              vf = sp.filter(isV);

        l(`Found: ${hf.length} HTML, ${cf.length} CSS, ${jf.length} JS, ${imf.length} images, ${ff.length} fonts, ${af.length} audio, ${vf.length} video files`, 'info');

        const hc = await gFC(hf); uP(hf.length);
        const cc = await gFC(cf); uP(cf.length);
        const jc = await gFC_JS(jf); uP(jf.length);
        const fts = await gFC_B64(ff, gFM); uP(ff.length);
        const imgs = await gFC_B64(imf, gIM); uP(imf.length);
        const mfs = await gFC_B64([...af, ...vf], p => isA(p) ? gAM(p.split('.').pop()) : gVM(p.split('.').pop())); uP(af.length + vf.length);

        let mh = mHF(hc);
        
        if (cc.length > 0) {
            mh = iIH(mh, `<style>${cc.map(c => c.c).join('\n')}</style>`);
            l(`Inlined ${cc.length} CSS files`, 'success');
        }
        if (jc.length > 0) {
            mh = iBBE(mh, `<script>${jc.map(j => j.c).join('\n\n')}<\/script>`);
            l(`Inlined ${jc.length} JS files`, 'success');
        }
        if (fts.length > 0) {
            const ffStyles = gFF(fts);
            if (ffStyles) {
                mh = iIH(mh, `<style>${ffStyles}</style>`);
                l(`Inlined ${fts.filter(f => !f.e).length} font files`, 'success');
            }
        }
        
        mh = rP(mh, imgs, "image");
        mh = rP(mh, mfs, "media");

        mh = cAO(mh);
        op.value = mh;
        l('Conversion completed successfully', 'success');
    } catch (e) {
        l(`Error during conversion: ${e.message}`, 'error');
        console.error(e);
    } finally {
        cvs.classList.add('hid');
        cv.disabled = false;
    }
}

function mHF(hc) {
    if (hc.length === 0) {
        l('No HTML files selected, creating a basic structure.', 'info');
        return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Inlined HTML</title></head><body></body></html>`;
    }
    if (hc.length === 1) return hc[0].c;
    
    let mainHtml = hc.find(h => /index\.html?$/i.test(h.p)) || hc[0];
    let merged = mainHtml.c;
    const otherHtmls = hc.filter(h => h.p !== mainHtml.p);
    
    if (otherHtmls.length > 0) {
        const bodyContent = otherHtmls.map(h => {
            const bodyMatch = h.c.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
            return `\n${(bodyMatch ? bodyMatch[1] : h.c).trim()}\n`;
        }).join('\n\n');
        
        merged = merged.includes('</body>') ? merged.replace('</body>', `\n${bodyContent}\n</body>`) : merged + `\n${bodyContent}`;
        l(`Intelligently merged ${hc.length} HTML files`, 'success');
    }
    return merged;
}

function cAO(html) {
    // OPTIMIZATION: Safer cleanup. Only removes whitespace between tags to avoid breaking code/pre content.
    return html.replace(/>\s+</g, '><').trim();
}

async function gFC(fps) {
    return await Promise.all(fps.map(async p => {
        try { return { p, c: await zfs[p].async("text") }; }
        catch (e) {
            l(`Error reading file ${p}: ${e.message}`, 'error');
            return { p, c: `/* Error loading ${p} */` };
        }
    }));
}
async function gFC_JS(fps) {
    return await Promise.all(fps.map(async p => {
        try { return { p, c: (await zfs[p].async("text")).replace(/<\/script>/gi, "<\\/script>") }; }
        catch (e) {
            l(`Error processing JS file ${p}: ${e.message}`, 'error');
            return { p, c: `/* Error loading ${p} */` };
        }
    }));
}
async function gFC_B64(fps, mimeFn) {
    return await Promise.all(fps.map(async p => {
        try {
            const d = await zfs[p].async("base64");
            const e = p.split('.').pop().toLowerCase();
            return { p, du: `data:${mimeFn(e)};base64,${d}` };
        } catch (e) {
            l(`Error processing Base64 for ${p}: ${e.message}`, 'error');
            return { p, e: e.message };
        }
    }));
}

function rP(html, assets, type) {
    let count = 0;
    for (const asset of assets) {
        if (!asset.e) {
            const fn = asset.p.split('/').pop();
            const rx = new RegExp(`(src|href)=["'](?:[^"'/]+/)*${eRE(fn)}["']`, 'g');
            const oldHtml = html;
            html = html.replace(rx, `$1="${asset.du}"`);
            if (oldHtml !== html) count++;
        }
    }
    if(count > 0) l(`Replaced ${count} ${type} references with inline data`, 'success');
    return html;
}

function uP(c) {
    pc += c;
    l(`Progress: ${pc} files processed`, 'info');
}

function iIH(h, c) {
    return h.includes('</head>') ? h.replace('</head>', `${c}\n</head>`) : `<head>${c}</head>${h}`;
}

function iBBE(h, c) {
    return h.includes('</body>') ? h.replace('</body>', `${c}\n</body>`) : `${h}\n${c}`;
}

function gFF(fs) {
    return fs.filter(f => !f.e).map(f => {
        const fn = f.p.split('/').pop();
        const e = fn.split('.').pop().toLowerCase();
        const ff = fn.split('.')[0].replace(/[_-]/g, ' ');
        return `@font-face{font-family:"${ff}";src:url("${f.du}") format("${gFF2(e)}");}`;
    }).join('\n');
}

const gIM = e => ({ jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', svg: 'image/svg+xml', webp: 'image/webp', bmp: 'image/bmp', ico: 'image/x-icon' }[e] || 'application/octet-stream');
const gFM = e => ({ woff: 'font/woff', woff2: 'font/woff2', ttf: 'font/ttf', otf: 'font/otf', eot: 'application/vnd.ms-fontobject' }[e] || 'application/octet-stream');
const gFF2 = e => ({ woff: 'woff', woff2: 'woff2', ttf: 'truetype', otf: 'opentype', eot: 'embedded-opentype' }[e] || 'truetype');
const gAM = e => ({ mp3: 'audio/mpeg', wav: 'audio/wav', ogg: 'audio/ogg', m4a: 'audio/mp4' }[e] || 'audio/mpeg');
const gVM = e => ({ mp4: 'video/mp4', webm: 'video/webm', ogv: 'video/ogg' }[e] || 'video/mp4');

function eRE(s) {
    // FIX: Corrected regex escaping function
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function pO() {
    const h = op.value;
    if (!h) { l('No output to preview', 'warning'); return; }
    try {
        const pw = window.open('', '_blank');
        pw.document.write(h);
        pw.document.close();
        l('Preview opened in new window', 'success');
    } catch (e) {
        l(`Failed to open preview: ${e.message}`, 'error');
    }
}

function sO() {
    const h = op.value;
    if (!h) { l('No output to save', 'warning'); return; }
    try {
        const b = new Blob([h], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'inline-page.html';
        a.click();
        URL.revokeObjectURL(a.href);
        l('HTML file saved', 'success');
    } catch (e) {
        l(`Failed to save HTML: ${e.message}`, 'error');
    }
}

function cO() {
    const h = op.value;
    if (!h) { l('No output to copy', 'warning'); return; }
    navigator.clipboard.writeText(h).then(() => {
        l('HTML copied to clipboard', 'success');
        const originalContent = cb.innerHTML;
        cb.innerHTML = `<svg fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="16"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg> Copied!`;
        setTimeout(() => { cb.innerHTML = originalContent; }, 2000);
    }, () => l('Failed to copy to clipboard', 'error'));
}

window.addEventListener('DOMContentLoaded', async () => {
    try {
        if (typeof JSZip === 'undefined') {
            l('Loading JSZip library...', 'info');
            await lJZ();
            l('JSZip loaded successfully', 'success');
        }
    } catch (e) {
        l(`Failed to load JSZip: ${e.message}`, 'error');
    }
});
</script>
