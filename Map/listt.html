<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packing List</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        font-size: 14px; /* Reduce base font size */
    }
    .container {
        max-width: 800px;
        margin: 40px auto;
        padding: 20px;
        background-color: #f9f9f9;
        border: 1px solid #ddd;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
        text-align: center;
        font-size: 24px; /* Reduce the size of the main title */
    }
    h2 {
        margin-top: 20px;
        font-size: 18px; /* Smaller size for section headers */
    }
    ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }
    li {
        margin-bottom: 10px;
        font-size: 14px; /* Reduce font size for list items */
    }
    label {
        font-weight: bold;
        margin-right: 10px;
        font-size: 14px; /* Shrink label size */
    }
    input[type="checkbox"] {
        margin-right: 10px;
    }
    #new-item-input {
        width: 70%;
        padding: 5px;
        font-size: 14px; /* Shrink input text */
    }
    #add-item-btn, #save-btn {
        padding: 5px 10px;
        cursor: pointer;
        font-size: 14px; /* Shrink button text */
    }
</style>

</head>
<body>
    <div class="container">
        <h1>Packing List</h1>
        <form>
            <!-- Dynamic Packing List Content Will Be Injected Here -->
        </form>
        <input type="text" id="new-item-input" placeholder="New item">
        <button type="button" id="add-item-btn">Add Item</button>
        <button type="button" id="save-btn">Save</button>
    </div>

    <script>
        const packingItems = {
            "Outfits": [
                "Airport outfit (1)",
                "Fitzroy Island outfit (1)",
                "Karunda outfit (1)",
                "Beach + City Tour outfit (1)",
                "Nightsuits (1-2)"
            ],
            "Swimwear": [
                "Swimsuits (2-3)"
            ],
            "Evening attire": [
                "Evening outfit for Dec 25th (maybe)",
                "Evening outfit for Dec 26th (maybe)",
                "Evening outfit for Dec 27th"
            ],
            "Other items": [
                "Undergarments and socks",
                "Comfortable walking shoes/sneakers",
                "Sandals/flip-flops",
                "Light jacket or sweater (depending on the weather)",
                "Toiletries",
                "Beach towel",
                "Sunscreen and sun hat",
                "Insect repellent",
                "Power adapter and charger",
                "Travel documents (passport, ID, etc.)",
                "Sunglasses",
                "Power Bank"
            ]
        };

        const form = document.querySelector('form');
        const newItemInput = document.getElementById('new-item-input');
        const addItemBtn = document.getElementById('add-item-btn');
        const saveBtn = document.getElementById('save-btn');

        // Function to create checkboxes dynamically
        function createPackingSection(title, items, savedSelections = []) {
            const section = document.createElement('section');
            const header = document.createElement('h2');
            header.textContent = title;
            section.appendChild(header);

            const ul = document.createElement('ul');
            items.forEach(item => {
                const li = document.createElement('li');
                const checkbox = document.createElement('input');
                checkbox.type = "checkbox";
                checkbox.checked = savedSelections.includes(item); // Set checkbox state based on saved data

                const label = document.createElement('label');
                label.textContent = item;
                li.appendChild(checkbox);
                li.appendChild(label);
                ul.appendChild(li);
            });

            section.appendChild(ul);
            form.appendChild(section);
        }

        // Load saved packing list and selections from localStorage
        function loadSavedData() {
            const savedPackingItems = JSON.parse(localStorage.getItem('packingItems')) || packingItems;
            const savedSelections = JSON.parse(localStorage.getItem('selections')) || {};

            for (const [category, items] of Object.entries(savedPackingItems)) {
                createPackingSection(category, items, savedSelections[category] || []);
            }
        }

        // Save packing list and selections to localStorage
        function savePackingData() {
            const savedPackingItems = {};
            const savedSelections = {};

            const sections = form.querySelectorAll('section');
            sections.forEach(section => {
                const category = section.querySelector('h2').textContent;
                const checkboxes = section.querySelectorAll('input[type="checkbox"]');
                const selectedItems = [];

                checkboxes.forEach((checkbox, index) => {
                    if (checkbox.checked) {
                        selectedItems.push(section.querySelectorAll('label')[index].textContent);
                    }
                });

                savedPackingItems[category] = Array.from(section.querySelectorAll('label')).map(label => label.textContent);
                savedSelections[category] = selectedItems;
            });

            localStorage.setItem('packingItems', JSON.stringify(savedPackingItems));
            localStorage.setItem('selections', JSON.stringify(savedSelections));
            alert('Packing list saved!');
        }

        // Add event listener to Add Item button
        addItemBtn.addEventListener('click', () => {
            const newItemText = newItemInput.value.trim();
            if (newItemText) {
                // Add new item to the "Other items" category for simplicity
                packingItems["Other items"].push(newItemText);
                
                // Clear input field
                newItemInput.value = '';

                // Re-render the "Other items" section
                form.innerHTML = ''; // Clear the form
                loadSavedData();
            }
        });

        // Add event listener to Save button
        saveBtn.addEventListener('click', () => {
            savePackingData();
        });

        // Initially load saved data or default packing items
        loadSavedData();
    </script>
</body>
</html>
