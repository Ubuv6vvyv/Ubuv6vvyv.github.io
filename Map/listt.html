
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packing List</title>
    <style>
    

body {
font-family: Arial, sans-serif;
margin: 0;
padding: 0;
}

.container {
max-width: 800px;
margin: 40px auto;
padding: 20px;
background-color: #f9f9f9;
border: 1px solid #ddd;
box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

h1 {
text-align: center;
}

h2 {
margin-top: 20px;
}

ul {
list-style: none;
padding: 0;
margin: 0;
}

li {
margin-bottom: 10px;
}

label {
font-weight: bold;
margin-right: 10px;
}

input[type="checkbox"] {
margin-right: 10px;
}
 
    
    </style>
</head>
<body>
    <div class="container">
        <h1>Packing List</h1>
        <form>
            <h2>Outfits</h2>
            <ul>
                <li><input type="checkbox" id="airport-outfit"><label for="airport-outfit">Airport outfit (1)</label></li>
                <li><input type="checkbox" id="fitzroy-island-outfit"><label for="fitzroy-island-outfit">Fitzroy Island outfit (1)</label></li>
                <li><input type="checkbox" id="karunda-outfit"><label for="karunda-outfit">Karunda outfit (1)</label></li>
                <li><input type="checkbox" id="beach-city-tour-outfit"><label for="beach-city-tour-outfit">Beach + City Tour outfit (1)</label></li>
                <li><input type="checkbox" id="nightsuits"><label for="nightsuits">Nightsuits (1-2)</label></li>
            </ul>

            <h2>Swimwear</h2>
            <ul>
                <li><input type="checkbox" id="swimsuits"><label for="swimsuits">Swimsuits (2-3)</label></li>
            </ul>

            <h2>Evening attire</h2>
            <ul>
                <li><input type="checkbox" id="evening-outfit-dec-25"><label for="evening-outfit-dec-25">Evening outfit for Dec 25th (maybe)</label></li>
                <li><input type="checkbox" id="evening-outfit-dec-26"><label for="evening-outfit-dec-26">Evening outfit for Dec 26th (maybe)</label></li>
                <li><input type="checkbox" id="evening-outfit-dec-27"><label for="evening-outfit-dec-27">Evening outfit for Dec 27th</label></li>
            </ul>

            <h2>Other items</h2>
            <ul>
                <li><input type="checkbox" id="undergarments-socks"><label for="undergarments-socks">Undergarments and socks</label></li>
                <li><input type="checkbox" id="comfortable-shoes"><label for="comfortable-shoes">Comfortable walking shoes/sneakers</label></li>
                <li><input type="checkbox" id="sandals-flip-flops"><label for="sandals-flip-flops">Sandals/flip-flops</label></li>
                <li><input type="checkbox" id="light-jacket-sweater"><label for="light-jacket-sweater">Light jacket or sweater (depending on the weather)</label></li>
                <li><input type="checkbox" id="toiletries"><label for="toiletries">Toiletries</label></li>
                <li><input type="checkbox" id="beach-towel"><label for="beach-towel">Beach towel</label></li>
                <li><input type="checkbox" id="sunscreen-sun-hat"><label for="sunscreen-sun-hat">Sunscreen and sun hat</label></li>
                <li><input type="checkbox" id="insect-repellent"><label for="insect-repellent">Insect repellent</label></li>
                <li><input type="checkbox" id="power-adapter-charger"><label for="power-adapter-charger">Power adapter and charger</label></li>
                <li><input type="checkbox" id="travel-documents"><label for="travel-documents">Travel documents (passport, ID, etc.)</label></li>
            </ul>
        </form>
    </div>

    <script>
        // Add event listener to checkboxes
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach((checkbox) => {
            checkbox.addEventListener('change', (event) => {
                console.log(`Checkbox ${(link unavailable)} is ${event.target.checked ? 'checked' : 'unchecked'}`);
            });
        });
    </script>
</body>
</html>
