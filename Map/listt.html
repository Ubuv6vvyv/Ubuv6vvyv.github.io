<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packing List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        h2 {
            margin-top: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin-bottom: 10px;
        }
        label {
            font-weight: bold;
            margin-right: 10px;
        }
        input[type="checkbox"] {
            margin-right: 10px;
        }
        #new-item-input {
            width: 70%;
            padding: 5px;
        }
        #add-item-btn {
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Packing List</h1>
        <form>
            <!-- Dynamic Packing List Content Will Be Injected Here -->
        </form>
        <input type="text" id="new-item-input" placeholder="New item">
        <button type="button" id="add-item-btn">Add Item</button>
    </div>

    <script>
        const packingItems = {
            "Outfits": [
                "Airport outfit (1)",
                "Fitzroy Island outfit (1)",
                "Karunda outfit (1)",
                "Beach + City Tour outfit (1)",
                "Nightsuits (1-2)"
            ],
            "Swimwear": [
                "Swimsuits (2-3)"
            ],
            "Evening attire": [
                "Evening outfit for Dec 25th (maybe)",
                "Evening outfit for Dec 26th (maybe)",
                "Evening outfit for Dec 27th"
            ],
            "Other items": [
                "Undergarments and socks",
                "Comfortable walking shoes/sneakers",
                "Sandals/flip-flops",
                "Light jacket or sweater (depending on the weather)",
                "Toiletries",
                "Beach towel",
                "Sunscreen and sun hat",
                "Insect repellent",
                "Power adapter and charger",
                "Travel documents (passport, ID, etc.)",
                "Sunglasses",
                "Power Bank"
            ]
        };

        const form = document.querySelector('form');
        const newItemInput = document.getElementById('new-item-input');
        const addItemBtn = document.getElementById('add-item-btn');

        // Function to create checkboxes dynamically
        function createPackingSection(title, items) {
            const section = document.createElement('section');
            const header = document.createElement('h2');
            header.textContent = title;
            section.appendChild(header);

            const ul = document.createElement('ul');
            items.forEach(item => {
                const li = document.createElement('li');
                const checkbox = document.createElement('input');
                checkbox.type = "checkbox";
                const label = document.createElement('label');
                label.textContent = item;
                li.appendChild(checkbox);
                li.appendChild(label);
                ul.appendChild(li);
            });

            section.appendChild(ul);
            form.appendChild(section);
        }

        // Loop through the packing items and create sections dynamically
        for (const [category, items] of Object.entries(packingItems)) {
            createPackingSection(category, items);
        }

        // Add event listener to checkboxes
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach((checkbox) => {
            checkbox.addEventListener('change', (event) => {
                console.log(`Checkbox ${(event.target.id)} is ${event.target.checked ? 'checked' : 'unchecked'}`);
            });
        });

        // Function to add new item dynamically
        addItemBtn.addEventListener('click', () => {
            const newItemText = newItemInput.value.trim();
            if (newItemText) {
                // Add new item to the "Other items" category for simplicity
                packingItems["Other items"].push(newItemText);
                
                // Clear input field
                newItemInput.value = '';

                // Re-render the "Other items" section
                form.innerHTML = ''; // Clear the form
                for (const [category, items] of Object.entries(packingItems)) {
                    createPackingSection(category, items);
                }
            }
        });
    </script>
</body>
</html>
