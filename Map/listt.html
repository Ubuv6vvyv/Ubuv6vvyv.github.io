<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packing List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
        }
        h2 {
            margin-top: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin-bottom: 10px;
        }
        label {
            font-weight: bold;
            margin-right: 10px;
        }
        input[type="checkbox"] {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Packing List</h1>
        <form>
            <!-- Dynamic Packing List Content Will Be Injected Here -->
        </form>
    </div>

    <script>
        const packingItems = {
            "Outfits": [
                { id: "airport-outfit", label: "Airport outfit (1)" },
                { id: "fitzroy-island-outfit", label: "Fitzroy Island outfit (1)" },
                { id: "karunda-outfit", label: "Karunda outfit (1)" },
                { id: "beach-city-tour-outfit", label: "Beach + City Tour outfit (1)" },
                { id: "nightsuits", label: "Nightsuits (1-2)" }
            ],
            "Swimwear": [
                { id: "swimsuits", label: "Swimsuits (2-3)" }
            ],
            "Evening attire": [
                { id: "evening-outfit-dec-25", label: "Evening outfit for Dec 25th (maybe)" },
                { id: "evening-outfit-dec-26", label: "Evening outfit for Dec 26th (maybe)" },
                { id: "evening-outfit-dec-27", label: "Evening outfit for Dec 27th" }
            ],
            "Other items": [
                { id: "undergarments-socks", label: "Undergarments and socks" },
                { id: "comfortable-shoes", label: "Comfortable walking shoes/sneakers" },
                { id: "sandals-flip-flops", label: "Sandals/flip-flops" },
                { id: "light-jacket-sweater", label: "Light jacket or sweater (depending on the weather)" },
                { id: "toiletries", label: "Toiletries" },
                { id: "beach-towel", label: "Beach towel" },
                { id: "sunscreen-sun-hat", label: "Sunscreen and sun hat" },
                { id: "insect-repellent", label: "Insect repellent" },
                { id: "power-adapter-charger", label: "Power adapter and charger" },
                { id: "travel-documents", label: "Travel documents (passport, ID, etc.)" },
              { id: "Sunglasses", label: "Sunglasses" },
                { id: "Power Bank", label: "Power Bank" }
            ]
        };

        const form = document.querySelector('#packing-list-form');

        // Function to create packing sections dynamically
        function createPackingSection(title, items) {
            const section = document.createElement('section');
            const header = document.createElement('h2');
            header.textContent = title;
            section.appendChild(header);

            const ul = document.createElement('ul');
            items.forEach(item => {
                const li = document.createElement('li');
                const checkbox = document.createElement('input');
                checkbox.type = "checkbox";
                checkbox.id = item.id;
                const label = document.createElement('label');
                label.setAttribute('for', item.id);
                label.textContent = item.label;
                li.appendChild(checkbox);
                li.appendChild(label);
                ul.appendChild(li);
            });

            section.appendChild(ul);
            form.appendChild(section);
        }

        // Function to add a new item to the list
        function addNewItem() {
            const itemName = document.querySelector('#item-name').value.trim();
            const itemCategory = document.querySelector('#item-category').value;

            if (itemName) {
                const itemId = itemName.toLowerCase().replace(/ /g, "-");
                const newItem = { id: itemId, label: `${itemName}` };

                // Add the new item to the corresponding category
                packingItems[itemCategory].push(newItem);

                // Re-render the packing list with the new item
                document.querySelector('#packing-list-form').innerHTML = '';
                for (const [category, items] of Object.entries(packingItems)) {
                    createPackingSection(category, items);
                }

                // Clear the input fields
                document.querySelector('#item-name').value = '';
            } else {
                alert('Please enter a valid item name.');
            }
        }

        // Loop through the packing items and create sections dynamically
        for (const [category, items] of Object.entries(packingItems)) {
            createPackingSection(category, items);
        }

        // Add event listener for adding a new item
        document.querySelector('#add-item').addEventListener('click', addNewItem);

        // Add event listener to checkboxes
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach((checkbox) => {
            checkbox.addEventListener('change', (event) => {
                console.log(`Checkbox ${(event.target.id)} is ${event.target.checked ? 'checked' : 'unchecked'}`);
            });
        });
    </script>
</body>
</html>
