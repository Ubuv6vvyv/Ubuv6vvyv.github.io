<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cairns Packing List</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
<style>
  /* General body styling */
  body {
    background: white;
    font-size: 16px;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
  }

  /* Container styling */
  .container {
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* Grid layout for categories */
  #categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
    align-items: start;
  }

  /* Styling for category cards */
  .category-card {
    border: 1px solid #ccc;
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    padding: 16px;
    transition: transform 0.2s ease-in-out;
  }

  .category-card:hover {
    transform: scale(1.02);
  }

  /* Category header */
  .category-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 1rem;
    font-weight: bold;
    background: black;
    color: white;
    padding: 12px;
    border-radius: 4px 4px 0 0;
  }

  .delete-btn {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    font-size: 1.25rem;
    transition: color 0.2s;
  }

  .delete-btn:hover {
    color: #ff6961;
  }

  /* Input fields */
  input[type="text"] {
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 8px;
    width: 100%;
    font-size: 0.9rem;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus {
    border-color: blue;
    outline: none;
  }

  /* Buttons */
  .add-item,
  #add-category-btn,
  #save-btn {
    background: black;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 10px 16px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.2s;
  }

  .add-item:hover,
  #add-category-btn:hover,
  #save-btn:hover {
    background: gray;
  }

  .add-item:active,
  #add-category-btn:active,
  #save-btn:active {
    transform: scale(0.95);
  }

  /* Items list */
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 0.875rem;
  }

  li input[type="checkbox"] {
    width: 1rem;
    height: 1rem;
    margin-right: 8px;
    cursor: pointer;
  }

  li button {
    background: none;
    border: none;
    color: red;
    font-size: 1rem;
    cursor: pointer;
    transition: color 0.2s;
  }

  li button:hover {
    color: darkred;
  }

  /* Mobile responsive adjustments */
  @media (max-width: 600px) {
    #categories-grid {
      grid-template-columns: 1fr;
    }

    .category-header {
      font-size: 0.875rem;
    }

    input[type="text"],
    .add-item {
      font-size: 0.8rem;
      padding: 8px;
    }
  }
</style>

</head>
<body>
  <div class="container mx-auto p-4 max-w-6xl">
    <h1 class="text-xl font-bold text-center text-black mb-6">Cairns Trip Packing List</h1>
    
    <div class="mb-6 flex gap-4">
      <div class="flex-1">
        <input type="text" id="category-input" placeholder="Add new category..." 
               class="w-full px-3 py-2 border border-black rounded-none text-xs">
      </div>
      <button id="add-category-btn" 
              class="px-4 py-2 bg-black text-white rounded-none text-xs hover:bg-gray-800 transition-colors">
        Add Category
      </button>
      <button id="save-btn" 
              class="px-4 py-2 bg-blue-900 text-white rounded-none text-xs hover:bg-blue-800 transition-colors">
        Save
      </button>
    </div>

    <div id="categories-grid" class="grid grid-cols-2 gap-4"></div>
  </div>

  <template id="category-template">
    <div class="category-card bg-white p-4 rounded-none shadow">
      <div class="category-header flex justify-between items-center">
        <h2 class="text-sm font-semibold"></h2>
        <button class="delete-category delete-btn hover:text-gray-300">×</button>
      </div>
      <div class="mb-4 flex gap-2">
        <input type="text" placeholder="Add item..." 
               class="flex-1 px-3 py-1 border border-black rounded-none text-xs">
        <button class="add-item px-3 py-1 bg-blue-900 text-white rounded-none text-xs hover:bg-blue-800">+</button>
      </div>
      <ul class="space-y-2"></ul>
    </div>
  </template>

  <script>
    const defaultCategories = {
      "Daily Outfits": [
        "Airport outfit (1)",
        "Fitzroy Island outfit (1)",
        "Kuranda outfit (1)",
        "Beach + City Tour outfit (1)",
        "Nightsuits (2)",
        "Extra outfit in case oopsie",
        "Light raincoat/bag"
      ],
      "Swimwear": [
        "Swimsuits (2-3)",
        "Singlet",
        "Wet bags for damp clothes"
      ],
      "Evening Attire": [
        "Evening outfit for Dec 25th",
        "Evening outfit for Dec 26th",
        "Evening outfit for Dec 27th"
      ],
      "Footwear": [
        "Comfortable walking shoes/sneakers",
        "Fashion Totes",
        "Flip-flops for beach",
        "Extra socks",
        "Water shoes"
      ],
      "Beach Stuff": [
        "Beach towel",
        "High SPF sunscreen",
        "After-sun care",
        "Sun hat",
        "Waterproof phone case",
        "Dry bag for electronics"
      ],
      "Health & Protection": [
        "Insect repellent",
        "First-aid basics",
        "Motion sickness pills",
        "Hydration tablets",
        "Reef-safe sunscreen",
        "Hand sanitizer",
        "Basic medications",
        "Bandaids"
      ],
      "Electronics": [
        "Phone charger",
        "Power bank",
        "Camera",
"Wall thing"
      ],
      "Documents & Money": [
        "Passport",
        "Tour bookings",
        "Cash + Cards",
        "Emergency contacts",
        "Hotel bookings",
        "Flight tickets"
      ],
      "Toiletries": [
        "Toothbrush + paste",
        "Shampoo + Conditioner",
        "Body wash",
        "Deodorant",
        "Hair ties/clips",
        "Razor",
        "Moisturizer with SPF",
        "Insect bite cream"
      ],
      "Random Shit": [
        "Zip-lock bags (wet clothes)",
        "Portable fan",
        "Reusable water bottle",
        "Snack pack",
        "Microfiber towel"
      ]
    };

    class PackingList {
      constructor() {
        this.categoriesGrid = document.getElementById('categories-grid');
        this.template = document.getElementById('category-template');
        this.setupEventListeners();
        this.loadData();
      }

      setupEventListeners() {
        document.getElementById('add-category-btn').onclick = () => this.addCategory();
        document.getElementById('save-btn').onclick = () => this.saveData();
        document.getElementById('category-input').onkeypress = (e) => {
          if (e.key === 'Enter') this.addCategory();
        };
      }

      loadData() {
        const savedData = JSON.parse(localStorage.getItem('packingCategories')) || defaultCategories;
        Object.entries(savedData).forEach(([category, items]) => {
          this.createCategoryCard(category, items);
        });
      }

      createCategoryCard(categoryName, items = []) {
        const card = this.template.content.cloneNode(true).children[0];
        card.querySelector('h2').textContent = categoryName;
        
        const itemInput = card.querySelector('input');
        const addItemBtn = card.querySelector('.add-item');
        const itemsList = card.querySelector('ul');
        
        items.forEach(item => this.addItemToList(itemsList, item));
        
        card.querySelector('.delete-category').onclick = () => {
          if (confirm('Delete this category?')) card.remove();
        };
        
        addItemBtn.onclick = () => {
          if (itemInput.value.trim()) {
            this.addItemToList(itemsList, itemInput.value);
            itemInput.value = '';
          }
        };
        
        itemInput.onkeypress = (e) => {
          if (e.key === 'Enter' && itemInput.value.trim()) {
            this.addItemToList(itemsList, itemInput.value);
            itemInput.value = '';
          }
        };

        this.categoriesGrid.appendChild(card);
      }

      addItemToList(list, itemText) {
        const li = document.createElement('li');
        li.className = 'flex items-center gap-2';
        li.innerHTML = `
          <input type="checkbox" class="form-checkbox h-3 w-3 text-blue-900 rounded-none checkbox-custom">
          <span class="flex-1 text-xs text-content">${itemText}</span>
          <button class="text-red-600 hover:text-red-800 text-xs">×</button>
        `;
        
        const checkbox = li.querySelector('input[type="checkbox"]');
        const span = li.querySelector('span');
        
        checkbox.onchange = () => {
          if (checkbox.checked) {
            span.style.textDecoration = 'line-through';
            span.style.color = '#666';
          } else {
            span.style.textDecoration = 'none';
            span.style.color = 'black';
          }
        };
        
        li.querySelector('button').onclick = () => li.remove();
        list.appendChild(li);
      }

      addCategory() {
        const input = document.getElementById('category-input');
        const category = input.value.trim();
        
        if (category) {
          this.createCategoryCard(category);
          input.value = '';
        }
      }

      saveData() {
        const data = {};
        this.categoriesGrid.querySelectorAll('.category-card').forEach(card => {
          const category = card.querySelector('h2').textContent;
          const items = Array.from(card.querySelectorAll('li span')).map(span => span.textContent);
          data[category] = items;
        });
        
        localStorage.setItem('packingCategories', JSON.stringify(data));
        
        const saveBtn = document.getElementById('save-btn');
        const originalText = saveBtn.textContent;
        saveBtn.textContent = 'Saved!';
        saveBtn.style.backgroundColor = '#22543d';
        
        setTimeout(() => {
          saveBtn.textContent = originalText;
          saveBtn.style.backgroundColor = '';
        }, 1000);
      }
    }

    new PackingList();
  </script>
</body>
</html>
