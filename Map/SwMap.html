<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Switzerland Travel Planner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        #map {
            height: 1000px;
            width: 100%;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .button-container {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }
        button {
            padding: 5px;
            margin: 0 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
            text-align: center;
        }
        #distance-info, #wiki-content {
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        .error-message {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Switzerland Travel Planner</h1>
    <div id="map"></div>
    <div class="button-container">
        <button id="interlaken-btn">Interlaken</button>
        <button id="lauterbrunnen-btn">Lauterbrunnen</button>
        <button id="grindelwald-btn">Grindelwald</button>
        <button id="lucerne-btn">Lucerne</button>
        <button id="zurich-btn">Zurich</button>
        <button id="distances-btn">Calculate Distances</button>
        <button id="reset-btn">Reset Map</button>
    </div>
    <div id="wiki-content"></div>
    <div id="distance-info"></div>

    <script>
        let map;
        let markers = [];
        let infoWindows = [];

        const locations = [
            { name: "Interlaken", lat: 46.68667, lng: 7.86389, description: "A popular tourist destination in the Bernese Oberland" },
            { name: "Lauterbrunnen", lat: 46.59722, lng: 7.90694, description: "Famous for its dramatic valley and waterfalls" },
            { name: "Grindelwald", lat: 46.62361, lng: 8.03472, description: "Picturesque mountain village in the Bernese Alps" },
            { name: "Lucerne", lat: 47.05051, lng: 8.30923, description: "Historic city with a beautiful lake and mountains" },
            { name: "Zurich", lat: 47.37689, lng: 8.54169, description: "Largest city in Switzerland, financial center" }
        ];

        function initMap() {
            const switzerland = { lat: 46.8182, lng: 8.2275 };
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 8,
                center: switzerland,
            });

            locations.forEach(location => {
                const marker = new google.maps.Marker({
                    position: { lat: location.lat, lng: location.lng },
                    map: map,
                    title: location.name,
                });

                const infoWindow = new google.maps.InfoWindow({
                    content: `<div>
                        <h3>${location.name}</h3>
                        <p>${location.description}</p>
                    </div>`
                });

                marker.addListener('click', () => {
                    // Close all other info windows
                    infoWindows.forEach(iw => iw.close());
                    infoWindow.open(map, marker);
                });

                markers.push(marker);
                infoWindows.push(infoWindow);
            });
        }

        function getWikiContent(city) {
            const url = `https://en.wikipedia.org/w/api.php?action=parse&page=${city}&format=json&origin=*`;
            const wikiContent = document.getElementById('wiki-content');
            wikiContent.innerHTML = '<p>Loading Wikipedia content...</p>';

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const content = data.parse.text['*'];
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(content, 'text/html');

                    const links = doc.querySelectorAll('a');
                    const list = document.createElement('ul');

                    links.forEach(link => {
                        const href = link.getAttribute('href');
                        if (href && href.startsWith('/wiki/')) {
                            const li = document.createElement('li');
                            const linkElement = document.createElement('a');
                            linkElement.setAttribute('href', `https://en.wikipedia.org${href}`);
                            linkElement.setAttribute('target', '_blank');
                            linkElement.textContent = link.textContent;
                            li.appendChild(linkElement);
                            list.appendChild(li);
                        }
                    });

                    wikiContent.innerHTML = '';
                    wikiContent.appendChild(list);
                })
                .catch(error => {
                    console.error('Error fetching Wikipedia content:', error);
                    wikiContent.innerHTML = `<p class="error-message">Could not load Wikipedia content for ${city}.</p>`;
                });
        }

        function calculateDistances() {
            const output = document.getElementById('distance-info');
            output.innerHTML = "<h3>Distances and Travel Times:</h3>"; 

            // Fallback calculation for distances (Haversine formula)
            function haversineDistance(lat1, lon1, lat2, lon2) {
                const R = 6371; // Earth's radius in kilometers
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = 
                    Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return (R * c).toFixed(2); // Distance in kilometers
            }

            let table = '<table><tr><th>From</th><th>To</th><th>Distance (km)</th></tr>';
            let tableRows = [];

            locations.forEach((origin, i) => {
                locations.slice(i + 1).forEach((destination) => {
                    const distance = haversineDistance(origin.lat, origin.lng, destination.lat, destination.lng);
                    
                    tableRows.push(`<tr>
                        <td>${origin.name}</td>
                        <td>${destination.name}</td>
                        <td>${distance} km</td>
                    </tr>`);
                });
            });

            table += tableRows.join('') + '</table>';
            output.innerHTML += table;

            // Attempt Google Maps Distance Matrix if available
            if (window.google && google.maps && google.maps.DistanceMatrixService) {
                const service = new google.maps.DistanceMatrixService();
                let matrixTable = '<h3>Google Maps Distance Matrix (if available):</h3>';
                matrixTable += '<table><tr><th>From</th><th>To</th><th>Distance (Car)</th><th>Time (Car)</th></tr>';
                let matrixRows = [];

                locations.forEach((origin, i) => {
                    locations.slice(i + 1).forEach((destination) => {
                        service.getDistanceMatrix(
                            {
                                origins: [{ lat: origin.lat, lng: origin.lng }],
                                destinations: [{ lat: destination.lat, lng: destination.lng }],
                                travelMode: google.maps.TravelMode.DRIVING,
                                unitSystem: google.maps.UnitSystem.METRIC
                            },
                            (response, status) => {
                                if (status === google.maps.DistanceMatrixStatus.OK) {
                                    const drivingDistance = response.rows[0].elements[0].distance.text;
                                    const drivingDuration = response.rows[0].elements[0].duration.text;

                                    matrixRows.push(`<tr>
                                        <td>${origin.name}</td>
                                        <td>${destination.name}</td>
                                        <td>${drivingDistance}</td>
                                        <td>${drivingDuration}</td>
                                    </tr>`);

                                    // Update the matrix table if all rows are processed
                                    if (matrixRows.length === (locations.length * (locations.length - 1)) / 2) {
                                        matrixTable += matrixRows.join('') + '</table>';
                                        output.innerHTML += matrixTable;
                                    }
                                }
                            }
                        );
                    });
                });
            }
        }

        function resetMap() {
            // Reset map to original center and zoom
            map.setCenter({ lat: 46.8182, lng: 8.2275 });
            map.setZoom(8);

            // Close any open info windows
            infoWindows.forEach(iw => iw.close());

            // Clear previous wiki and distance content
            document.getElementById('wiki-content').innerHTML = '';
            document.getElementById('distance-info').innerHTML = '';
        }

        // Event listeners
        document.getElementById('interlaken-btn').addEventListener('click', () => getWikiContent('Interlaken'));
        document.getElementById('lauterbrunnen-btn').addEventListener('click', () => getWikiContent('Lauterbrunnen'));
        document.getElementById('grindelwald-btn').addEventListener('click', () => getWikiContent('Grindelwald'));
        document.getElementById('lucerne-btn').addEventListener('click', () => getWikiContent('Lucerne'));
        document.getElementById('zurich-btn').addEventListener('click', () => getWikiContent('Zurich'));
        document.getElementById('distances-btn').addEventListener('click', calculateDistances);
        document.getElementById('reset-btn').addEventListener('click', resetMap);

        // Global error handling
        window.addEventListener('error', (event) => {
            if (event.message.includes('Google Maps')) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = 'Error loading Google Maps. Falling back to basic functionality.';
                document.body.insertBefore(errorDiv, document.getElementById('map'));
            }
        });
    </script>

    <!-- Google Maps API: Replace with your own key -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAqVp90WuvdNXrtmT0gKY4TYS3D1A0iUPA&&callback=initMap">
    </script>
</body>
</html>
