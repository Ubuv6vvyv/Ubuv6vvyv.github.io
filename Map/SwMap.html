<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Switzerland Map</title>
    <style>
        #map {
            height: 1000px;
            width: 100%;
            border: 1px solid black;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        td {
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <button id="interlaken-btn">Interlaken</button>
    <button id="lauterbrunnen-btn">Lauterbrunnen</button>
    <button id="grindelwald-btn">Grindelwald</button>
    <button id="lucerne-btn">Lucerne</button>
    <button id="zurich-btn">Zurich</button>
    <button id="distances-btn">Calculate Distances</button>
    <div id="wiki-content"></div>
    <div id="distance-info"></div> <!-- For displaying distances and times -->

    <script>
        let map;
        let markers = [];
        let locations = [
            { name: "Interlaken", lat: 46.68667, lng: 7.86389 },
            { name: "Lauterbrunnen", lat: 46.59722, lng: 7.90694 },
            { name: "Grindelwald", lat: 46.62361, lng: 8.03472 },
            { name: "Lucerne", lat: 47.05051, lng: 8.30923 },
            { name: "Zurich", lat: 47.37689, lng: 8.54169 }
        ];

        function initMap() {
            const switzerland = { lat: 46.8182, lng: 8.2275 };
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 8,
                center: switzerland,
            });

            locations.forEach(location => {
                const marker = new google.maps.Marker({
                    position: { lat: location.lat, lng: location.lng },
                    map: map,
                    title: location.name,
                });
                markers.push(marker);
            });
        }

        // Fetch and display Wikipedia content
        function getWikiContent(city) {
            const url = `https://en.wikipedia.org/w/api.php?action=parse&page=${city}&format=json&origin=*`;
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const wikiContent = document.getElementById('wiki-content');
                    wikiContent.innerHTML = ''; // Clear previous content

                    const content = data.parse.text['*'];
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(content, 'text/html');

                    const links = doc.querySelectorAll('a');
                    const list = document.createElement('ul');

                    links.forEach(link => {
                        const href = link.getAttribute('href');
                        if (href && href.startsWith('/wiki/')) {
                            const li = document.createElement('li');
                            const linkElement = document.createElement('a');
                            linkElement.setAttribute('href', `https://en.wikipedia.org${href}`);
                            linkElement.textContent = link.textContent;
                            li.appendChild(linkElement);
                            list.appendChild(li);
                        }
                    });

                    wikiContent.appendChild(list);
                })
                .catch(error => console.error('Error fetching Wikipedia content:', error));
        }

        // Calculate and display distances (car and train)
        function calculateDistances() {
            const output = document.getElementById('distance-info');
            output.innerHTML = "<h3>Distances and Travel Times:</h3>"; // Clear previous data

            let table = '<table><tr><th>From</th><th>To</th><th>Distance (Car)</th><th>Time (Car)</th><th>Distance (Train)</th><th>Time (Train)</th></tr>';
            const service = new google.maps.DistanceMatrixService();

            let totalRequests = 0;
            let completedRequests = 0;

            // Loop through all location pairs to calculate distances
            locations.forEach((origin, i) => {
                locations.slice(i + 1).forEach((destination, j) => {
                    totalRequests += 1;

                    // Get Car (DRIVING) distance and time
                    service.getDistanceMatrix(
                        {
                            origins: [{ lat: origin.lat, lng: origin.lng }],
                            destinations: [{ lat: destination.lat, lng: destination.lng }],
                            travelMode: google.maps.TravelMode.DRIVING, // Car travel mode
                            unitSystem: google.maps.UnitSystem.METRIC
                        },
                        (carResponse, carStatus) => {
                            if (carStatus === google.maps.DistanceMatrixStatus.OK) {
                                const drivingDistance = carResponse.rows[0].elements[0].distance.text;
                                const drivingDuration = carResponse.rows[0].elements[0].duration.text;

                                // Get Train (TRANSIT) distance and time
                                service.getDistanceMatrix(
                                    {
                                        origins: [{ lat: origin.lat, lng: origin.lng }],
                                        destinations: [{ lat: destination.lat, lng: destination.lng }],
                                        travelMode: google.maps.TravelMode.TRANSIT, // Train travel mode
                                        unitSystem: google.maps.UnitSystem.METRIC
                                    },
                                    (trainResponse, trainStatus) => {
                                        let transitDistance = 'N/A';
                                        let transitDuration = 'N/A';
                                        if (trainStatus === google.maps.DistanceMatrixStatus.OK) {
                                            transitDistance = trainResponse.rows[0].elements[0].distance.text;
                                            transitDuration = trainResponse.rows[0].elements[0].duration.text;
                                        }

                                        // Add the row to the table after both car and train data are available
                                        table += `<tr><td>${origin.name}</td><td>${destination.name}</td><td>${drivingDistance}</td><td>${drivingDuration}</td><td>${transitDistance}</td><td>${transitDuration}</td></tr>`;

                                        completedRequests += 1;

                                        // Once all requests are completed, render the table
                                        if (completedRequests === totalRequests) {
                                            table += '</table>';
                                            output.innerHTML += table; // Append the table
                                        }
                                    }
                                );
                            } else {
                                console.error('Error with Car request:', carStatus);
                            }
                        }
                    );
                });
            });
        }

        // Event listeners for city buttons
        const cities = ["Interlaken", "Lauterbrunnen", "Grindelwald", "Lucerne", "Zurich"];
        cities.forEach(city => {
            document.getElementById(`${city.toLowerCase()}-btn`).addEventListener('click', () => getWikiContent(city));
        });

        // Event listener for "Distances" button
        document.getElementById('distances-btn').addEventListener('click', () => calculateDistances());

    </script>

    <!-- Google Maps API: Replace your Google Maps API key here -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAqVp90WuvdNXrtmT0gKY4TYS3D1A0iUPA&callback=initMap"></script>
</body>
</html>
