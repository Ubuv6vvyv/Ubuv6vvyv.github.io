<!DOCTYPE html>
<html>
<head>
    <title>Italian Hotels Map</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
        #map { 
            height: 400px; 
            width: 100%;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: sans-serif;
            border: 2px solid #444;
            background-color: #fff;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #222;
            color: #fff;
            text-transform: uppercase;
        }
        tr:nth-child(even) {
            background-color: #f8f8f8;
        }
        tr:hover {
            background-color: #f1f1f1;
            cursor: pointer;
        }
        .selected {
            background-color: #e0e7ff !important;
        }
        .icon-button {
            background: none;
            border: none;
            color: #c00;
            cursor: pointer;
            padding: 5px;
            margin: 0 5px;
        }
        .icon-button:hover {
            color: #900;
        }
        .cancellation-date {
            background-color: #ffefef;
            color: #c00;
        }
        .total-row {
            font-weight: bold;
            background-color: #f0f0f0;
        }
        .total-row td {
            border-top: 2px solid #444;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <table id="hotelTable">
        <thead>
            <tr>
                <th>Hotel Name</th>
                <th>Address</th>
                <th>Price (AUD)</th>
                <th>Check-in</th>
                <th>Check-out</th>
                <th>Cancellation Deadline</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        const hotels = [
            {
                name: "Sant' Ambrogio Flat",
                address: "Via Edmondo de Amicis 61, Milan City Centre, 20123 Milan, Italy",
                price: 718,
                checkIn: "8 June",
                checkOut: "11 June",
                cancellation: "31 May 2025",
                coordinates: [45.4581, 9.1760],
                trainStation: {
                    name: "Milano Centrale",
                    distance: "5.4 km"
                },
                airport: {
                    name: "Milan Malpensa Airport",
                    distance: "52 km"
                }
            },
            {
                name: "Piccolo Principe Affittacamere",
                address: "Piazza Don Minzoni 5 piano 1, 19016 Monterosso al Mare, Italy",
                price: 335,
                checkIn: "11 June",
                checkOut: "12 June",
                cancellation: "27 May 2025",
                coordinates: [44.1464, 9.6492],
                trainStation: {
                    name: "Monterosso al Mare Train Station",
                    distance: "0.18 km"
                },
                airport: {
                    name: "Genoa Airport",
                    distance: "97 km"
                }
            },
            {
                name: "B&B Emozioni Fiorentine",
                address: "Piazza Della Repubblica 3, Santa Maria Novella, 50123 Florence, Italy",
                price: 968,
                checkIn: "12 June",
                checkOut: "15 June",
                cancellation: "7 June 2025",
                coordinates: [43.7721, 11.2538],
                trainStation: {
                    name: "Firenze Santa Maria Novella",
                    distance: "1.0 km"
                },
                airport: {
                    name: "Florence Airport",
                    distance: "4.7 km"
                }
            },
            {
                name: "Tenuta Santo Pietro",
                address: "Podere Santo Pietro 29, 53026 Pienza, Italy",
                price: 320,
                checkIn: "15 June",
                checkOut: "16 June",
                cancellation: "16 May 2025",
                coordinates: [43.0773, 11.6786],
                trainStation: {
                    name: "Chiusi-Chianciano Terme",
                    distance: "38.4 km"
                },
                airport: {
                    name: "Florence Airport",
                    distance: "128 km"
                }
            },
            {
                name: "La Caravella di Positano - Relais & Beach",
                address: "Via Rampa Teglia, 23, 84017 Positano, Italy",
                price: 2045,
                checkIn: "16 June",
                checkOut: "18 June",
                cancellation: "2 June 2025",
                coordinates: [40.6287, 14.4842],
                trainStation: {
                    name: "Piano di Sorrento",
                    distance: "14.5 km"
                },
                airport: {
                    name: "Naples Airport",
                    distance: "33.1 km"
                }
            }
        ];

        //  map
        const map = L.map('map').setView([42.8333, 12.8333], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        //  hotel
        const markers = {};
        hotels.forEach(hotel => {
            const marker = L.marker(hotel.coordinates)
                .bindPopup(`
                    <b>${hotel.name}</b><br>
                    ${hotel.address}<br>
                    Price: AUD ${hotel.price}<br>
                    Check-in: ${hotel.checkIn}<br>
                    Check-out: ${hotel.checkOut}<br>
                    Cancellation: ${hotel.cancellation}<br>
                    <small>Train: ${hotel.trainStation.distance} to ${hotel.trainStation.name}<br>
                    Airport: ${hotel.airport.distance} to ${hotel.airport.name}</small>
                `)
                .addTo(map);
            markers[hotel.name] = marker;
        });

        //  table
        const tbody = document.querySelector('#hotelTable tbody');
        let totalPrice = 0;

        hotels.forEach(hotel => {
            totalPrice += hotel.price;
            const row = tbody.insertRow();
            row.innerHTML = `
                <td>${hotel.name}</td>
                <td>${hotel.address}</td>
                <td>AUD ${hotel.price}</td>
                <td>${hotel.checkIn}</td>
                <td>${hotel.checkOut}</td>
                <td class="cancellation-date">${hotel.cancellation}</td>
                <td>
                    <button class="icon-button" onclick="showTrain('${hotel.name}')">🚂 Train</button>
                    <button class="icon-button" onclick="showAirport('${hotel.name}')">✈️ Airport</button>
                    <button class="icon-button" onclick="showHotel('${hotel.name}')">🏨 Hotel</button>
                </td>
            `;

            row.addEventListener('click', () => {
                document.querySelectorAll('tr').forEach(r => r.classList.remove('selected'));
                row.classList.add('selected');
                markers[hotel.name].openPopup();
                map.setView(markers[hotel.name].getLatLng(), 13);
            });
        });

        
        const totalRow = tbody.insertRow();
        totalRow.className = 'total-row';
        totalRow.innerHTML = `
            <td colspan="2">Total</td>
            <td>AUD ${totalPrice}</td>
            <td colspan="4"></td>
        `;

        
        window.showTrain = (hotelName) => {
            const hotel = hotels.find(h => h.name === hotelName);
            const url = `https://www.google.com/maps/dir/${encodeURIComponent(hotel.address)}/${encodeURIComponent(hotel.trainStation.name)}`;
            window.open(url, '_blank');
        };

        window.showAirport = (hotelName) => {
            const hotel = hotels.find(h => h.name === hotelName);
            const url = `https://www.google.com/maps/dir/${encodeURIComponent(hotel.address)}/${encodeURIComponent(hotel.airport.name)}`;
            window.open(url, '_blank');
        };

        window.showHotel = (hotelName) => {
            const hotel = hotels.find(h => h.name === hotelName);
            const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(hotel.address)}`;
            window.open(url, '_blank');
        };
    </script>
</body>
</html>
