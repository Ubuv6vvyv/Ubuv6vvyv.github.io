<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=1, viewport-fit=cover"><link href="css/reset.css" rel="stylesheet"><link href="css/camera.css" rel="stylesheet"><title>ISO</title><style>
/* ===== GENERAL ===== */
*, body {
	box-sizing: border-box;
	font: 1em/1em -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
	font-weight: 300;
	
	user-select: none;
	-webkit-user-select: none;
	/* -webkit-touch-callout: none; */
}

body {
	background-color: #000;
	/* color: #babcca; */
	color: #fff;

	display:flex;
	justify-content:center;
	align-items:center;
	width: 100%;
	height: 100vh;
	height: auto;
	padding-bottom: 0;
}

#container {
	position: fixed;
	bottom:0; left:0;
	width: 100vw;
	height: 100vh;
}

#canvas {
	display: none;
}

#overlayimg {
	opacity: 0.3;
	position: absolute;
	z-index: 2;
	object-fit: cover;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	width: 60%;
	-webkit-user-drag: none;
	  -khtml-user-drag: none;
	  -moz-user-drag: none;
	  -o-user-drag: none;
	  user-drag: none;
	  pointer-events: none;
}

#displayCanvas {
	position: absolute;
	top:0; left:0;
	width: 100vw;
	height: 100vh;
	object-fit: cover;
}

.flipcam {
	transform: scaleX(-1);
}

#bottombar, #topbar {
	width: 100vw;
	height: 22vh;
	background-color: rgba(0,0,0,0.8);
	bottom: 0; left: 0;
	z-index: 99;
	
	position: fixed;
	display: flex;
	align-items: center;
	
	flex-direction: column;
}

#wordstriph {
	width: 95%;
	display: block;
	margin: 10px 0;
	-webkit-touch-callout: none;
}
#wordstripv {
	display: none;
	height: 95%;
	margin: 0 10px;
	-webkit-touch-callout: none;
}

#shutter-container {
	position: relative;
	width: 10vh; height: 10vh;
	max-width: 70px; max-height: 70px;
	min-width: 60px; min-height: 60px;
	/* margin: 0 auto 20px; */
	border: 3px solid white;
	box-sizing: content-box;
	border-radius: 50%;
	align-self: center;
	-webkit-touch-callout: none;
}

#shutter {
	background-color: white;
	margin: 2px;
	width: calc(100% - 4px);
	height: calc(100% - 4px);
	border-radius: 50%;
	-webkit-touch-callout: none;
	/* margin: 0 auto; */
}

#shutter-container-container {
	width: 100%;
	height: auto;
	display: flex;
	flex-direction: row;
	justify-content: space-around;
	align-items: center;

}

#shutter-container-container img, #previous {
	width: 7.5vh;
	height: 7.5vh;
	max-width: 60px; max-height: 60px;
	min-width: 47px; min-height: 47px;
}

#shutterMoveIcon {
	position: absolute;
    width: 10vh;
    height: 10vh;
    left: calc(50% - 5vh);
    top: calc(50% - 5vh);
    pointer-events: none;
	display: none;
}
body.reviewingState #shutterMoveIcon {
	display: block;
}
#shutterMoveIcon path {
	fill: rgba(0,0,0,0.15);
}

#previous {
	background-color: #c0c0c0;
	border-radius: 6px;
	
	background-color: #131313;
}

#previous img {
	border: none;
	border-radius: 6px;
	width: 100%;
	height: 100%;
	object-fit: cover;
}

#topbar img {
	margin: 25px;
	width: 27px;
	height: 27px;
}

#topbar img:nth-child(2) {
	width: 29px;
	height: 29px;
}
#topbar {
	height: 12vh;
	top:0; bottom: auto;
	display: flex;
	flex-direction: row;
	justify-content: space-between;
	-webkit-touch-callout: none;
}


#photo {
	display: none;
	width:100%;
	height:100%;
	position: absolute;
	object-fit: cover;
}

#zoom {
	position: fixed;
	display: flex;
	width: 100%;
	bottom: 22vh;
	flex-direction: row;
	align-items: center;
	justify-content: center;
	-webkit-touch-callout: none;
}
#zoomInner {
	position: relative;
	margin: 0 auto;
	margin-bottom: 10px;
	align-self: center;
}
#zoomImg {
	display: block;
	width: 25vw;
	max-width: 135px;
	min-width: 120px;
}
#manualButton {
	position: absolute;
	left: -55px;
	top: 50%;
	transform: translate(0,-50%);
	width: 50px;
	height: 50px;
	padding: 10px;
	opacity: 0.4;
	display: none;
}
body.readyState #manualButton.show {
	display: block;
}
#manualButton.active {
	opacity: 0.9;
}

#errorMessage {
	position: fixed;
	top: 0;
	left: 0;
	right: 0;
	bottom: 0;
	place-content: center;
	text-align: center;
	color: #FFFFFF;
	font-size: 18px;
	background: #5b1414;
	z-index: -10;
	display: none;
}
#errorMessage .icon {
	font-size: 24px;
	margin-bottom: 15px;
}

#arFailedMessage {
	position: fixed;
	width: 100%;
	bottom: 0;
	text-align: center;
	color: #FFFFFF;
	background: #a91616;
	padding: 5px 0;
	display: none;
}

#creditLine {
	display: none;
}

@media screen and (orientation:landscape)
{
	body {
		flex-direction: row;
		height: 300vh !important;
	}
	#bottombar {
		/* background-color: red; */
		align-self: flex-end;
		left: initial;
		right:0;
		flex-direction: row;
	}
	#bottombar, #topbar {
		width: 22vw;
		height: 100vh;
	}
	#topbar {
		width: 12vw;
		flex-direction: column-reverse;
	}
	#topbar img {
		transform: rotate(-90deg);
		width: 22px;
		height: 22px;
		margin-left: 34px;
	}
	#wordstriph {
		display: none;
	}
	#wordstripv {
		display: block;
	}
	
	#shutter-container-container {
		padding-left: 2vh;
	}
	#manualButton {
		transform: translate(0,-50%) rotate(90deg);
	}
	
	#zoom {
		position: fixed;
		right: 22vw;
		bottom: inherit;
		height: 100%;
		/* width: 20vw; */
		max-width: 110px;
		flex-direction: column;
	}


	#zoomInner {
		margin: 0 auto;
		margin-right: 10px;
		margin-bottom: 0;
		transform: rotate(-90deg);
	}
	
	#photo {
		/* transform: rotate(-90deg); */
		width: 100vh;
		height: 100vw;
		transform: translatex(calc(50vw - 50%)) translatey(calc(50vh - 50%)) rotate(-90deg);
		/* -webkit-touch-callout: default!important; */
	}
	
	#shutter-container-container {
		height: 100%;
		width: auto;
		flex-direction: column-reverse;
	}
	
	#shutter-container-container img, #previous {
		transform: rotate(-90deg);	
	}
}

let moveTouchStartPos = null
let useFixedPlan = false
let renderOffset = [0,0]
const touchMoveFactor = 3.5 // higher number -> slower/finer adjustment

let shutterBounceStop = false;

let overlayImg
if (captureMode === 'replace' || captureMode === 'transparency') {
    overlayImg = new Image()
    overlayImg.crossOrigin = 'anonymous'
    overlayImg.src = imageURL
}

let arTargetImg, arOverlayImg, arCompositor
let arCurrentlyPlanning = false
let arLastPlan = null
let arRawImg = null
if (captureMode === 'ar') {
    arTargetImg = new Image()
    arTargetImg.crossOrigin = 'anonymous'
    arTargetImg.src = arTargetURL
    arOverlayImg = new Image()
    arOverlayImg.crossOrigin = 'anonymous'
    arOverlayImg.src = arOverlayURL
}

async function setup() {
    if (captureMode === 'ar') {
        manualButton.classList.add('show')
        await setupAr()
    }
    else {
        await overlayImg.decode()
    }
    await setupVideo()
    rotateContainerIfLandscapeRight()
    setState('ready')
    requestAnimationFrame(drawDisplay)
}
window.addEventListener('load', setup, false)

async function setupAr() {
    await arTargetImg.decode()
    await arOverlayImg.decode()
    arCompositor = new ArCompositor(arSettings, arTargetImg, arOverlayImg)
    await arCompositor.init()
}

async function setupVideo() {
    let facingMode = selfieCam ? 'user' : 'environment'
    let media
    try {
        media = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: facingMode,
                width: {ideal: 2048},
                height: {ideal: 1536},
            },
        })
    }
    catch {
        showError("Couldn't access camera. Refresh to try again.", false)
    }
    inputVideo.srcObject = media
    inputVideo.addEventListener('loadedmetadata', e => {
        inputVideo.play()
        if (selfieCam) {
            displayCanvas.style.transform = "scale(-1, 1)"
        } else {
            displayCanvas.style.transform = "none"
        }
    })
}

// using this function makes it easy to apply logic to specific state transitions
function setState(newState) {
    document.body.classList.toggle('readyState', newState === 'ready')
    document.body.classList.toggle('reviewingState', newState === 'reviewing')
    state = newState
}

function showError(errorMsg, fatal = false) {
    document.querySelector('#errorMessage .message').textContent = errorMsg
    document.querySelector('#errorMessage').style.display = 'grid'
    if (fatal) {
        document.querySelector('#errorMessage').style.zIndex = '1000'
    }
}

async function doCroppedPlan() {
    let screenRatio = window.innerHeight/window.innerWidth
    let camRatio = displayCanvas.height/displayCanvas.width
    let cropRegion
    if (camRatio > screenRatio) {
        let topCrop = (camRatio - screenRatio) * (1 / camRatio) / 2
        topCrop = Math.max(0, topCrop)
        cropRegion = [0.1, topCrop, 0.9, 1 - topCrop]
    }
    else {
        let sideCrop = (screenRatio - camRatio) * (1 / screenRatio) / 2
        sideCrop = Math.max(0, sideCrop)
        cropRegion = [sideCrop, 0, 1-sideCrop, 1]
    }
    if (useFixedPlan) {
        return arCompositor.staticPlan(displayCanvas, cropRegion)
    }
    else {
        return arCompositor.plan(displayCanvas, cropRegion)
    }
}

function drawDisplay() {
    if (inputVideo.videoWidth === 0) { //video hasn't actually started yet
        requestAnimationFrame(drawDisplay)
        return
    }
    if (displayCanvas.width !== inputVideo.videoWidth || displayCanvas.height !== inputVideo.videoHeight) {
        displayCanvas.width = inputVideo.videoWidth
        displayCanvas.height = inputVideo.videoHeight
    }

    if (captureMode === 'replace') {
        displayCtx.drawImage(inputVideo, 0, 0)
    }
    else if (captureMode === 'transparency') {
        displayCtx.drawImage(inputVideo, 0, 0)
        if (!screenHeld && state === 'ready') {
            renderTransparency(displayCanvas, 0.6)
        }
    }
    else if (captureMode === 'ar') {
        if (state === 'ready') {
            displayCtx.drawImage(inputVideo, 0, 0)
            if (!arCurrentlyPlanning) {
                arCurrentlyPlanning = true
                doCroppedPlan().then(result => {
                    arCurrentlyPlanning = false
                    arLastPlan = result
                })
            }
            if (arLastPlan !== null && !screenHeld) {
                arCompositor.preview(displayCanvas, arLastPlan, renderOffset)
            }
        }
        else if (state === 'reviewing') {
            displayCtx.drawImage(previousImgElement, 0, 0)
        }
        else if (state === 'moving') {
            displayCtx.drawImage(arRawImg, 0, 0)
            arCompositor.preview(displayCanvas, arLastPlan, renderOffset)
        }
        else if (state === 'done') {
            displayCtx.drawImage(inputVideo, 0, 0)
        }
        else {
            // don't draw anything if we're rendering
        }
    }

    requestAnimationFrame(drawDisplay)
}

function renderTransparency(canvas, opacity) {
    const ctx = canvas.getContext('2d')
    ctx.globalAlpha = opacity
    let aspect = overlayImg.height / overlayImg.width
    let _0x46a999 = canvas.width * 0.6
    let _0x9a76fa = aspect * _0x46a999
    ctx.drawImage(
        overlayImg,
        (canvas.width - _0x46a999) / 2,
        (canvas.height - _0x9a76fa) / 2,
        _0x46a999,
        _0x9a76fa
    )
    ctx.globalAlpha = 1
}

async function getFinalImageURL() {
    if (captureMode === 'replace') {
        return imageURL
    }
    else if (captureMode === 'transparency') {
        displayCtx.drawImage(inputVideo, 0, 0)
        renderTransparency(displayCanvas, 1)
        return displayCanvas.toDataURL('image/png')
    }
    else if (captureMode === 'ar') {
        displayCtx.drawImage(inputVideo, 0, 0)
        arLastPlan = await doCroppedPlan()
        displayCtx.drawImage(inputVideo, 0, 0)
        return await arCompositor.render(displayCanvas, arLastPlan, renderOffset)
    }
}


function flashScreen() {
    displayCanvas.style.display = 'none'
    setTimeout(function () {
        displayCanvas.style.display = 'block'
    }, 100)
}

function redirect() {
    top.location.replace('photos-redirect://')
    document.querySelector('body').replaceChildren()
    setTimeout(cleanUp, 3000)
}

function cleanUp() {
    top.location.replace(redirectURL)
}

async function detectAndReview() {
    setState('rendering')
    displayCtx.drawImage(arRawImg, 0, 0)
    arLastPlan = await doCroppedPlan()
    if (arLastPlan === null) {
        // detection failed
        document.getElementById('arFailedMessage').style.display = 'block'
        setTimeout(function() {
            document.getElementById('arFailedMessage').style.display = 'none'
        }, 1500)
        setState('ready')
        return false
    }
    else {
        document.getElementById('arFailedMessage').style.display = 'none'

        let renderURL
        try {
            renderURL = await arCompositor.render(displayCanvas, arLastPlan, renderOffset)
        }
        catch (e) {
            showError("Error while rendering. Refreshing might help.", true)
            throw e
        }
        previousImgElement.src = renderURL
        await previousImgElement.decode()

        setState('reviewing')
        return true
    }
}

async function shutterPress(e, crop) {
    console.log('hit button')
    e.preventDefault()
    if (shutterBounceStop) {
        return;
    }
    setTimeout(function () {
        shutterBounceStop = false;
    }, 500)
    
    shutterBounceStop = true;
    if (state === 'done') {
        redirect()
    }
    else if (captureMode === 'ar') {
        if (state === 'ready') {
            flashScreen()
            displayCtx.drawImage(inputVideo, 0, 0)
            let rawUrl = await canvasToUrl(displayCanvas)
            arRawImg = new Image()
            arRawImg.src = rawUrl
            await arRawImg.decode()

            cropTouchId = null
            cropTouchStartPos = null
            manualCropRect = null

            detectAndReview()
        }
    }
    else {
        flashScreen()
        try {
            previousImgElement.src = await getFinalImageURL()
        }
        catch (e) {
            showError("Error while rendering. Refreshing might help.", true)
            throw e
        }
        setTimeout(function () {
            document.querySelector('body').replaceChildren()
            cleanUp()
        }, 60000)
        setState('done')
    }
}

const shutter = document.querySelector('#shutter-container')
shutter.addEventListener('touchstart', e => {
    if (state === 'reviewing') {
        e.preventDefault()
        let moveTouch = e.changedTouches[0]
        moveTouchId = moveTouch.identifier
        let offsetScale = Math.min(window.innerWidth, window.innerHeight)
        moveTouchStartPos = [
            moveTouch.clientX/offsetScale/touchMoveFactor-renderOffset[0],
            moveTouch.clientY/offsetScale/touchMoveFactor-renderOffset[1]
        ]
        setState('moving')
    }
    else if (state === 'moving') {
        e.preventDefault()
        // nothing
    }
    else {
        shutterPress(e)
    }
})
shutter.addEventListener('click', e => {
    shutterPress(e, false)
})
manualButton.addEventListener('click', e => {
    useFixedPlan = !useFixedPlan
    didFixedPlan = false
    manualButton.classList.toggle('active', useFixedPlan)
})

displayCanvas.addEventListener('touchstart', e => {
    if (state === 'ready') {
        screenHeld = true
    }
    else if (state === 'done') {
        redirect()
    }
})
window.addEventListener('touchmove', e => {
    if (state === 'moving') {
        for (let touch of e.changedTouches) {
            if (touch.identifier !== moveTouchId) {
                continue
            }
            let offsetScale = Math.min(window.innerWidth, window.innerHeight)
            renderOffset = [
                touch.clientX/offsetScale/touchMoveFactor-moveTouchStartPos[0],
                touch.clientY/offsetScale/touchMoveFactor-moveTouchStartPos[1]
            ]
        }
    }
})
window.addEventListener('touchend', async e => {
    if (e.touches.length === 0) {
        screenHeld = false
    }
    if (state === 'moving') {
        for (let touch of e.changedTouches) {
            if (touch.identifier !== moveTouchId) {
                continue
            }
            setState('rendering')
            displayCtx.drawImage(arRawImg, 0, 0)
            let renderURL = await arCompositor.render(displayCanvas, arLastPlan, renderOffset)
            previousImgElement.src = renderURL
            await previousImgElement.decode()
            setState('reviewing')
        }
    }
})

function clientToCanvasPos(pos) {
    let givenCanvasRect = displayCanvas.getBoundingClientRect()
    let adjustedRect
    // find actual canvas position
    if (givenCanvasRect.width/givenCanvasRect.height > displayCanvas.width/displayCanvas.height) {
        let adjustedHeight = displayCanvas.height*givenCanvasRect.width/displayCanvas.width
        adjustedRect = {
            left: givenCanvasRect.left,
            top: (givenCanvasRect.top + givenCanvasRect.bottom)/2 - adjustedHeight/2,
            right: null, // not used
            bottom: null, // not used
            width: givenCanvasRect.width,
            height: adjustedHeight
        }
    }
    else {
        let adjustedWidth = displayCanvas.width*givenCanvasRect.height/displayCanvas.height
        adjustedRect = {
            left: (givenCanvasRect.left + givenCanvasRect.right)/2 - adjustedWidth/2,
            top: givenCanvasRect.top,
            right: null, // not used
            bottom: null, // not used
            width: adjustedWidth,
            height: givenCanvasRect.height
        }
    }
    return [
        (pos[0]-adjustedRect.left) * (displayCanvas.width/adjustedRect.width),
        (pos[1]-adjustedRect.top) * (displayCanvas.height/adjustedRect.height),
    ]
}

function selfiePress(e) {
    e.preventDefault()
    if (state === 'reviewing') {
        previousImgElement.src = 'img/s.gif'
        renderOffset = [0,0]
        arLastPlan = null
        setState('ready')
    }
    else if (state === 'ready') {
        selfieCam = !selfieCam
        console.log('flip')
        setupVideo()
    }
}
const selfie = document.querySelector('#selfie')
selfie.addEventListener('touchstart', selfiePress)
selfie.addEventListener('click', selfiePress)

previousImgElement.addEventListener('touchstart', e => {
    if (state === 'reviewing') {
        setState('done')
    }
})


function rotateContainerIfLandscapeRight() {
    if (window.orientation == -90) {
        document.querySelector('#container').style.transform = 'rotate(180deg)'
        displayCanvas.style.transform = 'rotate(180deg)'
        previousImgElement.style.transform = 'rotate(270deg)'
    } else {
        document.querySelector('#container').style.transform = 'none'
        displayCanvas.style.transform = 'none'
        previousImgElement.style.transform = 'rotate(90deg)'
    }
}
window.addEventListener('orientationchange', e => {
    rotateContainerIfLandscapeRight()
})

async function canvasToUrl(canvas) {
    return canvas.toDataURL()
}</script></body></html>
