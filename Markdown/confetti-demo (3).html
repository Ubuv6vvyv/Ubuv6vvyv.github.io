<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {			
		
background: linear-gradient(135deg, #0f0f0f, #1c1c1c);


			
            
        }
        /* Optimized shockwave and flash keyframes */
        @keyframes shockwaveExpand {
            0% { 
                transform: scale(0.1) rotate(0deg);
                opacity: 1;
                filter: brightness(1);
            }
            70% { 
                transform: scale(3) rotate(10deg);
                opacity: 0.8;
                filter: brightness(5);
            }
            100% { 
                transform: scale(5) rotate(-10deg);
                opacity: 0;
                filter: brightness(10);
            }
        }
        @keyframes intenseFlash {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
        @keyframes radicalShake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-10px) rotate(-5deg); }
            40% { transform: translateX(10px) rotate(5deg); }
            60% { transform: translateX(-15px) rotate(-7deg); }
            80% { transform: translateX(15px) rotate(7deg); }
        }
    </style>
</head>
<body>
<script>
(function() {
    // Debounce function to prevent excessive triggering
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    // Load Confetti Library (via CDN)
    const loadScript = (src, callback) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = callback;
        document.head.appendChild(script);
    };

    loadScript('https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js', () => {
        console.log('Confetti.js loaded');

        // Enhanced Spectacular Effects
        const spectacularEffects = [
            {
                name: 'WhiteoutBlast',
                particleCount: 750,
                spread: 300,
                startVelocity: 60,
                gravity: 0.6,
                colors: ['#FF4500', '#FFFFFF', '#FFD700', '#FF6347'],
                scalar: 1.4,
                ticks: 200,
                pageEffect: 'whiteoutShockwave'
            },
            {
                name: 'DarkRift',
                particleCount: 650,
                spread: 270,
                startVelocity: 55,
                gravity: 0.5,
                colors: ['#8A2BE2', '#4B0082', '#9400D3', '#FFFFFF'],
                scalar: 1.3,
                ticks: 180,
                pageEffect: 'fadeToBlackShock'
            },
            {
                name: 'ChromaticExplosion',
                particleCount: 800,
                spread: 330,
                startVelocity: 65,
                gravity: 0.7,
                colors: ['#00FFFF', '#1E90FF', '#FF1493', '#FFFFFF'],
                scalar: 1.5,
                ticks: 220,
                pageEffect: 'chromaticShockwave'
            }
        ];

        // Advanced Page Effects with Dramatic Transitions
        const pageEffects = {
            whiteoutShockwave: (overlay) => {
                // Intense white flash with shockwave
                Object.assign(overlay.style, {
                    backgroundColor: 'white',
                    animation: 'shockwaveExpand 0.2s cubic-bezier(0.25, 0.1, 0.25, 1), intenseFlash 0.3l2s ease-out',
                    zIndex: '9999'
                });

                // Body shake and temporary brightness
                document.body.style.animation = 'radicalShake 0.3s linear';
                document.body.style.filter = 'brightness(2)';

                // Fade sequence
                setTimeout(() => {
                    overlay.style.backgroundColor = 'black';
                    document.body.style.filter = 'brightness(1)';
                    document.body.style.animation = '';
                }, 100);

                // Cleanup
                setTimeout(() => overlay.remove(), 500);
            },
            fadeToBlackShock: (overlay) => {
                // Deep purple to black dramatic fade
                Object.assign(overlay.style, {
                    background: 'linear-gradient(45deg, rgba(75,0,130,1), rgba(0,0,0,1))',
                    animation: 'shockwaveExpand 0.2s cubic-bezier(0.4, 0, 0.2, 1)',
                    zIndex: '9999'
                });

                // Intense screen distortion
                document.body.style.animation = 'radicalShake 0.2s linear';
                
                // Fade to complete black
                setTimeout(() => {
                    overlay.style.backgroundColor = 'black';
                    document.body.style.background = 'black';
                }, 200);

                // Cleanup
                setTimeout(() => {
                    overlay.remove();
                    document.body.style.animation = '';
                    document.body.style.background = 'linear-gradient(135deg, #0f0f0f, #1c1c1c)';
                }, 600);
            },
            chromaticShockwave: (overlay) => {
                // Vibrant color shockwave with rapid transitions
                Object.assign(overlay.style, {
                    background: 'linear-gradient(135deg, rgba(0,255,255,0.7), rgba(255,20,147,0.7))',
                    animation: 'shockwaveExpand 0.2s ease-out, intenseFlash 0.2s alternate',
                    mixBlendMode: 'color-dodge',
                    zIndex: '9999'
                });

                // Intense screen vibration
                document.body.style.animation = 'radicalShake 0.3s linear';

                // Quick color and brightness manipulation
                setTimeout(() => {
                    overlay.style.filter = 'brightness(2) contrast(200%)';
                    document.body.style.filter = 'brightness(1.5)';
                }, 150);

                // Cleanup
                setTimeout(() => {
                    overlay.remove();
                    document.body.style.animation = '';
                    document.body.style.filter = 'brightness(1)';
                }, 250);
            }
        };

        // Create performance-friendly overlay
        const createQuickOverlay = () => {
            const overlay = document.createElement('div');
            Object.assign(overlay.style, {
                position: 'fixed',
                top: '0',
                left: '0',
                width: '100vw',
                height: '100vh',
                pointerEvents: 'none'
            });
            document.body.appendChild(overlay);
            return overlay;
        };

        // Trigger Spectacular Confetti with Optimized Effects
        const triggerSpectacularConfetti = debounce((event) => {
            // Randomly select an effect
            const effect = spectacularEffects[Math.floor(Math.random() * spectacularEffects.length)];

            // Trigger confetti with controlled overhead
            confetti({
                particleCount: effect.particleCount,
                spread: effect.spread,
                startVelocity: effect.startVelocity,
                gravity: effect.gravity,
                colors: effect.colors,
                scalar: effect.scalar,
                ticks: effect.ticks,
                origin: {
                    x: event.pageX / window.innerWidth,
                    y: event.pageY / window.innerHeight
                }
            });

            // Create and trigger page effect
            const overlay = createQuickOverlay();
            pageEffects[effect.pageEffect](overlay);
        }, 300); // Debounce to prevent spam

        // Click handling with spectacle probability
        let clickCount = 0;
        const handleClick = (event) => {
            // Probabilistic spectacular effect
            const spectacleChance = Math.random() * (clickCount * 0.2);
            
            if (spectacleChance > 0.5) {
                triggerSpectacularConfetti(event);
                clickCount = 0;
            } else {
                // Lightweight fallback confetti
                confetti({
                    particleCount: 50,
                    spread: 30,
                    origin: {
                        x: event.pageX / window.innerWidth,
                        y: event.pageY / window.innerHeight
                    }
                });
                clickCount++;
            }
        };

        // Attach click event
        document.addEventListener('click', handleClick);
    });
})();
</script>
</body>
</html>
