
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Pitched Sound Showcase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        button {
            margin: 5px 0;
            padding: 10px;
            background-color: #333;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #444;
        }
    </style>
</head>
<body>
    <h1>High-Pitched Sound Showcase</h1>
    <button id="mosquitoBtn">Mosquito Whine</button>
    <button id="ultrasonicBtn">Ultrasonic Squeal</button>
    <button id="earPiercingBtn">Ear-Piercing Tone</button>
    <button id="annoyingToAnimalsBtn">Most Annoying to Animals</button>
    <button id="annoyingToAdultsBtn">Most Annoying to Adults</button>
    <button id="hardToDetectBtn">Hardest to Detect</button>

    <script>
        let audioContext;
        let oscillator;

        document.getElementById('mosquitoBtn').addEventListener('click', () => {
            audioContext = new AudioContext();
            oscillator = audioContext.createOscillator();
            oscillator.type = 'sawtooth';
            oscillator.frequency.value = 17000;
            oscillator.connect(audioContext.destination);
            oscillator.start();
        });

        document.getElementById('ultrasonicBtn').addEventListener('click', () => {
            audioContext = new AudioContext();
            oscillator = audioContext.createOscillator();
            oscillator.type = 'sine';
            oscillator.frequency.value = 15000;
            oscillator.connect(audioContext.destination);
            oscillator.start();
        });

        document.getElementById('earPiercingBtn').addEventListener('click', () => {
            audioContext = new AudioContext();
            oscillator = audioContext.createOscillator();
            oscillator.type = 'square';
            oscillator.frequency.value = 16000;
            oscillator.connect(audioContext.destination);
            oscillator.start();
        });

        document.getElementById('annoyingToAnimalsBtn').addEventListener('click', () => {
            audioContext = new AudioContext();
            oscillator = audioContext.createOscillator();
            oscillator.type = 'sawtooth';
            oscillator.frequency.value = 17500;
            oscillator.connect(audioContext.destination);
            oscillator.start();
        });

        document.getElementById('annoyingToAdultsBtn').addEventListener('click', () => {
            audioContext = new AudioContext();
            oscillator = audioContext.createOscillator();
            oscillator.type = 'square';
            oscillator.frequency.value = 15000;
            oscillator.connect(audioContext.destination);
            oscillator.start();
        });

        document.getElementById('hardToDetectBtn').addEventListener('click', () => {
            audioContext = new AudioContext();
            oscillator = audioContext.createOscillator();
            gainNode = audioContext.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.value = 300; // Start with a low frequency
            gainNode.gain.value = 1; // Start with maximum gain
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            oscillator.start();

            // Create a fade-out effect
            const fadeOut = () => {
                gainNode.gain.value -= 0.01;
                if (gainNode.gain.value > 0) {
                    requestAnimationFrame(fadeOut);
                }
            };
            fadeOut();

            // Create a fade-in effect after 3 seconds
            setTimeout(() => {
                const fadeIn = () => {
                    gainNode.gain.value += 0.01;
                    if (gainNode.gain.value < 1) {
                        requestAnimationFrame(fadeIn);
                    }
                };
                fadeIn();
            }, 1000);

            // Randomly change the frequency every 5 seconds
            setInterval(() => {
                oscillator.frequency.value = Math.random() * 100 + 100;
            }, 7700);
        });
    </script>
</body>
</html>
