<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Curiosity Explorer</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #f4f4f4;
            font-family: 'Inter', Arial, sans-serif;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .nav-tabs .nav-link {
            color: #495057;
            transition: all 0.3s ease;
        }
        .nav-tabs .nav-link.active {
            background-color: #007bff;
            color: white;
        }
        #pdf-preview img {
            max-width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 8px;
        }
        .metadata-container {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
        }
        .table-bordered {
            border: 1px solid #dee2e6;
        }
        .accordion-button {
            background-color: #f8f9fa;
        }
        #custom-regex {
            display: none;
        }
        .copy-btn {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1 class="text-center my-4 display-6">
            <i class="fas fa-file-pdf text-danger me-2"></i>PDF Curiosity Explorer
        </h1>

        <div class="row">
            <!-- PDF Upload Section -->
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header d-flex align-items-center">
                        <i class="fas fa-upload me-2"></i>PDF Upload
                    </div>
                    <div class="card-body">
                        <input 
                            type="file" 
                            id="pdf-input" 
                            class="form-control" 
                            accept=".pdf"
                        >
                        <small class="form-text text-muted">
                            Max file size: 50MB. Supported format: PDF
                        </small>
                    </div>
                </div>

                <!-- Preview Card -->
                <div class="card mt-3">
                    <div class="card-header">
                        <i class="fas fa-image me-2"></i>PDF Preview
                    </div>
                    <div class="card-body text-center" id="pdf-preview">
                        <p class="text-muted">Upload a PDF to see preview</p>
                    </div>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="col-md-8">
                <!-- Tabs Navigation -->
                <ul class="nav nav-tabs" id="pdfTabs">
                    <li class="nav-item">
                        <a class="nav-link active" data-bs-toggle="tab" href="#metadata">
                            <i class="fas fa-info-circle me-1"></i>Metadata
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#text">
                            <i class="fas fa-file-alt me-1"></i>Text Content
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#images">
                            <i class="fas fa-images me-1"></i>Images
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#analysis">
                            <i class="fas fa-chart-bar me-1"></i>Analysis
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" data-bs-toggle="tab" href="#search">
                            <i class="fas fa-search me-1"></i>Text Search
                        </a>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content mt-3">
                    <!-- Metadata Tab -->
                    <div class="tab-pane fade show active" id="metadata">
                        <div class="card">
                            <div class="card-body" id="metadata-content">
                                <div class="text-center text-muted">
                                    Upload a PDF to view metadata
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Text Content Tab -->
                    <div class="tab-pane fade" id="text">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                Text Content
                                <div>
                                    <button id="download-markdown" class="btn btn-outline-primary btn-sm me-2">
                                        <i class="fas fa-file-download me-1"></i>Markdown
                                    </button>
                                    <button id="download-html" class="btn btn-outline-primary btn-sm">
                                        <i class="fas fa-file-download me-1"></i>HTML
                                    </button>
                                </div>
                            </div>
                            <div class="card-body">
                                <textarea id="text-content" class="form-control" rows="15" readonly></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Other tabs remain similar to previous implementation -->
                    <div class="tab-pane fade" id="images">
                        <div class="card">
                            <div class="card-body" id="images-content">
                                <p class="text-muted text-center">No images extracted yet</p>
                            </div>
                        </div>
                    </div>

                    <div class="tab-pane fade" id="analysis">
                        <div class="card">
                            <div class="card-body" id="analysis-content">
                                <p class="text-muted text-center">Upload a PDF for analysis</p>
                            </div>
                        </div>
                    </div>

                    <div class="tab-pane fade" id="search">
                        <div class="card">
                            <div class="card-header">Text Search</div>
                            <div class="card-body">
                                <div class="row mb-3">
                                    <div class="col-md-6">
                                        <select id="search-pattern" class="form-select">
                                            <option value="email">Email Addresses</option>
                                            <option value="phone">Phone Numbers</option>
                                            <option value="address">Addresses</option>
                                            <option value="name">Names</option>
                                            <option value="custom">Custom Regex</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <input id="custom-regex" class="form-control" placeholder="Enter custom regex">
                                    </div>
                                </div>
                                <button id="perform-search" class="btn btn-primary">
                                    <i class="fas fa-search me-1"></i>Search
                                </button>
                                <div id="search-results" class="mt-3">
                                    <pre id="search-results-content"></pre>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>

    <!-- Main Application Script -->
    <script>
    // Global PDF.js library configuration
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // Main Application Object
    const PDFCuriosityExplorer = {
        pdfDoc: null,
        currentPDF: null,

        // Initialize event listeners
        init() {
            document.getElementById('pdf-input').addEventListener('change', this.handlePDFUpload.bind(this));
            document.getElementById('download-markdown').addEventListener('click', this.downloadTextAsMarkdown.bind(this));
            document.getElementById('download-html').addEventListener('click', this.downloadTextAsHTML.bind(this));
            document.getElementById('search-pattern').addEventListener('change', this.toggleCustomRegex);
            document.getElementById('perform-search').addEventListener('click', this.performTextSearch.bind(this));
        },

        // PDF Upload Handler
        async handlePDFUpload(event) {
            const file = event.target.files[0];
            if (!file || file.type !== 'application/pdf') {
                alert('Please upload a valid PDF file.');
                return;
            }

            try {
                const fileReader = new FileReader();
                fileReader.onload = async (e) => {
                    try {
                        this.pdfDoc = await pdfjsLib.getDocument(e.target.result).promise;
                        await this.renderPDFPreview();
                        await this.extractTextContent();
                        await this.extractDetailedMetadata();
                        await this.extractImages();
                        this.performBasicAnalysis();
                    } catch (error) {
                        console.error('PDF Processing Error:', error);
                        alert('Error processing PDF. Please check the file and try again.');
                    }
                };
                fileReader.readAsArrayBuffer(file);
            } catch (error) {
                console.error('File Reading Error:', error);
            }
        },

        // Render PDF Preview
        async renderPDFPreview() {
            const previewContainer = document.getElementById('pdf-preview');
            previewContainer.innerHTML = ''; // Clear previous preview

            const page = await this.pdfDoc.getPage(1);
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            
            const viewport = page.getViewport({scale: 1.5});
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            
            await page.render({canvasContext: context, viewport: viewport}).promise;
            previewContainer.appendChild(canvas);
        },

        // Extract Full Text Content
        async extractTextContent() {
            let fullText = '';
            for (let pageNum = 1; pageNum <= this.pdfDoc.numPages; pageNum++) {
                const page = await this.pdfDoc.getPage(pageNum);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += pageText + '\n\n';
            }
            document.getElementById('text-content').value = fullText;
        },

        // Extract Images from PDF
        async extractImages() {
            const imagesContainer = document.getElementById('images-content');
            imagesContainer.innerHTML = '';

            for (let pageNum = 1; pageNum <= this.pdfDoc.numPages; pageNum++) {
                const page = await this.pdfDoc.getPage(pageNum);
                const operatorList = await page.getOperatorList();

                // Find image operations
                const imageOperations = operatorList.fnArray.reduce((images, operation, index) => {
                    if (operation === pdfjsLib.OPS.paintImageXObject) {
                        images.push(operatorList.argsArray[index][0]);
                    }
                    return images;
                }, []);

                // Render extracted images
                for (const imageName of imageOperations) {
                    try {
                        const image = await page.objs.get(imageName);
                        const canvas = document.createElement('canvas');
                        canvas.width = image.width;
                        canvas.height = image.height;
                        const context = canvas.getContext('2d');
                        context.drawImage(image, 0, 0);
                        canvas.classList.add('img-fluid', 'm-2');
                        imagesContainer.appendChild(canvas);
                    } catch (error) {
                        console.warn('Image extraction error:', error);
                    }
                }
            }

            if (imagesContainer.children.length === 0) {
                imagesContainer.innerHTML = '<p class="text-muted text-center">No images found in the PDF</p>';
            }
        },

        // Basic Document Analysis
        performBasicAnalysis() {
            const analysisContainer = document.getElementById('analysis-content');
            const text = document.getElementById('text-content').value;
            
            const wordCount = text.split(/\s+/).filter(word => word.length > 0).length;
            const characterCount = text.length;
            const paragraphCount = text.split('\n').filter(p => p.trim().length > 0).length;

            // Word frequency
            const wordFrequency = this.calculateWordFrequency(text);

            analysisContainer.innerHTML = `
                <div class="row">
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">Word Count</h5>
                                <p class="card-text display-6">${wordCount}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">Character Count</h5>
                                <p class="card-text display-6">${characterCount}</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-center">
                            <div class="card-body">
                                <h5 class="card-title">Paragraph Count</h5>
                                <p class="card-text display-6">${paragraphCount}</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card mt-3">
                    <div class="card-header">Top 10 Most Frequent Words</div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Word</th>
                                    <th>Frequency</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${Object.entries(wordFrequency)
                                    .sort((a, b) => b[1] - a[1])
                                    .slice(0, 10)
                                    .map(([word, freq]) => `
                                        <tr>
                                            <td>${word}</td>
                                            <td>${freq}</td>
                                        </tr>
                                    `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        },

        // Word Frequency Calculation
        calculateWordFrequency(text) {
            const words = text.toLowerCase().match(/\b\w+\b/g) || [];
            const stopWords = new Set(['the', 'a', 'an', 'and', 'or', 'but', 'in', 'on', 'at', 'to', 'for', 'of', 'with', 'by']);
            
            return words
                .filter(word => !stopWords.has(word) && word.length > 1)
                .reduce((freq, word) => {
                    freq[word] = (freq[word] || 0) + 1;
                    return freq;
                }, {});
        },

        // Toggle Custom Regex Input
        toggleCustomRegex() {
            const customRegexInput = document.getElementById('custom-regex');
            customRegexInput.style.display = 
                document.getElementById('search-pattern').value === 'custom' ? 'block' : 'none';
        },

        // Text Search Functionality
        performTextSearch() {
            const text = document.getElementById('text-content').value;
            const pattern = document.getElementById('search-pattern').value;
            const resultsContainer = document.getElementById('search-results-content');

            let regex;
            switch(pattern) {
                case 'email':
                    regex = /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b/g;
                    break;
                case 'phone':
                    regex = /\b(\+\d{1,2}\s?)?(\d{3}[-.]?)?\d{3}[-.]?\d{4}\b/g;
                    break;
                case 'address':
                    regex = /\b\d+\s+[A-Za-z\s]+(?:Street|St|Avenue|Ave|Road|Rd|Boulevard|Blvd|Lane|Ln)\b/g;
                    break;
                case 'name':
                    regex = /\b([A-Z][a-z]+)\s+([A-Z][a-z]+)\b/g;
                    break;
                case 'custom':
                    const customRegex = document.getElementById('custom-regex').value;
                    try {
                        regex = new RegExp(customRegex, 'g');
                    } catch(e) {
                        alert('Invalid regex pattern');
                        return;
                    }
                    break;
            }

            const matches = text.match(regex) || [];
            resultsContainer.textContent = matches.length > 0 
                ? matches.join('\n') 
                : 'No matches found.';
        },

        // Download text as Markdown
        downloadTextAsMarkdown() {
            const text = document.getElementById('text-content').value;
            const blob = new Blob([text], {type: 'text/markdown'});
            this.downloadFile(blob, 'pdf-text.md');
        },

        // Download text as HTML
        downloadTextAsHTML() {
            const text = document.getElementById('text-content').value;
            const converter = new showdown.Converter();
            const html = converter.makeHtml(text);
            const fullHtml = `
                <!DOCTYPE html>
                <html>
                <head><title>PDF Text Content</title></head>
                <body>${html}</body>
                </html>
            `;
            const blob = new Blob([fullHtml], {type: 'text/html'});
            this.downloadFile(blob, 'pdf-text.html');
        },

        // File Download Helper
        downloadFile(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        },

        // Detailed Metadata Extraction (previous implementation from your original code)
        async extractDetailedMetadata() {
            // Reuse the previous metadata extraction code you had
        }
    };

    // Initialize the application on page load
    document.addEventListener('DOMContentLoaded', () => {
        PDFCuriosityExplorer.init();
    });
    </script>
</body>
</html>
