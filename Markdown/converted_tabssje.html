<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Table Converter</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 800px; margin: auto; }
    textarea { width: 100%; height: 150px; padding: 10px; margin-bottom: 10px; font-family: monospace; }
    button { padding: 10px 20px; margin: 5px; border: none; cursor: pointer; }
    .themes { margin-bottom: 20px; }
    .theme-btn { margin-right: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    .basic { background-color: #f9f9f9; }
    .dark { background-color: #333; color: white; }
    .hacker { background-color: #000; color: #0f0; font-family: 'Courier New', monospace; }
    .banded tr:nth-child(odd) { background-color: #eee; }
  </style>
</head>
<body>

<div class="container">
  <h1>Universal Table Converter</h1>
  
  <textarea id="inputText" placeholder="Paste CSV, HTML Table, JSON, or TSV data here..."></textarea>
  
  <div>
    <button onclick="parseInput()">Parse & Convert</button>
    <button onclick="clearInput()">Clear Input</button>
    <input type="file" id="fileInput" onchange="handleFileUpload()" accept=".txt,.json,.csv,.html">
    <button onclick="downloadAsHTML()">Download as HTML</button>
    <button onclick="downloadAsTxt()">Download as TXT</button>
  </div>

  <div class="themes">
    <span>Select Theme:</span>
    <button class="theme-btn" onclick="setTheme('basic')">Basic</button>
    <button class="theme-btn" onclick="setTheme('dark')">Dark</button>
    <button class="theme-btn" onclick="setTheme('hacker')">Hacker</button>
    <button class="theme-btn" onclick="setTheme('banded')">Banded</button>
  </div>
  
  <div id="output" class="basic"></div>
</div>

<script>
  function clearInput() {
    document.getElementById('inputText').value = '';
    document.getElementById('output').innerHTML = '';
  }

  function handleFileUpload() {
    const file = document.getElementById('fileInput').files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('inputText').value = e.target.result;
    };
    reader.readAsText(file);
  }

  function parseInput() {
    const inputText = document.getElementById('inputText').value.trim();
    const strategies = [
      parseCSV,
      parseHTMLTable,
      parseJSON
    ];

    for (const strategy of strategies) {
      const result = strategy(inputText);
      if (result) {
        displayTable(result.headers, result.data);
        return;
      }
    }

    alert('Could not parse the input. Please check your data format.');
  }

  function parseCSV(input) {
    const lines = input.split('\n');
    const headers = lines[0].split(/[\t,]/);
    const data = lines.slice(1).map(line => line.split(/[\t,]/));
    return { headers, data };
  }

  function parseHTMLTable(input) {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = input;
    const table = tempDiv.querySelector('table');
    if (!table) return null;

    const headers = Array.from(table.querySelectorAll('th')).map(th => th.textContent.trim());
    const data = Array.from(table.querySelectorAll('tr')).slice(1).map(tr => {
      return Array.from(tr.querySelectorAll('td')).map(td => td.textContent.trim());
    });

    return { headers, data };
  }

  function parseJSON(input) {
    try {
      const obj = JSON.parse(input);
      if (!Array.isArray(obj)) return null;

      const headers = Object.keys(obj[0]);
      const data = obj.map(item => headers.map(key => item[key]));

      return { headers, data };
    } catch {
      return null;
    }
  }

  function displayTable(headers, data) {
    let html = '<table><thead><tr>';
    headers.forEach(header => {
      html += `<th>${header}</th>`;
    });
    html += '</tr></thead><tbody>';

    data.forEach(row => {
      html += '<tr>';
      row.forEach(cell => {
        html += `<td>${cell}</td>`;
      });
      html += '</tr>';
    });

    html += '</tbody></table>';
    document.getElementById('output').innerHTML = html;
  }

  function downloadAsHTML() {
    const content = document.getElementById('output').innerHTML;
    const blob = new Blob([content], { type: 'text/html' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'output.html';
    link.click();
  }

  function downloadAsTxt() {
    const content = document.getElementById('inputText').value;
    const blob = new Blob([content], { type: 'text/plain' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'output.txt';
    link.click();
  }

  function setTheme(theme) {
    document.getElementById('output').className = theme;
  }
</script>

</body>
</html>
