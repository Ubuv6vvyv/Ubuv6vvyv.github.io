<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tone Disorientation Generator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #16213e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #0f3460;
            background-color: #e94560;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .control-group {
            background-color: #0f3460;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .slider-container {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .slider-container label {
            flex: 1;
            margin-right: 15px;
            color: #e94560;
        }
        .slider-container input[type="range"] {
            flex: 2;
            accent-color: #e94560;
        }
        .slider-container span {
            flex: 0.5;
            color: #e0e0e0;
            margin-left: 10px;
        }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        #visualizer {
            width: 100%;
            height: 150px;
            background-color: #0f3460;
            margin-top: 20px;
            border-radius: 8px;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Advanced Tone Disorientation Generator</h1>

        <div class="control-group">
            <h2>Sine Wave Controls</h2>
            <div class="slider-container">
                <label for="frequencySlider">Frequency (Hz)</label>
                <input type="range" id="frequencySlider" min="1000" max="25000" step="1" value="15000">
                <span id="frequencyValue">15000</span> Hz
            </div>
            <div class="slider-container">
                <label for="detuneSlider">Detune (Cents)</label>
                <input type="range" id="detuneSlider" min="-2000" max="2000" step="1" value="0">
                <span id="detuneValue">0</span> cents
            </div>
            <div class="slider-container">
                <label for="modulationFreqSlider">Modulation Frequency (Hz)</label>
                <input type="range" id="modulationFreqSlider" min="0" max="100" step="0.1" value="20">
                <span id="modulationFreqValue">20</span> Hz
            </div>
            <div class="slider-container">
                <label for="modulationDepthSlider">Modulation Depth</label>
                <input type="range" id="modulationDepthSlider" min="0" max="2" step="0.01" value="0.75">
                <span id="modulationDepthValue">0.75</span>
            </div>
        </div>

        <div class="control-group">
            <h2>Annoyance Intensity</h2>
            <div class="slider-container">
                <label for="volumeSlider">Volume</label>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.75">
                <span id="volumeValue">0.75</span>
            </div>
            <div class="slider-container">
                <label for="gainSlider">Gain Intensity</label>
                <input type="range" id="gainSlider" min="0" max="2" step="0.01" value="1">
                <span id="gainValue">1</span>
            </div>
        </div>

        <div class="control-group button-group">
            <button id="playButton">Start Tone</button>
            <button id="stopButton">Stop Tone</button>
            <button id="autoToggleButton">Auto Morph</button>
        </div>

        <div class="control-group">
            <h2>Preset Annoying Tones</h2>
            <div class="button-group">
                <button id="annoyingTone1">Disorienting Low</button>
                <button id="annoyingTone2">Piercing High</button>
                <button id="annoyingTone3">Aggressive Mid</button>
                <button id="annoyingTone4">Ultrasonic Edge</button>
                <button id="highPitchTone1">Extreme High 1</button>
                <button id="highPitchTone2">Extreme High 2</button>
                <button id="dogTone">Canine Distress</button>
                <button id="detuneRandomButton">Random Detune</button>
                <button id="startButton">Evasive Sound Mode</button>
            </div>
        </div>

        <canvas id="visualizer"></canvas>
    </div>

    <script>
        // [Previous JavaScript remains the same, with enhanced variations]
        document.addEventListener("DOMContentLoaded", function () {
            // ... [Previous code]

            // Enhanced Tone Variations
            function generateAnnoyingTone(frequency, detune, volume, modulationFreq, modulationDepth) {
                frequencySlider.value = frequency;
                detuneSlider.value = detune;
                volumeSlider.value = volume;
                modulationFreqSlider.value = modulationFreq || 20;
                modulationDepthSlider.value = modulationDepth || 0.75;
                updateSound();
                
                // Optional: Add visual feedback
                canvas.style.backgroundColor = `hsl(${frequency/200}, 70%, 50%)`;
            }

            // Expanded Tone Presets with More Complex Variations
            annoyingTone1Button.addEventListener('click', function () {
                generateAnnoyingTone(9500, 350, 1, 15, 1); // Low-end disorienting
            });

            annoyingTone2Button.addEventListener('click', function () {
                generateAnnoyingTone(18000, 500, 1, 40, 1.5); // Piercing high
            });

            annoyingTone3Button.addEventListener('click', function () {
                generateAnnoyingTone(12000, 250, 1, 25, 0.85); // Aggressive mid-range
            });

            annoyingTone4Button.addEventListener('click', function () {
                generateAnnoyingTone(15500, 400, 1, 30, 1.25); // Unsettling ultrasonic edge
            });

            dogToneButton.addEventListener('click', function () {
                generateAnnoyingTone(19000, 200, 1, 50, 1.75); // Enhanced dog distress
            });

            highPitchTone1Button.addEventListener('click', function () {
                generateAnnoyingTone(22000, 600, 1, 60, 2); // Extreme high intensity
            });

            highPitchTone2Button.addEventListener('click', function () {
                generateAnnoyingTone(20500, 450, 1, 55, 1.6); // Another extreme high
            });

            // Optional: Visualization Enhancement
            function visualizeSound() {
                const analyser = audioContext.createAnalyser();
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                requestAnimationFrame(visualizeSound);
                analyser.getByteFrequencyData(dataArray);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const barWidth = (canvas.width / dataArray.length) * 2.5;
                let x = 0;

                for(let i = 0; i < dataArray.length; i++) {
                    const barHeight = dataArray[i] / 2;
                    ctx.fillStyle = `hsl(${i/2}, 70%, 50%)`;
                    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            }

            // More advanced start function for complex sound generation
            startButton.addEventListener('click', function () {
                setupOscillator();
                
                // Complex sound generation with random variations
                const randomFreq = Math.random() * 15000 + 5000;
                const randomDetune = Math.random() * 1000 - 500;
                const randomMod = Math.random() * 50;
                
                frequencySlider.value = randomFreq;
                detuneSlider.value = randomDetune;
                modulationFreqSlider.value = randomMod;
                
                updateSound();
                visualizeSound();
            });
        });
    </script>
</body>
</html>
