<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width,initial-scale=1">
    <title>Audio Processor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wavesurfer.js/7.7.3/wavesurfer.min.js"></script>
    <style>
        body{font-family:system-ui;max-width:600px;margin:0 auto;padding:15px;background:#f0f0f0}
        .container{background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
        .control-group{margin:12px 0}
        .waveform{height:128px;background:#f5f5f5;border-radius:4px;margin:10px 0}
        label{display:block;margin-bottom:4px;font-weight:600;font-size:14px}
        .slider{width:100%;margin:8px 0}
        .fine-slider{width:100%;margin:4px 0}
        button{background:#007bff;color:#fff;border:none;padding:8px 16px;border-radius:4px;margin:4px;cursor:pointer}
        button:disabled{background:#ccc}
        #fileInput{margin:15px 0}
        .value-display{font-size:12px;color:#666}
        .trim-container{display:flex;gap:10px;align-items:center;margin:10px 0}
        .trim-input{width:80px}
        .advanced-controls{display:none}
        .advanced-controls.show{display:block}
    </style>
</head>
<body>
    <div class="container">
        <input type="file" id="fileInput" accept="audio/*">
        <div id="waveform" class="waveform"></div>
        
        <div class="trim-container">
            <input type="number" id="trimStart" class="trim-input" placeholder="Start" min="0" step="0.1">
            <input type="number" id="trimEnd" class="trim-input" placeholder="End" min="0" step="0.1">
            <button id="trim">Trim</button>
        </div>

        <div class="control-group">
            <button id="playPause">Play</button>
            <button id="reset">Reset</button>
            <button id="download" disabled>Download</button>
            <button id="toggleAdvanced">Advanced Mode</button>
        </div>

        <div class="control-group">
            <label>Pitch <span id="pitchValue" class="value-display">1.0x</span></label>
            <input type="range" id="pitch" class="slider" min="0.5" max="2" step="0.01" value="1">
            <input type="range" id="pitchFine" class="fine-slider advanced-controls" min="0.95" max="1.05" step="0.001" value="1">
        </div>

        <div class="control-group">
            <label>Speed <span id="speedValue" class="value-display">1.0x</span></label>
            <input type="range" id="speed" class="slider" min="0.25" max="4" step="0.05" value="1">
            <input type="range" id="speedFine" class="fine-slider advanced-controls" min="0.95" max="1.05" step="0.001" value="1">
        </div>

        <div class="control-group">
            <label>Bass Boost <span id="bassValue" class="value-display">0dB</span></label>
            <input type="range" id="bass" class="slider" min="0" max="30" step="0.5" value="0">
            <input type="range" id="bassFine" class="fine-slider advanced-controls" min="-5" max="5" step="0.1" value="0">
        </div>

        <div class="control-group">
            <label>Voice Boost <span id="voiceValue" class="value-display">0dB</span></label>
            <input type="range" id="voice" class="slider" min="0" max="30" step="0.5" value="0">
            <input type="range" id="voiceFine" class="fine-slider advanced-controls" min="-5" max="5" step="0.1" value="0">
        </div>

        <div class="control-group">
            <label>Fade <span id="fadeValue" class="value-display">0s</span></label>
            <input type="range" id="fade" class="slider" min="0" max="5" step="0.1" value="0">
        </div>

        <div class="control-group">
            <button id="reverse">Reverse</button>
        </div>
    </div>

</script>
</body>
</html>
