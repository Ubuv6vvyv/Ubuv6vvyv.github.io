<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Decoder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-base64/3.7.5/base64.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>JWT Decoder</h1>
    <textarea id="jwtInput" placeholder="Paste your JWT here"></textarea>
    <button onclick="decodeJWT()">Decode</button>
    <h2>Decoded Header</h2>
    <pre id="headerOutput"></pre>
    <h2>Decoded Payload</h2>
    <pre id="payloadOutput"></pre>

    <script>
        function decodeJWT() {
            const jwt = document.getElementById('jwtInput').value.trim();
            const parts = jwt.split('.');
            if (parts.length !== 3) {
                alert('Invalid JWT format. Make sure it has three parts separated by dots.');
                return;
            }

            try {
                const header = JSON.parse(Base64.decode(parts[0]));
                const payload = JSON.parse(Base64.decode(parts[1]));

                document.getElementById('headerOutput').textContent = JSON.stringify(header, null, 2);
                document.getElementById('payloadOutput').textContent = JSON.stringify(payload, null, 2);
            } catch (e) {
                alert('Error decoding JWT: ' + e.message);
            }
        }
    </script>
</body>
</html>
