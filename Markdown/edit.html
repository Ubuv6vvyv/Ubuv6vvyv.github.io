<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced PDF and Image Rendering with Konva</title>

  <!-- Konva CDN -->
  <script src="https://cdn.jsdelivr.net/npm/konva@8.3.5/konva.min.js"></script>

  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.10.377/pdf.min.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #canvas-container {
      position: relative;
      width: 550px;
      height: 1012px;
      margin: 0 auto;
      border: 2px solid black;
      background-color: #f0f0f0;
    }
    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: white;
      padding: 15px;
      border: 1px solid #ccc;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
    }
    #controls label {
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
    }
    #controls input, #controls button {
      margin-bottom: 10px;
      width: 100%;
    }
    #uploadButtons {
      margin-bottom: 20px;
    }
    #uploadButtons button {
      margin-right: 10px;
      padding: 10px;
      border: none;
      color: white;
      cursor: pointer;
    }
    #uploadPDFBtn {
      background-color: #007bff;
    }
    #uploadImageBtn {
      background-color: #28a745;
    }
    #rotateButtons {
      margin-bottom: 20px;
    }
    #rotateButtons button {
      margin-right: 10px;
      padding: 10px;
      border: none;
      background-color: #ffc107;
      color: black;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Controls -->
  <div id="controls">
    <div id="uploadButtons">
      <button id="uploadPDFBtn">Upload PDF</button>
      <input type="file" id="uploadPDFInput" accept="application/pdf" style="display:none;">
      <button id="uploadImageBtn">Upload Image</button>
      <input type="file" id="uploadImageInput" accept="image/*" style="display:none;">
    </div>

    <h3>Image Controls</h3>
    <label>Opacity:</label>
    <input type="range" id="opacitySlider" min="0" max="1" step="0.1" value="1">
    <label>Brightness:</label>
    <input type="range" id="brightnessSlider" min="-1" max="1" step="0.1" value="0">
    <label>Contrast:</label>
    <input type="range" id="contrastSlider" min="-1" max="1" step="0.1" value="0">
    <label>Threshold:</label>
    <input type="range" id="thresholdSlider" min="0" max="255" step="1" value="128">

    <h3>Rotate</h3>
    <div id="rotateButtons">
      <button id="rotateLeftBtn">Rotate Left</button>
      <button id="rotateRightBtn">Rotate Right</button>
    </div>

    <button id="downloadBtn">Download Canvas</button>
  </div>

  <script>
    // Konva setup
    const stage = new Konva.Stage({
      container: 'canvas-container',
      width: 550,
      height: 1012,
    });
    const layer = new Konva.Layer();
    stage.add(layer);

    let elements = [];
    let currentElementIndex = -1;

    // Upload PDF
    document.getElementById('uploadPDFBtn').addEventListener('click', () => {
      document.getElementById('uploadPDFInput').click();
    });

    document.getElementById('uploadPDFInput').addEventListener('change', (event) => {
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = function (e) {
        const loadingTask = pdfjsLib.getDocument(e.target.result);
        loadingTask.promise.then((pdf) => {
          pdf.getPage(1).then((page) => {
            const viewport = page.getViewport({ scale: 1 });
            const pdfCanvas = document.createElement('canvas');
            const pdfContext = pdfCanvas.getContext('2d');
            pdfCanvas.width = viewport.width;
            pdfCanvas.height = viewport.height;

            page.render({
              canvasContext: pdfContext,
              viewport: viewport,
            }).promise.then(() => {
              const pdfImage = new Konva.Image({
                image: pdfCanvas,
                draggable: true,
              });
              layer.add(pdfImage);
              elements.push(pdfImage);
              layer.draw();
            });
          });
        });
      };
      reader.readAsArrayBuffer(file);
    });

    // Upload Image
    document.getElementById('uploadImageBtn').addEventListener('click', () => {
      document.getElementById('uploadImageInput').click();
    });

    document.getElementById('uploadImageInput').addEventListener('change', (event) => {
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = () => {
          const konvaImage = new Konva.Image({
            image: img,
            draggable: true,
          });
          layer.add(konvaImage);
          elements.push(konvaImage);
          layer.draw();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Manipulate properties
    document.getElementById('opacitySlider').addEventListener('input', (e) => {
      const element = elements[currentElementIndex];
      if (element) {
        element.opacity(e.target.value);
        layer.batchDraw();
      }
    });

    document.getElementById('brightnessSlider').addEventListener('input', (e) => {
      const element = elements[currentElementIndex];
      if (element) {
        element.cache();
        element.filters([Konva.Filters.Brighten]);
        element.brightness(e.target.value);
        layer.batchDraw();
      }
    });

    // Rotation tools
    document.getElementById('rotateLeftBtn').addEventListener('click', () => {
      const element = elements[currentElementIndex];
      if (element) {
        element.rotation(element.rotation() - 15);
        layer.batchDraw();
      }
    });

    document.getElementById('rotateRightBtn').addEventListener('click', () => {
      const element = elements[currentElementIndex];
      if (element) {
        element.rotation(element.rotation() + 15);
        layer.batchDraw();
      }
    });

    // Download canvas
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'canvas.png';
      link.href = stage.toDataURL();
      link.click();
    });
  </script>
</body>
</html>
