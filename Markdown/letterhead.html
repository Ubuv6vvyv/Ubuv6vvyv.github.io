
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Company Letterhead</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
        <style>
            
        :root {
            --primary-color: #333333;
            --accent-color: #4CAF50;
            --border-color: #ddd;
            --hover-color: #e8f5e9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: #f9f9f9;
        }

        .app-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .app-header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 10px;
        }

        .app-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            min-height: calc(100vh - 150px);
        }

        .controls-panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            height: fit-content;
        }

        .preview-panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .control-group {
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
            color: #555;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .template-option {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            transition: all 0.3s;
        }

        .template-option:hover {
            background: var(--hover-color);
        }

        .template-option.active {
            border-color: var(--accent-color);
            background: var(--hover-color);
            color: var(--accent-color);
        }

        .logo-controls {
            margin-bottom: 20px;
        }

        .logo-preview {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: center;
        }

        .logo-preview img {
            max-width: 100%;
            max-height: 100px;
        }

        .position-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .position-option {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            transition: all 0.3s;
        }

        .position-option:hover {
            background: var(--hover-color);
        }

        .position-option.active {
            border-color: var(--accent-color);
            background: var(--hover-color);
            color: var(--accent-color);
        }

        .color-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-control input[type="color"] {
            width: 50px;
            padding: 0;
            height: 30px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .primary-button {
            background: var(--accent-color);
            color: white;
        }

        .secondary-button {
            background: #f0f0f0;
            color: #333;
        }

        button:hover {
            filter: brightness(1.1);
        }

        #preview {
            background: white;
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
        }

         .letterhead {
            padding: 20mm;
            height: 80mm;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .letterhead-content {
            width: 100%;
            max-width: 170mm; /* Controlled width */
            margin: 0 auto;
        }

        .company-logo {
            height: 15mm; /* Fixed height for consistency */
            width: auto;
            object-fit: contain;
            margin-bottom: 5mm;
        }

        .logo-left {
            float: left;
            margin-right: 10mm;
        }

        .logo-center {
            display: block;
            margin: 0 auto 5mm;
        }

        .logo-right {
            float: right;
            margin-left: 10mm;
        }

        .company-name {
            font-size: 16pt; /* Smaller, more professional size */
            font-weight: 600;
            margin-bottom: 3mm;
            line-height: 1.2;
        }

        .contact-info {
            font-size: 9pt; /* Smaller text for contact details */
            line-height: 1.4;
            color: #666;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 4mm;
            margin-bottom: 1mm;
        }

        .contact-icon {
            width: 3.5mm; /* Properly sized icons */
            height: 3.5mm;
            flex-shrink: 0;
        }

        /* Template-specific styles */
        .modern-template .company-name {
            text-transform: uppercase;
            letter-spacing: 0.5mm;
            font-size: 14pt;
        }

        .minimal-template .company-name {
            font-weight: 300;
            font-size: 18pt;
        }

        .minimal-template .contact-info {
            font-weight: 300;
            font-size: 9pt;
        }

        #previewAddress {
            margin-bottom: 2mm;
        }

        /* Adjust preview panel */
        #preview {
            background: white;
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Print styles */
        @media print {
            .letterhead {
                padding: 20mm;
            }
        }
    
            body {
                margin: 0;
                padding: 20mm;
                background: white;
            }
            @media print {
                body {
                    padding: 0;
                }
            }
        </style>
    </head>
