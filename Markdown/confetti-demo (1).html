<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {			
            background: linear-gradient(135deg, #0f0f0f, #1c1c1c);
            margin: 0;
            overflow: hidden;
            transition: background 0.3s ease;
        }
        /* Shockwave and flash effects */
        @keyframes violentShockwave {
            0% { transform: scale(0.1); opacity: 1; filter: brightness(1); }
            70% { transform: scale(3); opacity: 0.8; filter: brightness(5); }
            100% { transform: scale(5); opacity: 0; filter: brightness(10); }
        }
        @keyframes violentShake {
            0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
            10% { transform: translateX(-10px) translateY(-10px) rotate(-5deg); }
            20% { transform: translateX(10px) translateY(10px) rotate(5deg); }
            30% { transform: translateX(-15px) translateY(-5px) rotate(-7deg); }
            40% { transform: translateX(15px) translateY(5px) rotate(7deg); }
            50% { transform: translateX(-20px) translateY(-10px) rotate(-10deg); }
            60% { transform: translateX(20px) translateY(10px) rotate(10deg); }
            70% { transform: translateX(-25px) translateY(-15px) rotate(-12deg); }
            80% { transform: translateX(25px) translateY(15px) rotate(12deg); }
            90% { transform: translateX(0) translateY(0) rotate(0deg); }
        }
    </style>
</head>
<body>
<script>
(function() {
    // Load Confetti Library (via CDN)
    const loadScript = (src, callback) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = callback;
        document.head.appendChild(script);
    };

    loadScript('https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js', () => {
        console.log('Confetti.js loaded');

        // Violent Shockwave Effects Collection
        const shockwaveEffects = [
            {
                name: 'Nuclear Burst',
                particleCount: 3000,
                spread: 360,
                startVelocity: 100,
                gravity: 0.1,
                colors: ['#FF0000', '#FF4500', '#FFD700', '#FFFFFF'],
                scalar: 2,
                ticks: 3000,
                pageEffect: 'nuclear'
            },
            {
                name: 'Electromagnetic Pulse',
                particleCount: 2500,
                spread: 270,
                startVelocity: 80,
                gravity: 0.2,
                colors: ['#00FFFF', '#1E90FF', '#4169E1', '#FFFFFF'],
                scalar: 1.8,
                ticks: 2500,
                pageEffect: 'emp'
            },
            {
                name: 'Dimensional Rift',
                particleCount: 3500,
                spread: 330,
                startVelocity: 90,
                gravity: 0.15,
                colors: ['#8A2BE2', '#9400D3', '#4B0082', '#FFFFFF'],
                scalar: 2.2,
                ticks: 3500,
                pageEffect: 'rift'
            }
        ];

        // Violent Page Effect Triggers
        const triggerViolentPageEffects = (effectType, event) => {
            switch(effectType) {
                case 'nuclear':
                    triggerNuclearEffect(event);
                    break;
                case 'emp':
                    triggerEMPEffect(event);
                    break;
                case 'rift':
                    triggerDimensionalRiftEffect(event);
                    break;
            }
        };

        // Nuclear Flash and Shake Effect
        const triggerNuclearEffect = (event) => {
            // Bright white flash
            const flashOverlay = document.createElement('div');
            Object.assign(flashOverlay.style, {
                position: 'fixed',
                top: '0',
                left: '0',
                width: '100vw',
                height: '100vh',
                backgroundColor: 'white',
                zIndex: '9999',
                opacity: '0.9',
                animation: 'violentShockwave 0.5s ease-out'
            });
            document.body.appendChild(flashOverlay);

            // Violent body shake
            document.body.style.animation = 'violentShake 0.5s linear';

            // Fade to black with violent transition
            setTimeout(() => {
                document.body.style.background = 'black';
                flashOverlay.style.backgroundColor = 'black';
                flashOverlay.style.opacity = '1';
            }, 300);

            // Cleanup
            setTimeout(() => {
                flashOverlay.remove();
                document.body.style.animation = '';
                document.body.style.background = 'linear-gradient(135deg, #0f0f0f, #1c1c1c)';
            }, 1000);
        };

        // EMP Glitch Effect
        const triggerEMPEffect = (event) => {
            const glitchOverlay = document.createElement('div');
            Object.assign(glitchOverlay.style, {
                position: 'fixed',
                top: '0',
                left: '0',
                width: '100vw',
                height: '100vh',
                backgroundColor: '#00FFFF',
                opacity: '0.7',
                filter: 'contrast(300%) brightness(200%)',
                zIndex: '9999',
                mixBlendMode: 'screen'
            });
            document.body.appendChild(glitchOverlay);

            // Violent screen split and glitch
            const glitchCSS = document.createElement('style');
            glitchCSS.innerHTML = `
                @keyframes glitchEffect {
                    0% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%); }
                    5% { clip-path: polygon(0 10%, 100% 0, 100% 90%, 0% 100%); }
                    10% { clip-path: polygon(0 0, 50% 0, 100% 100%, 0% 100%); }
                    15% { clip-path: polygon(0 0, 100% 0, 50% 100%, 0% 100%); }
                }
                .glitch-body {
                    animation: glitchEffect 0.3s steps(10, end) infinite;
                }
            `;
            document.head.appendChild(glitchCSS);
            document.body.classList.add('glitch-body');

            // Cleanup
            setTimeout(() => {
                glitchOverlay.remove();
                document.body.classList.remove('glitch-body');
                document.head.removeChild(glitchCSS);
            }, 500);
        };

        // Dimensional Rift Warping Effect
        const triggerDimensionalRiftEffect = (event) => {
            const warpOverlay = document.createElement('div');
            Object.assign(warpOverlay.style, {
                position: 'fixed',
                top: '0',
                left: '0',
                width: '100vw',
                height: '100vh',
                background: 'linear-gradient(45deg, rgba(128,0,128,0.8), rgba(0,0,0,0.9))',
                zIndex: '9999',
                transform: 'scale(0.1)',
                opacity: '0',
                transition: 'all 0.5s cubic-bezier(0.25, 0.1, 0.25, 1)'
            });
            document.body.appendChild(warpOverlay);

            // Trigger warp effect
            setTimeout(() => {
                Object.assign(warpOverlay.style, {
                    transform: 'scale(5) rotate(360deg)',
                    opacity: '1',
                    filter: 'blur(50px)'
                });
            }, 50);

            // Cleanup
            setTimeout(() => {
                warpOverlay.remove();
            }, 1000);
        };

        // Trigger Spectacular Confetti with Violent Page Effects
        const triggerSpectacularConfetti = (event) => {
            // Randomly select a shockwave effect
            const effect = shockwaveEffects[Math.floor(Math.random() * shockwaveEffects.length)];

            // Trigger confetti with selected effect
            confetti({
                particleCount: effect.particleCount,
                spread: effect.spread,
                startVelocity: effect.startVelocity,
                gravity: effect.gravity,
                colors: effect.colors,
                scalar: effect.scalar,
                ticks: effect.ticks,
                origin: {
                    x: event.pageX / window.innerWidth,
                    y: event.pageY / window.innerHeight
                }
            });

            // Trigger corresponding page effect
            triggerViolentPageEffects(effect.pageEffect, event);
        };

        // Click handling with increased spectacle probability
        let clickCount = 0;
        const handleClick = (event) => {
            // Increase chance of spectacular effect with each click
            const spectacleChance = Math.random() * (clickCount * 0.2);
            
            if (spectacleChance > 0.5) {
                triggerSpectacularConfetti(event);
                clickCount = 0; // Reset after big effect
            } else {
                // Regular confetti with smaller effects
                confetti({
                    particleCount: 100,
                    spread: 50,
                    origin: {
                        x: event.pageX / window.innerWidth,
                        y: event.pageY / window.innerHeight
                    }
                });
                clickCount++;
            }
        };

        // Attach click event
        document.addEventListener('click', handleClick);
    });
})();
</script>
</body>
</html>
