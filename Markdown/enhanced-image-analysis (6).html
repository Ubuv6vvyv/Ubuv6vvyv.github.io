<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<meta content="width=device-width,initial-scale=0.9" name="viewport">
<title>Enhanced Image Analysis Tool with Forgery Detection</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
<style>:root{--primary:#1E3A8A;--secondary:#1E40AF;--background:#F3F4F6;--text:#111827;--button-bg:#2563EB;--button-hover:#1D4ED8;--border:#E5E7EB;--success:#15803D;--error:#991B1B;--warning:#92400E}body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;margin:0;padding:16px;background:var(--background);color:var(--text);line-height:1.5}.container{max-width:900px;margin:20px auto;padding:20px;background:#fff;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.1)}h1,h2,h3{font-weight:700;color:var(--text);margin:0 0 16px;text-align:center}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0;justify-content:center}.analysis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:20px}button{padding:8px 12px;background:var(--button-bg);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:400;cursor:pointer;transition:all .2s ease;display:flex;align-items:center;justify-content:center;gap:8px}button:hover:not(:disabled){background:var(--button-hover);transform:translateY(-1px)}button:disabled{background:#cbd5e1;cursor:not-allowed}.image-container{position:relative;margin:20px auto;width:100%;max-width:100%;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#eff6ff;text-align:center}img{max-width:100%;display:block;border-radius:8px}canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}#results,#metadata{margin-top:20px;padding:16px;border-radius:12px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.05)}#results p,#metadata p{font-family:Arial,sans-serif;font-size:10px;line-height:1.2;color:#333;margin-bottom:20px;text-align:justify}#imageInput{padding:14px;border:2px dashed var(--border);border-radius:8px;width:100%;box-sizing:border-box;background:#fff;text-align:center;transition:border-color .3s ease}#imageInput:hover{border-color:var(--primary)}.loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(17,24,39,.9);color:#fff;padding:20px 30px;border-radius:12px;text-align:center;z-index:1000;display:none}.status{padding:12px;margin:12px 0;border-radius:8px;font-weight:700;text-align:center}.status-loading{background:#e0f2fe;color:#0369a1}.status-ready{background:#dcfce7;color:#15803d}.status-error{background:#ffe4e6;color:#991b1b}.checkbox{display:flex;align-items:center;margin:8px 0;justify-content:center}.checkbox input{margin-right:8px}label{font-size:12px}#histogram,#ela,#luminance{width:100%;height:200px;background:#f8fafc;border-radius:8px;margin-top:10px}</style>
<div class="container">
    <h1>Enhanced Image Analysis Tool</h1>
    <div class="status-loading" id="modelStatus">Loading models...</div>
    <input id="imageInput" type="file" accept="image/*">
    <div class="controls">
        <button disabled id="detectObjects">Detect Objects</button>
        <button disabled id="detectPeople">Detect People</button>
        <button disabled id="detectPeopleLarge">Detect Large Crowds</button>
        <button disabled id="analyzeForForge">Analyze for Forgery</button>
        <button disabled id="showMetadata">Show Metadata</button>
        <button disabled id="clearCanvas">Clear Analysis</button>
    </div>
    <div class="checkbox">
        <input id="dynamicThresholdToggle" type="checkbox" checked>
        <label for="dynamicThresholdToggle">Enable Dynamic Threshold</label>
    </div>
    <div class="image-container">
        <img id="uploadedImage" style="display:none">
        <canvas id="outputCanvas"></canvas>
    </div>
    <div class="analysis-grid">
        <canvas id="histogram"></canvas>
        <canvas id="ela"></canvas>
        <canvas id="luminance"></canvas>
    </div>
    <div id="results"></div>
    <div id="metadata"></div>
</div>
<div class="loading" id="loadingIndicator">Processing...</div>
<script>
let cocoModel=null,poseModel=null,currentImage,originalImageData;const modelStatus=document.getElementById("modelStatus"),dynamicThresholdToggle=document.getElementById("dynamicThresholdToggle");async function initModels(){try{modelStatus.textContent="Loading models...",modelStatus.className="status-loading";const[e,t]=await Promise.allSettled([cocoSsd.load(),poseDetection.createDetector(poseDetection.SupportedModels.MoveNet,{modelType:poseDetection.movenet.modelType.MULTIPOSE_LIGHTNING})]);return"fulfilled"===e.status&&(cocoModel=e.value),"fulfilled"===t.status&&(poseModel=t.value),cocoModel||poseModel||throwError("No models loaded"),modelStatus.textContent=cocoModel&&poseModel?"All models ready!":"Partial models loaded",modelStatus.className="status-ready",!0}catch(e){return console.error("Model loading error:",e),modelStatus.textContent="Error loading models",modelStatus.className="status-error",!1}}function calculateCrowdDensity(e){return e.length}function getThreshold(e){return dynamicThresholdToggle.checked?Math.max(.3,1/(e+1)):.5}async function detectObjects(){if(!(!cocoModel||!currentImage)){showLoading(),clearCanvas();try{const e=await cocoModel.detect(currentImage);drawPredictions(e),displayResults(e)}catch(e){console.error(e),alert("Detection error")}hideLoading()}}async function detectPeople(){if(!(!cocoModel||!currentImage)){showLoading(),clearCanvas();try{const e=await cocoModel.detect(currentImage);console.log("Raw Predictions:",e);const t=e.filter(e=>"person"===e.class),n=calculateCrowdDensity(t),a=getThreshold(n),s=t.filter(e=>e.score>a);s.length>10?drawHeatmap(s):drawPredictions(s),displayResults([{class:"people detected",score:s.length}])}catch(e){console.error(e),alert("Detection error")}hideLoading()}}async function detectPeopleLarge(){if(!(!poseModel||!currentImage)){showLoading(),clearCanvas();try{const e=await poseModel.estimatePoses(currentImage,{maxPoses:20,flipHorizontal:!1}),t=calculateCrowdDensity(e),n=getThreshold(t),a=e.filter(e=>e.keypoints.some(e=>e.score>n));drawPoses(a),displayResults([{class:"poses detected",score:a.length}])}catch(e){console.error("Pose detection error:",e),alert("Pose detection error")}hideLoading()}}function drawPredictions(e){const t=document.getElementById("outputCanvas").getContext("2d");e.forEach(e=>{const[n,a,s,r]=e.bbox;t.strokeStyle="#00ff00",t.lineWidth=2,t.strokeRect(n,a,s,r),t.fillStyle="#00ff00",t.fillText(`${e.class} ${Math.round(100*e.score)}%`,n,a>10?a-5:10)})}function drawHeatmap(e){const t=document.getElementById("outputCanvas").getContext("2d");e.forEach(e=>{const[n,a,s,r]=e.bbox,o=t.createRadialGradient(n+s/2,a+r/2,0,n+s/2,a+r/2,50);o.addColorStop(0,"rgba(255,0,0,0.2)"),o.addColorStop(1,"rgba(255,0,0,0)"),t.fillStyle=o,t.fillRect(n-50,a-50,s+100,r+100)})}function drawPoses(e){const t=document.getElementById("outputCanvas").getContext("2d");e.forEach(e=>{e.keypoints.forEach(e=>{e.score>.2&&(t.beginPath(),t.arc(e.x,e.y,3,0,2*Math.PI),t.fillStyle="red",t.fill())})})}function displayResults(e){document.getElementById("results").innerHTML=`<h3>Results:</h3>${e.map(e=>`<p>${e.class}: ${e.class.includes("detected")?e.score:Math.round(100*e.score)+"%"}</p>`).join("")}`}function clearCanvas(){const e=document.getElementById("outputCanvas").getContext("2d");e.clearRect(0,0,e.canvas.width,e.canvas.height),document.getElementById("results").innerHTML="",document.getElementById("metadata").innerHTML=""}function showLoading(){document.getElementById("loadingIndicator").style.display="block"}function hideLoading(){document.getElementById("loadingIndicator").style.display="none"}async function analyzeForForgery(){if(currentImage){showLoading();try{const e=document.getElementById("outputCanvas"),t=e.getContext("2d");t.drawImage(currentImage,0,0,e.width,e.height);const n=t.getImageData(0,0,e.width,e.height),a=await performELA(n),s=calculateHistogram(n),r=analyzeLuminance(n),o=detectInconsistencies(n),i=calculateNoiseLevels(n),l=detectClonePatterns(n),c={elaScore:a,histogramAnalysis:s,luminanceScore:r,inconsistencyScore:o,noiseScore:i,cloneDetection:l},d=calculateForgeryProbability(c);displayForensicResults(c,d)}catch(e){console.error("Forgery analysis error:",e),alert("Error during forgery analysis")}hideLoading()}}async function performELA(e){const t=document.getElementById("ela").getContext("2d");let n=0;const a=new ImageData(new Uint8ClampedArray(e.data),e.width,e.height);for(let t=0;t<e.data.length;t+=4){const s=e.data[t],r=e.data[t+1],o=e.data[t+2],i=Math.abs(s-a.data[t])+Math.abs(r-a.data[t+1])+Math.abs(o-a.data[t+2]);n+=i}return t.putImageData(a,0,0),n/(e.width*e.height)}function calculateHistogram(e){const t=document.getElementById("histogram").getContext("2d");t.clearRect(0,0,t.canvas.width,t.canvas.height);const n=new Array(256).fill(0),a=new Array(256).fill(0),s=new Array(256).fill(0);for(let t=0;t<e.data.length;t+=4)n[e.data[t]]++,a[e.data[t+1]]++,s[e.data[t+2]]++;return t.beginPath(),t.strokeStyle="red",plotHistogram(t,n),t.strokeStyle="green",plotHistogram(t,a),t.strokeStyle="blue",plotHistogram(t,s),{red:calculateHistogramStatistics(n),green:calculateHistogramStatistics(a),blue:calculateHistogramStatistics(s)}}function plotHistogram(e,t){const n=Math.max(...t),a=e.canvas.width/t.length;e.beginPath();for(let s=0;s<t.length;s++){const r=t[s]/n*e.canvas.height;e.moveTo(s*a,e.canvas.height),e.lineTo(s*a,e.canvas.height-r)}e.stroke()}function calculateHistogramStatistics(e){const t=e.reduce((e,t)=>e+t,0),n=e.reduce((n,a,s)=>n+s*a/t,0),a=Math.sqrt(e.reduce((e,a,s)=>e+Math.pow(s-n,2)*a/t,0));return{mean:n,stdDev:a}}function analyzeLuminance(e){const t=document.getElementById("luminance").getContext("2d"),n=new ImageData(e.width,e.height);let a=0;for(let t=0;t<e.data.length;t+=4){const s=.299*e.data[t]+.587*e.data[t+1]+.114*e.data[t+2];n.data[t]=n.data[t+1]=n.data[t+2]=s,n.data[t+3]=255,a+=s}return t.putImageData(n,0,0),a/(e.width*e.height)}function detectInconsistencies(e){let t=0;for(let n=0;n<e.data.length;n+=4){const a=e.data[n],s=e.data[n+1],r=e.data[n+2];Math.abs(a-s)>50&&Math.abs(s-r)>50&&t++}return t/(e.width*e.height)}function calculateNoiseLevels(e){let t=0;for(let n=0;n<e.data.length;n+=4){const a=e.data[n],s=e.data[n+1],r=e.data[n+2],o=Math.abs(a-s)+Math.abs(s-r)+Math.abs(r-a);t+=o}return t/(e.width*e.height)}function detectClonePatterns(e){const t=new Set;let n=0;for(let a=0;a<e.data.length;a+=4){const s=`${e.data[a]},${e.data[a+1]},${e.data[a+2]}`;t.has(s)&&n++,t.add(s)}return n/(e.width*e.height)}function calculateForgeryProbability(e){const t=.3*e.elaScore+.2*e.histogramAnalysis.red.stdDev+.2*e.luminanceScore+.15*e.inconsistencyScore+.1*e.noiseScore+.05*e.cloneDetection;return Math.min(Math.max(t,0),100)}function displayForensicResults(e,t){const n=document.getElementById("results");n.innerHTML=`
    <h3>Forgery Analysis Results:</h3>
    <p>Forgery Probability: ${t.toFixed(2)}%</p>
    <p>ELA Score: ${e.elaScore.toFixed(2)}</p>
    <p>Histogram Analysis:</p>
    <ul>
        <li>Red Channel: μ=${e.histogramAnalysis.red.mean.toFixed(2)}, σ=${e.histogramAnalysis.red.stdDev.toFixed(2)}</li>
        <li>Green Channel: μ=${e.histogramAnalysis.green.mean.toFixed(2)}, σ=${e.histogramAnalysis.green.stdDev.toFixed(2)}</li>
        <li>Blue Channel: μ=${e.histogramAnalysis.blue.mean.toFixed(2)}, σ=${e.histogramAnalysis.blue.stdDev.toFixed(2)}</li>
    </ul>
    <p>Luminance Score: ${e.luminanceScore.toFixed(2)}</p>
    <p>Inconsistency Score: ${e.inconsistencyScore.toFixed(2)}</p>
    <p>Noise Level Score: ${e.noiseScore.toFixed(2)}</p>
    <p>Clone Pattern Score: ${e.cloneDetection.toFixed(2)}</p>`}async function extractMetadata(){if(currentImage){showLoading();try{const e=await new Promise((e,t)=>{EXIF.getData(currentImage,function(){e(EXIF.getAllTags(this))})}),t=document.getElementById("metadata");t.innerHTML=`<h3>Image Metadata:</h3>${Object.entries(e).map(([e,t])=>`<p><strong>${e}:</strong> ${t}</p>`).join("")}`,console.log("Extracted metadata:",e)}catch(e){console.error("Metadata extraction error:",e),alert("Error extracting metadata")}hideLoading()}}function setupEventListeners(){document.getElementById("imageInput").addEventListener("change",handleImageUpload),document.getElementById("detectObjects").addEventListener("click",()=>safeDetect(detectObjects)),document.getElementById("detectPeople").addEventListener("click",()=>safeDetect(detectPeople)),document.getElementById("detectPeopleLarge").addEventListener("click",()=>safeDetect(detectPeopleLarge)),document.getElementById("analyzeForForge").addEventListener("click",analyzeForForgery),document.getElementById("showMetadata").addEventListener("click",extractMetadata),document.getElementById("clearCanvas").addEventListener("click",clearCanvas)}function handleImageUpload(e){const t=e.target.files[0];if(t){const e=new FileReader;e.onload=e=>{const t=document.getElementById("uploadedImage");t.src=e.target.result,t.style.display="block",currentImage=t,t.onload=()=>{setupCanvas(),enableButtons()}},e.readAsDataURL(t)}}function setupCanvas(){const e=document.getElementById("outputCanvas");e.width=currentImage.width,e.height=currentImage.height;const t=document.getElementById("histogram"),n=document.getElementById("ela"),a=document.getElementById("luminance");[t,n,a].forEach(e=>{e.width=400,e.height=200})}function enableButtons(){document.getElementById("detectObjects").disabled=!cocoModel,document.getElementById("detectPeople").disabled=!cocoModel,document.getElementById("detectPeopleLarge").disabled=!poseModel,document.getElementById("analyzeForForge").disabled=!1,document.getElementById("showMetadata").disabled=!1,document.getElementById("clearCanvas").disabled=!1}async function safeDetect(e){const t="detectPeopleLarge"===e.name?poseModel:cocoModel;t?await e():alert("Required model not available")}window.addEventListener("load",async()=>{await initModels(),setupEventListeners()});
</script>
