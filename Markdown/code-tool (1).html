<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/js-beautify/1.14.11/beautify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/js-beautify/1.14.11/beautify-html.min.js"></script>
    <style>
        body { 
            font-family: 'Courier New', monospace;
            margin: 0;
            background: #1e1e1e;
            color: #d4d4d4;
            font-size: 14px;
        }
        .container { 
            padding: 10px;
            max-width: 100%;
        }
        .section {
            background: #252526;
            border: 1px solid #333;
            border-radius: 4px;
            margin: 10px 0;
            padding: 10px;
        }
        #editor { 
            height: 250px;
            border-radius: 4px;
            margin: 10px 0;
        }
        #output { 
            min-height: 100px;
            max-height: 200px;
            overflow: auto;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .preview {
            min-height: 100px;
            background: #fff;
            padding: 10px;
            border-radius: 4px;
        }
        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 5px;
        }
        button {
            padding: 8px;
            background: #2d2d2d;
            color: #d4d4d4;
            border: 1px solid #404040;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
        }
        button:hover {
            background: #404040;
        }
        input[type="file"] {
            width: 100%;
            padding: 5px;
            color: #d4d4d4;
            font-size: 13px;
        }
        pre {
            margin: 0;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section">
            <input type="file" id="fileInput" accept=".html,.js,.txt">
        </div>

        <div class="section">
            <div class="btn-group">
                <button onclick="editor.setValue('')">Clear</button>
                <button onclick="resetTool()">Reset All</button>
            </div>
        </div>

        <div class="section" id="editor"></div>

        <div class="section">
            <div class="btn-group">
                <button onclick="executeCode()">Execute</button>
                <button onclick="executeInNewTab()">New Tab</button>
                <button onclick="minifyCode()">Minify</button>
                <button onclick="formatCode()">Format</button>
                <button onclick="createBookmarklet()">Create Button</button>
            </div>
        </div>

        <div class="section" id="output"></div>
        <div class="section preview" id="preview"></div>
    </div>

    <script>
        const editor = ace.edit("editor");
        editor.setTheme("ace/theme/monokai");
        editor.session.setMode("ace/mode/javascript");
        editor.setFontSize(13);

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (e) => editor.setValue(e.target.result);
            reader.readAsText(e.target.files[0]);
        });

        function resetTool() {
            editor.setValue('');
            document.getElementById('output').innerHTML = '';
            document.getElementById('preview').innerHTML = '';
            document.getElementById('fileInput').value = '';
        }

        function executeCode() {
            const code = editor.getValue();
            const preview = document.getElementById('preview');
            preview.innerHTML = '';
            try {
                if (code.includes('<script') || code.includes('<html')) {
                    preview.innerHTML = code;
                } else {
                    const result = eval(code);
                    document.getElementById('output').innerText = result;
                }
            } catch (err) {
                document.getElementById('output').innerText = `Error: ${err.message}`;
            }
        }

        function executeInNewTab() {
            const code = editor.getValue();
            const newTab = window.open();
            newTab.document.write(code.includes('<html') ? code : 
                `<!DOCTYPE html><html><body><script>${code}<\/script></body></html>`);
        }

        function minifyCode() {
            const code = editor.getValue();
            const minified = code.replace(/\s+/g, ' ').replace(/{\s+/g, '{')
                               .replace(/}\s+/g, '}').replace(/;\s+/g, ';').trim();
            document.getElementById('output').innerHTML = 
                `<pre>${minified}</pre><button onclick="saveToFile('${minified}', 'minified.js')">Save</button>`;
        }

        function formatCode() {
            const code = editor.getValue();
            const formatted = code.includes('<html') ? html_beautify(code) : js_beautify(code);
            document.getElementById('output').innerHTML = 
                `<pre>${formatted}</pre><button onclick="saveToFile('${formatted}', 'formatted.js')">Save</button>`;
        }

        function createBookmarklet() {
            const code = editor.getValue();
            const bookmarklet = `javascript:(function(){${encodeURIComponent(code)}})()`;
            const buttonCode = `<button onclick="${bookmarklet}">Execute Code</button>`;
            document.getElementById('output').innerHTML = 
                `${buttonCode}<pre>Button HTML:\n${buttonCode}</pre>`;
        }

        function saveToFile(content, filename) {
            const blob = new Blob([content], { type: 'text/javascript' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
