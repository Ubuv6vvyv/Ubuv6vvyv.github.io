<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT QR Code Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/base64-js/base64.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
        }
        #qrCanvas {
            margin: 10px auto;
            display: block;
        }
        .buttons {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>JWT QR Code Tool</h1>
    <h2>Decode JWT</h2>
    <textarea id="jwtInput" placeholder="Enter or paste JWT"></textarea>
    <button id="decodeJWT">Decode JWT</button>
    <pre id="decodedPayload">Decoded payload will appear here</pre>

    <h2>Edit Payload</h2>
    <textarea id="payloadInput" placeholder="Modify the payload JSON here"></textarea>
    <button id="encodeJWT">Re-Encode JWT</button>
    <textarea id="jwtOutput" placeholder="Encoded JWT will appear here"></textarea>

    <h2>Generate QR Code</h2>
    <button id="generateQRCode">Generate QR Code</button>
    <canvas id="qrCanvas"></canvas>

    <h2>Decode QR Code</h2>
    <input type="file" id="qrFileInput" accept="image/*">
    <button id="decodeQRCode">Decode QR Code</button>
    <pre id="qrDecodedPayload">Decoded QR JWT will appear here</pre>

    <script>
        // Decode JWT
        document.getElementById('decodeJWT').addEventListener('click', () => {
            const jwt = document.getElementById('jwtInput').value.trim();
            if (!jwt.includes('.')) {
                alert('Invalid JWT format');
                return;
            }
            try {
                const payloadBase64 = jwt.split('.')[1];
                const payload = atob(payloadBase64);
                document.getElementById('decodedPayload').textContent = payload;
                document.getElementById('payloadInput').value = payload;
            } catch (err) {
                alert('Failed to decode JWT: ' + err.message);
            }
        });

        // Encode JWT
        document.getElementById('encodeJWT').addEventListener('click', () => {
            try {
                const payload = document.getElementById('payloadInput').value.trim();
                const encodedHeader = btoa(JSON.stringify({ alg: "none" }));
                const encodedPayload = btoa(payload);
                const newJWT = `${encodedHeader}.${encodedPayload}.`;
                document.getElementById('jwtOutput').value = newJWT;
            } catch (err) {
                alert('Failed to encode JWT: ' + err.message);
            }
        });

        // Generate QR Code
        document.getElementById('generateQRCode').addEventListener('click', () => {
            const jwt = document.getElementById('jwtOutput').value.trim();
            if (!jwt) {
                alert('No JWT to encode into QR code');
                return;
            }
            const qrCanvas = document.getElementById('qrCanvas');
            QRCode.toCanvas(qrCanvas, jwt, (err) => {
                if (err) alert('Error generating QR code: ' + err.message);
            });
        });

        // Decode QR Code
        document.getElementById('decodeQRCode').addEventListener('click', () => {
            const fileInput = document.getElementById('qrFileInput');
            if (fileInput.files.length === 0) {
                alert('Please select a QR code image');
                return;
            }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function () {
                const img = new Image();
                img.src = reader.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const decodedQR = jsQR(imageData.data, canvas.width, canvas.height);
                    if (decodedQR) {
                        document.getElementById('qrDecodedPayload').textContent = decodedQR.data;
                    } else {
                        alert('Failed to decode QR code');
                    }
                };
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
