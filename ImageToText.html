<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ASCII</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<style>
:root{
  --d: #1a1a1a;
  --k: #121212;
  --p: #252525;
  --t: #fff;
  --m: rgba(255,255,255,.8);
  --a: #3498db;
  --s: #2ecc71;
  --r: 4px;
}
*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
body{
  font: 12px/1.2 system-ui, sans-serif;
  background: var(--d);
  color: var(--t);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: fixed;
  width: 100%;
}
.c{
  background: var(--p);
  padding: 4px;
  max-height: 35vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  box-shadow: 0 2px 8px #0003;
  position: relative;
  z-index: 2;
}
.g{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
  gap: 4px;
}
.i{
  padding: 1px;
}
.f{
  grid-column: 1 / -1;
}
label{
  font-size: 10px;
  color: var(--m);
  display: block;
  margin-bottom: 2px;
}
input[type=range]{
  width: 100%;
  height: 20px;
  margin: 2px 0;
  accent-color: var(--a);
}
input[type=file]{
  font-size: 10px;
  width: 100%;
  color: var(--m);
}
input[type=file]::file-selector-button{
  background: var(--a);
  border: 0;
  padding: 4px 8px;
  border-radius: var(--r);
  color: var(--t);
  font-size: 10px;
  cursor: pointer;
}
input[type=checkbox], input[type=radio]{
  accent-color: var(--a);
  margin-right: 4px;
}
.o{
  flex: 1;
  background: var(--k);
  overflow: auto;
  position: relative;
  min-height: 60vh;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
}
.w{
  position: relative;
  width: 100%;
  height: 100%;
  overflow: auto;
}
#u{
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100%;
  transform-origin: center;
}
#u.e{
  color: var(--m);
  font-style: italic;
}
#u pre{
  font: 10px/1 monospace;
  white-space: pre;
  position: relative;
  background: var(--k);
  color: var(--t);
  text-align: left;
  margin: auto;
}
.b{
  width: 100%;
  padding: 6px;
  background: var(--a);
  color: var(--t);
  border: 0;
  border-radius: var(--r);
  font-size: 11px;
  cursor: pointer;
  transition: background .2s, transform .1s;
  user-select: none;
}
.b:active{
  transform: translateY(1px);
  background: color-mix(in srgb, var(--a) 85%, #000);
}
.r{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px 8px;
  background: var(--p);
  box-shadow: 0 -2px 8px #0003;
  position: relative;
  z-index: 2;
}
.z{
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  background: #000c;
  padding: 4px;
  border-radius: var(--r);
  backdrop-filter: blur(4px);
  z-index: 3;
}
.y{
  width: 40px;
  height: 40px;
  font-size: 20px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.t{
  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--s);
  color: var(--t);
  padding: 8px 16px;
  border-radius: var(--r);
  font-size: 12px;
  opacity: 0;
  transition: transform .3s, opacity .3s;
  z-index: 3;
}
.t.w{
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
/* Mobile optimization */
@media (max-width: 600px) {
  .b {
    font-size: 14px;
    padding: 8px;
  }
  .c {
    padding: 6px;
  }
  label {
    font-size: 11px;
  }
}
</style>
</head>
<body>
<div class="c">
  <div class="g">
    <div class="i f"><input type="file" id="f" accept="image/*"></div>
    <div class="i">
      <label>ASCII Detail: <span id="sv">0.3</span></label>
      <input type="range" id="s" min="0.1" max="1" step="0.05" value="0.3">
    </div>
    <div class="i">
      <label>View Size: <span id="zv">1.0</span>x</label>
      <input type="range" id="zm" min="0.05" max="3" step="0.01" value="1">
    </div>
    <div class="i">
      <input type="checkbox" id="op">
      <label for="op">Chat (35ch)</label>
    </div>
    <div class="i">
      <input type="checkbox" id="in">
      <label for="in">Invert</label>
    </div>
    <div class="i">
      <label>Mode:</label>
      <input type="radio" id="modeSimple" name="mode" value="simple">
      <label for="modeSimple">Simple</label>
      <input type="radio" id="modeComplex" name="mode" value="complex" checked>
      <label for="modeComplex">Complex</label>
    </div>
    <div class="i">
      <input type="checkbox" id="col">
      <label for="col">Colour Output</label>
    </div>
    <div class="i">
      <label>Background Colour:</label>
      <input type="color" id="bgColor" value="#1a1a1a">
    </div>
    <div class="i f"><button class="b" id="cv">Convert</button></div>
  </div>
</div>
<div class="o">
  <div class="w">
    <div id="u" class="e">Select image</div>
  </div>
</div>
<div class="z">
  <button class="b y" id="zo">-</button>
  <button class="b y" id="rs">⟲</button>
  <button class="b y" id="zi">+</button>
</div>
<div class="r">
  <button class="b" id="cp">Copy</button>
  <button class="b" id="dl">Save</button>
</div>
<div class="t" id="ts"></div>
<script>
const $ = document.querySelector.bind(document);
const S = {
  d: null,
  a: '',
  p: false,
  v: 1 // view size
};

class A {
  static COMPLEX = " .:-=+*#%@";
  static SIMPLE = " .:-=+";
  constructor(i, s = 0.3, invert = false, mode = "complex", colorMode = false) {
    this.z = Math.max(0.1, Math.min(s, 1));
    this.invert = invert;
    this.mode = mode;
    this.colorMode = colorMode;
    return new Promise((resolve, reject) => {
      const m = new Image();
      m.src = i;
      m.onload = () => {
        const c = document.createElement('canvas'),
          x = c.getContext('2d');
        c.width = m.width * this.z;
        c.height = m.height * this.z;
        x.drawImage(m, 0, 0, c.width, c.height);
        this.d = x.getImageData(0, 0, c.width, c.height);
        this.w = c.width;
        resolve(this);
      };
      m.onerror = reject;
    });
  }
  convert() {
    const { data: d } = this.d;
    const h = this.mode === "complex" ? A.COMPLEX : A.SIMPLE;
    let o = '';
    if (!this.colorMode) {
      for (let i = 0; i < d.length; i += 4) {
        const brightness = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) / 255;
        const index = this.invert ? Math.floor(brightness * (h.length - 1)) : Math.floor((1 - brightness) * (h.length - 1));
        o += h[index];
        if (!((i / 4 + 1) % this.w)) o += '\n';
      }
    } else {
      for (let i = 0; i < d.length; i += 4) {
        const rVal = d[i], gVal = d[i+1], bVal = d[i+2];
        const brightness = (rVal * 0.299 + gVal * 0.587 + bVal * 0.114) / 255;
        const index = this.invert ? Math.floor(brightness * (h.length - 1)) : Math.floor((1 - brightness) * (h.length - 1));
        const char = h[index];
        o += '<span style="color: rgb(' + rVal + ',' + gVal + ',' + bVal + ')">' + char + '</span>';
        if (!((i / 4 + 1) % this.w)) o += '<br>';
      }
    }
    return o;
  }
}

const U = () => {
  const p = $('#u pre');
  if (p) {
    p.style.fontSize = `${10 * S.v}px`;
  }
};

const R = () => {
  S.v = 1;
  U();
  $('#zm').value = 1;
  $('#zv').textContent = '1.0';
};

const M = (m, d = 2000) => {
  const t = $('#ts');
  t.textContent = m;
  t.classList.add('w');
  setTimeout(() => t.classList.remove('w'), d);
};

const C = async () => {
  if (!S.d || S.p) return;
  S.p = true;
  $('#cv').disabled = true;
  try {
    const detail = $('#op').checked ? 0.3 : +$('#s').value;
    const invert = $('#in').checked;
    const mode = document.querySelector('input[name="mode"]:checked').value;
    const colorMode = $('#col').checked;
    // Change output background based on color mode toggle
    document.querySelector('.o').style.background = colorMode ? '#ffffff' : 'var(--k)';
    const o = $('#u');
    o.innerHTML = 'Converting...';
    o.classList.remove('e');
    const c = await new A(S.d, detail, invert, mode, colorMode);
    S.a = c.convert();
    const p = document.createElement('pre');
    if (colorMode) {
      p.innerHTML = S.a;
    } else {
      p.textContent = S.a;
    }
    o.innerHTML = '';
    o.appendChild(p);
    U();
  } catch (e) {
    console.error(e);
    M('Error');
  } finally {
    S.p = false;
    $('#cv').disabled = false;
  }
};

$('#cv').onclick = () => {
  const f = $('#f').files[0];
  if (!f) return M('Select image');
  const r = new FileReader();
  r.onload = e => {
    S.d = e.target.result;
    C();
  };
  r.readAsDataURL(f);
};

$('#s').oninput = function() {
  $('#sv').textContent = this.value;
  if (!$('#op').checked) C();
};

$('#zm').oninput = function() {
  S.v = +this.value;
  $('#zv').textContent = this.value;
  U();
};

$('#zi').onclick = () => {
  const z = $('#zm');
  z.value = Math.min(+z.value + 0.2, 5);
  z.oninput();
};

$('#zo').onclick = () => {
  const z = $('#zm');
  z.value = Math.max(+z.value - 0.2, 0.2);
  z.oninput();
};

$('#rs').onclick = R;
['in', 'op', 'col'].forEach(i => {
  $(`#${i}`).onchange = C;
});
// Make simple/complex toggle act immediately
document.querySelectorAll('input[name="mode"]').forEach(input => {
  input.onchange = C;
});

$('#cp').onclick = () => {
  if (!S.a) return M('No ASCII');
  navigator.clipboard.writeText(S.a).then(() => M('Copied!')).catch(() => M('Copy failed'));
};

$('#dl').onclick = () => {
  if (!S.a) return M('No ASCII');
  const b = new Blob([S.a], { type: 'text/plain' }),
    u = URL.createObjectURL(b),
    a = document.createElement('a');
  a.href = u;
  a.download = 'ascii.txt';
  a.click();
  URL.revokeObjectURL(u);
  M('Downloaded');
};

const d = $('.o');
d.ondragover = e => {
  e.preventDefault();
  d.style.opacity = '.7';
};
d.ondragleave = () => d.style.opacity = '1';
d.ondrop = e => {
  e.preventDefault();
  d.style.opacity = '1';
  const f = e.dataTransfer?.files[0];
  if (f?.type.startsWith('image/')) {
    $('#f').files = e.dataTransfer.files;
    $('#cv').click();
  } else {
    M('Need image');
  }
};

$('#bgColor').oninput = function() {
  document.documentElement.style.setProperty('--d', this.value);
};
</script>
</body>
</html>
