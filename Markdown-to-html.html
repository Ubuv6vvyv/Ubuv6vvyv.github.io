<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDtoHTML - Interactive Standalone Converter</title>

    <!-- External Libraries loaded via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #252526;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 760px;
        }

        h1 {
            color: #569cd6;
            margin-top: 0;
            margin-bottom: 1.2rem;
            text-align: center;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #9cdcfe;
            font-size: 0.9rem;
        }

        input[type="file"] {
            width: 100%;
            color: #d4d4d4;
            box-sizing: border-box;
        }

        input[type="file"]::file-selector-button {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-right: 10px;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #1177bb;
        }

        textarea {
            width: 100%;
            height: 280px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            padding: 12px;
            font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            box-sizing: border-box;
            resize: vertical;
        }

        textarea:focus {
            outline: 1px solid #007acc;
            border-color: #007acc;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 130px;
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1177bb;
        }

        button.btn-clear {
            background-color: #8a2525;
            flex: 0 0 90px;
        }

        button.btn-clear:hover {
            background-color: #a83232;
        }

        #status {
            margin-top: 1.2rem;
            text-align: left;
            font-size: 0.9rem;
        }

        .success { color: #6a9955; }
        .error { color: #f48771; }

        .file-list {
            list-style: none;
            padding-left: 0;
            margin-top: 0.8rem;
        }

        .file-list li {
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #333;
        }

        .file-list a {
            color: #3794ff;
            text-decoration: none;
            font-weight: bold;
        }

        .file-list a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MD to HTML Converter</h1>

        <div class="input-group">
            <label for="fileInput">Upload Markdown File(s):</label>
            <input type="file" id="fileInput" accept=".md,.txt" multiple>
        </div>

        <div class="input-group">
            <label for="markdownInput">Or Paste / Edit Markdown Below:</label>
            <textarea id="markdownInput" placeholder="Paste raw markdown here or upload a file above to view/edit..."></textarea>
        </div>

        <div class="button-group">
            <button type="button" id="btnPreview">Preview in New Tab</button>
            <button type="button" id="btnDownload">Download HTML</button>
            <button type="button" class="btn-clear" id="btnClear">Clear</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const markdownInput = document.getElementById('markdownInput');
        const btnPreview = document.getElementById('btnPreview');
        const btnDownload = document.getElementById('btnDownload');
        const btnClear = document.getElementById('btnClear');
        const statusDiv = document.getElementById('status');

        let activeFileName = "converted.html";

        // Embedded CSS styles for converted HTML document
        const cssStyles = `<style>
body {
    font-family: var(--vscode-markdown-font-family, -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", "Ubuntu", "Droid Sans", sans-serif);
    font-size: var(--vscode-markdown-font-size, 14px);
    padding: 0 26px;
    line-height: var(--vscode-markdown-line-height, 22px);
    word-wrap: break-word;
    background-color: #1e1e1e;
    color: #d4d4d4;
}

img { max-width: 100%; max-height: 100%; }
a { text-decoration: none; color: #3794ff; }
a:hover { text-decoration: underline; color: #3794ff; }
hr { border: 0; height: 2px; border-bottom: 2px solid; }
h1 { padding-bottom: 0.3em; line-height: 1.2; border-bottom-width: 1px; border-bottom-style: solid; }
h1, h2, h3 { font-weight: normal; }
table { border-collapse: collapse; }
table > thead > tr > th { text-align: left; border-bottom: 1px solid; }
table > thead > tr > th, table > thead > tr > td, table > tbody > tr > th, table > tbody > tr > td { padding: 5px 10px; }
table > tbody > tr + tr > td { border-top: 1px solid; }
blockquote { margin: 0 7px 0 5px; padding: 0 16px 0 10px; border-left-width: 5px; border-left-style: solid; }
code { font-family: Menlo, Monaco, Consolas, "Droid Sans Mono", "Courier New", monospace; font-size: 1em; line-height: 1.357em; }

pre { background-color: #2d2d2d; border: 1px solid #444; border-radius: 4px; position: relative; overflow: auto; cursor: pointer; transition: border-color 0.2s; }
pre:hover { border-color: #007acc; }
pre:not(.hljs) { padding: 16px; line-height: 19px; }
pre code { color: var(--vscode-editor-foreground); tab-size: 4; display: block; }
blockquote { background: rgba(127, 127, 127, 0.1); border-color: rgba(0, 122, 204, 0.5); color: #cccccc; }
:not(pre):not(.hljs) > code { color: #ce9178; font-size: inherit; }

/* Tomorrow Theme Syntax Highlighting */
.hljs-comment, .hljs-quote { color: #8e908c; }
.hljs-variable, .hljs-template-variable, .hljs-tag, .hljs-name, .hljs-selector-id, .hljs-selector-class, .hljs-regexp, .hljs-deletion { color: #c82829; }
.hljs-number, .hljs-built_in, .hljs-builtin-name, .hljs-literal, .hljs-type, .hljs-params, .hljs-meta, .hljs-link { color: #f5871f; }
.hljs-attribute { color: #eab700; }
.hljs-string, .hljs-symbol, .hljs-bullet, .hljs-addition { color: #718c00; }
.hljs-title, .hljs-section { color: #4271ae; }
.hljs-keyword, .hljs-selector-tag { color: #8959a8; }
.hljs { display: block; overflow-x: auto; color: #d4d4d4; padding: 1em; }
.hljs-emphasis { font-style: italic; }
.hljs-strong { font-weight: bold; }

/* Code Block Toast Cue */
.copy-toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #0e639c;
    color: #ffffff;
    padding: 8px 16px;
    border-radius: 4px;
    font-family: sans-serif;
    font-size: 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    z-index: 10000;
}
</style>`;

        // Interactive scripts embedded into the output HTML
        const embeddedScripts = `
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"><\/script>
<script>
  mermaid.initialize({ startOnLoad: true, theme: 'dark' });

  // Attach click-to-copy handler to code blocks inside generated HTML
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('pre').forEach(pre => {
      pre.title = 'Click code block to copy content';
      pre.addEventListener('click', async () => {
        const textToCopy = pre.innerText;
        try {
          await navigator.clipboard.writeText(textToCopy);
          showToast('Code copied to clipboard!');
        } catch (err) {
          showToast('Failed to copy code.');
        }
      });
    });
  });

  function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'copy-toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }
<\/script>`;

        // Configure Marked renderer
        marked.use({
            renderer: {
                code(token) {
                    const { text, lang } = token;
                    if (lang === 'mermaid') {
                        return `<pre><code class="language-mermaid"><div class="mermaid">${text}</div></code></pre>`;
                    }
                    if (lang && hljs.getLanguage(lang)) {
                        try {
                            const highlighted = hljs.highlight(text, { language: lang }).value;
                            return `<pre><code class="hljs language-${lang}">${highlighted}</code></pre>`;
                        } catch (e) {}
                    }
                    return `<pre><code class="hljs">${text}</code></pre>`;
                }
            }
        });

        // Convert Markdown text to standalone HTML
        function convertContent(mdContent, title = "Converted Document") {
            const htmlContent = marked.parse(mdContent);
            return `<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-type" content="text/html;charset=UTF-8">
<title>${title}</title>
${cssStyles}
${embeddedScripts}
</head>
<body class="vscode-dark">
${htmlContent}
</body>
</html>`;
        }

        // Display uploaded file contents directly into the textarea for editing
        fileInput.addEventListener('change', async () => {
            if (!fileInput.files.length) return;

            if (fileInput.files.length === 1) {
                const file = fileInput.files[0];
                activeFileName = file.name.replace(/\.md$/i, '') + '.html';
                const text = await file.text();
                markdownInput.value = text;
                statusDiv.innerHTML = `<p class="success">Loaded <strong>${file.name}</strong> into editor.</p>`;
            } else {
                statusDiv.innerHTML = `<p class="success">Loaded ${fileInput.files.length} files. Click below to convert batch.</p>`;
            }
        });

        // Preview in New Tab
        btnPreview.addEventListener('click', () => {
            const mdText = markdownInput.value.trim();
            if (!mdText) {
                statusDiv.innerHTML = `<p class="error">Please paste Markdown or upload a file first.</p>`;
                return;
            }
            const htmlOutput = convertContent(mdText, activeFileName.replace('.html', ''));
            const blob = new Blob([htmlOutput], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);
            window.open(blobUrl, '_blank');
        });

        // Download HTML
        btnDownload.addEventListener('click', async () => {
            statusDiv.innerHTML = '';

            // Handle batch files if multiple files selected
            if (fileInput.files.length > 1) {
                const fileList = document.createElement('ul');
                fileList.className = 'file-list';

                for (const file of fileInput.files) {
                    const mdText = await file.text();
                    const outputName = file.name.replace(/\.md$/i, '') + '.html';
                    const htmlOutput = convertContent(mdText, file.name);
                    const blob = new Blob([htmlOutput], { type: 'text/html' });
                    const blobUrl = URL.createObjectURL(blob);

                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span>📄 ${outputName}</span>
                        <a href="${blobUrl}" download="${outputName}">Download</a>
                    `;
                    fileList.appendChild(li);
                }
                statusDiv.innerHTML = `<p class="success"><strong>Batch Conversion Complete!</strong></p>`;
                statusDiv.appendChild(fileList);
                return;
            }

            // Single document download
            const mdText = markdownInput.value.trim();
            if (!mdText) {
                statusDiv.innerHTML = `<p class="error">Please paste Markdown or upload a file first.</p>`;
                return;
            }

            const htmlOutput = convertContent(mdText, activeFileName.replace('.html', ''));
            const blob = new Blob([htmlOutput], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = activeFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            statusDiv.innerHTML = `<p class="success">Downloaded <strong>${activeFileName}</strong> successfully!</p>`;
        });

        // Clear button resets editor and file uploads
        btnClear.addEventListener('click', () => {
            markdownInput.value = '';
            fileInput.value = '';
            statusDiv.innerHTML = '';
            activeFileName = "converted.html";
        });
    </script>
</body>
</html>
