<!DOCTYPE html>
<html>
<head>
  <title>3D Pipes Screensaver</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #canvas { width: 100vw; height: 100vh; display: block; }
    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.8);
      padding: 15px;
      border-radius: 8px;
      color: white;
      font-family: Arial, sans-serif;
      min-width: 280px;
    }
    .control-group {
      margin: 12px 0;
    }
    label {
      display: inline-block;
      width: 140px;
      font-size: 14px;
    }
    input[type="range"],
    input[type="color"],
    select {
      vertical-align: middle;
    }
    input[type="range"] {
      width: 120px;
    }
    .value-display {
      display: inline-block;
      width: 40px;
      text-align: right;
      margin-left: 8px;
      font-size: 12px;
    }
    /* Hide advanced controls by default */
    .advanced-controls {
      display: none;
    }
    .advanced-controls.show {
      display: block;
    }
    /* Rotate arrow when advanced controls are shown */
    .arrow.up {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>
  <div id="controls">
    <div class="basic-controls">
      <div class="control-group">
        <label>Speed:</label>
        <input type="range" id="growthRate" min="0.1" max="2" step="0.1" value="1">
        <span class="value-display">1.00</span>
      </div>
      <div class="control-group">
        <label>Base Color:</label>
        <input type="color" id="pipeColor" value="#4488ff">
      </div>
      <div class="control-group">
        <label>Pattern:</label>
        <select id="pat">
          <option value="0">Classic</option>
          <option value="1">Spiral</option>
          <option value="2">Grid</option>
          <option value="3">Random</option>
          <option value="4">Fountain</option>
        </select>
      </div>
    </div>
    <button id="toggleAdvanced">Advanced Options <span class="arrow">▼</span></button>
    <div class="advanced-controls">
      <div class="control-group">
        <label>Rainbow Mode:</label>
        <input type="checkbox" id="rainbowMode">
      </div>
      <div class="control-group">
        <label>Color Shift:</label>
        <input type="range" id="colorShiftSpeed" min="0" max="2" step="0.1" value="0.5">
        <span class="value-display">0.50</span>
      </div>
      <div class="control-group">
        <label>Brightness:</label>
        <input type="range" id="brightness" min="0.5" max="2" step="0.1" value="1.5">
        <span class="value-display">1.50</span>
      </div>
      <div class="control-group">
        <label>Rotation:</label>
        <!-- Global scene rotation applied independently -->
        <input type="range" id="rotationSpeed" min="0" max="2" step="0.1" value="0.3">
        <span class="value-display">0.30</span>
      </div>
      <div class="control-group">
        <label>Camera Distance:</label>
        <!-- Base camera distance; dynamic zoom-out is added based on scene extent -->
        <input type="range" id="camDistance" min="10" max="50" step="1" value="15">
        <span class="value-display">15</span>
      </div>
      <div class="control-group">
        <label>Complexity:</label>
        <input type="range" id="complexity" min="1" max="5" step="1" value="2">
        <span class="value-display">2</span>
      </div>
      <div class="control-group">
        <label>Branching:</label>
        <input type="range" id="branchChance" min="0.01" max="0.1" step="0.01" value="0.03">
        <span class="value-display">0.03</span>
      </div>
    </div>
  </div>
  
  <canvas id="canvas"></canvas>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Toggle advanced options display
    const toggleButton = document.getElementById('toggleAdvanced');
    const advancedControls = document.querySelector('.advanced-controls');
    const arrow = document.querySelector('.arrow');
    
    toggleButton.addEventListener('click', () => {
      advancedControls.classList.toggle('show');
      arrow.classList.toggle('up');
    });
    
    // Three.js Setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    
    // Enhanced lighting system
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const directionalLight1 = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight1.position.set(1, 1, 1);
    scene.add(directionalLight1);
    
    const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight2.position.set(-1, -1, -1);
    scene.add(directionalLight2);
    
    const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5);
    scene.add(hemisphereLight);
    
    // Material with enhanced visibility
    let pipeMaterial = new THREE.MeshStandardMaterial({
      color: 0x4488ff,
      metalness: 0.7,
      roughness: 0.2,
      emissive: 0x112244,
      emissiveIntensity: 0.2
    });
    
    // Global pipes array
    let pipes = [];
    
    // PipeSegment class with unified starting-branch logic
    class PipeSegment {
      constructor(startPoint, direction, length = 2, generation = 0) {
        this.startPoint = startPoint;
        this.direction = direction;
        this.length = length;
        this.children = [];
        this.mesh = null;
        this.growth = 0;
        this.generation = generation;
        this.createMesh();
        this.colorOffset = Math.random() * 10; // For rainbow effect
      }
    
      createMesh() {
        const segments = 12; // Smoother pipes
        const geometry = new THREE.CylinderGeometry(0.15, 0.15, this.length, segments);
        // Translate geometry so that its base is at (0,0,0) rather than centered.
        geometry.translate(0, this.length / 2, 0);
    
        this.material = pipeMaterial.clone();
        this.mesh = new THREE.Mesh(geometry, this.material);
        // Position the mesh so that its base is exactly at startPoint.
        this.mesh.position.copy(this.startPoint);
    
        // Align the cylinder (which extends along positive Y) with the given direction.
        const axis = new THREE.Vector3(0, 1, 0);
        const quaternion = new THREE.Quaternion();
        quaternion.setFromUnitVectors(axis, this.direction.clone().normalize());
        this.mesh.setRotationFromQuaternion(quaternion);
    
        scene.add(this.mesh);
      }
    
      // Grow the pipe from its base. When fully grown, spawn branch(es).
      grow(delta) {
        if (this.growth < 1) {
          this.growth += delta;
          if (this.growth > 1) this.growth = 1;
          // Scale along Y so that only the top extends outward.
          this.mesh.scale.y = this.growth;
          return false;
        }
        // Once fully grown, if no branch exists, always spawn one (ensuring continuity).
        if (this.children.length === 0) {
          this.addBranch();
        }
        // Additionally, if the number of children is less than the Complexity slider value,
        // spawn extra branches based on the Branching slider probability.
        let maxBranches = parseInt(controls.complexity.value);
        let branchProb = parseFloat(controls.branchChance.value);
        if (this.children.length < maxBranches && Math.random() < branchProb) {
          this.addBranch();
        }
        return true;
      }
    
      // Spawns a new branch starting exactly at the tip of this pipe.
      addBranch() {
        // Calculate the tip position: startPoint + (direction * length)
        const endPoint = new THREE.Vector3()
          .copy(this.startPoint)
          .addScaledVector(this.direction, this.length);
    
        // Decide new direction.
        const turnProbability = 0.8; // 80% chance to turn sharply.
        let newDirection;
        if (Math.random() < turnProbability) {
          // Choose one of the 6 cardinal directions that is nearly perpendicular.
          const allowed = [
            new THREE.Vector3(1, 0, 0),
            new THREE.Vector3(-1, 0, 0),
            new THREE.Vector3(0, 1, 0),
            new THREE.Vector3(0, -1, 0),
            new THREE.Vector3(0, 0, 1),
            new THREE.Vector3(0, 0, -1)
          ];
          const perpendicular = allowed.filter(v => Math.abs(this.direction.dot(v)) < 0.1);
          if (perpendicular.length > 0) {
            newDirection = perpendicular[Math.floor(Math.random() * perpendicular.length)];
          } else {
            newDirection = this.direction.clone();
          }
        } else {
          // Otherwise, continue in the same direction.
          newDirection = this.direction.clone();
        }
    
        const newLength = 2 + Math.random() * 3; // Random length between 2 and 5.
        const newPipe = new PipeSegment(endPoint, newDirection, newLength, this.generation + 1);
        this.children.push(newPipe);
        return newPipe;
      }
    
      updateColor(baseColor, rainbowMode, time) {
        if (rainbowMode) {
          const hue = (time * 0.1 + this.colorOffset) % 1;
          this.material.color.setHSL(hue, 0.8, 0.5);
        } else {
          this.material.color.copy(baseColor);
        }
      }
    }
    
    // Reset thresholds
    const PIPE_LIFECYCLE = 30000; // Base lifecycle: 30 seconds.
    const MAX_PIPES = 75;         // Base maximum number of pipes.
    let startTime = Date.now();
    let shouldReset = false;
    
    // Pattern creation functions – each creates one or more initial pipe(s).
    function createClassic() {
      const startPoint = new THREE.Vector3(0, -5, 0);
      const direction = new THREE.Vector3(0, 1, 0); // upward.
      const initialLength = 2 + Math.random() * 3;
      let root = new PipeSegment(startPoint, direction, initialLength);
      pipes.push(root);
    }
    
    function createSpiral() {
      const numPipes = 10;
      const radius = 2;
      for (let i = 0; i < numPipes; i++) {
        const angle = i * (Math.PI / 5);
        const startX = radius * Math.cos(angle);
        const startZ = radius * Math.sin(angle);
        const startY = -5 + i * 0.5;
        const startPoint = new THREE.Vector3(startX, startY, startZ);
        const tangentX = -radius * Math.sin(angle);
        const tangentZ = radius * Math.cos(angle);
        const tangentY = 0.5; // slight upward component.
        const direction = new THREE.Vector3(tangentX, tangentY, tangentZ).normalize();
        pipes.push(new PipeSegment(startPoint, direction));
      }
    }
    
    function createGrid() {
      const gridSize = 3;
      const spacing = 3;
      for (let i = -Math.floor(gridSize/2); i <= Math.floor(gridSize/2); i++) {
        for (let j = -Math.floor(gridSize/2); j <= Math.floor(gridSize/2); j++) {
          const startPoint = new THREE.Vector3(i * spacing, -5, j * spacing);
          const direction = new THREE.Vector3(0, 1, 0);
          pipes.push(new PipeSegment(startPoint, direction));
        }
      }
    }
    
    function createRandom() {
      const numPipes = 5;
      for (let i = 0; i < numPipes; i++) {
        const startX = (Math.random() - 0.5) * 20;
        const startY = -5 + Math.random() * 10;
        const startZ = (Math.random() - 0.5) * 20;
        const startPoint = new THREE.Vector3(startX, startY, startZ);
        const direction = new THREE.Vector3(Math.random() - 0.5, Math.random(), Math.random() - 0.5).normalize();
        pipes.push(new PipeSegment(startPoint, direction));
      }
    }
    
    function createFountain() {
      const numPipes = 10;
      const startPoint = new THREE.Vector3(0, -5, 0);
      for (let i = 0; i < numPipes; i++) {
        const dirX = (Math.random() - 0.5);
        const dirY = 1;
        const dirZ = (Math.random() - 0.5);
        const direction = new THREE.Vector3(dirX, dirY, dirZ).normalize();
        pipes.push(new PipeSegment(startPoint, direction));
      }
    }
    
    function createInitialPipes() {
      pipes.length = 0; // Clear pipes array.
      const patValue = parseInt(document.getElementById('pat').value);
      switch(patValue) {
        case 0:
          createClassic();
          break;
        case 1:
          createSpiral();
          break;
        case 2:
          createGrid();
          break;
        case 3:
          createRandom();
          break;
        case 4:
          createFountain();
          break;
        default:
          createClassic();
          break;
      }
    }
    
    // Controls setup.
    const controls = {
      growthRate: document.getElementById('growthRate'),
      rotationSpeed: document.getElementById('rotationSpeed'),
      pipeColor: document.getElementById('pipeColor'),
      rainbowMode: document.getElementById('rainbowMode'),
      colorShiftSpeed: document.getElementById('colorShiftSpeed'),
      pattern: document.getElementById('pat'),
      camDistance: document.getElementById('camDistance'),
      complexity: document.getElementById('complexity'),
      branchChance: document.getElementById('branchChance')
    };
    
    // Update value displays for range inputs.
    Object.entries(controls).forEach(([key, element]) => {
      if (element.type === 'range') {
        const display = element.nextElementSibling;
        element.addEventListener('input', () => {
          // For camDistance and complexity, show no decimals.
          if (key === 'camDistance' || key === 'complexity') {
            display.textContent = parseFloat(element.value).toFixed(0);
          } else {
            display.textContent = parseFloat(element.value).toFixed(2);
          }
        });
      }
    });
    
    // When the pattern selector changes, clear the current pipes and start anew.
    controls.pattern.addEventListener('change', () => {
      resetScene();
    });
    
    let lastTime = 0;
    function resetScene() {
      pipes.forEach(pipe => {
        scene.remove(pipe.mesh);
        pipe.mesh.geometry.dispose();
        pipe.material.dispose();
      });
      pipes.length = 0;
      createInitialPipes();
      startTime = Date.now();
      shouldReset = false;
    }
    
    // Global rotation variable for independent scene rotation.
    let globalRotation = 0;
    
    function animate(currentTime) {
      requestAnimationFrame(animate);
      const delta = (currentTime - lastTime) / 1000;
      lastTime = currentTime;
    
      const baseColor = new THREE.Color(controls.pipeColor.value);
      const rainbowMode = controls.rainbowMode.checked;
      const colorShiftSpeed = parseFloat(controls.colorShiftSpeed.value);
    
      // Extend thresholds based on the Complexity slider so that more intricate patterns get more time.
      const complexityVal = parseInt(controls.complexity.value);
      let effectiveMaxPipes = MAX_PIPES * complexityVal;
      let effectiveLifecycle = PIPE_LIFECYCLE * complexityVal;
    
      // Reset the scene if too many pipes exist or if the scene has been running too long.
      if (pipes.length >= effectiveMaxPipes || Date.now() - startTime > effectiveLifecycle) {
        if (!shouldReset) {
          shouldReset = true;
          setTimeout(resetScene, 1000);
        }
      }
    
      // Update brightness.
      const brightness = parseFloat(document.getElementById('brightness').value);
      directionalLight1.intensity = brightness;
      directionalLight2.intensity = brightness * 0.8;
      ambientLight.intensity = brightness * 0.6;
      hemisphereLight.intensity = brightness * 0.5;
    
      // Update each pipe.
      const growthRate = parseFloat(controls.growthRate.value);
      pipes.forEach(pipe => {
        pipe.grow(delta * growthRate);
        pipe.updateColor(baseColor, rainbowMode, currentTime * colorShiftSpeed);
        // Add any newly spawned children to the global pipes array.
        pipe.children.forEach(child => {
          if (pipes.indexOf(child) === -1 && pipes.length < effectiveMaxPipes) {
            pipes.push(child);
          }
        });
      });
    
      // Independently update global rotation based on the Rotation slider.
      const rotationSpeed = parseFloat(controls.rotationSpeed.value);
      globalRotation += rotationSpeed * delta;
      scene.rotation.y = globalRotation;
      scene.rotation.x = Math.sin(currentTime * 0.0005) * 0.2;
    
      // Dynamic camera scaling:
      // Start with the base camera distance from the slider...
      let baseCamDist = parseFloat(controls.camDistance.value);
      // ...and compute the maximum distance of any pipe node from the scene center.
      let maxDistance = 0;
      pipes.forEach(pipe => {
        let d = pipe.mesh.position.length();
        if (d > maxDistance) maxDistance = d;
      });
      // Calculate the desired camera distance as the base plus an offset proportional to the pattern’s extent.
      let desiredCamDist = baseCamDist + maxDistance * 1.5;
      // Smoothly interpolate the camera’s z‑position toward the desired distance.
      camera.position.z = THREE.MathUtils.lerp(camera.position.z, desiredCamDist, 0.01);
      // Ensure the camera is centered.
      camera.position.x = 0;
      camera.position.y = 0;
      camera.lookAt(scene.position);
    
      renderer.render(scene, camera);
    }
    
    // Set an initial camera position.
    if (window.innerHeight > window.innerWidth) {
      camera.position.z = 20;
    } else {
      camera.position.z = 15;
    }
    
    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.position.z = window.innerHeight > window.innerWidth ? 20 : 15;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }, 100);
    });
    
    // Initialize the scene.
    camera.position.z = 15;
    createInitialPipes();
    animate(0);
  </script>
</body>
</html>
