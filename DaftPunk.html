<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.00, user-scalable=no, maximum-scale=1.0">
    <title>Vowel Synthesizer</title>
    <style>
        :root {
            --bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2d 50%, #16213e 100%);
            --surface: rgba(44, 44, 68, 0.95);
            --border: rgba(138, 43, 226, 0.3);
            --accent: linear-gradient(45deg, #8a2be2, #4169e1, #00ced1, #ff1493);
            --text: #f0f0f8;
            --text-dim: #a0a0c0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 5px; /* Reduced */
            user-select: none;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #app {
            width: 100%;
            max-width: 380px; /* Reduced */
            padding: 8px; /* Reduced */
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);
            border: 1px solid var(--border);
        }
        .group {
            padding: 12px; /* Reduced */
            border-radius: 10px;
            margin-bottom: 2px; /* Reduced */
margin-top: 0px;
            background: rgba(0,0,0,.3);
            border: 1px solid rgba(255,255,255,.08);
        }
        .label {
            font-size: .6em; /* Reduced */
            font-weight: 700;
            margin-bottom: 10px; /* Reduced */
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: .7px;
        }
        button {
            flex: 1;
            padding: 10px;
            font-size: .8em; /* Reduced */
            font-weight: 800;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            transition: all .15s cubic-bezier(.4,0,.2,1);
            text-transform: uppercase;
        }
        button:active { transform: scale(.92); }
        input[type="range"] {
            width: 100%;
            height: 4px; /* Reduced */
            background: rgba(255,255,255,.1);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            margin: 2px 0 4px 0; /* Adjusted */
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px; /* Reduced */
            height: 16px; /* Reduced */
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,.4);
        }
        .val {
            font-weight: 700; /* Reduced */
            font-size: 0.9em;
            background: var(--accent);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .divider {
            text-align: center;
            margin: 8px 0 6px;
            font-size: .7em; /* Reduced */
            font-weight: 800;
            background: var(--accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #pad-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: radial-gradient(circle at center, rgba(138,43,226,.1) 0%, rgba(0,0,0,.8) 100%);
            border-radius: 12px; /* Reduced */
            border: 1px solid var(--border); /* Reduced */
            margin-bottom: 8px;
            overflow: hidden;
        }
        #pad {
            position: absolute;
            inset: 0;
            cursor: crosshair;
        }
        #puck {
            position: absolute;
            width: 20px; /* Reduced */
            height: 20px; /* Reduced */
            background: var(--accent);
            border-radius: 50%;
            border: 2px solid white; /* Reduced */
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 15px rgba(138,43,226,.8), 0 0 30px rgba(138,43,226,.4);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 15px rgba(138,43,226,.8), 0 0 30px rgba(138,43,226,.4); }
            50% { box-shadow: 0 0 25px rgba(138,43,226,1), 0 0 50px rgba(138,43,226,.6); }
        }
        .vowel {
            position: absolute;
            color: var(--text-dim);
            font-size: .7em; /* Reduced */
            font-weight: 800;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(0,0,0,.8);
        }
        .vowel.tl { top: 6px; left: 6px; }
        .vowel.tc { top: 6px; left: 50%; transform: translateX(-50%); }
        .vowel.tr { top: 6px; right: 6px; }
        .vowel.ml { top: 50%; left: 6px; transform: translateY(-50%); }
        .vowel.mc { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .vowel.mr { top: 50%; right: 6px; transform: translateY(-50%); }
        .vowel.bl { bottom: 6px; left: 6px; }
        .vowel.bc { bottom: 6px; left: 50%; transform: translateX(-50%); }
        .vowel.br { bottom: 6px; right: 6px; }
        select {
            width: 100%;
            padding: 5px; /* Reduced */
            background: rgba(51,51,77,.8);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: .75em; /* Reduced */
            margin-top: 2px;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    </style>
</head>
<body>

<div id="app">
    <div class="group">
        <button id="startStopButton">🎤 Start That Noise</button>
    </div>

    <div class="group">
        <div id="pad-container">
            <div id="pad"></div>
            <div id="puck" style="left: 50%; top: 50%;"></div>
            <div class="vowel tl">Ee</div> <div class="vowel tc">Er</div> <div class="vowel tr">Uu</div>
            <div class="vowel ml">Eh</div> <div class="vowel mc">Ah</div> <div class="vowel mr">Oo</div>
            <div class="vowel bl">Ae</div> <div class="vowel bc">Aa</div> <div class="vowel br">Ao</div>
        </div>
        
        <div class="label"><span>Pitch</span><span class="val" id="pitchVal">150 Hz</span></div>
        <input type="range" id="pitch" min="40" max="600" step="1" value="150">
    </div>

    <div class="group">
        <div class="divider">Voice Character</div>
        
        <input type="range" id="breathiness" min="0" max="1" step="0.01" value="0.1">
<div class="label"><span>Breathiness</span><span class="val" id="breathinessVal">10%</span></div>
        
        
        <input type="range" id="tone" min="100" max="8000" step="10" value="2000">
<div class="label"><span>Tone</span><span class="val" id="toneVal">2000 Hz</span></div>
        
        
        <input type="range" id="resonance" min="2" max="40" step="0.1" value="15">
<div class="label"><span>Resonance</span><span class="val" id="resonanceVal">15.0</span></div>
        
        
        <input type="range" id="voiceSize" min="0.3" max="2.0" step="0.01" value="1.0">
<div class="label"><span>Voice Size (Giant/Dwarf)</span><span class="val" id="voiceSizeVal">1.00x</span></div>
    </div>

    <div class="group">
        <div class="divider">Effects</div>
        
        <input type="range" id="reverb" min="0" max="1" step="0.01" value="0">
<div class="label"><span>Reverb</span><span class="val" id="reverbVal">0%</span></div>
        
        
        <input type="range" id="distortion" min="0" max="100" step="1" value="0">
<div class="label"><span>Distortion</span><span class="val" id="distortionVal">0%</span></div>

        
        <input type="range" id="vibrato" min="0" max="1" step="0.01" value="0">
<div class="label"><span>Vibrato</span><span class="val" id="vibratoVal">0%</span></div>
    </div>

    <div class="group grid">
        <div>
            <div class="divider">LFO 1</div>
            
            <input type="range" id="lfo1Rate" min="0.1" max="20" step="0.1" value="2">
<div class="label">Rate<span class="val" id="lfo1RateVal">2.0 Hz</span></div>
            
            <input type="range" id="lfo1Depth" min="0" max="1" step="0.01" value="0">
<div class="label">Depth<span class="val" id="lfo1DepthVal">0%</span></div>
            <select id="lfo1Target">
                <option value="none">Target...</option>
                <option value="vowelX">Vowel X</option>
                <option value="vowelY">Vowel Y</option>
                <option value="pitch">Pitch</option>
                <option value="tone">Tone</option>
                <option value="voiceSize">Voice Size</option>
            </select>
        </div>
        <div>
            <div class="divider">LFO 2</div>
            
            <input type="range" id="lfo2Rate" min="0.1" max="20" step="0.1" value="5">
<div class="label">Rate<span class="val" id="lfo2RateVal">5.0 Hz</span></div>
            
            <input type="range" id="lfo2Depth" min="0" max="1" step="0.01" value="0">
<div class="label">Depth<span class="val" id="lfo2DepthVal">0%</span></div>
            <select id="lfo2Target">
                <option value="none">Target...</option>
                <option value="vowelX">Vowel X</option>
                <option value="vowelY">Vowel Y</option>
                <option value="pitch">Pitch</option>
                <option value="tone">Tone</option>
                <option value="voiceSize">Voice Size</option>
            </select>
        </div>
    </div>

    <div class="group">
        <div class="label"><span>Volume</span><span class="val" id="volumeVal">50%</span></div>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    let audioContext, isPlaying = false, isInitialized = false;
    let osc, noise, oscGain, noiseGain, toneFilter, masterGain;
    let formant1, formant2, formant3, reverb, reverbGain, distortion, vibratoOsc, vibratoGain;
    let distortionCurves = new Map();

    const VOWELS = {
        'Ee': [270, 2300, 3000], 'Er': [500, 1400, 2500], 'Uu': [250, 600, 2200],
        'Eh': [550, 1770, 2490], 'Ah': [600, 1040, 2250], 'Oo': [300, 870, 2240],
        'Ae': [690, 1750, 2500], 'Aa': [730, 1090, 2440], 'Ao': [570, 840, 2410]
    };
    const VOWEL_GRID = [
        [VOWELS.Ee, VOWELS.Er, VOWELS.Uu], [VOWELS.Eh, VOWELS.Ah, VOWELS.Oo], [VOWELS.Ae, VOWELS.Aa, VOWELS.Ao]
    ];
    let xyPos = { x: 0.5, y: 0.5 };
    const ui = {};
    document.querySelectorAll('[id]').forEach(el => ui[el.id] = el);

    let lastUpdateTime = 0;
    const UPDATE_INTERVAL = 16; // ~60fps
    let cachedValues = {};
    let needsUpdate = true;

    function makeDistortionCurve(amount) {
        const rounded = Math.round(amount);
        if (distortionCurves.has(rounded)) return distortionCurves.get(rounded);
        
        const k = rounded;
        const n_samples = 8192; // Reduced from 44100
        const curve = new Float32Array(n_samples);
        const deg = Math.PI / 180;
        for (let i = 0; i < n_samples; ++i) {
            const x = i * 2 / n_samples - 1;
            curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
        }
        
        if (distortionCurves.size > 20) distortionCurves.clear(); // Memory management
        distortionCurves.set(rounded, curve);
        return curve;
    }

    function createReverbImpulse(duration = 1.5, decay = 1.2) { // Reduced duration
        const sampleRate = audioContext.sampleRate;
        const length = sampleRate * duration;
        const impulse = audioContext.createBuffer(2, length, sampleRate);
        for (let channel = 0; channel < 2; channel++) {
            const data = impulse.getChannelData(channel);
            for (let i = 0; i < length; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
            }
        }
        return impulse;
    }

    function initializeAudio() {
        if (isInitialized) return;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        osc = audioContext.createOscillator();
        noise = audioContext.createBufferSource();
        oscGain = audioContext.createGain();
        noiseGain = audioContext.createGain();
        toneFilter = audioContext.createBiquadFilter();
        
        vibratoOsc = audioContext.createOscillator();
        vibratoGain = audioContext.createGain();
        vibratoOsc.frequency.value = 5;
        vibratoOsc.connect(vibratoGain);
        vibratoGain.connect(osc.detune);

        const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.1, audioContext.sampleRate); // Smaller buffer
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        noise.buffer = noiseBuffer; noise.loop = true;
        
        osc.connect(oscGain);
        noise.connect(noiseGain);
        oscGain.connect(toneFilter);
        noiseGain.connect(toneFilter);

        const formantGain = audioContext.createGain();
        [formant1, formant2, formant3] = [1, 2, 3].map(() => {
            const f = audioContext.createBiquadFilter();
            f.type = 'bandpass';
            toneFilter.connect(f);
            f.connect(formantGain);
            return f;
        });
        
        distortion = audioContext.createWaveShaper();
        reverb = audioContext.createConvolver();
        reverb.buffer = createReverbImpulse();
        reverbGain = audioContext.createGain();
        masterGain = audioContext.createGain();
        
        formantGain.connect(distortion);
        distortion.connect(reverb);
        distortion.connect(masterGain);
        reverb.connect(reverbGain);
        reverbGain.connect(masterGain);

        masterGain.connect(audioContext.destination);

        osc.type = 'sawtooth';
        toneFilter.type = 'lowpass';
        masterGain.gain.value = 0;
        
        osc.start();
        noise.start();
        vibratoOsc.start();
        isInitialized = true;
    }
    
    const lerp = (a, b, t) => a * (1 - t) + b * t;
    const bilerp = (c00, c10, c01, c11, tx, ty) => {
        const f1 = lerp(c00[0], c10[0], tx) + (lerp(c01[0], c11[0], tx) - lerp(c00[0], c10[0], tx)) * ty;
        const f2 = lerp(c00[1], c10[1], tx) + (lerp(c01[1], c11[1], tx) - lerp(c00[1], c10[1], tx)) * ty;
        const f3 = lerp(c00[2], c10[2], tx) + (lerp(c01[2], c11[2], tx) - lerp(c00[2], c10[2], tx)) * ty;
        return [f1, f2, f3];
    };

    function togglePlay() {
        if (!isInitialized) initializeAudio();
        if (audioContext.state === 'suspended') audioContext.resume();

        isPlaying = !isPlaying;
        const now = audioContext.currentTime;
        if (isPlaying) {
            masterGain.gain.setTargetAtTime(+ui.volume.value, now, 0.1);
            ui.startStopButton.innerHTML = "🎤 Stop";
        } else {
            masterGain.gain.setTargetAtTime(0, now, 0.2);
            ui.startStopButton.innerHTML = "🎤 Start";
        }
    }

    function updateAudioParams(time) {
        const now = audioContext.currentTime;
        const lfo1 = +ui.lfo1Depth.value * Math.sin(2 * Math.PI * +ui.lfo1Rate.value * time / 1000);
        const lfo2 = +ui.lfo2Depth.value * Math.sin(2 * Math.PI * +ui.lfo2Rate.value * time / 1000);
        let mods = { vowelX: 0, vowelY: 0, pitch: 0, tone: 0, voiceSize: 0 };
        
        const targets = [ui.lfo1Target.value, ui.lfo2Target.value];
        const values = [lfo1, lfo2];
        for (let i = 0; i < 2; i++) {
            const t = targets[i], v = values[i];
            if (t === "vowelX") mods.vowelX += v * 0.5;
            else if (t === "vowelY") mods.vowelY += v * 0.5;
            else if (t === "pitch") mods.pitch += v * 100;
            else if (t === "tone") mods.tone += v * 2000;
            else if (t === "voiceSize") mods.voiceSize += v * 0.5;
        }

        const gx = Math.max(0, Math.min(1, xyPos.x + mods.vowelX)) * 2;
        const gy = Math.max(0, Math.min(1, xyPos.y + mods.vowelY)) * 2;
        const col = Math.min(1, Math.floor(gx));
        const row = Math.min(1, Math.floor(gy));
        const formants = bilerp(VOWEL_GRID[row][col], VOWEL_GRID[row][col + 1], VOWEL_GRID[row + 1][col], VOWEL_GRID[row + 1][col + 1], gx - col, gy - row);
        const voiceSize = +ui.voiceSize.value + mods.voiceSize;
        
        formant1.frequency.setTargetAtTime(formants[0] * voiceSize, now, 0.03);
        formant2.frequency.setTargetAtTime(formants[1] * voiceSize, now, 0.03);
        formant3.frequency.setTargetAtTime(formants[2] * voiceSize, now, 0.03);

        osc.frequency.setTargetAtTime(+ui.pitch.value + mods.pitch, now, 0.03);
        oscGain.gain.setTargetAtTime(1.0 - +ui.breathiness.value, now, 0.03);
        noiseGain.gain.setTargetAtTime(+ui.breathiness.value, now, 0.03);
        toneFilter.frequency.setTargetAtTime(Math.max(20, +ui.tone.value + mods.tone), now, 0.03);
        
        const resonance = +ui.resonance.value;
        formant1.Q.setTargetAtTime(resonance, now, 0.03);
        formant2.Q.setTargetAtTime(resonance, now, 0.03);
        formant3.Q.setTargetAtTime(resonance, now, 0.03);
        
        reverbGain.gain.setTargetAtTime(+ui.reverb.value, now, 0.03);
        
        const distVal = +ui.distortion.value;
        if (Math.abs(distVal - (cachedValues.lastDistortion || 0)) > 1) {
            distortion.curve = makeDistortionCurve(distVal);
            cachedValues.lastDistortion = distVal;
        }
        
        vibratoGain.gain.setTargetAtTime(+ui.vibrato.value * 100, now, 0.03);
        if (isPlaying) masterGain.gain.setTargetAtTime(+ui.volume.value, now, 0.03);
    }

    function animationLoop(time) {
        if (!isInitialized) { requestAnimationFrame(animationLoop); return; }
        
        if (time - lastUpdateTime >= UPDATE_INTERVAL) {
            updateAudioParams(time);
            lastUpdateTime = time;
        }
        
        requestAnimationFrame(animationLoop);
    }

    function setupEventListeners() {
        ui.startStopButton.addEventListener('click', togglePlay);
        
        let isDragging = false;
        const pad = ui.pad;
        const puck = ui.puck;
        const handleInteraction = e => {
            e.preventDefault();
            const rect = pad.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            xyPos.x = Math.max(0, Math.min(1, x / rect.width));
            xyPos.y = Math.max(0, Math.min(1, y / rect.height));
            puck.style.left = `${xyPos.x * 100}%`;
            puck.style.top = `${xyPos.y * 100}%`;
        };
        pad.addEventListener('mousedown', e => { isDragging = true; handleInteraction(e); });
        document.addEventListener('mousemove', e => { if (isDragging) handleInteraction(e); });
        document.addEventListener('mouseup', () => { isDragging = false; });
        pad.addEventListener('touchstart', e => { isDragging = true; handleInteraction(e); }, { passive: false });
        document.addEventListener('touchmove', e => { if (isDragging) handleInteraction(e); }, { passive: false });
        document.addEventListener('touchend', () => { isDragging = false; });
        
        let displayUpdateTimer;
        const updateDisplays = () => {
            clearTimeout(displayUpdateTimer);
            displayUpdateTimer = setTimeout(() => {
                ui.pitchVal.textContent = `${ui.pitch.value} Hz`;
                ui.breathinessVal.textContent = `${Math.round(ui.breathiness.value * 100)}%`;
                ui.toneVal.textContent = `${ui.tone.value} Hz`;
                ui.resonanceVal.textContent = (+ui.resonance.value).toFixed(1);
                ui.voiceSizeVal.textContent = `${(+ui.voiceSize.value).toFixed(2)}x`;
                ui.reverbVal.textContent = `${Math.round(ui.reverb.value * 100)}%`;
                ui.distortionVal.textContent = `${Math.round(ui.distortion.value)}%`;
                ui.vibratoVal.textContent = `${Math.round(ui.vibrato.value * 100)}%`;
                ui.lfo1RateVal.textContent = `${(+ui.lfo1Rate.value).toFixed(1)} Hz`;
                ui.lfo1DepthVal.textContent = `${Math.round(ui.lfo1Depth.value * 100)}%`;
                ui.lfo2RateVal.textContent = `${(+ui.lfo2Rate.value).toFixed(1)} Hz`;
                ui.lfo2DepthVal.textContent = `${Math.round(ui.lfo2Depth.value * 100)}%`;
                ui.volumeVal.textContent = `${Math.round(ui.volume.value * 100)}%`;
            }, 50);
        };
        document.querySelectorAll('input[type="range"]').forEach(slider => {
            slider.addEventListener('input', updateDisplays);
        });
        updateDisplays();
    }

    setupEventListeners();
    requestAnimationFrame(animationLoop);
});
</script>
</body>
</html>
