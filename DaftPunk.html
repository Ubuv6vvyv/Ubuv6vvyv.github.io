<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.00, user-scalable=no, maximum-scale=1.0">
    <title>Enhanced Vowel Synthesizer</title>
    <style>
        :root {
            --bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2d 50%, #16213e 100%);
            --surface: rgba(44, 44, 68, 0.95);
            --border: rgba(138, 43, 226, 0.3);
            --accent: linear-gradient(45deg, #8a2be2, #4169e1, #00ced1, #ff1493);
            --text: #f0f0f8;
            --text-dim: #a0a0c0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 5px;
            user-select: none;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #app {
            width: 100%;
            max-width: 380px;
            padding: 8px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.1);
            border: 1px solid var(--border);
        }
        .group {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 6px;
            background: rgba(0,0,0,.3);
            border: 1px solid rgba(255,255,255,.08);
        }
        .label {
            font-size: .5em;
            font-weight: 800;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: .7px;
        }
        button {
            flex: 1;
            padding: 10px;
            font-size: .8em;
            font-weight: 800;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            transition: all .15s cubic-bezier(.4,0,.2,1);
            text-transform: uppercase;
        }
        button:active { transform: scale(.92); }
        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,.1);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            margin: 2px 0 4px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,.4);
        }
        .val {
            font-weight: 700;
            font-size: 0.9em;
            background: var(--accent);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .divider {
            text-align: center;
            margin: 8px 0 6px;
            font-size: .7em;
            font-weight: 800;
            background: var(--accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #pad-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            background: radial-gradient(circle at center, rgba(138,43,226,.1) 0%, rgba(0,0,0,.8) 100%);
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 8px;
            overflow: hidden;
        }
        #pad {
            position: absolute;
            inset: 0;
            cursor: crosshair;
        }
        #puck {
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            border: 2px solid white;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 0 15px rgba(138,43,226,.8), 0 0 30px rgba(138,43,226,.4);
            animation: pulse 2s ease-in-out infinite;
        }
        .vowel {
            position: absolute;
            color: var(--text-dim);
            font-size: .7em;
            font-weight: 800;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(0,0,0,.8);
        }
        .vowel.tl { top: 6px; left: 6px; }
        .vowel.tc { top: 6px; left: 50%; transform: translateX(-50%); }
        .vowel.tr { top: 6px; right: 6px; }
        .vowel.ml { top: 50%; left: 6px; transform: translateY(-50%); }
        .vowel.mc { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .vowel.mr { top: 50%; right: 6px; transform: translateY(-50%); }
        .vowel.bl { bottom: 6px; left: 6px; }
        .vowel.bc { bottom: 6px; left: 50%; transform: translateX(-50%); }
        .vowel.br { bottom: 6px; right: 6px; }
        select {
            width: 100%;
            padding: 5px;
            background: rgba(51,51,77,.8);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: .75em;
            margin-top: 2px;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .wave-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }
        .wave-btn {
            padding: 6px 4px;
            font-size: 0.65em;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .wave-btn.active {
            background: var(--accent);
            border-color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

<div id="app">
    <div class="group">
        <button id="startStopButton">🎤 Start</button>
    </div>

    <div class="group">
        <div id="pad-container">
            <div id="pad"></div>
            <div id="puck" style="left: 50%; top: 50%;"></div>
            <div class="vowel tl">Ee</div> <div class="vowel tc">Er</div> <div class="vowel tr">Uu</div>
            <div class="vowel ml">Eh</div> <div class="vowel mc">Ah</div> <div class="vowel mr">Oo</div>
            <div class="vowel bl">Ae</div> <div class="vowel bc">Aa</div> <div class="vowel br">Ao</div>
        </div>
        
        <div class="label"><span>Pitch</span><span class="val" id="pitchVal">150 Hz</span></div>
        <input type="range" id="pitch" min="40" max="600" step="1" value="150">
        
        <div class="label"><span>Portamento</span><span class="val" id="portamentoVal">10%</span></div>
        <input type="range" id="portamento" min="0" max="1" step="0.01" value="0.1">
    </div>

    <div class="group">
        <div class="divider">Oscillator</div>
        <div class="wave-buttons">
            <button class="wave-btn active" data-wave="sawtooth">SAW</button>
            <button class="wave-btn" data-wave="square">SQR</button>
            <button class="wave-btn" data-wave="sine">SIN</button>
            <button class="wave-btn" data-wave="triangle">TRI</button>
        </div>
        
        <div class="label"><span>Harmonics</span><span class="val" id="harmonicsVal">0%</span></div>
        <input type="range" id="harmonics" min="0" max="1" step="0.01" value="0">
    </div>

    <div class="group">
        <div class="divider">Voice Character</div>
        
        <div class="label"><span>Breathiness</span><span class="val" id="breathinessVal">10%</span></div>
        <input type="range" id="breathiness" min="0" max="1" step="0.01" value="0.1">
        
        <div class="label"><span>Tone</span><span class="val" id="toneVal">2000 Hz</span></div>
        <input type="range" id="tone" min="100" max="8000" step="10" value="2000">
        
        <div class="label"><span>Formant Q</span><span class="val" id="resonanceVal">15.0</span></div>
        <input type="range" id="resonance" min="2" max="40" step="0.1" value="15">
        
        <div class="label"><span>Voice Size</span><span class="val" id="voiceSizeVal">1.00x</span></div>
        <input type="range" id="voiceSize" min="0.3" max="2.0" step="0.01" value="1.0">
    </div>

    <div class="group">
        <div class="divider">Effects</div>
        
        <div class="label"><span>Reverb</span><span class="val" id="reverbVal">0%</span></div>
        <input type="range" id="reverb" min="0" max="1" step="0.01" value="0">
        
        <div class="label"><span>Chorus</span><span class="val" id="chorusVal">0%</span></div>
        <input type="range" id="chorus" min="0" max="1" step="0.01" value="0">
        
        <div class="label"><span>Distortion</span><span class="val" id="distortionVal">0%</span></div>
        <input type="range" id="distortion" min="0" max="100" step="1" value="0">
        
        <div class="label"><span>Compressor</span><span class="val" id="compressorVal">0%</span></div>
        <input type="range" id="compressor" min="0" max="1" step="0.01" value="0">
        
        <div class="label"><span>Tremolo</span><span class="val" id="tremoloVal">0%</span></div>
        <input type="range" id="tremolo" min="0" max="1" step="0.01" value="0">
        
        <div class="label"><span>Vibrato</span><span class="val" id="vibratoVal">0%</span></div>
        <input type="range" id="vibrato" min="0" max="1" step="0.01" value="0">
    </div>

    <div class="group grid">
        <div>
            <div class="divider">LFO 1</div>
            <div class="label">Rate<span class="val" id="lfo1RateVal">2.0 Hz</span></div>
            <input type="range" id="lfo1Rate" min="0.1" max="20" step="0.1" value="2">
            <div class="label">Depth<span class="val" id="lfo1DepthVal">0%</span></div>
            <input type="range" id="lfo1Depth" min="0" max="1" step="0.01" value="0">
            <select id="lfo1Target">
                <option value="none">Target...</option>
                <option value="vowelX">Vowel X</option>
                <option value="vowelY">Vowel Y</option>
                <option value="pitch">Pitch</option>
                <option value="tone">Tone</option>
                <option value="voiceSize">Voice Size</option>
            </select>
        </div>
        <div>
            <div class="divider">LFO 2</div>
            <div class="label">Rate<span class="val" id="lfo2RateVal">5.0 Hz</span></div>
            <input type="range" id="lfo2Rate" min="0.1" max="20" step="0.1" value="5">
            <div class="label">Depth<span class="val" id="lfo2DepthVal">0%</span></div>
            <input type="range" id="lfo2Depth" min="0" max="1" step="0.01" value="0">
            <select id="lfo2Target">
                <option value="none">Target...</option>
                <option value="vowelX">Vowel X</option>
                <option value="vowelY">Vowel Y</option>
                <option value="pitch">Pitch</option>
                <option value="tone">Tone</option>
                <option value="voiceSize">Voice Size</option>
            </select>
        </div>
    </div>

    <div class="group">
        <div class="label"><span>Volume</span><span class="val" id="volumeVal">50%</span></div>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    let audioContext, isPlaying = false, isInitialized = false;
    let osc, harmonicOsc, noise, oscGain, harmonicGain, noiseGain, toneFilter, masterGain;
    let formant1, formant2, formant3, reverb, reverbGain, distortion, vibratoOsc, vibratoGain;
    let chorusDelay, chorusGain, compressor, tremoloGain;
    let currentWaveform = 'sawtooth';
    let targetPitch = 150;

    const VOWELS = {
        'Ee': [270, 2300, 3000], 'Er': [500, 1400, 2500], 'Uu': [250, 600, 2200],
        'Eh': [550, 1770, 2490], 'Ah': [600, 1040, 2250], 'Oo': [300, 870, 2240],
        'Ae': [690, 1750, 2500], 'Aa': [730, 1090, 2440], 'Ao': [570, 840, 2410]
    };
    const VOWEL_GRID = [
        [VOWELS.Ee, VOWELS.Er, VOWELS.Uu], [VOWELS.Eh, VOWELS.Ah, VOWELS.Oo], [VOWELS.Ae, VOWELS.Aa, VOWELS.Ao]
    ];
    let xyPos = { x: 0.5, y: 0.5 };
    const ui = {};
    document.querySelectorAll('[id]').forEach(el => ui[el.id] = el);

    function createPinkNoise() {
        const bufferSize = audioContext.sampleRate * 2;
        const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
        const data = buffer.getChannelData(0);
        let b0=0, b1=0, b2=0, b3=0, b4=0, b5=0, b6=0;
        for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99886 * b0 + white * 0.0555179; b1 = 0.99332 * b1 + white * 0.0750759;
            b2 = 0.96900 * b2 + white * 0.1538520; b3 = 0.86650 * b3 + white * 0.3104856;
            b4 = 0.55000 * b4 + white * 0.5329522; b5 = -0.7616 * b5 - white * 0.0168980;
            data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
            b6 = white * 0.115926;
        }
        return buffer;
    }

    function makeDistortionCurve(amount) {
        const k = Math.abs(amount) < 1 ? 1 : amount;
        const n_samples = 44100;
        const curve = new Float32Array(n_samples);
        const deg = Math.PI / 180;
        for (let i = 0; i < n_samples; ++i) {
            const x = i * 2 / n_samples - 1;
            curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
        }
        return curve;
    }
    
    function initializeAudio() {
        if (isInitialized) return;
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        osc = audioContext.createOscillator();
        harmonicOsc = audioContext.createOscillator();
        noise = audioContext.createBufferSource();
        oscGain = audioContext.createGain();
        harmonicGain = audioContext.createGain();
        noiseGain = audioContext.createGain();
        toneFilter = audioContext.createBiquadFilter();
        
        vibratoOsc = audioContext.createOscillator();
        vibratoGain = audioContext.createGain();
        const tremoloOsc = audioContext.createOscillator();
        tremoloGain = audioContext.createGain();
        
        vibratoOsc.frequency.value = 5;
        tremoloOsc.frequency.value = 4;
        vibratoOsc.connect(vibratoGain);
        tremoloOsc.connect(tremoloGain);
        vibratoGain.connect(osc.detune);
        vibratoGain.connect(harmonicOsc.detune);

        noise.buffer = createPinkNoise();
        noise.loop = true;
        
        osc.connect(oscGain);
        harmonicOsc.connect(harmonicGain);
        noise.connect(noiseGain);
        
        oscGain.connect(toneFilter);
        harmonicGain.connect(toneFilter);
        noiseGain.connect(toneFilter);

        const formantGain = audioContext.createGain();
        [formant1, formant2, formant3] = [1, 2, 3].map(() => {
            const f = audioContext.createBiquadFilter();
            f.type = 'bandpass'; f.Q.value = 15;
            toneFilter.connect(f);
            f.connect(formantGain);
            return f;
        });
        
        compressor = audioContext.createDynamicsCompressor();
        distortion = audioContext.createWaveShaper();
        
        chorusDelay = audioContext.createDelay(0.05);
        chorusGain = audioContext.createGain();
        const chorusLFO = audioContext.createOscillator();
        const chorusLFOGain = audioContext.createGain();
        chorusLFO.frequency.value = 0.5;
        chorusLFOGain.gain.value = 0.005;
        chorusLFO.connect(chorusLFOGain).connect(chorusDelay.delayTime);
        chorusLFO.start();
        
        reverb = audioContext.createConvolver();
        const impulseLen = audioContext.sampleRate * 2.0;
        const impulse = audioContext.createBuffer(2, impulseLen, audioContext.sampleRate);
        for (let ch=0; ch<2; ch++) {
            const data = impulse.getChannelData(ch);
            for (let i=0; i<impulseLen; i++) data[i] = (Math.random()*2-1)*Math.pow(1-i/impulseLen, 1.5);
        }
        reverb.buffer = impulse;
        reverbGain = audioContext.createGain();
        
        masterGain = audioContext.createGain();
        
        formantGain.connect(compressor);
        compressor.connect(distortion);
        distortion.connect(chorusDelay).connect(chorusGain);
        distortion.connect(reverb).connect(reverbGain);
        distortion.connect(masterGain);
        chorusGain.connect(masterGain);
        reverbGain.connect(masterGain);
        tremoloGain.connect(masterGain.gain);
        masterGain.connect(audioContext.destination);

        osc.type = currentWaveform;
        harmonicOsc.type = 'sine';
        toneFilter.type = 'lowpass';
        
        [masterGain, harmonicGain, chorusGain, reverbGain, tremoloGain].forEach(g => g.gain.value = 0);
        
        compressor.threshold.value = -12; compressor.knee.value = 30; compressor.ratio.value = 12;
        
        osc.start(); harmonicOsc.start(); noise.start();
        vibratoOsc.start(); tremoloOsc.start();
        isInitialized = true;
    }
    
    const lerp = (a, b, t) => a + t * (b - a);
    const bilerp = (c00, c10, c01, c11, tx, ty) => {
        const f1 = lerp(c00[0], c10[0], tx) + (lerp(c01[0], c11[0], tx) - lerp(c00[0], c10[0], tx)) * ty;
        const f2 = lerp(c00[1], c10[1], tx) + (lerp(c01[1], c11[1], tx) - lerp(c00[1], c10[1], tx)) * ty;
        const f3 = lerp(c00[2], c10[2], tx) + (lerp(c01[2], c11[2], tx) - lerp(c00[2], c10[2], tx)) * ty;
        return [f1, f2, f3];
    };

    function togglePlay() {
        if (!isInitialized) initializeAudio();
        if (audioContext.state === 'suspended') audioContext.resume();

        isPlaying = !isPlaying;
        const now = audioContext.currentTime;
        if (isPlaying) {
            masterGain.gain.setTargetAtTime(parseFloat(ui.volume.value), now, 0.1);
            ui.startStopButton.innerHTML = "🎤 Stop";
        } else {
            masterGain.gain.setTargetAtTime(0, now, 0.2);
            ui.startStopButton.innerHTML = "🎤 Start";
        }
    }

    function animationLoop(time) {
        if (!isInitialized || !isPlaying) { requestAnimationFrame(animationLoop); return; }
        
        const now = audioContext.currentTime;
        const lfo1 = parseFloat(ui.lfo1Depth.value) * Math.sin(2 * Math.PI * parseFloat(ui.lfo1Rate.value) * time / 1000);
        const lfo2 = parseFloat(ui.lfo2Depth.value) * Math.sin(2 * Math.PI * parseFloat(ui.lfo2Rate.value) * time / 1000);
        let mods = { vowelX: 0, vowelY: 0, pitch: 0, tone: 0, voiceSize: 0 };
        
        [{ v: lfo1, t: ui.lfo1Target.value }, { v: lfo2, t: ui.lfo2Target.value }].forEach(lfo => {
            if (lfo.t === "vowelX") mods.vowelX += lfo.v * 0.5;
            else if (lfo.t === "vowelY") mods.vowelY += lfo.v * 0.5;
            else if (lfo.t === "pitch") mods.pitch += lfo.v * 100;
            else if (lfo.t === "tone") mods.tone += lfo.v * 2000;
            else if (lfo.t === "voiceSize") mods.voiceSize += lfo.v * 0.5;
        });
        
        const smoothTime = parseFloat(ui.portamento.value) * 0.2 + 0.015;
        
        const gx = Math.max(0, Math.min(1, xyPos.x + mods.vowelX)) * 2;
        const gy = Math.max(0, Math.min(1, xyPos.y + mods.vowelY)) * 2;
        const col = Math.min(1, Math.floor(gx));
        const row = Math.min(1, Math.floor(gy));
        const formants = bilerp(VOWEL_GRID[row][col], VOWEL_GRID[row][col+1], VOWEL_GRID[row+1][col], VOWEL_GRID[row+1][col+1], gx-col, gy-row);
        const voiceSize = parseFloat(ui.voiceSize.value) + mods.voiceSize;
        formant1.frequency.setTargetAtTime(formants[0] * voiceSize, now, smoothTime);
        formant2.frequency.setTargetAtTime(formants[1] * voiceSize, now, smoothTime);
        formant3.frequency.setTargetAtTime(formants[2] * voiceSize, now, smoothTime);

        targetPitch = parseFloat(ui.pitch.value);
        osc.frequency.setTargetAtTime(targetPitch + mods.pitch, now, smoothTime);
        harmonicOsc.frequency.setTargetAtTime((targetPitch + mods.pitch) * 2, now, smoothTime);
        
        toneFilter.frequency.setTargetAtTime(Math.max(100, parseFloat(ui.tone.value) + mods.tone), now, 0.02);

        requestAnimationFrame(animationLoop);
    }

    function setupEventListeners() {
        ui.startStopButton.addEventListener('click', togglePlay);
        
        let isDragging = false;
        const pad = ui.pad, puck = ui.puck;
        const handleInteraction = e => {
            e.preventDefault();
            const rect = pad.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;
            xyPos.x = Math.max(0, Math.min(1, x / rect.width));
            xyPos.y = Math.max(0, Math.min(1, y / rect.height));
            puck.style.left = `${xyPos.x * 100}%`;
            puck.style.top = `${xyPos.y * 100}%`;
        };
        pad.addEventListener('mousedown', e => { isDragging = true; handleInteraction(e); });
        document.addEventListener('mousemove', e => { if (isDragging) handleInteraction(e); });
        document.addEventListener('mouseup', () => { isDragging = false; });
        pad.addEventListener('touchstart', e => { isDragging = true; handleInteraction(e); }, { passive: false });
        document.addEventListener('touchmove', e => { if (isDragging) handleInteraction(e); }, { passive: false });
        document.addEventListener('touchend', () => { isDragging = false; });
        
        const updateDisplays = () => {
            ui.pitchVal.textContent = `${ui.pitch.value} Hz`;
            ui.portamentoVal.textContent = `${Math.round(ui.portamento.value * 100)}%`;
            ui.harmonicsVal.textContent = `${Math.round(ui.harmonics.value * 100)}%`;
            ui.breathinessVal.textContent = `${Math.round(ui.breathiness.value * 100)}%`;
            ui.toneVal.textContent = `${ui.tone.value} Hz`;
            ui.resonanceVal.textContent = parseFloat(ui.resonance.value).toFixed(1);
            ui.voiceSizeVal.textContent = `${parseFloat(ui.voiceSize.value).toFixed(2)}x`;
            ui.reverbVal.textContent = `${Math.round(ui.reverb.value * 100)}%`;
            ui.chorusVal.textContent = `${Math.round(ui.chorus.value * 100)}%`;
            ui.distortionVal.textContent = `${Math.round(ui.distortion.value)}%`;
            ui.compressorVal.textContent = `${Math.round(ui.compressor.value * 100)}%`;
            ui.tremoloVal.textContent = `${Math.round(ui.tremolo.value * 100)}%`;
            ui.vibratoVal.textContent = `${Math.round(ui.vibrato.value * 100)}%`;
            ui.lfo1RateVal.textContent = `${parseFloat(ui.lfo1Rate.value).toFixed(1)} Hz`;
            ui.lfo1DepthVal.textContent = `${Math.round(ui.lfo1Depth.value * 100)}%`;
            ui.lfo2RateVal.textContent = `${parseFloat(ui.lfo2Rate.value).toFixed(1)} Hz`;
            ui.lfo2DepthVal.textContent = `${Math.round(ui.lfo2Depth.value * 100)}%`;
            ui.volumeVal.textContent = `${Math.round(ui.volume.value * 100)}%`;
        };
        
        document.querySelectorAll('.wave-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelector('.wave-btn.active').classList.remove('active');
                btn.classList.add('active');
                currentWaveform = btn.dataset.wave;
                if (isInitialized) {
                    osc.type = currentWaveform;
                    harmonicOsc.type = currentWaveform === 'sine' ? 'sine' : 'sawtooth';
                }
            };
        });

        document.querySelectorAll('input[type="range"]').forEach(slider => {
            slider.addEventListener('input', () => {
                updateDisplays();
                if (!isInitialized) return;
                const now = audioContext.currentTime;
                const val = parseFloat(slider.value);
                switch(slider.id) {
                    case 'harmonics': harmonicGain.gain.setTargetAtTime(val, now, 0.02); break;
                    case 'breathiness': 
                        noiseGain.gain.setTargetAtTime(val * 0.3, now, 0.02);
                        oscGain.gain.setTargetAtTime(1.0 - val, now, 0.02);
                        break;
                    case 'resonance': [formant1.Q, formant2.Q, formant3.Q].forEach(q => q.setTargetAtTime(val, now, 0.02)); break;
                    case 'reverb': reverbGain.gain.setTargetAtTime(val, now, 0.02); break;
                    case 'chorus': chorusGain.gain.setTargetAtTime(val, now, 0.02); break;
                    case 'distortion': distortion.curve = makeDistortionCurve(val); break;
                    case 'compressor': compressor.threshold.setTargetAtTime(-50 * (1 - val), now, 0.02); break;
                    case 'tremolo': tremoloGain.gain.setTargetAtTime(val * 0.8, now, 0.02); break;
                    case 'vibrato': vibratoGain.gain.setTargetAtTime(val * 50, now, 0.02); break;
                    case 'volume': if(isPlaying) masterGain.gain.setTargetAtTime(val, now, 0.02); break;
                }
            });
        });
        updateDisplays();
    }

    setupEventListeners();
    requestAnimationFrame(animationLoop);
});
</script>

</body>
</html>
