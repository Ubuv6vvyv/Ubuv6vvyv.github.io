<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360° Panoramic Straightener</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }
        .container { 
            max-width: 100vw; 
            padding: 10px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 10px;
            background: rgba(0,0,0,0.8);
        }
        .title { font-size: 18px; font-weight: 600; }
        .upload-btn {
            background: #007AFF;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 300px;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
            margin: 10px 0;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            touch-action: none;
        }
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.3;
        }
        .controls {
            padding: 20px 10px;
            background: rgba(20,20,20,0.9);
            border-radius: 8px;
            margin: 10px 0;
        }
        .control-group {
            margin-bottom: 25px;
        }
        .control-label {
            font-size: 16px;
            margin-bottom: 12px;
            display: block;
            font-weight: 500;
        }
        .slider-container {
            position: relative;
            height: 40px;
            background: #333;
            border-radius: 20px;
            margin: 10px 0;
        }
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 40px;
            background: transparent;
            outline: none;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 20px;
        }
        .slider::-webkit-slider-track {
            height: 40px;
            background: linear-gradient(90deg, #333, #555, #333);
            border-radius: 20px;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 36px;
            height: 36px;
            background: #007AFF;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 10px rgba(0,122,255,0.3);
        }
        .slider::-moz-range-track {
            height: 40px;
            background: linear-gradient(90deg, #333, #555, #333);
            border-radius: 20px;
            border: none;
        }
        .slider::-moz-range-thumb {
            width: 36px;
            height: 36px;
            background: #007AFF;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 10px rgba(0,122,255,0.3);
        }
        .value-display {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #aaa;
            pointer-events: none;
        }
        .reset-btn {
            background: #666;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .export-btn {
            background: #34C759;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin: 10px 5px;
        }
        .file-input { display: none; }

        #progress-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .progress-container {
            background: #2c2c2e;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .progress-label {
            font-size: 16px;
            margin-bottom: 15px;
        }
        .progress-bar-background {
            background: #444;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #007AFF;
            border-radius: 5px;
            transition: width 0.1s linear;
        }
        .progress-text {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }

        @media (max-width: 480px) {
            .canvas-container { height: 200px; }
            .controls { padding: 15px 5px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Straighten</div>
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Load Image</button>
        </div>
        
        <input type="file" id="fileInput" class="file-input" accept="image/*">
        
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
            <div class="grid-overlay">
                <svg width="100%" height="100%">
                    <defs>
                        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fff" stroke-width="0.5"/>
                        </pattern>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#grid)" />
                    <line x1="50%" y1="0" x2="50%" y2="100%" stroke="#007AFF" stroke-width="1"/>
                    <line x1="0" y1="50%" x2="100%" y2="50%" stroke="#007AFF" stroke-width="1"/>
                </svg>
            </div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label class="control-label">Horizontal</label>
                <div class="slider-container">
                    <input type="range" id="horizontalSlider" class="slider" min="-100" max="100" value="0">
                    <div class="value-display" id="horizontalValue">0</div>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Vertical</label>
                <div class="slider-container">
                    <input type="range" id="verticalSlider" class="slider" min="-100" max="100" value="0">
                    <div class="value-display" id="verticalValue">0</div>
                </div>
            </div>
            
            <div class="control-group">
                <label class="control-label">Pan / Center</label>
                <div class="slider-container">
                    <input type="range" id="panSlider" class="slider" min="-100" max="100" value="0">
                    <div class="value-display" id="panValue">0</div>
                </div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <button class="reset-btn" onclick="resetValues()">Reset</button>
                <button class="export-btn" onclick="exportImage()">Export</button>
            </div>
        </div>
    </div>

    <div id="progress-overlay" style="display: none;">
        <div class="progress-container">
            <div class="progress-label">Exporting High Quality Image...</div>
            <div class="progress-bar-background">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="progress-text" class="progress-text">0%</div>
        </div>
    </div>

    <script>
        let canvas, ctx, originalImage, originalImageData, fullQualityImage;
        let horizontalCorrection = 0, verticalCorrection = 0, panOffset = 0;
        let isProcessing = false;
        let processingQueue = null;
        
        function initCanvas() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            canvas.width = 800;
            canvas.height = 400;
        }
        
        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    fullQualityImage = img; // Store the original full-size image
                    
                    // Use a copy for the preview canvas to keep it fast
                    const previewImage = new Image();
                    previewImage.onload = () => {
                        originalImage = previewImage;
                        
                        // Resize for performance if too large
                        let newWidth = previewImage.width;
                        let newHeight = previewImage.height;
                        const maxSize = 1200; // Max size for the interactive preview
                        
                        if (newWidth > maxSize || newHeight > maxSize) {
                            const ratio = Math.min(maxSize / newWidth, maxSize / newHeight);
                            newWidth = Math.floor(newWidth * ratio);
                            newHeight = Math.floor(newHeight * ratio);
                        }
                        
                        canvas.width = newWidth;
                        canvas.height = newHeight;
                        
                        ctx.drawImage(previewImage, 0, 0, newWidth, newHeight);
                        originalImageData = ctx.getImageData(0, 0, newWidth, newHeight);
                        resetValues(); // Reset sliders for new image
                        processImage();
                    };
                    previewImage.src = img.src; // Create the preview copy
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        // Fast processing with reduced quality for real-time preview
        function processImageFast() {
            if (!originalImage || isProcessing) return;
            isProcessing = true;
            
            const width = canvas.width;
            const height = canvas.height;
            const scale = 0.5; // Process at half resolution for speed
            const fastWidth = Math.floor(width * scale);
            const fastHeight = Math.floor(height * scale);
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = fastWidth;
            tempCanvas.height = fastHeight;
            const tempCtx = tempCanvas.getContext('2d');
            
            const imageData = tempCtx.createImageData(fastWidth, fastHeight);
            const data = imageData.data;
            
            const scaledCanvas = document.createElement('canvas');
            scaledCanvas.width = fastWidth;
            scaledCanvas.height = fastHeight;
            const scaledCtx = scaledCanvas.getContext('2d');
            scaledCtx.drawImage(originalImage, 0, 0, fastWidth, fastHeight);
            const scaledData = scaledCtx.getImageData(0, 0, fastWidth, fastHeight).data;
            
            const hStrength = horizontalCorrection * 0.01;
            const vStrength = verticalCorrection * 0.01;
            const pixelShift = panOffset * 0.005 * fastWidth;
            
            const step = 2;
            
            for (let y = 0; y < fastHeight; y += step) {
                for (let x = 0; x < fastWidth; x += step) {
                    const normalizedX = (x / fastWidth) * 2 - 1;
                    const normalizedY = (y / fastHeight) * 2 - 1;
                    
                    let sourceX = x;
                    let sourceY = y;
                    
                    if (hStrength !== 0) {
                        const hRadius = normalizedX * normalizedX + normalizedY * normalizedY;
                        const hFactor = 1 + hStrength * hRadius;
                        sourceX = (normalizedX / hFactor + 1) * fastWidth * 0.5;
                    }
                    
                    if (vStrength !== 0) {
                        const vFactor = 1 + vStrength * normalizedY;
                        sourceY = ((normalizedY / vFactor) + 1) * fastHeight * 0.5;
                    }
                    
                    sourceX = ((sourceX + pixelShift) % fastWidth + fastWidth) % fastWidth;

                    sourceX = Math.max(0, Math.min(fastWidth - 1, Math.floor(sourceX)));
                    sourceY = Math.max(0, Math.min(fastHeight - 1, Math.floor(sourceY)));
                    
                    const sourceIdx = (sourceY * fastWidth + sourceX) * 4;
                    
                    for (let dy = 0; dy < step && y + dy < fastHeight; dy++) {
                        for (let dx = 0; dx < step && x + dx < fastWidth; dx++) {
                            const idx = ((y + dy) * fastWidth + (x + dx)) * 4;
                            data[idx] = scaledData[sourceIdx];
                            data[idx + 1] = scaledData[sourceIdx + 1];
                            data[idx + 2] = scaledData[sourceIdx + 2];
                            data[idx + 3] = 255;
                        }
                    }
                }
            }
            
            tempCtx.putImageData(imageData, 0, 0);
            
            ctx.clearRect(0, 0, width, height);
            ctx.drawImage(tempCanvas, 0, 0, width, height);
            
            isProcessing = false;
        }
        
        // High quality processing for final result with enhanced interpolation
        function processImage() {
            if (!originalImage) return;
            
            const width = canvas.width;
            const height = canvas.height;
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;
            const originalData = originalImageData.data;
            
            const hStrength = horizontalCorrection * 0.01;
            const vStrength = verticalCorrection * 0.01;
            const pixelShift = panOffset * 0.005 * width;
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const normalizedX = (x / width) * 2 - 1;
                    const normalizedY = (y / height) * 2 - 1;
                    
                    let sourceX = x;
                    let sourceY = y;
                    
                    if (hStrength !== 0) {
                        const hRadius = Math.sqrt(normalizedX * normalizedX + normalizedY * normalizedY);
                        if (hRadius > 0) {
                            const hFactor = 1 + hStrength * hRadius * hRadius * 0.8;
                            sourceX = (normalizedX / hFactor + 1) * width * 0.5;
                        }
                    }
                    
                    if (vStrength !== 0) {
                        const vFactor = 1 + vStrength * normalizedY * 0.6;
                        if (Math.abs(vFactor) > 0.1) {
                            sourceY = ((normalizedY / vFactor) + 1) * height * 0.5;
                        }
                    }

                    sourceX = ((sourceX + pixelShift) % width + width) % width;
                    
                    sourceX = Math.max(1, Math.min(width - 2, sourceX));
                    sourceY = Math.max(1, Math.min(height - 2, sourceY));
                    
                    const x1 = Math.floor(sourceX);
                    const y1 = Math.floor(sourceY);
                    
                    const fx = sourceX - x1;
                    const fy = sourceY - y1;
                    
                    const idx = (y * width + x) * 4;
                    
                    for (let c = 0; c < 3; c++) {
                        const p1 = originalData[(y1 * width + x1) * 4 + c];
                        const p2 = originalData[(y1 * width + (x1 + 1)) * 4 + c];
                        const p3 = originalData[((y1 + 1) * width + x1) * 4 + c];
                        const p4 = originalData[((y1 + 1) * width + (x1 + 1)) * 4 + c];
                        
                        const i1 = p1 * (1 - fx) + p2 * fx;
                        const i2 = p3 * (1 - fx) + p4 * fx;
                        
                        data[idx + c] = i1 * (1 - fy) + i2 * fy;
                    }
                    data[idx + 3] = 255;
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        // High quality, asynchronous processing for export with progress updates
        function processImageForExport(onComplete) {
            if (!fullQualityImage) return;

            const width = fullQualityImage.width;
            const height = fullQualityImage.height;

            const exportCanvas = new OffscreenCanvas(width, height);
            const exportCtx = exportCanvas.getContext('2d');
            exportCtx.drawImage(fullQualityImage, 0, 0);

            const originalData = exportCtx.getImageData(0, 0, width, height).data;
            const imageData = exportCtx.createImageData(width, height);
            const data = imageData.data;

            const hStrength = horizontalCorrection * 0.01;
            const vStrength = verticalCorrection * 0.01;
            const pixelShift = panOffset * 0.005 * width;
            
            let y = 0;
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            function processChunk() {
                const chunkSize = 10; // Process 10 rows at a time to keep UI responsive
                const endY = Math.min(y + chunkSize, height);

                for (let currentY = y; currentY < endY; currentY++) {
                    for (let x = 0; x < width; x++) {
                        const normalizedX = (x / width) * 2 - 1;
                        const normalizedY = (currentY / height) * 2 - 1;
                        
                        let sourceX = x;
                        let sourceY = currentY;

                        if (hStrength !== 0) {
                            const hRadius = Math.sqrt(normalizedX * normalizedX + normalizedY * normalizedY);
                            if (hRadius > 0) {
                                const hFactor = 1 + hStrength * hRadius * hRadius * 0.8;
                                sourceX = (normalizedX / hFactor + 1) * width * 0.5;
                            }
                        }

                        if (vStrength !== 0) {
                            const vFactor = 1 + vStrength * normalizedY * 0.6;
                            if (Math.abs(vFactor) > 0.1) {
                                sourceY = ((normalizedY / vFactor) + 1) * height * 0.5;
                            }
                        }
                        
                        sourceX = ((sourceX + pixelShift) % width + width) % width;

                        sourceX = Math.max(1, Math.min(width - 2, sourceX));
                        sourceY = Math.max(1, Math.min(height - 2, sourceY));

                        const x1 = Math.floor(sourceX);
                        const y1 = Math.floor(sourceY);
                        const fx = sourceX - x1;
                        const fy = sourceY - y1;
                        const idx = (currentY * width + x) * 4;

                        for (let c = 0; c < 3; c++) {
                            const p1 = originalData[(y1 * width + x1) * 4 + c];
                            const p2 = originalData[(y1 * width + (x1 + 1)) * 4 + c];
                            const p3 = originalData[((y1 + 1) * width + x1) * 4 + c];
                            const p4 = originalData[((y1 + 1) * width + (x1 + 1)) * 4 + c];
                            
                            const i1 = p1 * (1 - fx) + p2 * fx;
                            const i2 = p3 * (1 - fx) + p4 * fx;
                            data[idx + c] = i1 * (1 - fy) + i2 * fy;
                        }
                        data[idx + 3] = 255;
                    }
                }
                
                y = endY;
                const progress = Math.round((y / height) * 100);
                progressBar.style.width = progress + '%';
                progressText.textContent = progress + '%';

                if (y < height) {
                    requestAnimationFrame(processChunk);
                } else {
                    exportCtx.putImageData(imageData, 0, 0);
                    onComplete(exportCanvas);
                }
            }
            
            processChunk(); // Start the processing
        }
        
        // Debounced processing for slider changes
        function updateSliders() {
            horizontalCorrection = parseInt(document.getElementById('horizontalSlider').value);
            verticalCorrection = parseInt(document.getElementById('verticalSlider').value);
            panOffset = parseInt(document.getElementById('panSlider').value);
            
            document.getElementById('horizontalValue').textContent = horizontalCorrection;
            document.getElementById('verticalValue').textContent = verticalCorrection;
            document.getElementById('panValue').textContent = panOffset;
            
            if (processingQueue) {
                clearTimeout(processingQueue);
            }
            
            processImageFast();
            
            processingQueue = setTimeout(() => {
                processImage();
            }, 150);
        }
        
        function resetValues() {
            document.getElementById('horizontalSlider').value = 0;
            document.getElementById('verticalSlider').value = 0;
            document.getElementById('panSlider').value = 0;
            horizontalCorrection = 0;
            verticalCorrection = 0;
            panOffset = 0;
            updateSliders();
        }
        
        function exportImage() {
            if (!fullQualityImage) {
                alert("Please load an image first.");
                return;
            }

            const overlay = document.getElementById('progress-overlay');
            overlay.style.display = 'flex';

            processImageForExport((finalCanvas) => {
                // The onComplete callback
                finalCanvas.convertToBlob({ type: 'image/jpg' }).then(blob => {
                    const link = document.createElement('a');
                    link.download = 'straightened-panorama.jpg';
                    link.href = URL.createObjectURL(blob);
                    link.click();
                    URL.revokeObjectURL(link.href);
                    
                    overlay.style.display = 'none';
                });
            });
        }
        
        // Event listeners
        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files[0]) loadImage(e.target.files[0]);
        });
        
        ['horizontalSlider', 'verticalSlider', 'panSlider'].forEach(id => {
            const slider = document.getElementById(id);
            slider.addEventListener('input', updateSliders);
            slider.addEventListener('change', updateSliders);
            
            let touchStartValue;
            slider.addEventListener('touchstart', (e) => {
                touchStartValue = slider.value;
                slider.style.transition = 'none';
            });
            
            slider.addEventListener('touchend', () => {
                slider.style.transition = '';
                if (touchStartValue !== slider.value) {
                    updateSliders();
                }
            });
        });
        
        // Initialize
        initCanvas();
        
        // Load demo image
        const demoSvg = `<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#87CEEB"/>
                    <stop offset="100%" style="stop-color:#98FB98"/>
                </linearGradient>
                <radialGradient id="sun" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:#FFD700"/>
                    <stop offset="100%" style="stop-color:#FFA500"/>
                </radialGradient>
            </defs>
            <rect width="800" height="200" fill="url(#sky)"/>
            <rect width="800" height="200" y="200" fill="#8B7355"/>
            <circle cx="200" cy="100" r="30" fill="url(#sun)"/>
            <rect x="300" y="120" width="60" height="80" fill="#8B4513"/>
            <polygon points="300,120 330,80 360,120" fill="#228B22"/>
            <rect x="500" y="140" width="80" height="60" fill="#DC143C"/>
            <polygon points="500,140 540,100 580,140" fill="#2F4F4F"/>
            <rect x="600" y="130" width="40" height="70" fill="#654321"/>
            <polygon points="600,130 620,100 640,130" fill="#0F5132"/>
            <ellipse cx="100" cy="300" rx="40" ry="15" fill="#696969"/>
            <ellipse cx="700" cy="320" rx="35" ry="12" fill="#696969"/>
            <text x="400" y="350" text-anchor="middle" fill="white" font-size="18" font-family="Arial">Demo 360° Panorama - Load your image to start</text>
        </svg>`;
        
        const img = new Image();
        img.onload = () => {
            fullQualityImage = img;
            originalImage = img;
            canvas.width = 800;
            canvas.height = 400;
            ctx.drawImage(img, 0, 0);
            originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        };
        img.src = 'data:image/svg+xml,' + encodeURIComponent(demoSvg);
    </script>
</body>
</html>
