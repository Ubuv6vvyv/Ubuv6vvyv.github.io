<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXTREME CHAMPIONSHIP GIF ENGINE v4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap');
        
        body {
            background-color: #030303;
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }
        .extreme-font { font-family: 'Archivo Black', sans-serif; }
        
        .control-card {
            background: linear-gradient(145deg, rgba(30, 30, 30, 0.9), rgba(10, 10, 10, 0.9));
            border-radius: 16px;
            padding: 1.25rem;
            border: 1px solid rgba(255, 0, 0, 0.2);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        input[type="range"] {
            accent-color: #ff0000;
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 10px;
            cursor: pointer;
        }

        input[type="text"] {
            background: #111;
            border: 1px solid #444;
            color: #fff;
            padding: 0.75rem;
            border-radius: 8px;
            width: 100%;
            font-family: 'Archivo Black', sans-serif;
            text-transform: uppercase;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        canvas {
            image-rendering: pixelated;
            max-width: 100%;
            height: auto !important;
            border-radius: 8px;
        }

        .btn-primary {
            background: linear-gradient(to right, #ff0000, #990000);
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.3);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .btn-primary:active { transform: scale(0.92); }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ff0000; border-radius: 10px; }

        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 0, 0.5); }
            50% { box-shadow: 0 0 25px rgba(255, 0, 0, 0.8); }
        }
        .rendering-active { animation: pulse-red 1.5s infinite; }
        
        #msgBox {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body class="p-4 min-h-screen flex flex-col items-center custom-scrollbar">

    <div id="msgBox"></div>

    <header class="w-full max-w-md mb-6 text-center">
        <div class="inline-block bg-red-600 px-2 py-0.5 mb-1 text-[10px] font-black tracking-widest uppercase">Level 3 Extreme</div>
        <h1 class="text-4xl extreme-font text-white leading-none tracking-tighter uppercase">Gif Engine</h1>
        <p class="text-[10px] text-gray-500 mt-2 font-mono uppercase tracking-widest">v4.0 // Optical & Text Edition</p>
    </header>

    <main class="w-full max-w-md space-y-4">
        
        <!-- Viewport Container -->
        <div class="relative group bg-zinc-900 rounded-xl overflow-hidden border-2 border-zinc-800 transition-all duration-300">
            <div id="canvasWrapper" class="flex justify-center p-2 bg-black">
                <canvas id="previewCanvas"></canvas>
            </div>
            
            <!-- Render Progress Overlay -->
            <div id="renderOverlay" class="hidden absolute inset-0 bg-black/95 backdrop-blur-sm flex flex-col items-center justify-center z-50">
                <div class="relative w-24 h-24 mb-4">
                    <svg class="w-full h-full transform -rotate-90">
                        <circle cx="48" cy="48" r="40" stroke="currentColor" stroke-width="8" fill="transparent" class="text-zinc-800" />
                        <circle id="progressCircle" cx="48" cy="48" r="40" stroke="currentColor" stroke-width="8" fill="transparent" stroke-dasharray="251.2" stroke-dashoffset="251.2" class="text-red-600 transition-all duration-300" />
                    </svg>
                    <div id="renderProgress" class="absolute inset-0 flex items-center justify-center text-xl font-black extreme-font">0%</div>
                </div>
                <p id="statusText" class="text-xs font-bold text-red-500 uppercase tracking-[0.3em]">Processing Frames</p>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="togglePreview()" id="playBtn" class="btn-primary py-4 rounded-xl text-white font-black extreme-font uppercase text-sm tracking-widest">Start Live</button>
            <button onclick="generateGIF()" class="bg-white hover:bg-zinc-200 py-4 rounded-xl text-black font-black extreme-font uppercase text-sm tracking-widest transition-colors">Render GIF</button>
        </div>

        <!-- Master Controls -->
        <div class="space-y-4">
            <div class="control-card">
                <label class="block text-[10px] font-bold mb-2 uppercase tracking-widest text-zinc-500">Select Preset Routine</label>
                <select id="presetSelect" class="w-full bg-black text-white border border-zinc-800 rounded-lg p-3 focus:border-red-600 outline-none text-sm font-bold appearance-none mb-3">
                    <optgroup label="Text Engines">
                        <option value="text" selected>Custom Word Burst</option>
                    </optgroup>
                    <optgroup label="Optical Illusions">
                        <option value="ouchi">Ouchi Illusion (Relative Motion)</option>
                        <option value="hypno_rings">Hypnotic Expansion</option>
                        <option value="pinwheel">Peripheral Pinwheel</option>
                        <option value="droste">Droste Void Zoom</option>
                        <option value="peripheral">Fraser-Wilcox Grid</option>
                    </optgroup>
                    <optgroup label="Classic Routines">
                        <option value="quad">Quadrant Strobe</option>
                        <option value="split">Split Alternate</option>
                        <option value="checker">Checker Insanity</option>
                        <option value="rotate">Rotational Flash</option>
                        <option value="slice">Vertical Slice</option>
                        <option value="rgb">RGB Channel Offset</option>
                        <option value="desync">Phase Desync Quad</option>
                        <option value="radial">Radial Pulse</option>
                        <option value="invert">Temporal Inversion</option>
                    </optgroup>
                    <optgroup label="Extreme Additions">
                        <option value="scanline">Interlaced Static</option>
                        <option value="glitch">Chunk Displacement</option>
                        <option value="spiral">Hypno Spiral</option>
                        <option value="tunnel">Infinite Void</option>
                        <option value="noise">Gaussian Filth</option>
                        <option value="mosaic">Macro Pixel Strobe</option>
                        <option value="starfield">Warp Velocity</option>
                        <option value="plasma">Heat Map Cycle</option>
                        <option value="wave">Sinusoidal Warp</option>
                        <option value="orbit">Solar Flare</option>
                    </optgroup>
                </select>

                <!-- Conditionally Visible Text Input -->
                <div id="textInputContainer" class="animate-in fade-in slide-in-from-top-2 duration-300">
                    <label class="block text-[10px] font-bold mb-2 uppercase tracking-widest text-zinc-500">Words (Comma Separated)</label>
                    <input type="text" id="customTextInput" value="VOID, MAX, FLASH, GO, KILL, LIVE" placeholder="ENTER, WORDS, HERE">
                </div>
            </div>

            <div class="control-card grid grid-cols-1 gap-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <div class="flex justify-between items-end">
                            <label class="text-[10px] font-bold uppercase text-zinc-500 tracking-widest">Resolution</label>
                            <span id="resVal" class="text-sm font-black text-red-600 leading-none">400px</span>
                        </div>
                        <input type="range" id="resSlider" min="100" max="600" step="10" value="400">
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between items-end">
                            <label class="text-[10px] font-bold uppercase text-zinc-500 tracking-widest">Complexity</label>
                            <span id="complexityVal" class="text-sm font-black text-red-600 leading-none">5</span>
                        </div>
                        <input type="range" id="complexitySlider" min="1" max="20" value="5">
                    </div>
                </div>
                
                <div class="space-y-2">
                    <div class="flex justify-between items-end">
                        <label class="text-[10px] font-bold uppercase text-zinc-500 tracking-widest">Intensity (Speed)</label>
                        <span id="intensityVal" class="text-sm font-black text-red-600 leading-none">10</span>
                    </div>
                    <input type="range" id="intensitySlider" min="1" max="50" value="10">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <div class="flex justify-between items-end">
                            <label class="text-[10px] font-bold uppercase text-zinc-500 tracking-widest">FPS</label>
                            <span id="fpsVal" class="text-sm font-black text-red-600 leading-none">20</span>
                        </div>
                        <input type="range" id="fpsSlider" min="5" max="60" value="20">
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between items-end">
                            <label class="text-[10px] font-bold uppercase text-zinc-500 tracking-widest">Frames</label>
                            <span id="frameVal" class="text-sm font-black text-red-600 leading-none">30</span>
                        </div>
                        <input type="range" id="frameSlider" min="10" max="150" value="30">
                    </div>
                </div>
            </div>
        </div>

        <div id="resultContainer" class="flex flex-col items-center gap-4 pb-12"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>

    <script>
        const canvas = document.getElementById("previewCanvas");
        const ctx = canvas.getContext("2d", { alpha: false });
        const playBtn = document.getElementById("playBtn");
        const renderOverlay = document.getElementById("renderOverlay");
        const progressEl = document.getElementById("renderProgress");
        const circleEl = document.getElementById("progressCircle");
        const statusText = document.getElementById("statusText");
        const textInputContainer = document.getElementById("textInputContainer");
        const customTextInput = document.getElementById("customTextInput");

        let animationId;
        let tick = 0;
        let isRunning = false;

        const config = {
            res: document.getElementById("resSlider"),
            fps: document.getElementById("fpsSlider"),
            frames: document.getElementById("frameSlider"),
            intensity: document.getElementById("intensitySlider"),
            complexity: document.getElementById("complexitySlider"),
            preset: document.getElementById("presetSelect")
        };

        function showMessage(text, color = "bg-red-600") {
            const el = document.createElement("div");
            el.className = `${color} text-white px-4 py-2 rounded shadow-lg mb-2 text-xs font-bold uppercase tracking-widest transition-opacity duration-1000`;
            el.innerText = text;
            document.getElementById("msgBox").appendChild(el);
            setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 1000); }, 3000);
        }

        function updateCanvasSize() {
            const size = parseInt(config.res.value);
            canvas.width = size;
            canvas.height = size;
            document.getElementById("resVal").innerText = `${size}px`;
            if (!isRunning) drawFrame();
        }

        function handlePresetChange() {
            textInputContainer.style.display = (config.preset.value === "text") ? "block" : "none";
            if (!isRunning) drawFrame();
        }

        config.res.oninput = updateCanvasSize;
        config.fps.oninput = () => document.getElementById("fpsVal").innerText = config.fps.value;
        config.frames.oninput = () => document.getElementById("frameVal").innerText = config.frames.value;
        config.intensity.oninput = () => document.getElementById("intensityVal").innerText = config.intensity.value;
        config.complexity.oninput = () => document.getElementById("complexityVal").innerText = config.complexity.value;
        config.preset.onchange = handlePresetChange;
        customTextInput.oninput = () => { if (!isRunning) drawFrame(); };

        function togglePreview() { isRunning ? stopPreview() : startPreview(); }
        function startPreview() { isRunning = true; playBtn.innerText = "Stop Live"; playBtn.classList.replace("btn-primary", "bg-zinc-700"); animate(); }
        function stopPreview() { isRunning = false; playBtn.innerText = "Start Live"; playBtn.classList.replace("bg-zinc-700", "btn-primary"); cancelAnimationFrame(animationId); }

        function animate() {
            if (!isRunning) return;
            drawFrame();
            tick++;
            animationId = requestAnimationFrame(animate);
        }

        function drawFrame() {
            const preset = config.preset.value;
            const w = canvas.width;
            const h = canvas.height;
            const intensity = parseInt(config.intensity.value);
            const complexity = parseInt(config.complexity.value);
            const speed = tick * (intensity / 10);

            ctx.fillStyle = "#000";
            ctx.fillRect(0,0,w,h);

            switch (preset) {
                // --- TEXT ENGINE ---
                case "text": {
                    const rawText = customTextInput.value || "VOID";
                    const words = rawText.split(',').map(w => w.trim().toUpperCase()).filter(w => w.length > 0);
                    if(words.length === 0) words.push("VOID");
                    const word = words[Math.floor(speed) % words.length];

                    const toggle = Math.floor(speed * 2) % 2 === 0;
                    ctx.fillStyle = toggle ? "#000" : "#fff"; 
                    ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = toggle ? "#fff" : "#000";

                    // Dynamic Math Scaling
                    let baseSize = 100;
                    ctx.font = `900 ${baseSize}px Archivo Black, Impact, sans-serif`;
                    let metrics = ctx.measureText(word);
                    let textWidth = metrics.width;
                    let textHeight = baseSize * 0.75; // Approximation for uppercase sans-serif

                    // Scale to fit 90% of canvas
                    let scaleX = (w * 0.9) / textWidth;
                    let scaleY = (h * 0.9) / textHeight;
                    let finalScale = Math.min(scaleX, scaleY);
                    let finalSize = baseSize * finalScale;

                    ctx.font = `900 ${finalSize}px Archivo Black, Impact, sans-serif`;
                    ctx.textAlign = "center"; 
                    ctx.textBaseline = "middle";
                    ctx.fillText(word, w/2, h/2);

                    // Complexity adds glitch/afterimage echoes
                    if(complexity > 5) {
                        ctx.globalAlpha = 0.5;
                        const offset = complexity * 2;
                        ctx.fillStyle = "#f00";
                        ctx.fillText(word, w/2 - offset, h/2);
                        ctx.fillStyle = "#0ff";
                        ctx.fillText(word, w/2 + offset, h/2);
                        ctx.globalAlpha = 1.0;
                    }
                    break;
                }

                // --- OPTICAL ILLUSIONS ---
                case "ouchi": {
                    // Ouchi illusion: Vertical background stripes, moving horizontal center stripes
                    const stripeW = Math.max(2, 40 / complexity);
                    
                    // Background
                    ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = "#fff";
                    for(let x=0; x<w; x+=stripeW*2) { ctx.fillRect(x,0,stripeW,h); }

                    // Foreground Circle (Relative Motion)
                    const cSize = w * 0.6;
                    // Motion is smooth, sine-based relative to speed
                    const driftX = Math.sin(speed * 0.1) * (complexity * 2);
                    const driftY = Math.cos(speed * 0.1) * (complexity * 2);
                    
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(w/2 + driftX, h/2 + driftY, cSize/2, 0, Math.PI*2);
                    ctx.clip();
                    
                    ctx.fillStyle = "#000"; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = "#fff";
                    for(let y=0; y<h; y+=stripeW*2) { ctx.fillRect(0,y,w,stripeW); }
                    ctx.restore();
                    break;
                }

                case "hypno_rings": {
                    // Smooth expanding rings (hypnotic)
                    const ringW = Math.max(5, w / (complexity * 2));
                    const maxR = w * 1.5;
                    // Continuous outward offset
                    const offset = (speed * ringW * 0.2) % (ringW * 2);
                    
                    for(let r=maxR; r>0; r-=ringW) {
                        ctx.beginPath(); 
                        ctx.arc(w/2, h/2, Math.max(0, r + offset), 0, Math.PI*2);
                        // Toggle color
                        ctx.fillStyle = Math.floor(r/ringW) % 2 === 0 ? "#fff" : "#000";
                        ctx.fill();
                    }
                    break;
                }

                case "pinwheel": {
                    // Peripheral spinning wheel
                    ctx.save();
                    ctx.translate(w/2, h/2);
                    ctx.rotate(speed * 0.05);
                    const slices = complexity * 4;
                    const angle = (Math.PI * 2) / slices;
                    
                    for(let i=0; i<slices; i++) {
                        ctx.beginPath();
                        ctx.moveTo(0,0);
                        ctx.arc(0, 0, w, i*angle, (i+1)*angle);
                        ctx.fillStyle = (i % 2 === 0) ? "#fff" : "#000";
                        ctx.fill();
                    }
                    ctx.restore();
                    break;
                }

                case "droste": {
                    // Infinite zooming nested squares
                    ctx.save();
                    ctx.translate(w/2, h/2);
                    const maxS = w * 2.5;
                    const count = complexity * 2;
                    
                    for(let i=count; i>0; i--) {
                        // Progress 0.0 -> 1.0 driving scale
                        let prog = ((i / count) + (speed * 0.02)) % 1.0;
                        let size = maxS * Math.pow(prog, 2); // Squared for smooth zoom perception
                        
                        ctx.rotate(speed * 0.01 * (i % 2 === 0 ? 1 : -1));
                        ctx.fillStyle = (i % 2 === 0) ? "#fff" : "#000";
                        ctx.fillRect(-size/2, -size/2, size, size);
                    }
                    ctx.restore();
                    break;
                }

                case "peripheral": {
                    // Fraser-Wilcox style high frequency alternating grid
                    const cols = Math.max(4, complexity);
                    const size = w/cols;
                    
                    for(let x=0; x<cols; x++) {
                        for(let y=0; y<cols; y++) {
                            const phase = (x + y) * 0.5 + speed * 0.2;
                            // Background patch oscillating luminance
                            const lum1 = Math.sin(phase) * 127 + 128;
                            ctx.fillStyle = `rgb(${lum1},${lum1},${lum1})`;
                            ctx.fillRect(x*size, y*size, size, size);
                            
                            // Inner high-contrast patch opposite phase
                            const lum2 = Math.cos(phase) * 127 + 128;
                            ctx.fillStyle = `rgb(${lum2},${lum2},${lum2})`;
                            ctx.fillRect(x*size + size*0.25, y*size + size*0.25, size*0.5, size*0.5);
                        }
                    }
                    break;
                }

                // --- CLASSIC PRESETS ---
                case "quad": {
                    const divisions = complexity > 5 ? 4 : 2;
                    const sw = w / divisions, sh = h / divisions;
                    const toggle = Math.floor(speed) % 2 === 0;
                    for(let x=0; x<divisions; x++) {
                        for(let y=0; y<divisions; y++) {
                            ctx.fillStyle = ((x+y)%2 === 0 === toggle) ? "#fff" : "#000";
                            ctx.fillRect(x*sw, y*sh, sw, sh);
                        }
                    }
                    break;
                }
                case "split": {
                    const toggle = Math.floor(speed) % 2 === 0;
                    const count = complexity;
                    const sw = w / count;
                    for(let i=0; i<count; i++) {
                        ctx.fillStyle = (i % 2 === 0 === toggle) ? "#f00" : "#00f";
                        ctx.fillRect(i*sw, 0, sw, h);
                    }
                    break;
                }
                case "checker": {
                    const size = Math.max(4, 100 / complexity);
                    const toggle = Math.floor(speed) % 2 === 0;
                    for (let x = 0; x < w; x += size) {
                        for (let y = 0; y < h; y += size) {
                            if (((Math.floor(x/size) + Math.floor(y/size)) % 2 === 0) === toggle) {
                                ctx.fillStyle = "#fff";
                                ctx.fillRect(x,y,size,size);
                            }
                        }
                    }
                    break;
                }
                case "rotate": {
                    ctx.save(); ctx.translate(w/2, h/2);
                    for(let i=0; i<complexity; i++) {
                        ctx.rotate(speed * 0.1 * (i+1));
                        ctx.strokeStyle = (Math.floor(speed + i) % 2 === 0) ? "#fff" : "#f00";
                        ctx.lineWidth = complexity;
                        ctx.strokeRect(-w/(4+i), -h/(4+i), w/(2+i), h/(2+i));
                    }
                    ctx.restore();
                    break;
                }
                case "slice": {
                    const slices = Math.max(2, complexity * 2);
                    const sw = w / slices;
                    for (let i = 0; i < slices; i++) {
                        ctx.fillStyle = (Math.floor(speed + i) % 2 === 0) ? "#fff" : "#000";
                        ctx.fillRect(i * sw, 0, sw, h);
                    }
                    break;
                }
                case "rgb": {
                    ctx.globalCompositeOperation = "lighter";
                    const osc = Math.sin(speed * 0.5) * (complexity * 2);
                    ctx.fillStyle = "#f00"; ctx.fillRect(osc, 0, w, h);
                    ctx.fillStyle = "#0f0"; ctx.fillRect(-osc, osc, w, h);
                    ctx.fillStyle = "#00f"; ctx.fillRect(0, -osc, w, h);
                    ctx.globalCompositeOperation = "source-over";
                    break;
                }
                case "desync": {
                    const grid = complexity > 10 ? 4 : 2;
                    const s = w/grid;
                    for (let i = 0; i < grid*grid; i++) {
                        ctx.fillStyle = (Math.floor(speed + (i * 0.2)) % 2 === 0) ? "#fff" : "#000";
                        ctx.fillRect((i%grid)*s, Math.floor(i/grid)*s, s, s);
                    }
                    break;
                }
                case "radial": {
                    for(let i=complexity; i>0; i--) {
                        const r = (i/complexity) * (w * 0.8) + (Math.sin(speed)*20);
                        ctx.fillStyle = (Math.floor(speed + i) % 2 === 0) ? "#fff" : "#000";
                        ctx.beginPath(); ctx.arc(w/2, h/2, r, 0, Math.PI*2); ctx.fill();
                    }
                    break;
                }
                case "invert": {
                    const toggle = Math.floor(speed) % 2 === 0;
                    for(let i=0; i<complexity; i++) {
                        const s = w - (i * (w/complexity));
                        ctx.fillStyle = ((i % 2 === 0) === toggle) ? "#fff" : "#000";
                        ctx.fillRect(w/2-s/2, h/2-s/2, s, s);
                    }
                    break;
                }
                case "scanline": {
                    const lineH = Math.max(1, 40 / complexity);
                    for(let y=0; y<h; y+=lineH) {
                        ctx.fillStyle = (Math.floor(y/lineH + speed) % 2 === 0) ? "#fff" : "#000";
                        ctx.fillRect(0, y, w, lineH);
                    }
                    break;
                }
                case "glitch": {
                    ctx.fillStyle = (Math.floor(speed) % 2 === 0) ? "#fff" : "#000"; ctx.fillRect(0,0,w,h);
                    for(let i=0; i<complexity*2; i++) {
                        ctx.fillStyle = (i % 2 === 0) ? "#f00" : "#0ff";
                        ctx.fillRect(Math.random()*w, Math.random()*h, Math.random()*w/2, Math.random()*20);
                    }
                    break;
                }
                case "spiral": {
                    ctx.save(); ctx.translate(w/2, h/2);
                    const points = complexity * 5;
                    for(let i=0; i<points; i++) {
                        ctx.rotate(speed * 0.05);
                        ctx.fillStyle = (i % 2 === 0) ? "#fff" : "#000";
                        ctx.beginPath(); ctx.arc(0, 0, (points-i)*(w/points), 0, Math.PI*2); ctx.fill();
                    }
                    ctx.restore();
                    break;
                }
                case "tunnel": {
                    const count = complexity * 2;
                    const toggle = Math.floor(speed) % 2 === 0;
                    for(let i=count; i>0; i--) {
                        const s = (i/count) * w + (Math.sin(speed)*20);
                        ctx.fillStyle = (i % 2 === (toggle ? 0 : 1)) ? "#fff" : "#000";
                        ctx.fillRect(w/2 - s/2, h/2 - s/2, s, s);
                    }
                    break;
                }
                case "noise": {
                    const grain = Math.max(1, Math.floor(10 / (complexity/2)));
                    const toggle = Math.floor(speed) % 2 === 0;
                    for(let x=0; x<w; x+=grain) {
                        for(let y=0; y<h; y+=grain) {
                            if(Math.random() > (toggle ? 0.3 : 0.7)) { ctx.fillStyle="#fff"; ctx.fillRect(x,y,grain,grain); }
                        }
                    }
                    break;
                }
                case "mosaic": {
                    const mSize = Math.max(5, w / (complexity + 2));
                    for(let x=0; x<w; x+=mSize) {
                        for(let y=0; y<h; y+=mSize) {
                            ctx.fillStyle = Math.random() > 0.5 ? "#fff" : "#000";
                            ctx.fillRect(x,y,mSize,mSize);
                        }
                    }
                    break;
                }
                case "starfield": {
                    const toggle = Math.floor(speed) % 2 === 0;
                    ctx.fillStyle = toggle ? "#111" : "#000"; ctx.fillRect(0,0,w,h);
                    ctx.fillStyle = "#fff";
                    for(let i=0; i<complexity*10; i++) {
                        ctx.fillRect((Math.sin(i)*w + speed*100)%w, (Math.cos(i)*h + h)%h, 2 + complexity/5, 2);
                    }
                    break;
                }
                case "plasma": {
                    for(let x=0; x<w; x+=10) {
                        const val = Math.sin(x/50 * (complexity/2) + speed) * 127 + 128;
                        ctx.fillStyle = `rgb(${val}, ${255-val}, ${Math.sin(speed)*255})`;
                        ctx.fillRect(x, 0, 10, h);
                    }
                    break;
                }
                case "wave": {
                    const amp = complexity * 4;
                    ctx.fillStyle = "#fff";
                    for(let y=0; y<h; y+=4) {
                        const xOff = Math.sin(y * 0.02 * (complexity/5) + speed) * amp;
                        ctx.fillRect(w/2 + xOff - 10, y, 20, 4);
                        ctx.fillRect(w/2 - xOff - 10, y, 20, 4);
                    }
                    break;
                }
                case "orbit": {
                    const toggle = Math.floor(speed) % 2 === 0;
                    for(let i=0; i<complexity; i++) {
                        const angle = (speed + (i * Math.PI * 2 / complexity));
                        const dist = w/4 + (Math.sin(speed)*20);
                        ctx.fillStyle = (i % 2 === 0) ? (toggle ? "#ff0" : "#f00") : (toggle ? "#0ff" : "#fff");
                        ctx.beginPath(); ctx.arc(w/2 + Math.cos(angle)*dist, h/2 + Math.sin(angle)*dist, w/12, 0, Math.PI*2); ctx.fill();
                    }
                    break;
                }
            }
        }

        async function generateGIF() {
            stopPreview();
            renderOverlay.classList.remove("hidden");
            renderOverlay.classList.add("rendering-active");
            statusText.innerText = "Initializing Engine";
            updateProgressUI(0);

            const fps = parseInt(config.fps.value);
            const frames = parseInt(config.frames.value);
            const w = canvas.width;
            const h = canvas.height;

            let workerBlobUrl = '';
            try {
                const response = await fetch('https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js');
                const scriptText = await response.text();
                const blob = new Blob([scriptText], { type: 'application/javascript' });
                workerBlobUrl = URL.createObjectURL(blob);
            } catch (e) {
                console.error("Worker fetch failed, falling back to direct URL", e);
                workerBlobUrl = 'https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.worker.js';
            }

            const gif = new GIF({
                workers: 2, 
                quality: 10,
                width: w,
                height: h,
                workerScript: workerBlobUrl
            });

            tick = 0;
            statusText.innerText = "Capturing Frames";
            for (let i = 0; i < frames; i++) {
                drawFrame();
                gif.addFrame(ctx, { copy: true, delay: 1000 / fps });
                tick++;
                updateProgressUI(Math.round(((i + 1) / frames) * 50));
                if (i % 10 === 0) await new Promise(r => requestAnimationFrame(r));
            }

            statusText.innerText = "Encoding Final GIF";
            
            gif.on('progress', (p) => {
                updateProgressUI(50 + Math.round(p * 50));
            });

            gif.on('finished', (blob) => {
                renderOverlay.classList.add("hidden");
                renderOverlay.classList.remove("rendering-active");
                if (workerBlobUrl.startsWith('blob:')) URL.revokeObjectURL(workerBlobUrl);
                
                const url = URL.createObjectURL(blob);
                const wrapper = document.createElement("div");
                wrapper.className = "control-card w-full flex flex-col items-center animate-in fade-in zoom-in duration-300";
                wrapper.innerHTML = `
                    <div class="w-full flex justify-between items-center mb-3">
                        <span class="text-[10px] font-black text-red-600 uppercase tracking-widest">Successful Render</span>
                        <span class="text-[10px] text-zinc-600 font-mono">${(blob.size / 1024 / 1024).toFixed(2)} MB</span>
                    </div>
                    <img src="${url}" class="rounded-lg shadow-2xl border border-zinc-800" />
                    <div class="grid grid-cols-2 gap-2 w-full mt-4">
                        <a href="${url}" download="extreme_v4_${Date.now()}.gif" class="bg-red-600 text-white py-3 rounded-lg text-[10px] font-black uppercase text-center tracking-widest hover:bg-red-500">Download</a>
                        <button onclick="this.parentElement.parentElement.remove()" class="bg-zinc-800 text-zinc-400 py-3 rounded-lg text-[10px] font-black uppercase tracking-widest text-center">Discard</button>
                    </div>
                `;
                document.getElementById("resultContainer").prepend(wrapper);
                showMessage("Render Complete", "bg-green-600");
            });

            gif.on('error', (err) => {
                renderOverlay.classList.add("hidden");
                showMessage("Render Error: " + err, "bg-red-700");
            });

            gif.render();
        }

        function updateProgressUI(percent) {
            progressEl.innerText = `${percent}%`;
            circleEl.style.strokeDashoffset = 251.2 - (251.2 * percent / 100);
        }

        // Initialize state
        handlePresetChange();
        updateCanvasSize();
    </script>
</body>
