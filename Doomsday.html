<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Explosion Blast Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- General & Body --- */
        body, html {
            height: 100%; margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #E5E7EB;
            overflow: hidden;
        }

        /* --- Map & Overlay Effects --- */
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .fireball {
            position: absolute; border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #fffee0 20%, #ffc382 50%, #f77831 80%, rgba(247,120,49,0) 70%);
            pointer-events: none; z-index: 90;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0);
            mix-blend-mode: screen;
        }
        @keyframes fireball-animation {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0.9; filter: brightness(1.2); }
            15% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; filter: brightness(2.0); } /* Exaggerated expansion */
            40% { transform: translate(-50%, -50%) scale(0.9); opacity: 1; filter: brightness(1.5); } /* Pulsing effect */
            100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; filter: brightness(1); }
        }

        .whitewash {
            position: absolute; border-radius: 50%;
            background-color: #FFF;
            mix-blend-mode: color-dodge;
            pointer-events: none; z-index: 95;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0);
        }
        @keyframes whitewash-animation {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        .shockwave {
            position: absolute; border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            border-width: 4px; /* Thicker for more impact */
            border-style: solid;
            pointer-events: none; z-index: 80;
            box-shadow: 0 0 15px 3px var(--shockwave-color, #FFF); /* Glow effect */
        }
        @keyframes shockwave-animation {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* Camera Shake Animation */
        @keyframes camera-shake {
            0% { transform: translate(0, 0); }
            10%, 90% { transform: translate(-2px, 2px); }
            20%, 80% { transform: translate(3px, -3px); }
            30%, 50%, 70% { transform: translate(-5px, 4px); }
            40%, 60% { transform: translate(5px, -2px); }
            100% { transform: translate(0, 0); }
        }
        .shake-effect { animation: camera-shake var(--shake-duration, 0.5s) cubic-bezier(.36,.07,.19,.97) both; }


        /* --- UI Panels & Controls (Identical to v5) --- */
        .ui-panel { position: absolute; background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(55, 65, 81, 0.6); border-radius: 12px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); z-index: 10; }
        #controls-container { top: 1rem; left: 1rem; bottom: 1rem; width: 120px; display: flex; flex-direction: column; }
        #controls-container h1 { font-size: 0.9rem; font-weight: 700; color: #F87171; padding: 0.75rem; text-align: center; border-bottom: 1px solid rgba(55, 65, 81, 0.6); flex-shrink: 0; }
        #controls { overflow-y: auto; flex-grow: 1; padding: 0.2rem; }
        #controls::-webkit-scrollbar { width: 6px; } #controls::-webkit-scrollbar-track { background: transparent; } #controls::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 3px; }
        .munition-label { display: block; padding: 0.4rem 0.6rem; font-size: 0.5rem; color: #D1D5DB; border-radius: 6px; cursor: pointer; transition: background-color 0.2s, color 0.2s; margin-bottom: 2px; }
        .munition-label:hover { background-color: #374151; }
        .munition-label input { display: none; }
        .munition-label input:checked + span { color: #F87171; font-weight: 700; }
        #info-container { bottom: 1rem; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; padding: 1rem; }
        #info-panel #info-title { font-size: 0.71rem; font-weight: 700; color: #F9FAFB; margin-bottom: 0.1rem; }
        #info-panel #info-yield { font-family: 'Roboto Mono', monospace; font-size: 0.6rem; color: #F87171; margin-bottom: 0.5rem; }
        #info-panel #info-details { font-size: 0.6rem; line-height: 1.5; color: #D1D5DB; max-height: 60px; overflow-y: auto; }
        #legend { margin-top: 0.75rem; padding-top: 0.75rem; border-top: 1px solid rgba(55, 65, 81, 0.6); display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; font-size: 0.55rem; }
        .legend-item { display: flex; align-items: center; }
        .legend-color { width: 12px; height: 12px; border-radius: 50%; margin-right: 0.5rem; flex-shrink: 0; }
        #address-search-container { position: absolute; top: 1rem; left: 70%; transform: translateX(-50%); width: 90%; max-width: 300px; z-index: 11; }
        #address-input { width: 100%; padding: 0.75rem 1rem; font-size: 0.6rem; color: #E5E7EB; background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(55, 65, 81, 0.6); border-radius: 12px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); outline: none; transition: border-color 0.3s; }
        #address-input:focus { border-color: #F87171; }
        .pac-container { background-color: #1F2937; border: 1px solid #4B5563; border-radius: 8px; color: #D1D5DB; }
        .pac-item { padding: 8px; font-size: 0.9rem; cursor: pointer; border-top: 1px solid #374151; } .pac-item:first-child { border-top: none; } .pac-item:hover, .pac-item-selected { background-color: #374151; } .pac-item-query { font-weight: 500; color: #F9FAFB; }
        @media (min-width: 888px) { #info-container { left: calc(110px + 1rem); transform: translateX(0); max-width: 400px; } #address-search-container { left: calc(220px + 2rem); transform: translateX(0); max-width: 400px; } }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div id="address-search-container"><input id="address-input" type="text" placeholder="Search for a location..."></div>
    <aside id="controls-container" class="ui-panel"><h1>Munitions</h1><div id="controls"></div></aside>
    <div id="info-container" class="ui-panel">
        <div id="info-panel"><h3 id="info-title">Select a Munition</h3><p id="info-yield"></p><p id="info-details">Details will appear here.</p></div>
        <div id="legend">
            <div class="legend-item"><span class="legend-color" style="background-color: #ff4545; opacity: 0.6;"></span>Fireball</div>
            <div class="legend-item"><span class="legend-color" style="background-color: #ffa500; opacity: 0.6;"></span>Severe Blast</div>
            <div class="legend-item"><span class="legend-color" style="background-color: #ffff00; opacity: 0.6;"></span>Thermal</div>
        </div>
    </div>

    <script>
        function initMap() {
            let map;
            let persistentOverlays = [];
            let groundZeroMarker;
            let currentCenter = { lat: -37.8255, lng: 144.9637 };

            const munitionData = {
                'sdb': { name: 'GBU-39 SDB', yield: '110kg HE', yieldKt: 0.0001, radii: { ruin: 20, severe: 70, thermal: 0 }, details: "Small Diameter Bomb. A precision-guided glide bomb that can be carried in larger numbers, allowing a single aircraft to engage multiple targets." },
                'hellfire': { name: 'AGM-114 Hellfire', yield: '9kg (Tandem HEAT)', yieldKt: 0.00001, radii: { ruin: 5, severe: 20, thermal: 0 }, details: "Primary US air-to-ground anti-armor missile. Famously used on drones like the Predator and Reaper. The R9X variant uses blades instead of explosives." },
                'shahed-136': { name: 'Shahed-136 Drone', yield: '~50kg HE', yieldKt: 0.00005, radii: { ruin: 15, severe: 50, thermal: 0 }, details: "Iranian 'suicide drone', known for its use by Russia in Ukraine. Slow and noisy, but effective against static targets due to precision and low cost." },
                'jdam': { name: 'JDAM (GBU-31)', yield: '900kg (2000lb) Warhead', yieldKt: 0.0009, radii: { ruin: 80, severe: 350, thermal: 0 }, details: "A guidance kit that turns unguided bombs into 'smart' munitions. A cost-effective, widely used weapon by the US and its allies." },
                'moab': { name: 'GBU-43/B MOAB', yield: '11 tons HE', yieldKt: 0.011, radii: { ruin: 150, severe: 500, thermal: 1500 }, details: "'Mother of All Bombs,' one of the largest conventional weapons. Used once in Afghanistan." },
                'foab': { name: 'ATBIP FOAB', yield: '44 tons HE', yieldKt: 0.044, radii: { ruin: 300, severe: 1000, thermal: 2500 }, details: "Russia's 'Father of All Bombs.' A thermobaric weapon claimed to be the most powerful conventional bomb, creating a longer blast wave." },
                'little-boy': { name: 'Little Boy (Hiroshima)', yield: '15 kilotons', yieldKt: 15, radii: { ruin: 500, severe: 1600, thermal: 2800 }, details: "First nuclear weapon used in warfare (Aug 6, 1945). Detonation over Hiroshima helped end WWII." },
                'fat-man': { name: 'Fat Man (Nagasaki)', yield: '21 kilotons', yieldKt: 21, radii: { ruin: 800, severe: 1900, thermal: 3500 }, details: "Second nuclear weapon used (Aug 9, 1945). Its implosion design was more complex and efficient." },
                'b61-12': { name: 'B61-12 Nuclear Bomb', yield: '50 kilotons (Variable)', yieldKt: 50, radii: { ruin: 900, severe: 2500, thermal: 4500 }, details: "Newest US 'smart' nuclear gravity bomb with a guided tail kit and 'dial-a-yield' feature, making it controversially 'more usable'." },
                'w87': { name: 'W87/Mk21 (US ICBM)', yield: '300 kilotons', yieldKt: 300, radii: { ruin: 2100, severe: 5700, thermal: 10500 }, details: "Standard thermonuclear warhead for US ICBMs. A key component of the US strategic nuclear deterrent." },
                'ivy-mike': { name: 'Ivy Mike (H-Bomb)', yield: '10.4 megatons', yieldKt: 10400, radii: { ruin: 3200, severe: 12000, thermal: 20000 }, details: "First-ever hydrogen bomb tested by the US (1952). Its massive yield proved the terrifying potential of fusion weapons. Not a deliverable weapon." },
                'tsar-bomba': { name: 'Tsar Bomba (50 Megaton Test)', yield: '50 megatons', yieldKt: 50000, radii: { ruin: 5500, severe: 35000, thermal: 60000 }, details: "Most powerful nuclear weapon ever detonated (1961). Its shockwave circled Earth three times. A display of ultimate destructive capability." },
            };
            
            // --- Overlay Class for animations --- //
            class AnimatedOverlay extends google.maps.OverlayView {
                constructor(center, radius, className, animation) {
                    super(); this.center = center; this.radius = radius; this.className = className; this.animation = animation; this.div = null;
                }
                onAdd() {
                    this.div = document.createElement('div');
                    this.div.className = this.className;
                    this.div.style.animation = `${this.animation.name} ${this.animation.duration}s ${this.animation.easing} forwards`;
                    if (this.animation.delay) this.div.style.animationDelay = `${this.animation.delay}s`;
                    if (this.animation.color) this.div.style.borderColor = this.animation.color;
                    this.div.style.setProperty('--shockwave-color', this.animation.color);
                    this.getPanes().overlayLayer.appendChild(this.div);
                }
                draw() {
                    const projection = this.getProjection();
                    const centerPx = projection.fromLatLngToDivPixel(this.center);
                    const earthRadius = 6378137;
                    const metersPerPx = (Math.cos(this.center.lat() * Math.PI / 180) * 2 * Math.PI * earthRadius) / (256 * Math.pow(2, this.getMap().getZoom()));
                    const radiusPx = this.radius / metersPerPx;
                    if (centerPx) {
                        this.div.style.left = `${centerPx.x}px`;
                        this.div.style.top = `${centerPx.y}px`;
                        this.div.style.width = `${radiusPx * 2}px`;
                        this.div.style.height = `${radiusPx * 2}px`;
                    }
                }
                onRemove() { if (this.div) { this.div.parentNode.removeChild(this.div); this.div = null; } }
            }
            
            // --- Core Functions --- //
            function triggerBlast(munition) {
                clearPersistentOverlays();
                const centerLatLng = new google.maps.LatLng(currentCenter);

                // 1. Camera Shake
                if (munition.yieldKt >= 1) {
                    const mapDiv = document.getElementById('map');
                    // Clamp shake duration for sanity
                    const shakeDuration = Math.min(Math.max(0.5, Math.log10(munition.yieldKt) * 0.8), 4);
                    mapDiv.style.setProperty('--shake-duration', `${shakeDuration}s`);
                    mapDiv.classList.add('shake-effect');
                    setTimeout(() => mapDiv.classList.remove('shake-effect'), shakeDuration * 700);
                }

                // 2. Initial Whitewash flash
                const whitewash = new AnimatedOverlay(centerLatLng, munition.radii.ruin * 2.5, 'whitewash', {
                    name: 'whitewash-animation', duration: 0.4, easing: 'ease-out'
                });
                whitewash.setMap(map);
                setTimeout(() => whitewash.setMap(null), 400);

                // 3. Dynamic Fireball
                // Duration and size scale logarithmically for dramatic effect
                const fireballRadius = munition.radii.ruin;
                const fireballDuration = Math.max(2.5, Math.log(munition.yieldKt + 1) * 2.5 + 1);
                const fireball = new AnimatedOverlay(centerLatLng, fireballRadius, 'fireball', {
                    name: 'fireball-animation', duration: fireballDuration, easing: 'ease-out'
                });
                fireball.setMap(map);
                setTimeout(() => fireball.setMap(null), fireballDuration * 1000);

                // 4. Propagating Shockwaves & Persistent Circles
                const colors = { ruin: '#ff4545', severe: '#ffa500', thermal: '#ffff00' };
                let shockwaveDelay = 0.3; // Start after initial flash
                
                ['thermal', 'severe', 'ruin'].forEach(key => {
                    const radius = munition.radii[key];
                    if (radius > 0) {
                        const shockwaveDuration = Math.max(1.5, Math.log10(radius) * 0.9);
                        const shockwave = new AnimatedOverlay(centerLatLng, radius, 'shockwave', {
                            name: 'shockwave-animation',
                            duration: shockwaveDuration,
                            delay: shockwaveDelay,
                            easing: 'cubic-bezier(0.1, 0.5, 0.4, 1)', // Fast start, slow end
                            color: colors[key]
                        });
                        shockwave.setMap(map);
                        setTimeout(() => shockwave.setMap(null), (shockwaveDelay + shockwaveDuration) * 1000);

                        // Create the persistent circle to appear as the animation finishes
                        setTimeout(() => {
                            const persistentCircle = new google.maps.Circle({
                                strokeColor: colors[key], strokeWeight: 1, strokeOpacity: 0.9,
                                fillColor: colors[key], fillOpacity: 0.25,
                                map: map, center: centerLatLng, radius: radius, clickable: false,
                            });
                            persistentOverlays.push(persistentCircle);
                        }, shockwaveDelay * 1000 + 500); // Appear mid-shockwave for smooth transition
                    }
                });
            }
            
            function clearPersistentOverlays() {
                persistentOverlays.forEach(overlay => overlay.setMap(null));
                persistentOverlays.length = 0;
            }

            // --- Setup & UI Functions (unchanged) --- //
            function handleSelection() {
                const selectedKey = document.querySelector('input[name="munition"]:checked').value;
                const data = munitionData[selectedKey];
                triggerBlast(data);
                updateInfoPanel(data);
                autoZoomToRadius(Math.max(...Object.values(data.radii)));
            }
            function setGroundZero(location) {
                currentCenter = { lat: location.lat(), lng: location.lng() };
                if (groundZeroMarker) {
                    groundZeroMarker.setPosition(currentCenter);
                } else {
                    groundZeroMarker = new google.maps.Marker({
                        position: currentCenter, map: map, draggable: true,
                        icon: { path: 'M -2,0 a 2,2 0 1,0 4,0 a 2,2 0 1,0 -4,0 M 0,-3 l 0,6 M -3,0 l 6,0', scale: 4, strokeColor: '#FF0000', strokeWeight: 2, zIndex: 999 }
                    });
                    groundZeroMarker.addListener('dragend', () => setGroundZero(groundZeroMarker.getPosition()));
                }
                map.panTo(currentCenter);
            }
            function updateInfoPanel(data) { document.getElementById('info-title').textContent = data.name; document.getElementById('info-yield').textContent = `Yield: ${data.yield}`; document.getElementById('info-details').innerHTML = data.details; }
            function autoZoomToRadius(radius) {
                 if (!radius) { map.setZoom(14); map.panTo(currentCenter); return; }
                 const bounds = new google.maps.LatLngBounds();
                 const effectiveRadius = radius * 0.3; const centerLatLng = new google.maps.LatLng(currentCenter);
                 bounds.extend(google.maps.geometry.spherical.computeOffset(centerLatLng, effectiveRadius, 0));
                 bounds.extend(google.maps.geometry.spherical.computeOffset(centerLatLng, effectiveRadius, 90));
                 bounds.extend(google.maps.geometry.spherical.computeOffset(centerLatLng, effectiveRadius, 180));
                 bounds.extend(google.maps.geometry.spherical.computeOffset(centerLatLng, effectiveRadius, 270));
                 map.fitBounds(bounds, { top: 60, bottom: 180, left: 240, right: 20 });
            }
            function populateControls() {
                const controlsContainer = document.getElementById('controls');
                Object.keys(munitionData).forEach(key => {
                    const munition = munitionData[key];
                    const label = document.createElement('label'); label.className = "munition-label";
                    const radio = document.createElement('input'); radio.type = 'radio'; radio.name = 'munition'; radio.value = key;
                    radio.addEventListener('change', handleSelection);
                    const span = document.createElement('span'); span.textContent = munition.name;
                    label.appendChild(radio); label.appendChild(span); controlsContainer.appendChild(label);
                });
            }

            // --- INITIALIZATION --- //
            map = new google.maps.Map(document.getElementById('map'), {
                center: currentCenter, zoom: 11, mapTypeId: 'satellite',
                disableDefaultUI: true, zoomControl: true, heading: 0, tilt: 45,
                gestureHandling: 'cooperative', styles: [ { stylers: [ { "saturation": -100 }, { "gamma": 0.8 }, { "lightness": -20 } ] } ]
            });
            setGroundZero(new google.maps.LatLng(currentCenter.lat, currentCenter.lng));
            const autocomplete = new google.maps.places.Autocomplete(document.getElementById('address-input'));
            autocomplete.bindTo('bounds', map); autocomplete.setFields(['geometry', 'name']);
            autocomplete.addListener('place_changed', () => {
                const place = autocomplete.getPlace();
                if (place.geometry && place.geometry.location) {
                    setGroundZero(place.geometry.location);
                    if (document.querySelector('input[name="munition"]:checked')) { handleSelection(); } else { map.setZoom(15); }
                }
            });
            populateControls();
        }
    </script>
    <script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAqVp90WuvdNXrtmT0gKY4TYS3D1A0iUPA&callback=initMap&libraries=places,geometry"></script>
</body>
</html>
