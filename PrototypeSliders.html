<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhanced Rope Sliders Collection</title>
  <style>
    :root {
      --primary: #66ccff;
      --secondary: #ff6699;
      --tertiary: #99ff66;
      --quaternary: #ffcc33;
      --radioactive: #ff4444;
      --background: #111;
      --text: #fff;
    }
    
    body {
      background: var(--background);
      color: var(--text);
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-weight: 300;
      font-size: 2.5rem;
      color: var(--primary);
    }
    
    .slider-container {
      position: relative;
      width: 90%;
      max-width: 500px;
      height: 100px;
      margin: 80px auto;
    }
    
    .slider-title {
      position: absolute;
      top: -40px;
      left: 0;
      font-size: 1.2rem;
      color: var(--text);
      opacity: 0.8;
    }
    
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }
    
    input[type="range"] {
      position: absolute;
      top: 40px;
      width: 100%;
      -webkit-appearance: none;
      background: transparent;
      z-index: 2;
    }
    
    input[type="range"]:focus {
      outline: none;
    }
    
    /* Hide the native range track by making it transparent */
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
      border-radius: 2px;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      background: var(--primary);
      border: 2px solid #fff;
      border-radius: 50%;
      margin-top: -9px;
      cursor: pointer;
      position: relative;
      z-index: 3;
      box-shadow: 0 0 10px rgba(102, 204, 255, 0.5);
    }
    
    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      background: var(--primary);
      border: 2px solid #fff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(102, 204, 255, 0.5);
    }
    
    input[type="range"]::-moz-range-track {
      height: 4px;
      background: transparent;
    }
    
    .value-display {
      position: absolute;
      right: 0;
      top: -40px;
      font-size: 1.2rem;
      color: var(--primary);
    }
    
    /* Responsive styles */
    @media (max-width: 768px) {
      .slider-container {
        width: 95%;
      }
    }
    
    /* Slider-specific styles */
    #bouncy-slider {
      --slider-color: var(--secondary);
    }
    
    #bouncy-slider input[type="range"]::-webkit-slider-thumb {
      background: var(--secondary);
      box-shadow: 0 0 10px rgba(255, 102, 153, 0.5);
    }
    
    #electric-slider {
      --slider-color: var(--quaternary);
    }
    
    #electric-slider input[type="range"]::-webkit-slider-thumb {
      background: var(--quaternary);
      box-shadow: 0 0 10px rgba(255, 204, 51, 0.5);
    }
    
    #radioactive-slider {
      --slider-color: var(--radioactive);
    }
    
    #radioactive-slider input[type="range"]::-webkit-slider-thumb {
      background: var(--radioactive);
      box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
    }
    
    .shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    
    .glow {
      animation: glow 1.5s ease-in-out infinite alternate;
    }
    
    @keyframes glow {
      from { box-shadow: 0 0 5px #fff, 0 0 10px var(--slider-color); }
      to { box-shadow: 0 0 10px #fff, 0 0 20px var(--slider-color); }
    }
  </style>
</head>
<body>
  <h1>Enhanced Rope Sliders</h1>
  
  <!-- Elastic Rope Slider -->
  <div class="slider-container" id="elastic-slider">
    <div class="slider-title">Elastic Rope</div>
    <canvas id="elastic-canvas"></canvas>
    <input type="range" min="0" max="100" value="50">
    <div class="value-display">50</div>
  </div>
  
  <!-- Bouncy Particles Slider -->
  <div class="slider-container" id="bouncy-slider">
    <div class="slider-title">Bouncy Particles</div>
    <canvas id="bouncy-canvas"></canvas>
    <input type="range" min="0" max="100" value="50">
    <div class="value-display">50</div>
  </div>
  
  <!-- Electric Bolt Slider -->
  <div class="slider-container" id="electric-slider">
    <div class="slider-title">Electric Bolt</div>
    <canvas id="electric-canvas"></canvas>
    <input type="range" min="0" max="100" value="50">
    <div class="value-display">50</div>
  </div>
  
  <!-- Radioactive Decay Slider -->
  <div class="slider-container" id="radioactive-slider">
    <div class="slider-title">Radioactive Decay</div>
    <canvas id="radioactive-canvas"></canvas>
    <input type="range" min="0" max="100" value="50">
    <div class="value-display">50</div>
  </div>

  <script>
    // Common utilities used by multiple sliders
    class Point {
      constructor(x, y, oldx = x, oldy = y) {
        this.x = x;
        this.y = y;
        this.oldx = oldx;
        this.oldy = oldy;
        this.vx = 0;
        this.vy = 0;
        this.pinned = false;
      }
      update(gravity, friction = 0.87) {
        if (this.pinned) return;
        this.vx = (this.x - this.oldx) * friction;
        this.vy = (this.y - this.oldy) * friction;
        this.oldx = this.x;
        this.oldy = this.y;
        this.x += this.vx;
        this.y += this.vy + gravity;
      }
      constrain(height) {
        if (this.y > height - 1) {
          this.y = height - 1;
          this.oldy = this.y + this.vy * 0.2;
        }
      }
      setPosition(x, y) {
        this.x = x;
        this.y = y;
      }
    }
    class Stick {
      constructor(p0, p1, length = null) {
        this.p0 = p0;
        this.p1 = p1;
        this.length = length || Math.hypot(p1.x - p0.x, p1.y - p0.y);
        this.tension = 1; // higher value makes the stick stiffer
      }
      update() {
        const dx = this.p1.x - this.p0.x;
        const dy = this.p1.y - this.p0.y;
        const dist = Math.hypot(dx, dy);
        const diff = (this.length - dist) * this.tension;
        if (dist === 0) return;
        const percent = diff / dist / 2;
        const offsetX = dx * percent;
        const offsetY = dy * percent;
        if (!this.p0.pinned) {
          this.p0.x -= offsetX;
          this.p0.y -= offsetY;
        }
        if (!this.p1.pinned) {
          this.p1.x += offsetX;
          this.p1.y += offsetY;
        }
      }
      draw(ctx, width = 8, color = "#66ccff") {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        ctx.moveTo(this.p0.x, this.p0.y);
        ctx.lineTo(this.p1.x, this.p1.y);
        ctx.stroke();
      }
    }
    class Particle {
      constructor(x, y, radius = 5, color = "#ff6699") {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.color = color;
        this.vx = 0;
        this.vy = 0;
        this.gravity = 0.2;
        this.friction = 0.97;
        this.bounce = 0.7;
      }
      update(width, height) {
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= this.friction;
        this.vy *= this.friction;
        if (this.x - this.radius < 0) {
          this.x = this.radius;
          this.vx *= -this.bounce;
        } else if (this.x + this.radius > width) {
          this.x = width - this.radius;
          this.vx *= -this.bounce;
        }
        if (this.y - this.radius < 0) {
          this.y = this.radius;
          this.vy *= -this.bounce;
        } else if (this.y + this.radius > height) {
          this.y = height - this.radius;
          this.vy *= -this.bounce;
        }
      }
      draw(ctx) {
        ctx.beginPath();
        ctx.fillStyle = this.color;
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    // Helper function to draw a lightning bolt from (sx, sy) to (ex, ey)
    function drawLightningBolt(ctx, sx, sy, ex, ey) {
      const segments = 20;
      const dx = (ex - sx) / segments;
      const dy = (ey - sy) / segments;
      let x = sx, y = sy;
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let i = 1; i <= segments; i++) {
        const offset = (Math.random() - 0.5) * 20;
        const perpX = -dy;
        const perpY = dx;
        const factor = offset / Math.hypot(perpX, perpY);
        x = sx + dx * i + perpX * factor;
        y = sy + dy * i + perpY * factor;
        ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'rgba(255, 204, 51, 0.8)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    
    // Initialize all sliders when the page loads
    function initSliders() {
      initElasticRope();
      initBouncyParticles();
      initElectricBolt();
      initRadioactiveDecay();
      
      // Update value displays for all sliders
      document.querySelectorAll('input[type="range"]').forEach(slider => {
        const valueDisplay = slider.nextElementSibling;
        valueDisplay.textContent = slider.value;
        slider.addEventListener('input', () => {
          valueDisplay.textContent = slider.value;
        });
        slider.addEventListener('change', () => {
          slider.parentNode.classList.add('shake');
          setTimeout(() => {
            slider.parentNode.classList.remove('shake');
          }, 500);
        });
      });
    }
    
    // 1. Elastic Rope Slider (as before)
    function initElasticRope() {
      const container = document.getElementById('elastic-slider');
      const slider = container.querySelector('input[type="range"]');
      const canvas = document.getElementById('elastic-canvas');
      const ctx = canvas.getContext('2d');
      let width = slider.offsetWidth;
      let height = 200;
      canvas.width = width;
      canvas.height = height;
      
      const gravity = 0.4;
      const points = [];
      const sticks = [];
      const segments = 40;
      const spacing = width / segments;
      
      function createRope() {
        points.length = 0;
        sticks.length = 0;
        for (let i = 0; i <= segments; i++) {
          const x = i * spacing;
          const y = 40 + Math.sin(i * 0.3) * 5;
          const point = new Point(x, y);
          point.pinned = (i === 0 || i === segments);
          points.push(point);
        }
        for (let i = 0; i < segments; i++) {
          const stick = new Stick(points[i], points[i + 1]);
          stick.tension = 0.9;
          sticks.push(stick);
        }
      }
      
      function setRopeTip() {
        const ratio = (slider.value - slider.min) / (slider.max - slider.min);
        const x = ratio * width;
        const thumbPoint = points[segments];
        if (thumbPoint) {
          thumbPoint.setPosition(x, 40);
        }
      }
      
      function update() {
        setRopeTip();
        for (let i = 1; i < points.length - 1; i++) {
          points[i].update(gravity);
          points[i].constrain(height);
        }
        for (let j = 0; j < 5; j++) {
          for (let stick of sticks) {
            stick.update();
          }
        }
      }
      
      function draw() {
        ctx.clearRect(0, 0, width, height);
        // Draw rope shadow
        for (let stick of sticks) {
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
          ctx.lineWidth = 12;
          ctx.lineCap = 'round';
          ctx.moveTo(stick.p0.x, stick.p0.y + 5);
          ctx.lineTo(stick.p1.x, stick.p1.y + 5);
          ctx.stroke();
        }
        // Draw rope curve
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length - 1; i++) {
          const xc = (points[i].x + points[i + 1].x) / 2;
          const yc = (points[i].y + points[i + 1].y) / 2;
          ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
        }
        ctx.quadraticCurveTo(
          points[points.length - 2].x,
          points[points.length - 2].y,
          points[points.length - 1].x,
          points[points.length - 1].y
        );
        ctx.strokeStyle = '#66ccff';
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.stroke();
        // Draw glow overlay
        ctx.shadowColor = '#66ccff';
        ctx.shadowBlur = 10;
        ctx.strokeStyle = 'rgba(102, 204, 255, 0.5)';
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      
      function animate() {
        update();
        draw();
        requestAnimationFrame(animate);
      }
      
      function resizeCanvas() {
        width = slider.offsetWidth;
        canvas.width = width;
        height = 100;
        canvas.height = height;
        createRope();
      }
      
      slider.addEventListener('input', setRopeTip);
      window.addEventListener('resize', resizeCanvas);
      createRope();
      animate();
    }
    
    // 2. Bouncy Particles Slider (as before)
    function initBouncyParticles() {
      const container = document.getElementById('bouncy-slider');
      const slider = container.querySelector('input[type="range"]');
      const canvas = document.getElementById('bouncy-canvas');
      const ctx = canvas.getContext('2d');
      let width = slider.offsetWidth;
      let height = 100;
      canvas.width = width;
      canvas.height = height;
      const particles = [];
      const numParticles = 20;
      let lastThumbPosition = parseInt(slider.value) / 100 * width;
      let thumbVelocity = 0;
      
      function createParticles() {
        particles.length = 0;
        for (let i = 0; i < numParticles; i++) {
          const x = Math.random() * width;
          const y = Math.random() * height * 0.5 + 30;
          const radius = Math.random() * 4 + 3;
          const hue = 330 + Math.random() * 20;
          const color = `hsl(${hue}, 100%, 70%)`;
          particles.push(new Particle(x, y, radius, color));
        }
      }
      
      function update() {
        const currentThumbPosition = parseInt(slider.value) / 100 * width;
        thumbVelocity = currentThumbPosition - lastThumbPosition;
        lastThumbPosition = currentThumbPosition;
        for (let particle of particles) {
          const dx = currentThumbPosition - particle.x;
          const dy = 40 - particle.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < 100) {
            const force = (100 - distance) / 100 * 2;
            particle.vx += (dx / distance) * force * thumbVelocity * 0.2;
            particle.vy += (dy / distance) * force * Math.abs(thumbVelocity) * 0.1;
          }
          particle.update(width, height);
        }
      }
      
      function draw() {
        ctx.clearRect(0, 0, width, height);
        // Draw a wavy dynamic track that reacts to the slider thumb
        const thumbPosition = parseInt(slider.value) / 100 * width;
        ctx.beginPath();
        ctx.moveTo(0, 40);
        const controlX = width / 2;
        const controlY = 40 + Math.sin(Date.now() * 0.005) * 10;
        ctx.quadraticCurveTo(controlX, controlY, width, 40);
        const gradient = ctx.createLinearGradient(0, 40, width, 40);
        gradient.addColorStop(0, 'rgba(255,102,153,0.2)');
        gradient.addColorStop(1, 'rgba(255,102,153,0.2)');
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 6;
        ctx.stroke();
        // Draw particles with glow
        for (let particle of particles) {
          ctx.save();
          ctx.shadowColor = particle.color;
          ctx.shadowBlur = 5;
          particle.draw(ctx);
          ctx.restore();
        }
      }
      
      function animate() {
        update();
        draw();
        requestAnimationFrame(animate);
      }
      
      function resizeCanvas() {
        width = slider.offsetWidth;
        canvas.width = width;
        createParticles();
      }
      
      slider.addEventListener('input', () => {
        const thumbPosition = parseInt(slider.value) / 100 * width;
        if (Math.abs(thumbVelocity) > 3 && Math.random() > 0.7) {
          const radius = Math.random() * 4 + 2;
          const hue = 330 + Math.random() * 20;
          const color = `hsl(${hue}, 100%, ${70 + Math.random() * 20}%)`;
          const particle = new Particle(thumbPosition, 40, radius, color);
          particle.vy = -Math.random() * 5 - 2;
          particle.vx = (Math.random() - 0.5) * 3;
          particles.push(particle);
          if (particles.length > 40) {
            particles.shift();
          }
        }
      });
      
      window.addEventListener('resize', resizeCanvas);
      createParticles();
      animate();
    }
    
    // 3. Electric Bolt Slider – Draws a crackling lightning bolt from thumb to right edge
    function initElectricBolt() {
      const container = document.getElementById('electric-slider');
      const slider = container.querySelector('input[type="range"]');
      const canvas = document.getElementById('electric-canvas');
      const ctx = canvas.getContext('2d');
      let width = slider.offsetWidth;
      let height = 100;
      canvas.width = width;
      canvas.height = height;
      
      function update() {
        // No extra physics required; redraw lightning bolt each frame
      }
      
      function draw() {
        ctx.clearRect(0, 0, width, height);
        const thumbX = parseInt(slider.value) / 100 * width;
        // Draw a lightning bolt from the thumb position to the right edge
        drawLightningBolt(ctx, thumbX, 40, width, 40);
        // Draw the thumb glow for emphasis
        ctx.beginPath();
        ctx.arc(thumbX, 40, 10 + Math.sin(Date.now() * 0.005) * 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 204, 51, 0.5)';
        ctx.fill();
      }
      
      function animate() {
        update();
        draw();
        requestAnimationFrame(animate);
      }
      
      function resizeCanvas() {
        width = slider.offsetWidth;
        canvas.width = width;
      }
      
      slider.addEventListener('input', () => { /* immediate update if needed */ });
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      animate();
    }
    
    // 4. Radioactive Decay Slider – Reworked to be unusual, with multiple overlapping, flickering arcs and glitching photon bursts
    function initRadioactiveDecay() {
      const container = document.getElementById('radioactive-slider');
      const slider = container.querySelector('input[type="range"]');
      const canvas = document.getElementById('radioactive-canvas');
      const ctx = canvas.getContext('2d');
      let width = slider.offsetWidth;
      let height = 100;
      canvas.width = width;
      canvas.height = height;
      
      // Array to store unusual decay particles and burst fragments
      const decayParticles = [];
      
      // Enhanced DecayParticle class with color glitches
      class DecayParticle {
        constructor(x, y, vx, vy, life, baseColor) {
          this.x = x;
          this.y = y;
          this.vx = vx;
          this.vy = vy;
          this.life = life; // frames remaining
          this.maxLife = life;
          this.baseColor = baseColor;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.life--;
        }
        draw(ctx) {
          const opacity = this.life / this.maxLife;
          // Introduce a flicker by randomly adjusting the brightness
          const flicker = Math.random() * 0.3;
          ctx.beginPath();
          ctx.arc(this.x, this.y, 2 + (1 - opacity) * 3, 0, Math.PI * 2);
          ctx.fillStyle = this.baseColor.replace('OPACITY', (opacity + flicker).toFixed(2));
          ctx.fill();
        }
      }
      
      // Helper function to draw multiple, overlapping unstable arcs
      function drawUnstableTrack() {
        const instability = slider.value / slider.max;
        // Draw 3 overlapping arcs with random displacements
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          // Base Y position fluctuates with instability and time
          const baseY = 40 + Math.sin(Date.now() * 0.005 + i) * 5 * instability;
          ctx.moveTo(0, baseY);
          const segments = 30;
          for (let j = 1; j <= segments; j++) {
            const x = (width / segments) * j;
            // Each segment offset grows with instability and adds randomness
            const offset = (Math.random() - 0.5) * 15 * instability;
            const y = baseY + offset;
            ctx.lineTo(x, y);
          }
          // Stroke becomes brighter with instability and with a slight hue shift
          ctx.strokeStyle = `rgba(255,68,68,${0.2 + instability * 0.8})`;
          ctx.lineWidth = 3 + instability * 3;
          ctx.stroke();
        }
      }
      
      function update() {
        const instability = slider.value / slider.max; // from 0 to 1
        // Generate decay particles from the thumb position based on instability
        const thumbX = parseInt(slider.value) / 100 * width;
        const thumbY = 40;
        if (Math.random() < instability * 0.5) {
          const angle = Math.random() * Math.PI * 2;
          const speed = instability * (Math.random() * 3 + 1);
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed;
          const life = Math.floor(20 + instability * 40);
          // Use a base color string where 'OPACITY' will be replaced later
          const baseColor = `rgba(255,68,68,OPACITY)`;
          decayParticles.push(new DecayParticle(thumbX, thumbY, vx, vy, life, baseColor));
        }
        // Update existing particles
        for (let i = decayParticles.length - 1; i >= 0; i--) {
          decayParticles[i].update();
          if (decayParticles[i].life <= 0) {
            decayParticles.splice(i, 1);
          }
        }
      }
      
      function draw() {
        ctx.clearRect(0, 0, width, height);
        // Draw an unstable, flickering track across the slider
        drawUnstableTrack();
        // Draw the decay particles (photon bursts)
        for (let particle of decayParticles) {
          particle.draw(ctx);
        }
        // Draw a pulsating thumb glow to indicate the source of instability
        const thumbX = parseInt(slider.value) / 100 * width;
        const pulse = 12 + Math.sin(Date.now() * 0.005) * 4;
        ctx.beginPath();
        ctx.arc(thumbX, 40, pulse, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,68,68,0.4)`;
        ctx.fill();
      }
      
      function animate() {
        update();
        draw();
        requestAnimationFrame(animate);
      }
      
      function resizeCanvas() {
        width = slider.offsetWidth;
        canvas.width = width;
      }
      
      slider.addEventListener('input', () => { /* immediate update if needed */ });
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      animate();
    }
    
    // Start all sliders after the page loads
    window.addEventListener('load', initSliders);
  </script>
</body>
</html>
