<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaleidoscope Pro - Patterns</title>
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2ecc71;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --accent: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--dark);
            color: var(--light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 0.5rem; /* Reduced horizontal padding */
        }
        header {
            background: rgba(44, 62, 80, 0.9);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0.5rem 0; /* Reduced header padding */
            flex-shrink: 0;
        }
        header h1 {
            text-align: center;
            font-size: 1.2rem; /* Further reduced title for small screens */
            color: var(--light);
        }
        main.container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding-top: 0.5rem; /* Reduced top padding */
            padding-bottom: 80px; /* Space for controls_header height + some */
        }
        .canvas-container {
            position: relative;
            width: 95vw; /* Slightly more width */
            max-width: 450px; /* Slightly smaller max for portrait */
            aspect-ratio: 1 / 1;
            margin: 0 auto; /* Removed top/bottom margin, handled by main padding */
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
        }
        #animationCanvas {
            width: 100%;
            height: 100%;
            background: #000;
            display: block;
            border-radius: 6px;
            border: 1px solid var(--primary);
        }
        .controls-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(30, 40, 50, 0.95);
            backdrop-filter: blur(10px);
            transition: transform .3s ease-in-out;
            z-index: 1000;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: .4rem .8rem; /* Compact header */
        }
        .button-group { display: flex; gap: .4rem; } /* Smaller gap */
        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: .4rem .8rem; /* Compact buttons */
            border-radius: 4px;
            cursor: pointer;
            font-weight: normal; /* Normal weight for compactness */
            font-size: 0.75rem; /* Smaller font */
            transition: background-color 0.2s, opacity 0.2s;
        }
        .btn-secondary { background: var(--secondary); }
        .btn-danger { background: var(--accent); }
        .btn-icon {
            width: 32px; /* Smaller icon button */
            height: 32px;
            padding: 0;
            border-radius: 50%;
            font-size: 1rem; /* Smaller icon */
        }
        .btn:hover { opacity: .85; }
        .btn:active { transform: scale(0.95); }

        .controls {
            padding: 0.5rem; /* Compact padding */
            max-height: 0;
            overflow-y: auto;
            transition: max-height .3s ease-in-out; /* Slightly faster */
        }
        .controls.expanded {
            max-height: 35vh; /* Reduced max height for controls panel */
        }
        .row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); /* Responsive columns */
            gap: 0.5rem; /* Gap between columns */
            align-items: start;
        }
        .col {
            /* flex: 1; min-width: 200px; No longer needed due to grid */
            padding: 0; /* No col padding, gap handles spacing */
        }
        .slider-container, .select-container { margin-bottom: .5rem; } /* Reduced margin */
        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: .2rem; /* Reduced margin */
            font-size: .7rem; /* Smaller label font */
        }
        .slider-label span { /* Value display */
            font-size: .65rem;
            opacity: .9;
            background: rgba(255,255,255,0.08);
            padding: .1rem .25rem;
            border-radius: 2px;
        }
        input[type=range] {
            width: 100%;
            height: 6px; /* Thinner slider track */
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
            padding: 0;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px; /* Smaller thumb */
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            border: 2px solid var(--light);
            cursor: pointer;
            transition: background-color 0.2s;
        }
        input[type=range]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--primary);
            border-radius: 50%;
            border: 2px solid var(--light);
            cursor: pointer;
            transition: background-color 0.2s;
        }
        input[type=range]::-webkit-slider-thumb:hover { background: var(--secondary); }
        input[type=range]::-moz-range-thumb:hover { background: var(--secondary); }

        select {
            width: 100%;
            padding: .3rem .5rem; /* Compact select */
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 3px;
            font-size: 0.75rem; /* Smaller select font */
        }
        select option { background: var(--dark); color: var(--light); }
        #fileInput { display: none; }
    </style>
</head>
<body>
    <header><div class="container"><h1>Kaleidoscope Pro</h1></div></header>
    <main class="container">
        <div class="canvas-container">
            <canvas id="animationCanvas"></canvas>
        </div>
    </main>

    <div class="controls-wrapper">
        <div class="controls-header">
            <div class="button-group">
                <button class="btn" id="uploadBtn">Upload</button>
                <button class="btn btn-secondary" id="playPauseBtn">Pause</button>
                <button class="btn" id="saveBtn">Save</button>
            </div>
            <button class="btn btn-icon" id="toggleControls" aria-expanded="false" title="Toggle Controls">⚙️</button>
        </div>
        <div class="controls" id="controlsPanel">
            <div class="row">
                <div class="col">
                    <div class="slider-container">
                        <div class="slider-label"><label for="scaleInput">Pattern Scale</label><span id="scaleVal">1</span></div>
                        <input type="range" id="scaleInput" min="0.25" max="4" step="0.05" value="1">
                    </div>
                    <div class="slider-container">
                        <div class="slider-label"><label for="sectorsInput">Sectors</label><span id="sectorsVal">8</span></div>
                        <input type="range" id="sectorsInput" min="2" max="32" step="2" value="8">
                    </div>
                    <div class="slider-container">
                        <div class="slider-label"><label for="speedInput">Anim Speed</label><span id="speedVal">1</span></div>
                        <input type="range" id="speedInput" min="0" max="3" step="0.05" value="1"> </div>
                </div>
                <div class="col">
                    <div class="slider-container">
                        <div class="slider-label"><label for="zoomInput">Image Zoom</label><span id="zoomVal">1</span></div>
                        <input type="range" id="zoomInput" min="0.1" max="5" step="0.05" value="1">
                    </div>
                    <div class="slider-container">
                        <div class="slider-label"><label for="panXInput">Image Pan X</label><span id="panXVal">0</span></div>
                        <input type="range" id="panXInput" min="-300" max="300" step="1" value="0">
                    </div>
                    <div class="slider-container">
                        <div class="slider-label"><label for="panYInput">Image Pan Y</label><span id="panYVal">0</span></div>
                        <input type="range" id="panYInput" min="-300" max="300" step="1" value="0">
                    </div>
                </div>
                <div class="col">
                    <div class="slider-container">
                        <div class="slider-label"><label for="rotateInput">Kaleido Rotate</label><span id="rotateVal">0</span></div>
                        <input type="range" id="rotateInput" min="-0.2" max="0.2" step="0.002" value="0"> </div>
                    <div class="select-container">
                        <label for="modeSelect" style="font-size: 0.7rem; margin-bottom: 0.2rem; display:block;">Effect Mode <span id="modeVal" style="opacity:0.7;">Normal</span></label>
                        <select id="modeSelect">
                            <option value="0">Normal</option>
                            <option value="1">Hue Shift</option>
                            <option value="2">Alternate Sector Reflect</option>
                            <option value="3">Offset Image Sectors</option>
                            <option value="4">Static Image, Rotating Wedges</option>
                            <option value="5">Central Pulse Zoom</option>
                            <option value="6">Image Edge Bias</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <script>
        const canvas = document.getElementById('animationCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const saveBtn = document.getElementById('saveBtn');
        const toggleBtn = document.getElementById('toggleControls');
        const controlsPanel = document.getElementById('controlsPanel');

        const inputs = {
            scaleInput: document.getElementById('scaleInput'),
            sectorsInput: document.getElementById('sectorsInput'),
            speedInput: document.getElementById('speedInput'),
            zoomInput: document.getElementById('zoomInput'),
            panXInput: document.getElementById('panXInput'),
            panYInput: document.getElementById('panYInput'),
            rotateInput: document.getElementById('rotateInput'),
            modeSelect: document.getElementById('modeSelect')
        };

        const vals = {
            scale: document.getElementById('scaleVal'),
            sectors: document.getElementById('sectorsVal'),
            speed: document.getElementById('speedVal'),
            zoom: document.getElementById('zoomVal'),
            panX: document.getElementById('panXVal'),
            panY: document.getElementById('panYVal'),
            rotate: document.getElementById('rotateVal'),
            mode: document.getElementById('modeVal')
        };

        let P = {
            baseResolutionWidth: 600,
            baseResolutionHeight: 600,
            currentScale: 1,
            numSectors: 8,
            animationSpeed: 0.5, // Default animation speed reduced
            sourceZoom: 1,
            sourceOffsetX: 0,
            sourceOffsetY: 0,
            kaleidoRotSpeed: 0,
            patternMode: 0,
            playing: true
        };

        let img = new Image();
        let loaded = false;
        let counter = 0;
        let lastTimestamp = 0;
        let deltaTime = 0;

        function applySettings() {
            canvas.width = P.baseResolutionWidth;
            canvas.height = P.baseResolutionHeight;
        }

        function updateVal(id) {
            const key = id.replace(/Input|Select/, '');
            if (vals[key] && inputs[id]) {
                if (id === 'modeSelect') {
                    vals[key].textContent = inputs[id].options[inputs[id].selectedIndex].text.split(' ')[0]; // Show first word
                } else {
                    vals[key].textContent = inputs[id].value;
                }
            }
        }

        function readInputs() {
            P.currentScale = +inputs.scaleInput.value;
            P.numSectors = +inputs.sectorsInput.value;
            P.animationSpeed = +inputs.speedInput.value;
            P.sourceZoom = +inputs.zoomInput.value;
            P.sourceOffsetX = +inputs.panXInput.value;
            P.sourceOffsetY = +inputs.panYInput.value;
            P.kaleidoRotSpeed = +inputs.rotateInput.value;
            P.patternMode = +inputs.modeSelect.value;
        }

        function toggleControls() {
            const expanded = toggleBtn.getAttribute('aria-expanded') === 'true';
            toggleBtn.setAttribute('aria-expanded', String(!expanded));
            controlsPanel.classList.toggle('expanded');
            toggleBtn.innerHTML = expanded ? '⚙️' : '✕';
        }

        function togglePlay() {
            P.playing = !P.playing;
            playPauseBtn.textContent = P.playing ? 'Pause' : 'Play';
            if (P.playing) {
                lastTimestamp = performance.now();
                requestAnimationFrame(animate);
            }
        }

        function saveImage() {
            const wasPlaying = P.playing;
            if (wasPlaying) P.playing = false;
            drawKaleidoscope(ctx, canvas.width, canvas.height, true, counter); // Pass current counter for static draw

            canvas.toBlob(blob => {
                const link = document.createElement('a');
                link.download = `kaleidoscope-pattern-${Date.now()}.png`;
                link.href = URL.createObjectURL(blob);
                link.click();
                URL.revokeObjectURL(link.href);
                if (wasPlaying) {
                     P.playing = true;
                     lastTimestamp = performance.now();
                     requestAnimationFrame(animate);
                }
            }, 'image/png', 0.92);
        }

        function drawKaleidoscope(targetCtx, width, height, isStaticDraw = false, staticCounter) {
            targetCtx.fillStyle = '#000000';
            targetCtx.fillRect(0, 0, width, height);

            const currentCounter = isStaticDraw ? staticCounter : counter;
            const angleInc = (2 * Math.PI) / (P.numSectors || 2);

            targetCtx.save(); // Global save
            targetCtx.translate(width / 2, height / 2);
            targetCtx.scale(P.currentScale, P.currentScale);
            targetCtx.rotate(currentCounter * P.kaleidoRotSpeed);

            const effectiveRadius = Math.hypot(width / P.currentScale, height / P.currentScale) / 2 * 1.42; // Adjusted for full coverage

            for (let i = 0; i < P.numSectors; i++) {
                targetCtx.save(); // Sector save
                targetCtx.rotate(i * angleInc);

                // Default reflection for kaleidoscope effect
                if (i % 2 !== 0 && P.patternMode !== 2) { // Mode 2 handles its own reflection
                     targetCtx.scale(1, -1);
                }


                targetCtx.beginPath();
                targetCtx.moveTo(0, 0);
                targetCtx.arc(0, 0, effectiveRadius, -angleInc / 2, angleInc / 2);
                targetCtx.closePath();
                targetCtx.clip();

                targetCtx.save(); // Image specific transforms and effects save

                // Apply pattern modes transformations BEFORE image drawing
                let dynamicSourceZoom = P.sourceZoom;
                let currentSourceOffsetX = P.sourceOffsetX;
                let currentSourceOffsetY = P.sourceOffsetY;

                targetCtx.filter = 'none'; // Reset filter for each sector initially

                switch (P.patternMode) {
                    case 1: // Hue Shift
                        targetCtx.filter = `hue-rotate(${currentCounter * 25}deg)`;
                        break;
                    case 2: // Alternate Sector Reflect (different axis)
                        if (i % 2 === 0) {
                            targetCtx.scale(-1, 1); // Reflect horizontally
                        } else {
                            targetCtx.scale(1,-1); // Reflect vertically (default like)
                        }
                        break;
                    case 3: // Offset Image Sectors
                        if (i % 2 === 0) {
                            currentSourceOffsetX += Math.sin(currentCounter * 0.5) * 30;
                            currentSourceOffsetY += Math.cos(currentCounter * 0.5) * 30;
                        } else {
                            currentSourceOffsetX -= Math.sin(currentCounter * 0.5) * 30;
                            currentSourceOffsetY -= Math.cos(currentCounter * 0.5) * 30;
                        }
                        break;
                    case 4: // Static Image, Rotating Wedges
                        // Counteract the kaleidoscope rotation and individual sector rotation for the image
                        targetCtx.rotate(- (currentCounter * P.kaleidoRotSpeed) - (i * angleInc) );
                        if (i % 2 !== 0) targetCtx.scale(1,-1); // re-apply original reflection if needed
                        break;
                    case 5: // Central Pulse Zoom
                        dynamicSourceZoom *= (1 + Math.sin(currentCounter * 1.5) * 0.3);
                        break;
                    case 6: // Image Edge Bias
                        if (loaded) {
                            const bias = Math.sin(currentCounter * 0.8) * (img.width / 4 / dynamicSourceZoom);
                            if (i % 2 === 0) {
                                currentSourceOffsetX += bias;
                            } else {
                                currentSourceOffsetX -= bias;
                            }
                        }
                        break;
                }

                // Common image transformations (pan, zoom, internal rotation)
                const dynamicPanFactor = isStaticDraw ? 0 : Math.sin(currentCounter * 0.3) * 20; // Subtle pan animation
                targetCtx.translate(currentSourceOffsetX + dynamicPanFactor, currentSourceOffsetY + dynamicPanFactor);
                targetCtx.scale(dynamicSourceZoom, dynamicSourceZoom);
                targetCtx.rotate(currentCounter * 0.05); // Slow internal image rotation

                if (loaded) {
                    targetCtx.drawImage(img, -img.width / 2, -img.height / 2, img.width, img.height);
                } else { // Fallback procedural pattern
                    targetCtx.fillStyle = `hsl(${(i * 360 / P.numSectors + currentCounter * 20) % 360}, 60%, 45%)`;
                    targetCtx.fillRect(-effectiveRadius, -effectiveRadius, effectiveRadius * 2, effectiveRadius * 2);
                }

                targetCtx.restore(); // Image specific transforms and effects restore
                targetCtx.restore(); // Sector restore (clipping, sector rotation)
            }
            targetCtx.restore(); // Global restore
        }

        function animate(timestamp) {
            if (!P.playing) return;

            deltaTime = timestamp - lastTimestamp;
            lastTimestamp = timestamp;
            if (deltaTime > 100) deltaTime = 16.666; // Cap deltaTime

            counter += (deltaTime / 16.666) * P.animationSpeed * 0.1; // Adjusted animation speed scaling

            drawKaleidoscope(ctx, canvas.width, canvas.height, false, counter);
            requestAnimationFrame(animate);
        }

        function init() {
            Object.keys(inputs).forEach(id => {
                const keyWithoutSuffix = id.replace(/Input|Select/, '');
                let pKey = keyWithoutSuffix;
                if (keyWithoutSuffix === 'scale') pKey = 'currentScale'; // Handle special case for scale

                if (P.hasOwnProperty(pKey)) {
                    inputs[id].value = P[pKey];
                }
                updateVal(id);

                inputs[id].addEventListener(inputs[id].tagName === 'SELECT' ? 'change' : 'input', () => {
                    readInputs();
                    updateVal(id);
                    if (!P.playing) { // If paused, redraw statically on input change
                         drawKaleidoscope(ctx, canvas.width, canvas.height, true, counter);
                    }
                });
            });
            
            playPauseBtn.textContent = P.playing ? 'Pause' : 'Play';

            uploadBtn.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', e => {
                const f = e.target.files[0];
                if (!f) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    img.onload = () => {
                        loaded = true;
                        if (!P.playing) {
                            drawKaleidoscope(ctx, canvas.width, canvas.height, true, counter);
                        }
                    };
                    img.onerror = () => { loaded = false; alert("Error loading image."); };
                    img.src = ev.target.result;
                };
                reader.onerror = () => { alert("Failed to read file."); };
                reader.readAsDataURL(f);
                fileInput.value = '';
            });

            playPauseBtn.addEventListener('click', togglePlay);
            saveBtn.addEventListener('click', saveImage);
            toggleBtn.addEventListener('click', toggleControls);

            applySettings();
            readInputs(); // Ensure P is synced with initial slider values set by P object

            if (P.playing) {
                lastTimestamp = performance.now();
                requestAnimationFrame(animate);
            } else {
                drawKaleidoscope(ctx, canvas.width, canvas.height, true, counter);
            }
        }
        window.addEventListener('load', init);
    </script>
</body>
</html>
